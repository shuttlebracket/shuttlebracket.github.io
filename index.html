function openScheduleDialog(match){
  const t = tournamentById(match.tournamentId);
  const courts = tCourts(match.tournamentId).filter(c=>c.active);
  // Not scheduled yet: suggest the first time (5-minute steps) when both sides have had their rest.
  const early = earliestStartFor(match);
  let dt;
  if(match.scheduledStart) dt = new Date(match.scheduledStart);
  else { const step=5*60000; dt = new Date(Math.ceil(Math.max(Date.now(), early.time||0)/step)*step); }
  const dateVal = localDateStr(dt);            // local date (toISOString would give the UTC day)
  const timeVal = localTimeStr(dt);
  const restNote = early.because && feedersOf(match).some(f=>f.id===early.because.id)
    ? `<div class="helptext">${ICONS.calendar} Starts after ${esc(matchNumberLabel(early.because))} (scheduled until ${esc(fmtTime(new Date(matchWindow(early.because).end).toISOString()))}) plus ${restMinutesAfter(early.because)} min rest: from <b>${esc(fmtDateTime(new Date(early.time).toISOString()))}</b>.</div>`
    : early.because
    ? `<div class="helptext">${ICONS.calendar} Players are free from <b>${esc(fmtDateTime(new Date(early.time).toISOString()))}</b>: ${restMinutesAfter(early.because)} min rest after their match ${esc(entryName(entryById(early.because.entry1Id)))} vs ${esc(entryName(entryById(early.because.entry2Id)))}.</div>`
    : `<div class="helptext">Rest rule: at least ${MIN_REST_SINGLE} min between one-game matches, ${MIN_REST_MULTI} min after best of 3/5.</div>`;
  const body = `
    <div class="field"><label>Court</label><select id="fSchCourt">${courts.map(c=>`<option value="${c.id}" ${match.courtId===c.id?'selected':''}>${esc(c.name)}</option>`).join('') || '<option value="">No active courts</option>'}</select></div>
    <div class="field-row">
      <div class="field"><label>Date</label>${dateFieldHtml('fSchDate', dateVal)}</div>
      <div class="field"><label>Time</label><input type="time" id="fSchTime" value="${timeVal}"></div>
    </div>
    <div class="field"><label>Duration (min)</label><input type="number" id="fSchDur" min="1" value="${scheduleDurationDefault(match, t)}"></div>
    <div id="schConflictNote">${restNote}</div>
  `;
  openDialog('Schedule match', body, stdFoot('btnSaveSchedule','Save'));
  document.getElementById('btnSaveSchedule').onclick = async ()=>{
    const courtId = document.getElementById('fSchCourt').value;
    const date = document.getElementById('fSchDate').value, time = document.getElementById('fSchTime').value;
    const dur = parseInt(document.getElementById('fSchDur').value,10)||scheduleDurationDefault(match, t);
    if(!date||!time){ toast('Pick a date and time', true); return; }
    const iso = new Date(date+'T'+time+':00').toISOString();
    const ok = await assignMatchSchedule(match, courtId||null, iso, dur);
    if(ok) closeGenericDialog();
    render();
  };
}
/* Duration shown when scheduling a match. New matches are created with a
   placeholder 30 min, so an unscheduled match uses the tournament's "Match
   duration" setting (General -> Logistics). A match that is already scheduled
   keeps the duration it was given, and one with its own estimate (e.g. a
   best-of-3 Americano final, 45 min) keeps that. */
const PLACEHOLDER_MATCH_MIN = 30;
function scheduleDurationDefault(match, t){
  const setting = (t && parseInt(t.matchDurationMin,10)) || PLACEHOLDER_MATCH_MIN;
  if(match.scheduledStart && match.estDurationMin) return match.estDurationMin;
  if(match.estDurationMin && match.estDurationMin!==PLACEHOLDER_MATCH_MIN) return match.estDurationMin;
  return setting;
}

/* ---------- DIALOG: SCORE ENTRY / CORRECTION ----------
   One dialog, two labels: entering a fresh score and correcting an already-
   decided one are the same per-game score editor, just with a different
   completion path (a fresh match completes normally; a decided one is
   force-corrected and audit-logged). This is the dialog the "Score" button
   opens everywhere - match cards, match rows, and the match-detail popup. */
let dlgScoreDraft = null;
function openScoreDialog(match){
  const t = tournamentById(match.tournamentId), ev = eventById(match.eventId);
  const cfg = scoringFor(ev, t, match);
  const wasDecided = ['completed','walkover','retired'].includes(match.status);
  dlgScoreDraft = {matchId:match.id, cfg, games:(match.games&&match.games.length?match.games:[{a:0,b:0}]).map(g=>({a:g.a,b:g.b}))};
  openDialog(wasDecided?'Correct score':'Enter score', '', stdFoot('btnSaveCorrect', wasDecided?'Save correction':'Save score'));
  renderScoreEditorBody();
  document.getElementById('btnSaveCorrect').onclick = async (ev)=>{
    const btn = ev.currentTarget;
    readScoreInputs();   // take exactly what's in the boxes, even if one is still being edited
    const m = matchById(dlgScoreDraft.matchId); if(!m) return;
    const cfg = dlgScoreDraft.cfg;
    // Ignore trailing 0-0 games (e.g. an extra game added but not played).
    const games = dlgScoreDraft.games.map(g=>({a:g.a|0, b:g.b|0})).filter((g,i,arr)=> i===0 || g.a || g.b || arr.slice(i+1).some(x=>x.a||x.b));
    const bad = games.findIndex(g=>!ScoreRules.validGameScore(g, cfg));
    if(bad>=0){ toast('Game '+(bad+1)+': scores can\'t go above '+(cfg.capPoints||30)+' points', true); return; }
    const odd = games.findIndex(g=>ScoreRules.gameProblem(g, cfg));
    if(odd>=0){ const g=games[odd]; toast('Game '+(odd+1)+': '+g.a+'-'+g.b+' isn\'t possible, '+ScoreRules.gameProblem(g, cfg)+' ('+describeScoring(cfg)+').', true); return; }
    const mp = ScoreRules.matchProblem(games, cfg);
    if(mp){ toast('That score isn\'t possible: ' + mp.reason + '.', true); return; }
    const winner = ScoreRules.matchWinner(games, cfg);
    const decided = ['completed','walkover','retired'].includes(m.status);
    btn.disabled = true;
    try{
      if(winner){
        const winnerEntryId = winner===1 ? m.entry1Id : m.entry2Id;
        if(decided) await correctScore(m, games);
        else await completeMatch(m, {status:'completed', winnerEntryId, games}, {});
        closeGenericDialog(); render();
        toast((winner===1?entryName(entryById(m.entry1Id)):entryName(entryById(m.entry2Id)))+' wins');
        return;
      }
      if(decided){
        toast('That score has no winner yet. To correct a finished match, enter every game so one side wins '+ScoreRules.gamesNeeded(cfg)+' game'+(ScoreRules.gamesNeeded(cfg)>1?'s':'')+'.', true);
        return;
      }
      if(!games.some(g=>g.a||g.b)){ toast('Enter the score first', true); return; }
      // Not finished yet: keep the score and mark the match as being played.
      const patch = {games, updatedAt: nowIso()};
      if(!['in_progress'].includes(m.status)){ patch.status='in_progress'; patch.actualStart = m.actualStart || nowIso(); }
      await Store.update('matches', m.id, patch);
      const w1 = games.filter(g=>ScoreRules.gameWinner(g,cfg)===1).length, w2 = games.filter(g=>ScoreRules.gameWinner(g,cfg)===2).length;
      closeGenericDialog(); render();
      toast('Score saved - match in progress' + ((cfg.bestOf||3)>1 ? ' ('+w1+'-'+w2+' in games)' : ''));
    }catch(err){
      console.error(err); toast('Couldn\'t save the score: '+(err&&err.message||'unknown error'), true);
    }finally{ if(btn.isConnected) btn.disabled = false; }
  };
}
function openCorrectDialog(match){ openScoreDialog(match); }
/* Copies every score box into the draft (clamped to whole numbers >= 0). */
function readScoreInputs(){
  const body = document.getElementById('genericBody'); if(!body || !dlgScoreDraft) return;
  body.querySelectorAll('.score-input').forEach(inp=>{
    const gi=+inp.getAttribute('data-sc-game'), side=inp.getAttribute('data-sc-side');
    let v=parseInt(inp.value,10); if(isNaN(v)||v<0) v=0;
    if(dlgScoreDraft.games[gi]) dlgScoreDraft.games[gi][side]=v;
  });
}
/* Updates the winner notes and the match summary in place, so typing never
   loses focus (rebuilding the inputs closed the iPhone keyboard mid-entry). */
function updateScoreSummary(){
  const body = document.getElementById('genericBody'); if(!body || !dlgScoreDraft) return;
  const m = matchById(dlgScoreDraft.matchId); if(!m) return;
  const e1n = entryName(entryById(m.entry1Id)), e2n = entryName(entryById(m.entry2Id));
  const cfg = dlgScoreDraft.cfg;
  const need = ScoreRules.gamesNeeded(cfg);
  const winner = ScoreRules.matchWinner(dlgScoreDraft.games, cfg);
  const w1 = dlgScoreDraft.games.filter(g=>ScoreRules.gameWinner(g,cfg)===1).length;
  const w2 = dlgScoreDraft.games.filter(g=>ScoreRules.gameWinner(g,cfg)===2).length;
  const sum = body.querySelector('#scoreSummary');
  let badIdx = dlgScoreDraft.games.findIndex(g=>ScoreRules.gameProblem(g,cfg));
  const mp = badIdx<0 ? ScoreRules.matchProblem(dlgScoreDraft.games, cfg) : null;
  if(mp) badIdx = mp.index;
  if(sum && mp){
    sum.className = 'score-summary bad';
    sum.textContent = 'Not possible: ' + mp.reason;
  } else if(sum && badIdx>=0){
    sum.className = 'score-summary bad';
    sum.textContent = 'Check game '+(badIdx+1)+' · '+describeScoring(cfg);
  } else if(sum){
    sum.className = winner ? 'score-summary won' : 'score-summary';
    sum.textContent = winner
      ? (winner===1?e1n:e2n)+' wins the match ('+w1+'-'+w2+')'
      : (cfg.bestOf||3)>1
        ? 'Best of '+(cfg.bestOf||3)+' · first to '+need+' games wins · currently '+w1+'-'+w2+' · an unfinished score is saved as in progress'
        : describeScoring(cfg)+' · an unfinished score is saved as in progress';
  }
  dlgScoreDraft.games.forEach((g,i)=>{
    const note = body.querySelector('[data-game-note="'+i+'"]'); if(!note) return;
    const w = ScoreRules.gameWinner(g,cfg);
    const problem = ScoreRules.gameProblem(g,cfg);
    note.classList.toggle('bad', !!problem);
    note.textContent = problem ? g.a+'-'+g.b+' isn\'t possible: '+problem : w ? (w===1?e1n:e2n)+' won this game' : '';
  });
  const addG = document.getElementById('btnAddCorrectGame');
  if(addG) addG.style.display = winner ? 'none' : '';   // no further game once someone has won the match
  const save = document.getElementById('btnSaveCorrect');
  const decided = ['completed','walkover','retired'].includes(m.status);
  if(save && !decided) save.textContent = (winner && badIdx<0) ? 'Save result' : 'Save score';
}
function renderScoreEditorBody(){
  const m = matchById(dlgScoreDraft.matchId);
  const e1n = entryName(entryById(m.entry1Id)), e2n = entryName(entryById(m.entry2Id));
  const cfg = dlgScoreDraft.cfg;
  const body = document.getElementById('genericBody');
  body.innerHTML = `<div class="score-vs" style="text-align:center;font-weight:700">${esc(e1n)}<span style="color:var(--muted);font-weight:500;font-size:11px;margin:0 6px">vs</span>${esc(e2n)}</div>
    <div id="scoreSummary" class="score-summary"></div>
    ${scoreEditorRows(dlgScoreDraft.games, cfg, e1n, e2n)}
    ${(cfg.bestOf||3)>1 && dlgScoreDraft.games.length<(cfg.bestOf||3) ? `<button type="button" class="btn btn-sm" id="btnAddCorrectGame">${ICONS.plus} Add game</button>` : ''}`;
  body.querySelectorAll('[data-sc-step]').forEach(b=>b.addEventListener('click', ()=>{
    const gi=+b.getAttribute('data-sc-game'), side=b.getAttribute('data-sc-side'), delta=+b.getAttribute('data-sc-step');
    readScoreInputs();
    const v = Math.max(0, (dlgScoreDraft.games[gi][side]||0)+delta);
    dlgScoreDraft.games[gi][side] = v;
    const inp = body.querySelector('.score-input[data-sc-game="'+gi+'"][data-sc-side="'+side+'"]'); if(inp) inp.value = v;
    updateScoreSummary();
  }));
  body.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ readScoreInputs(); updateScoreSummary(); });
    inp.addEventListener('focus', ()=>{ try{ inp.select(); }catch(e){} });
  });
  body.querySelectorAll('[data-sc-remove]').forEach(b=>b.addEventListener('click', ()=>{
    readScoreInputs(); dlgScoreDraft.games.splice(+b.getAttribute('data-sc-remove'), 1); renderScoreEditorBody();
  }));
  const addBtn = document.getElementById('btnAddCorrectGame');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    readScoreInputs(); dlgScoreDraft.games.push({a:0,b:0}); renderScoreEditorBody();
    const ins = body.querySelectorAll('.score-input'); if(ins.length) ins[ins.length-2].focus();
  });
  updateScoreSummary();
}

/* ---------- DIALOG: SWAP ENTRIES ---------- */
function openSwapDialog(ev){
  const matches = eventMatches(ev.id).filter(m=> !['completed','bye'].includes(m.status));
  const opts = [];
  matches.forEach(m=>{
    if(m.entry1Id) opts.push({matchId:m.id, slot:1, label: roundLabelForMatch(m)+' - '+entryName(entryById(m.entry1Id))});
    if(m.entry2Id) opts.push({matchId:m.id, slot:2, label: roundLabelForMatch(m)+' - '+entryName(entryById(m.entry2Id))});
  });
  if(opts.length<2){ toast('Not enough unplayed slots to swap', true); return; }
  const body = `
    <div class="field"><label>First slot</label><select id="fSwapA">${opts.map((o,i)=>`<option value="${i}">${esc(o.label)}</option>`).join('')}</select></div>
    <div class="field"><label>Second slot</label><select id="fSwapB">${opts.map((o,i)=>`<option value="${i}" ${i===1?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>
    <div class="helptext">Only entries in unplayed matches can be swapped.</div>
  `;
  openDialog('Swap entries', body, stdFoot('btnSaveSwap','Swap'));
  document.getElementById('btnSaveSwap').onclick = async ()=>{
    const a = opts[+document.getElementById('fSwapA').value], b = opts[+document.getElementById('fSwapB').value];
    if(a.matchId===b.matchId && a.slot===b.slot){ toast('Pick two different slots', true); return; }
    await swapDrawEntries(matchById(a.matchId), a.slot, matchById(b.matchId), b.slot);
    closeGenericDialog(); render();
  };
}

function rerenderPreservingFocus(el){
  const key = el.getAttribute('data-filter') || el.id;
  const isText = el.tagName!=='SELECT' && !['checkbox','date','number','time'].includes(el.type);
  const selStart = el.selectionStart, selEnd = el.selectionEnd;
  // Only typing fields get focus back. Focusing a <select> again after the redraw
  // makes iPhone open its picker a second time, so let dropdowns go.
  if(!isText || el.readOnly){ try{ el.blur(); }catch(e){} render(); return; }
  render();
  if(key){
    const again = document.querySelector(`[data-filter="${key}"]`) || (el.id?document.getElementById(el.id):null);
    if(again){
      again.focus();
      if(isText && again.setSelectionRange && selStart!=null){ try{ again.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function handleFilterInput(el){
  const raw = el.getAttribute('data-filter'); if(!raw) return;
  const [key, field] = raw.split('.');
  state.filters[key] = state.filters[key]||{};
  let val = el.type==='checkbox' ? el.checked : el.value;
  state.filters[key][field] = (val===''||val==null) ? null : val;
  if(raw==='matches.eventId' && state.filters[key][field]) state.filters.drawEventId = state.filters[key][field];   // Settings -> Draws follows
  rerenderPreservingFocus(el);
}

      try{
        const r = await ShareAPI.rpc({url:nurl, key}, 'sb_updated_at', {p_id:'ConnectionTest00'}, 15000);
        out.innerHTML = (r===null ? '<b style="color:var(--win)">Connected.</b> The database is set up and ready.' : '<b style="color:var(--win)">Connected.</b>')
          + (nurl!==rawUrl ? ` <span class="sub-txt">(using ${esc(nurl)})</span>` : '')
          + ` <span class="sub-txt">${Math.round((Date.now()-t0))} ms</span>`;
        if(nurl!==rawUrl){ const el=document.getElementById('setShareUrl'); if(el) el.value = nurl; }
        ViewerPageCheck.run(true);
      }catch(err){
        out.innerHTML = '<b style="color:var(--danger)">Not working yet:</b> ' + esc(ShareAPI.explain(err))
          + (nurl!==rawUrl ? ` <span class="sub-txt">(tried ${esc(nurl)})</span>` : '')
          + ((err.status||err.detail) ? `<div class="sub-txt" style="margin-top:4px">Details: ${esc([err.status?'HTTP '+err.status:'', err.code||'', err.detail||'', err.body&&!err.code?err.body:''].filter(Boolean).join(' · '))}</div>` : '');
      }finally{ clearInterval(tick); if(btn) btn.disabled = false; }
      return;
    }
    case 'btnUnfollow': setFollow(null); return;
    case 'btnViewerRetry': state.viewerError=null; state.ready=false; render(); ViewerMode.load().catch(err=>{ state.ready=true; state.viewerError = err.offline?'offline':'error'; state.viewerErrorMsg=ShareAPI.explain(err); render(); }); return;
    case 'repPlayers': exportPlayers(); return;
    case 'repStats': exportPlayerStats(); return;
    case 'repRankings': exportRankings(); return;
  }

  const dataChecks = [
    ['data-role', v=>setRole(v)],
    ['data-open-club', v=>{ state.filters.players = Object.assign({}, state.filters.players, {clubId:v}); state.search=''; state.searchOpen=false; goto('players'); }],
    ['data-theme', v=>{ try{ localStorage.setItem('sb-theme', v); }catch(err){} applyStoredTheme(); if(state.view==='more') render(); }],
    ['data-open-tournament', v=>{ const tab=e.target.closest('[data-open-tab]'); const evEl=e.target.closest('[data-open-event-id]'); state.searchOpen=false; state.search=''; state.mobileSearch=false; openTournament(v, tab?tab.getAttribute('data-open-tab'):null, evEl?evEl.getAttribute('data-open-event-id'):null); window.scrollTo(0,0); }],
    ['data-open-player', v=>{ const p=playerById(v); if(p) openPlayerDetailDialog(p); }],
    ['data-open-match', v=>{ const m=matchById(v); if(m) openMatchDetailDialog(m); }],
    ['data-select-tournament', v=>openTournament(v)],
    ['data-nav', v=>goto(v)],
    ['data-tab', v=>{ state.tab=v; state.eventId=null; render(); window.scrollTo(0,0); }],
    ['data-open-event', v=>{ state.eventId=null; state.tab='matches'; state.filters.matches = {eventId:v}; state.filters.drawEventId = v; render(); window.scrollTo(0,0); }],
    ['data-ev-players', v=>openEventPlayersDialog(v)],
    ['data-ev-seeds', v=>openEventSeedsDialog(v)],
    ['data-goto-draws', v=>{ state.filters.drawEventId = v; state.eventId = v; state.tab='draws'; render(); window.scrollTo(0,0); }],
    ['data-back-events', ()=>{ state.eventId=null; render(); window.scrollTo(0,0); }],
    ['data-delete-event', async v=>{ if(await confirmDialog('Delete this event and all its data?')) await deleteEventCascade(v); }],
    ['data-open-live', v=>{ const m=matchById(v); if(m) openScoreDialog(m); }],
    ['data-close-live', ()=>{ state.liveMatchId=null; render(); }],
    ['data-point', v=>{ const m=matchById(state.liveMatchId); if(m) addPoint(m, v).then(render); }],
    ['data-undo-point', ()=>{ const m=matchById(state.liveMatchId); if(m) undoPoint(m).then(render); }],
    ['data-end-game', ()=>{ const m=matchById(state.liveMatchId); if(m) endGameManually(m).then(render); }],
    ['data-add-am-rounds', v=>{ const ev=eventById(v); if(ev) openAddAmericanoRoundsDialog(ev); }],
    ['data-points-help', ()=>openPointsHelp()],
    ['data-goto-results', ()=>{ state.tab='matches'; state.filters.matches={}; render(); requestAnimationFrame(()=>{ const h=[...document.querySelectorAll('.mt-sec > h3')].find(x=>/Completed/.test(x.textContent)); if(h) h.scrollIntoView({block:'start'}); }); }],
    ['data-suggest-seeds', v=>{ const ev=eventById(v); if(ev) openSuggestSeedsDialog(ev); }],
    ['data-clear-filters', v=>{ const [key, fields] = v.split(':'); const f = state.filters[key] = state.filters[key]||{}; (fields||'').split(',').forEach(k=>{ f[k]=null; }); render(); }],
    ['data-filter-toggle', v=>{ state.mFilterOpen = state.mFilterOpen||{}; state.mFilterOpen[v] = !state.mFilterOpen[v]; render(); }],
    ['data-ev-sub', v=>{ state.eventSub = v; state.eventSubFor = state.eventId; render(); }],
    ['data-start-match', async v=>{ const m=matchById(v); if(m){ await startMatch(m); render(); } }],
    ['data-unstart-match', async v=>{ const m=matchById(v); if(m){ await act(async ()=>{ await Store.update('matches', m.id, {status:'scheduled', actualStart:null, games:[], updatedAt:nowIso()}); }, 'Back to not started'); render(); } }],
    ['data-finish-event', async v=>{ const ev=eventById(v); if(ev){ await confirmFinishEvent(ev); render(); } }],
    ['data-reopen-event', async v=>{ const ev=eventById(v); if(ev && await confirmDialog('Reopen '+ev.name+'? Matches cancelled when it was finished come back, and the champion is withdrawn until it is finished again.', {title:'Reopen event', okLabel:'Reopen', danger:false})){ await reopenEvent(ev); render(); } }],
    ['data-am-final', v=>{ const ev=eventById(v); if(ev) openAmericanoFinalDialog(ev); }],
    ['data-am-final-remove', async v=>{ const ev=eventById(v); if(ev){ await removeAmericanoFinal(ev); render(); } }],
    ['data-open-schedule', v=>{ const m=matchById(v); if(m) openScheduleDialog(m); }],
    ['data-open-decide', v=>{ const m=matchById(v); if(m) openDecideDialog(m); }],
    ['data-open-correct', v=>{ const m=matchById(v); if(m) openCorrectDialog(m); }],
    ['data-toggle-court', async v=>{ const c=courtById(v); if(c) await updateCourt(c.id, {active:!c.active}); render(); }],
    ['data-delete-court', async v=>{ if(await confirmDialog('Delete this court?')) await deleteCourt(v); render(); }],
    ['data-delete-player', async v=>{ if(await confirmDialog('Delete this player profile?')) await deletePlayer(v); }],
    ['data-export-standings', v=>exportStandings(v)],
    ['data-register-event', async v=>{
      const me = myPlayer(); if(!me){ toast('Choose a player profile first', true); return; }
      const partnerSel = document.querySelector('[data-partner-select="'+v+'"]');
      const partnerId = partnerSel ? (partnerSel.value||null) : null;
      const ev = eventById(v);
      if(isDoublesType(ev.type) && !partnerId){ toast('Choose a partner first', true); return; }
      await registerForEvent(t?t.id:ev.tournamentId, v, me.id, partnerId); render();
    }],
    ['data-withdraw-reg', async v=>{ const reg=state.registrations.find(r=>r.id===v); if(reg && await confirmDialog('Withdraw from this event?', {okLabel:'Withdraw'})) await withdrawRegistration(reg); render(); }],
    ['data-mark-read', async v=>{ await Store.update('notifications', v, {read:true}); render(); }],
    ['data-delete-tournament-card', async v=>{ const tt=state.tournaments.find(x=>x.id===v); if(tt && await confirmDialog('Delete "'+tt.name+'" and everything in it? This cannot be undone.')) await deleteTournamentCascade(v); }],
    ['data-admin-register-event', async v=>{
      const sel = document.querySelector('[data-admin-player-select="'+v+'"]');
      const partnerSel = document.querySelector('[data-admin-partner-select="'+v+'"]');
      const playerId = sel ? sel.value : '';
      const partnerId = partnerSel ? (partnerSel.value||null) : null;
      const ev = eventById(v);
      if(!playerId){ toast('Choose a player first', true); return; }
      if(isDoublesType(ev.type) && !partnerId){ toast('Choose a partner first', true); return; }
      await adminRegisterPlayer(ev.tournamentId, v, playerId, partnerId); render();
    }]
  ];
  // Walk up from the actual click target level by level (not attr-by-attr across the
  // whole ancestor chain) so a nested control (e.g. a delete button inside a card that
  // itself opens on click) always wins over the outer card's own handler.
  let node = e.target;
  while(node && node.nodeType===1 && node!==document.body){
    if(node.hasAttribute('data-more-menu')){ e.stopPropagation(); openMoreSheet(node); return; }
    for(const [attr, fn] of dataChecks){
      if(node.hasAttribute(attr)){ e.stopPropagation(); await fn(node.getAttribute(attr)); return; }
    }
    node = node.parentElement;
  }

  let changed=false;
  if(!e.target.closest('.role-switch') && state.roleMenuOpen){ state.roleMenuOpen=false; changed=true; }
  if(!e.target.closest('.search-wrap') && state.searchOpen){ state.searchOpen=false; changed=true; }
  if(!e.target.closest('#btnBell') && !e.target.closest('.notif-panel') && state.notifOpen){ state.notifOpen=false; changed=true; }
  if(changed) render();
});

document.addEventListener('change', async (e)=>{
  const t = currentTournament();
  const target = e.target;

  if(target.id==='themeToggleNoop') return;
  if(target.closest && target.closest('#themeToggle')){
    const btn = target.closest('button[data-theme]'); if(!btn) return;
    try{ localStorage.setItem('sb-theme', btn.getAttribute('data-theme')); }catch(err){}
    applyStoredTheme(); return;
  }
  if(target.matches('[data-filter]')){ handleFilterInput(target); return; }
  if(target.id==='globalSearch'){ state.search=target.value; state.searchOpen=true; rerenderPreservingFocus(target); return; }
  if(target.id==='selViewingPlayer'){ setViewingPlayer(target.value||null); return; }
  if(target.id==='viewerFollow'){ setFollow(target.value||null); return; }
  if(target.matches('[data-reg-status], [data-seed-input], #fDrawFormat, #fThirdPlace, #fGroupSize')){
    const regL = target.matches('[data-reg-status]') && state.registrations.find(r=>r.id===target.getAttribute('data-reg-status'));
    const entL = target.matches('[data-seed-input]') && entryById(target.getAttribute('data-seed-input'));
    const evL = eventById((regL&&regL.eventId) || (entL&&entL.eventId) || target.getAttribute('data-event-id') || state.eventId);
    const msg = evL && lockReason(tournamentById(evL.tournamentId), evL);
    if(msg){ toast(msg, true); render(); return; }
  }
  if(target.matches('[data-reg-status]')){
    const reg = state.registrations.find(r=>r.id===target.getAttribute('data-reg-status'));
    if(reg) await setRegistrationStatus(reg, target.value);
    render(); return;
  }
  if(target.matches('[data-seed-input]')){
    const entryId = target.getAttribute('data-seed-input');
    const seed = validSeed(target.value.trim());
    const en = entryById(entryId);
    const clash = seed!=null && en && eventEntries(en.eventId).find(x=>x.id!==entryId && validSeed(x.seed)===seed);
    await act(async ()=> Store.update('entries', entryId, {seed}));
    if(clash) toast('Seed '+seed+' is also given to '+entryName(clash)+' - give each seed to one entry.', true);
    if(target.value.trim() && seed==null) target.value = '';
    return;
  }
  if(target.id==='fDrawFormat'){
    const wrap = document.getElementById('fGroupSizeWrap');
    if(wrap) wrap.hidden = target.value!=='group_knockout';
    const tp = document.getElementById('fThirdPlaceWrap');
    if(tp) tp.hidden = !['single_elimination','group_knockout'].includes(target.value);
    const eventId = target.getAttribute('data-event-id');
    if(eventId) await updateEvent(eventId, {drawFormat: target.value});
    return;
  }
  if(target.id==='fReportTournament'){ state.tid = target.value||null; render(); return; }
  if(target.id==='fDrawEventSelect'){ state.filters.drawEventId = target.value; render(); return; }
  if(target.id==='fTPlayerAddEvent' || target.id==='fTPlayerAddPlayer'){
    syncMixedPartnerOptions(eventById(document.getElementById('fTPlayerAddEvent').value), genderOfPlayerId(document.getElementById('fTPlayerAddPlayer').value), document.getElementById('fTPlayerAddPartner'));
    return;
  }
  if(target.matches('[data-admin-player-select]')){
    const evId = target.getAttribute('data-admin-player-select');
    syncMixedPartnerOptions(eventById(evId), genderOfPlayerId(target.value), document.querySelector('[data-admin-partner-select="'+evId+'"]'));
    return;
  }
});

document.addEventListener('input', (e)=>{
  const target = e.target;
  if(target.matches('[data-filter]') && target.tagName!=='SELECT'){ handleFilterInput(target); return; }
  if(target.id==='globalSearch'){ state.search=target.value; state.searchOpen=true; rerenderPreservingFocus(target); return; }
});

/* ============================== POST-RENDER HOOKS / THEME ============================== */
function postRenderHooks(){
  // The current screen's buttons (New tournament, Add player, Share, ⋯) sit in the top bar next to the logo.
  const slot = document.getElementById('topbarActions');
  const acts = !VIEWER && document.querySelector('.main .t-header .t-actions');
  if(slot && acts){ slot.appendChild(acts); }
  document.querySelectorAll('details[data-guide]').forEach(d=>d.addEventListener('toggle', ()=>{ state.guideOpen = state.guideOpen||{}; state.guideOpen[d.getAttribute('data-guide')] = d.open; }));
  const addForm = document.getElementById('tAddPlayerForm');
  if(addForm) addForm.addEventListener('toggle', ()=>{ state.tAddOpen = addForm.open; });
  // Keep the active tab visible in the sideways-scrolling tab strip (phones).
  const strip = document.querySelector('.tabs'), act = strip && strip.querySelector('.tab.active');
  if(strip && act && strip.scrollWidth > strip.clientWidth){
    const want = act.offsetLeft - (strip.clientWidth - act.offsetWidth)/2;
    strip.scrollLeft = Math.max(0, want);
  }
  if((state.view==='tdetail' && state.tab==='draws') || ['draws','results'].includes(state.view)){
    requestAnimationFrame(drawAllBracketConnectors);
  }
  const fp = followedPlayer();
  if(fp && state.tab==='draws'){
    document.querySelectorAll('#tabBody [data-match-id], #tabBody [data-open-match]').forEach(el=>{
      const m = matchById(el.getAttribute('data-match-id') || el.getAttribute('data-open-match'));
      if(m && matchHasPlayer(m, fp.id)) el.classList.add('me-match');
    });
  }
}
function applyStoredTheme(){
  let pref='auto';
  try{ pref = localStorage.getItem('sb-theme') || 'auto'; }catch(e){}
  const root = document.documentElement;
  if(pref==='light') root.setAttribute('data-theme','light');
  else if(pref==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  document.querySelectorAll('button[data-theme]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-theme')===pref);
  });
}

document.addEventListener('focusin', e=>{ if(e.target.matches && e.target.matches('input,select,textarea')) document.body.classList.add('kb-open'); });
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ const a=document.activeElement; if(!(a && a.matches && a.matches('input,select,textarea'))) document.body.classList.remove('kb-open'); }, 50); });

/* ============================== BOOT ============================== */
const COLLECTIONS = ['tournaments','clubs','players','events','registrations','entries','draws','matches','courts','notifications','auditLog','settings'];
(async function boot(){
  applyStoredTheme();
  if(VIEWER){ ViewerMode.start(); return; }
  try{
    await Store.init();
    let pending = COLLECTIONS.length;
    COLLECTIONS.forEach(col=>{
      Store.subscribe(col, [], (arr)=>{
        state[col] = arr;
        ShareSync.schedule();   // keep live links up to date (no-op when nothing is shared)
        // Startup: render once when every collection has arrived, not once per collection.
        if(pending>0){ pending--; if(pending===0){ state.ready=true; render(); CloudUI.start();
          setTimeout(async ()=>{ try{ const n = await repairFalseByes(); if(n){ toast('Fixed '+n+' knockout match'+(n===1?'':'es')+' that were wrongly shown as byes'); render(); } }catch(e){ console.error('bye repair', e); } }, 300);
        } return; }
        render();
        if(col==='tournaments' || col==='settings') ShareUI.redraw();
      });
    });
    if(!state.ready) render();   // show the loading state while shared data arrives
  }catch(e){
    console.error('Boot failed', e);
    state.ready = true;
    render();
    toast('Could not start data layer - some features may not work.', true);
  }
})();

})();
</script>
