/* ============================== SCORING RULES ============================== */
/* Two kinds of scoring, chosen by the rule's `kind`:
   - 'rally' (badminton, and rules saved before sports existed): rally-point
     games to 21, deuce and a cap. A match is a list of games {a, b}.
   - 'sets' (tennis, padel): points 15/30/40, games, sets and tiebreaks. A match
     is a list of sets {a, b} counted in games; a set's point log replays the
     games, the current point (pt) and a 6-6 tiebreak (tb).
   Never trust the UI: every save is re-validated through these pure functions. */
const DEFAULT_SCORING = { bestOf:3, pointsToWin:21, winBy:2, capPoints:30, deuceEnabled:true };
const TENNIS_SCORING = { kind:'sets', bestOf:3, gamesPerSet:6, tiebreakTo:7, finalSet:'tiebreak', superTo:10, deuce:'advantage' };
const PADEL_SCORING = Object.assign({}, TENNIS_SCORING, {deuce:'golden'});
const SPORTS = {
  badminton: {name:'Badminton', scoring:DEFAULT_SCORING},
  tennis: {name:'Tennis', scoring:TENNIS_SCORING},
  padel: {name:'Padel', scoring:PADEL_SCORING}
};
function sportOf(t){ return (t && SPORTS[t.sport]) ? t.sport : 'badminton'; }
function defaultScoringFor(sport){ return {...(SPORTS[sport] || SPORTS.badminton).scoring}; }
function isSetScoring(cfg){ return !!(cfg && cfg.kind==='sets'); }

const RallyRules = {
  gameWinner(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const a=g.a, b=g.b;
    if(a==null||b==null||a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b)) return null;
    if(a===b) return null;
    if(cfg.totalPoints) return a+b>=cfg.totalPoints ? (a>b?1:2) : null;
    if(!cfg.deuceEnabled){
      if(a>=cfg.pointsToWin || b>=cfg.pointsToWin) return a>b?1:2;
      return null;
    }
    const cap = cfg.capPoints||30;
    if(a>=cap||b>=cap) return a>b?1:2;
    const hi=Math.max(a,b), lo=Math.min(a,b);
    if(hi<cfg.pointsToWin) return null;
    if(hi-lo<cfg.winBy) return null;
    return a>b?1:2;
  },
  /* Recompute a/b for a game purely from its point-event log, so Undo is exact
     (pop one event) rather than a blind decrement. */
  scoreFromLog(log){
    let a=0,b=0;
    for(const ev of log||[]){ if(ev==='a') a++; else if(ev==='b') b++; }
    return {a,b};
  },
  /* A finished-looking game whose score couldn't happen under the rules (e.g.
     25-21 when a game ends at 21 or 2 clear): returns a short reason, else null.
     Unfinished scores (e.g. 18-15, 22-21) are fine: they're saved as in progress. */
  gameProblem(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const a=g.a|0, b=g.b|0, hi=Math.max(a,b), lo=Math.min(a,b), P=cfg.pointsToWin||21;
    if(cfg.totalPoints){
      return a+b>cfg.totalPoints ? 'the match ends when '+cfg.totalPoints+' points have been played' : null;
    }
    if(!cfg.deuceEnabled){
      return hi>P ? 'the game ends as soon as a side reaches '+P : null;
    }
    const cap=cfg.capPoints||30, by=cfg.winBy||2;
    if(hi>cap) return 'the game ends at '+cap+' at the latest';
    if(hi<=P) return null;                               // not past the target yet
    if(hi===cap) return (lo===cap-1 || (hi-lo===by && lo>=P-by+1)) ? null : 'the game would have ended earlier';
    if(hi-lo<by) return null;                            // still in deuce, unfinished
    return (hi-lo===by && lo>=P-by+1) ? null : 'the game would have ended earlier';
  },
  validGameScore(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    if(g.a<0||g.b<0) return false;
    const cap = cfg.totalPoints || cfg.capPoints||30;
    if(g.a>cap||g.b>cap) return false;
    return true;
  }
};

/* Tennis / padel. A set is one of three kinds, by its place in the match:
   'set' (to gamesPerSet, two clear, tiebreak at gamesPerSet-all), 'adv' (a
   final set played on with no tiebreak) or 'stb' (a match tiebreak to superTo
   in place of the final set, counted in points). */
const SetRules = {
  G(cfg){ return cfg.gamesPerSet||6; },
  setKind(cfg, index, g){
    if(g && g.stb) return 'stb';
    if(g && g.adv) return 'adv';
    if(index!=null && index===(cfg.bestOf||3)-1 && (cfg.bestOf||3)>1){
      if(cfg.finalSet==='super') return 'stb';
      if(cfg.finalSet==='advantage') return 'adv';
    }
    return 'set';
  },
  gameWinner(g, cfg, index){
    const a=g.a, b=g.b;
    if(a==null||b==null||a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b)||a===b) return null;
    const hi=Math.max(a,b), lo=Math.min(a,b), G=this.G(cfg), kind=this.setKind(cfg, index, g);
    const w = a>b?1:2;
    if(kind==='stb') return (hi>=(cfg.superTo||10) && hi-lo>=2) ? w : null;
    if(kind==='adv') return (hi>=G && hi-lo>=2) ? w : null;
    if(hi>=G && hi-lo>=2 && hi<=G+1) return w;
    return (hi===G+1 && lo===G) ? w : null;              // won the tiebreak
  },
  /* Replays a set's points. Returns the games {a, b}, the tiebreak points (tb)
     once one starts, and the current game's points (pt, counted 0,1,2,3...) while
     the set is still going. */
  scoreFromLog(log, cfg, kind){
    cfg = cfg || TENNIS_SCORING;
    const G=this.G(cfg), golden = cfg.deuce==='golden';
    let a=0, b=0, pa=0, pb=0, tb=null, done=false;
    for(const ev of log||[]){
      if(done || (ev!=='a' && ev!=='b')) continue;
      if(kind==='stb'){
        if(ev==='a') a++; else b++;
        if(Math.max(a,b)>=(cfg.superTo||10) && Math.abs(a-b)>=2) done=true;
        continue;
      }
      if(tb){
        if(ev==='a') tb.a++; else tb.b++;
        if(Math.max(tb.a,tb.b)>=(cfg.tiebreakTo||7) && Math.abs(tb.a-tb.b)>=2){ if(tb.a>tb.b) a++; else b++; done=true; }
        continue;
      }
      if(ev==='a') pa++; else pb++;
      const won = golden && pa+pb===7 ? (pa>pb?1:2)   // 40-40, the next point decides
        : (Math.max(pa,pb)>=4 && Math.abs(pa-pb)>=2) ? (pa>pb?1:2) : 0;
      if(!won) continue;
      if(won===1) a++; else b++;
      pa=0; pb=0;
      if(Math.max(a,b)>=G && Math.abs(a-b)>=2) done=true;
      else if(kind!=='adv' && a===G && b===G) tb={a:0,b:0};
    }
    const out = {a, b};
    if(tb) out.tb = tb;
    if(!done && kind!=='stb' && !tb && (pa||pb)) out.pt = {a:pa, b:pb};
    return out;
  },
  gameProblem(g, cfg, index){
    const a=g.a|0, b=g.b|0, hi=Math.max(a,b), lo=Math.min(a,b), G=this.G(cfg), kind=this.setKind(cfg, index, g);
    if(kind==='stb'){
      const S=cfg.superTo||10;
      if(hi>S && hi-lo!==2) return 'the match tiebreak ends at '+S+' points, or 2 clear after that';
      return null;
    }
    if(kind==='adv'){
      if(hi>G && hi-lo>2) return 'the set would have ended earlier';
      return null;
    }
    if(hi>G+1) return 'a set ends at '+(G+1)+'-'+G+' at the latest (tiebreak at '+G+'-'+G+')';
    if(hi===G+1 && lo<G-1) return 'the set would have ended at '+G+'-'+lo;
    if(g.tb && hi===G+1 && lo===G){
      const T=cfg.tiebreakTo||7, ta=g.tb.a|0, tbb=g.tb.b|0, th=Math.max(ta,tbb), tl=Math.min(ta,tbb);
      if((ta>tbb)!==(a>b) || th<T || (th>T && th-tl!==2) || (th===T && tl>T-2)) return 'the tiebreak score '+ta+'-'+tbb+' doesn\'t fit';
    }
    return null;
  },
  validGameScore(g, cfg, index){
    if(g.a<0||g.b<0) return false;
    const kind=this.setKind(cfg, index, g);
    if(kind==='set') return g.a<=this.G(cfg)+1 && g.b<=this.G(cfg)+1;
    return g.a<=99 && g.b<=99;
  }
};

/* One API for both kinds. Pass the game's index in the match where you have it:
   tennis needs it to know the final set (a match tiebreak or an advantage set). */
/* "Game 2", "Set 2", or "Match tiebreak" for a final set played as one. */
function gameLabel(cfg, index){
  if(isSetScoring(cfg)) return SetRules.setKind(cfg, index)==='stb' ? 'Match tiebreak' : 'Set '+(index+1);
  return 'Game '+(index+1);
}
const ScoreRules = {
  rules(cfg){ return isSetScoring(cfg) ? SetRules : RallyRules; },
  unit(cfg){ return isSetScoring(cfg) ? 'set' : 'game'; },
  gameWinner(g, cfg, index){ cfg = cfg || DEFAULT_SCORING; return this.rules(cfg).gameWinner(g, cfg, index); },
  gamesNeeded(cfg){ return Math.ceil((cfg&&cfg.bestOf||3)/2); },
  matchWinner(games, cfg){
    cfg = cfg || DEFAULT_SCORING;
    let w1=0,w2=0;
    const need = this.gamesNeeded(cfg);
    for(let i=0;i<games.length;i++){
      const w=this.gameWinner(games[i],cfg,i);
      if(w===1) w1++; else if(w===2) w2++;
      if(w1===need) return 1;
      if(w2===need) return 2;
    }
    return null;
  },
  isMatchComplete(games, cfg){ return this.matchWinner(games,cfg)!=null; },
  /* Rally: the score from a game's log. Sets: pass cfg and the set's index too. */
  scoreFromLog(log, cfg, index){
    return isSetScoring(cfg) ? SetRules.scoreFromLog(log, cfg, SetRules.setKind(cfg, index)) : RallyRules.scoreFromLog(log);
  },
  gameProblem(g, cfg, index){ cfg = cfg || DEFAULT_SCORING; return this.rules(cfg).gameProblem(g, cfg, index); },
  /* Problems with the games as a whole: a game played after one side had already
     won the match (e.g. a 3rd game at 2-0 in best of 3), or a later game with a
     score while an earlier one is unfinished. Returns {index, reason} or null. */
  matchProblem(games, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const need = this.gamesNeeded(cfg), u = this.unit(cfg);
    let w1=0, w2=0;
    for(let i=0;i<games.length;i++){
      const g = games[i];
      const played = (g.a|0) || (g.b|0);
      if((w1>=need || w2>=need) && played) return {index:i, reason:'the match was already won '+Math.max(w1,w2)+'-'+Math.min(w1,w2)+' after '+u+' '+i+', so '+u+' '+(i+1)+' isn\'t played'};
      const w = this.gameWinner(g, cfg, i);
      if(!w && played && games.slice(i+1).some(x=>(x.a|0)||(x.b|0))) return {index:i, reason:u+' '+(i+1)+' isn\'t finished, so there can\'t be a score for '+u+' '+(i+2)};
      if(w===1) w1++; else if(w===2) w2++;
    }
    if(games.length > (cfg.bestOf||3)) return {index:cfg.bestOf||3, reason:'best of '+(cfg.bestOf||3)+' has at most '+(cfg.bestOf||3)+' '+u+'s'};
    return null;
  },
  validGameScore(g, cfg, index){ cfg = cfg || DEFAULT_SCORING; return this.rules(cfg).validGameScore(g, cfg, index); },
  /* What a game adds to "points for/against" in standings: points in a rally
     game, games in a set (a match tiebreak counts as one game to the winner). */
  tally(g, cfg, index){
    if(isSetScoring(cfg) && SetRules.setKind(cfg, index, g)==='stb'){
      const w = this.gameWinner(g, cfg, index);
      return [w===1?1:0, w===2?1:0];
    }
    return [g.a||0, g.b||0];
  },
  /* Each side's point in the game being played of a live set: {a:'40', b:'AD'},
     a tiebreak's points ({a:'5', b:'4', tb:true}), or null (rally scoring, a
     match tiebreak - its score is the points - or a finished set). */
  pointSides(g, cfg){
    if(!isSetScoring(cfg) || !g || g.stb || this.gameWinner(g, cfg)) return null;
    if(g.tb) return {a:String(g.tb.a|0), b:String(g.tb.b|0), tb:true};
    const p = g.pt || {a:0, b:0}, N=['0','15','30','40'];
    if(p.a>=3 && p.b>=3 && p.a!==p.b) return p.a>p.b ? {a:'AD', b:'40'} : {a:'40', b:'AD'};
    return {a:N[Math.min(p.a,3)], b:N[Math.min(p.b,3)]};
  },
  /* The same as one string: "40-30", "AD-40", "TB 5-4". */
  pointLabel(g, cfg){
    const p = this.pointSides(g, cfg); if(!p) return null;
    return (p.tb ? 'TB ' : '')+p.a+'-'+p.b;
  }
};


/* ============================== STORE ============================== */
/* Tries the shared `db` capability; falls back to localStorage (per-viewer
   only, never treated as shared truth) with matching filter/subscribe/emit
   semantics. Generic over any flat top-level collection name. */
const LOCAL_KEY = 'shuttle-bracket-store-v2';
/* Live-sharing defaults. Empty here; scripts/build_web.py fills them from
   sharing/share-config.json so an App Store build works without setup. */
const SHARE_DEFAULTS = {url:'', key:'', viewerUrl:''};
/* With all three built in, live sharing just works: its Settings card is hidden
   and the built-in values are always used (so an old saved entry can't override them). */
const SHARE_BUILTIN = !!(SHARE_DEFAULTS.url && SHARE_DEFAULTS.key && SHARE_DEFAULTS.viewerUrl);
/* Public website (the live-link site) with the privacy policy and support pages. */
const SITE_URL = ((SHARE_DEFAULTS.viewerUrl || 'https://shuttlebracket.github.io/').replace(/[#?].*$/,'').replace(/\/?$/,'/'));
function legalLinksHtml(){ return `<a href="${SITE_URL}privacy/" target="_blank" rel="noopener">Privacy</a> &middot; <a href="${SITE_URL}support/" target="_blank" rel="noopener">Support</a>`; }
/* Build stamp: scripts/build_web.py writes the same id into the app and into the
   viewer page, so the app can tell when the viewer page on GitHub is out of date. */
const APP_BUILD = 'b3f5c595693d';
/* scripts/build_web.py sets this to true in the public viewer page (GitHub
   Pages): opened without a live link it shows a short landing page, never the
   organiser app, which only ships inside the iOS app. */
const VIEWER_ONLY = true;
/* Opened from a share link (#s=<id>&p=<project>&k=<key>)? Then this page is a
   read-only live viewer of that one tournament and never touches local data. */
const VIEWER = (function(){
  try{
    const h = new URLSearchParams((location.hash||'').replace(/^#/,''));
    const id = h.get('s'); if(!id || !/^[A-Za-z0-9]{12,40}$/.test(id)) return null;
    const ref = h.get('p'), u = h.get('u');
    let key = h.get('k');
    let url = (ref && /^[a-z0-9-]{3,64}$/i.test(ref)) ? 'https://'+ref.toLowerCase()+'.supabase.co'
      : (u && /^https:\/\/[^\s]+$/.test(u) ? u.replace(/\/+$/,'') : null);
    // Short links (#s=<id>) use the project built into this page.
    if(!url && !key && SHARE_DEFAULTS.url && SHARE_DEFAULTS.key){ url = SHARE_DEFAULTS.url.replace(/\/+$/,''); key = SHARE_DEFAULTS.key; }
    if(!url || !key) return null;
    const reg = h.get('r');   // registration link: lets this visitor sign up for events
    return {id, url, key, reg: (reg && /^[A-Za-z0-9]{8,40}$/.test(reg)) ? reg : null};
  }catch(e){ return null; }
})();
/* iOS app bridge (WKWebView script message handlers). Absent on the web, so
   every call is a feature-detected no-op there. In the iOS app the native
   side injects the saved database as window.__SB_NATIVE_STORE__ before this
   script runs and persists every change to a JSON file in Application
   Support (more durable than WebView localStorage, and included in backups). */
const Native = (function(){
  const h = (window.webkit && window.webkit.messageHandlers) || null;
  return {
    has(name){ return !!(h && h[name]); },
    post(name, body){ try{ h[name].postMessage(body); return true; }catch(e){ return false; } }
  };
})();
/* Shuttle Bracket Pro: one in-app purchase (StoreKit, ProStore.swift) unlocks
   the live and registration links, iCloud sync, more than one active
   tournament, the advanced draw formats, events of more than FREE_MAX_ENTRIES,
   exports and printing, and the Rankings page. Outside the iOS app (a
   browser, the public viewer) there is no store, so everything is open. */
const FREE_MAX_ENTRIES = 16;
const PRO_FORMATS = ['group_knockout','double_elimination','americano'];
const Pro = (function(){
  const native = ()=> Native.has('sbPro');
  let pro = native() ? window.__SB_PRO__===true : true, price = '';
  function set(v){ const was = pro; pro = !!v; if(was!==pro && typeof render==='function' && state.ready) render(); }
  async function call(action){
    if(!native()) return {pro:true, price:'', error:''};
    try{
      const r = await window.webkit.messageHandlers.sbPro.postMessage({action}) || {};
      if(r.price) price = r.price;
      set(!!r.pro);
      return r;
    }catch(e){ return {pro, price, error: String((e && e.message) || e)}; }
  }
  return {has: ()=> VIEWER || pro, native, price: ()=>price, set, call};
})();
window.sbProChanged = v => Pro.set(v);
const Store = (function(){
  let db=null, mode='local';
  let local = {};
  try{
    const nativeRaw = (typeof window.__SB_NATIVE_STORE__==='string' && window.__SB_NATIVE_STORE__) ? window.__SB_NATIVE_STORE__ : null;
    const raw = VIEWER ? null : (nativeRaw || localStorage.getItem(LOCAL_KEY));
    if(raw) local=JSON.parse(raw)||{};
  }catch(e){}
  const localListeners = {};
  /* For merging with other devices (iCloud sync): every record written here
     carries _mt (last change, ms), and deletions are remembered in
     local[DEL_KEY][col][id] = time, so a record deleted on one device isn't
     brought back by another. DEL_KEY is not a collection. */
  const DEL_KEY = '__deleted';
  const TOMBSTONE_KEEP_MS = 180*864e5;
  function tomb(col){ local[DEL_KEY] = local[DEL_KEY]||{}; return (local[DEL_KEY][col] = local[DEL_KEY][col]||{}); }

  function ensureCol(col){ if(!local[col]) local[col]={}; if(!localListeners[col]) localListeners[col]=new Set(); }
  let nativeSaveTimer = null;
  function flushNative(){ nativeSaveTimer = null; Native.post('sbStore', JSON.stringify(local)); }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
    if(Native.has('sbStore')){ clearTimeout(nativeSaveTimer); nativeSaveTimer = setTimeout(flushNative, 250); }
  }
  const flushIfPending = ()=>{ if(nativeSaveTimer){ clearTimeout(nativeSaveTimer); flushNative(); } };
  window.addEventListener('pagehide', flushIfPending);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushIfPending(); });
  function matchFilters(rec, filters){ return filters.every(([f,v])=> rec[f]===v); }
  function emitLocal(col){
    ensureCol(col);
    localListeners[col].forEach(entry=>{
      let arr = Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, entry.filters));
      arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
      entry.cb(arr);
    });
  }

  async function init(){
    try{
      if(window.claude && window.claude.use){
        const d = await window.claude.use('db');
        if(d){ db=d; mode='db'; return 'db'; }
      }
    }catch(e){ console.error('db init failed, falling back to local', e); }
    mode='local';
    return 'local';
  }

  function subscribe(col, filters, cb){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      try{ filters.forEach(([f,v])=>{ q = q.where(f,'==',v); }); }catch(e){ console.error(e); cb([]); return ()=>{}; }
      return q.onSnapshot(snap=>{
        const arr = snap.docs.map(d=>({id:d.id, ...d.data()}));
        arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
        cb(arr);
      }, err=>{ console.error('db subscribe error', col, err); cb([]); });
    } else {
      ensureCol(col);
      const entry = {filters, cb};
      localListeners[col].add(entry);
      emitLocal(col);
      return ()=> localListeners[col].delete(entry);
    }
  }

  async function getAll(col, filters){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      filters.forEach(([f,v])=>{ q = q.where(f,'==',v); });
      const snap = await q.get();
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    }
    ensureCol(col);
    return Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, filters));
  }

  async function add(col, data, id){
    const docId = id || uid();
    if(VIEWER) return docId;   // read-only viewer: never writes
    const body = {...data, createdAt: data.createdAt || nowIso()};
    if(mode==='db'){
      await db.collection(col).doc(docId).set(body);

      ensureCol(col);
      local[col][docId] = {...body, _mt: Date.now()};
      if(local[DEL_KEY] && local[DEL_KEY][col]) delete local[DEL_KEY][col][docId];
      saveLocal(); emitLocal(col);
    }
    return docId;
  }
  async function update(col, id, data){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).update(data);
    } else {
      ensureCol(col);
      if(!local[col][id]) return;
      local[col][id] = {...local[col][id], ...data, _mt: Date.now()}; saveLocal(); emitLocal(col);
    }
  }
  async function remove(col, id){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).delete();
    } else {
      ensureCol(col);
      delete local[col][id]; tomb(col)[id] = Date.now(); saveLocal(); emitLocal(col);
    }
  }

  /* Merge a database from another device (iCloud) into this one, record by
     record: the newer change wins (_mt; older records fall back to
     updatedAt/createdAt), and a deletion wins over any change made before it.
     Returns {changed} - whether anything on this device changed. The merged
     result is saved (and so written back to iCloud) whenever it differs from
     the incoming copy, so both sides end up the same. */
  function recTime(r){ return r ? (r._mt || Date.parse(r.updatedAt||'') || Date.parse(r.createdAt||'') || 0) : 0; }
  function mergeRemote(remote){
    if(mode!=='local' || VIEWER || !remote || typeof remote!=='object') return {changed:false};
    const isCol = k => k!==DEL_KEY && ((local[k] && typeof local[k]==='object') || (remote[k] && typeof remote[k]==='object'));
    const del = {};
    [local[DEL_KEY]||{}, remote[DEL_KEY]||{}].forEach(src=>Object.entries(src).forEach(([c,ids])=>{
      del[c] = del[c]||{};
      Object.entries(ids||{}).forEach(([id,ts])=>{ if(!(del[c][id] >= ts)) del[c][id] = ts; });
    }));
    const out = {}, changedCols = new Set();
    new Set([...Object.keys(local), ...Object.keys(remote)].filter(isCol)).forEach(c=>{
      const L = local[c]||{}, R = remote[c]||{}, res = {};
      new Set([...Object.keys(L), ...Object.keys(R)]).forEach(id=>{
        const l = L[id], r = R[id];
        let pick = !l ? r : !r ? l : (recTime(r) > recTime(l) ? r : l);
        const dts = del[c] && del[c][id];
        if(dts && dts >= recTime(pick)) pick = null;           // deleted after its last change
        else if(dts) delete del[c][id];                         // changed again after the deletion: keep it
        if(pick) res[id] = pick;
        if(JSON.stringify(pick||null) !== JSON.stringify(l||null)) changedCols.add(c);
      });
      out[c] = res;
    });
    const cutoff = Date.now() - TOMBSTONE_KEEP_MS;
    Object.values(del).forEach(ids=>Object.keys(ids).forEach(id=>{ if(ids[id] < cutoff) delete ids[id]; }));
    out[DEL_KEY] = del;
    const differsFromRemote = JSON.stringify(out) !== JSON.stringify(remote);
    local = out;
    if(changedCols.size || differsFromRemote){
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
      if(Native.has('sbStore')){ clearTimeout(nativeSaveTimer); flushNative(); }
    }
    changedCols.forEach(c=>{ if(localListeners[c]) emitLocal(c); });
    return {changed: changedCols.size>0};
  }

  return {init, subscribe, add, update, remove, getAll, mergeRemote, mode:()=>mode};
})();

/* Wrap every write in try/catch so a db failure (offline, quota, revoked
   grant) shows a small inline toast instead of crashing the page. */
/* While an action runs, its many saves don't each redraw the screen (a big
   Schedule all or draw used to redraw hundreds of times); the screen is drawn
   once when the outermost action ends. */
var renderHold = 0, renderPending = false;
async function act(fn, okMsg){
  renderHold++;
  try{
    const result = await fn();
    if(okMsg) toast(okMsg);
    return result;
  }catch(e){
    console.error(e);
    toast('Error: ' + (e && e.message ? e.message : 'action failed'), true);
  }
  finally{
    if(--renderHold===0 && renderPending){ renderPending = false; render(); }
  }
}



/* ============================== LIVE SHARE LINKS ============================== */
/* A shared tournament is a read-only copy kept in the organiser's own Supabase
   project (table + functions from sharing/supabase_setup.sql). The organiser's
   app republishes it a couple of seconds after every change; the link opens this
   same page in "viewer" mode, which polls for updates. Private player details
   (email, phone, date of birth, photo) are never included. */
function shareConfig(){
  const doc = (state.settings||[]).find(s=>s.id==='share') || {};
  const pick = k => (!SHARE_BUILTIN && doc[k]!=null && doc[k]!=='') ? String(doc[k]).trim() : (SHARE_DEFAULTS[k]||'');
  const cfg = {url: pick('url').replace(/\/+$/,''), key: pick('key'), viewerUrl: pick('viewerUrl')};
  if(!cfg.viewerUrl && /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|(^|\.)claudeusercontent\.com$/.test(location.hostname)){
    cfg.viewerUrl = location.origin + location.pathname;   // a self-hosted copy of this page can view its own links
  }
  cfg.ready = !!(cfg.url && cfg.key);
  return cfg;
}
/* Must match sb_config() in sharing/supabase_setup.sql. */
const SHARE_KEEP_DAYS = 90;          // a link is removed this many days after its last change
const SHARE_MAX_BYTES = 1024*1024;   // largest tournament a link can hold
function shareBytes(snap){ const j = typeof snap==='string' ? snap : JSON.stringify(snap); try{ return new TextEncoder().encode(j).length; }catch(e){ return j.length; } }
function shareExpiryDate(at){ if(!at) return null; const d=new Date(at); if(isNaN(d)) return null; d.setDate(d.getDate()+SHARE_KEEP_DAYS); return d; }
function isShareLive(t){ return !!(t && t.share && t.share.id && t.share.key && !t.share.expired); }
/* Is the viewer page that links open (e.g. on GitHub Pages) the same version as this app?
   Only checked from the iPhone app, which can read other sites; cached per session. */
const ViewerPageCheck = { result:null, running:false,
  async run(force){
    const cfg = shareConfig();
    if(APP_BUILD==='dev' || VIEWER || !cfg.viewerUrl || !Native.has('sbFetch')) return null;
    if(this.running || (this.result && !force)) return this.result;
    this.running = true;
    try{
      const url = cfg.viewerUrl.replace(/#.*$/,'') + (cfg.viewerUrl.includes('?')?'&':'?') + 'v=' + Date.now();
      const r = await window.webkit.messageHandlers.sbFetch.postMessage({url, method:'GET', headers:{'Cache-Control':'no-cache'}});
      if(!r || r.error || !r.ok){ this.result = {state:'unreachable', detail: r && (r.error || ('HTTP '+r.status))}; }
      else {
        // The build stamp: a <meta> tag (survives minifying), or the script constant in older viewer pages.
        const m = /<meta name="sb-build" content="([^"]*)">/.exec(r.text||'') || /const APP_BUILD = '([^']*)';/.exec(r.text||'');
        const theirs = m ? m[1] : null;
        this.result = theirs===APP_BUILD ? {state:'current'} : {state:'outdated', theirs};
      }
    }catch(e){ this.result = {state:'unreachable', detail: e && e.message}; }
    finally{ this.running = false; }
    ShareUI.redraw(); const card=document.getElementById('viewerPageStatus'); if(card) card.outerHTML = viewerPageStatusHtml();
    return this.result;
  }
};
function viewerPageStatusHtml(){
  const r = ViewerPageCheck.result;
  // A developer notice (upload the new viewer page): only in builds run from Xcode, never in App Store builds.
  if(SHARE_BUILTIN && !window.__SB_DEBUG__) return '<div id="viewerPageStatus"></div>';
  if(!r || r.state==='current') return '<div id="viewerPageStatus"></div>';
  if(r.state==='outdated') return `<div id="viewerPageStatus" class="reg-banner closed" style="margin:10px 0">${ICONS.warn}<span><b>Your viewer page is out of date.</b> People opening a live link see an older version (without the latest fixes). Upload <b>sharing/viewer-site/index.html</b> from the ShuttleBracket-iOS folder to your GitHub repository again.</span></div>`;
  return `<div id="viewerPageStatus" class="helptext" style="margin:8px 0">Couldn't check the viewer page${r.detail?' ('+esc(r.detail)+')':''}. Make sure the Viewer page address opens in a browser.</div>`;
}
function randomToken(len){
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const buf=new Uint8Array(len); crypto.getRandomValues(buf);
  let s=''; for(let i=0;i<len;i++) s+=abc[buf[i]%62];
  return s;
}
const ShareAPI = {
  headers(key){
    const h={'apikey':key, 'Content-Type':'application/json'};
    if(/^eyJ/.test(key)) h['Authorization']='Bearer '+key;   // legacy anon JWT; new sb_publishable_ keys go in apikey only
    return h;
  },
  async rpc(cfg, fn, body, timeoutMs){
    timeoutMs = timeoutMs || 15000;
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    let timer, res, timedOut=false;
    // Race the request against a timer: some sandboxes never settle a blocked fetch.
    const timeout = new Promise((_,rej)=>{ timer = setTimeout(()=>{ timedOut=true; const err=new Error('timeout'); err.offline=true; err.timeout=true; rej(err); try{ ctrl && ctrl.abort(); }catch(e){} }, timeoutMs); });
    const url = normalizeSupabaseUrl(cfg.url)+'/rest/v1/rpc/'+fn;
    try{
      if(Native.has('sbFetch')){
        // iPhone app: iOS makes the request (a page loaded from a local file can't reach other sites directly).
        const r = await Promise.race([
          window.webkit.messageHandlers.sbFetch.postMessage({url, method:'POST', headers:ShareAPI.headers(cfg.key), body:JSON.stringify(body||{})}),
          timeout
        ]);
        if(!r || r.error){ const err = new Error('offline'); err.offline = true; err.detail = (r && r.error) || 'no response'; err.native = true; throw err; }
        res = { ok: !!r.ok, status: r.status|0, text: async ()=> r.text || '' };
      } else {
        res = await Promise.race([
          fetch(url, {method:'POST', headers:ShareAPI.headers(cfg.key), body:JSON.stringify(body||{}), cache:'no-store', signal:ctrl?ctrl.signal:undefined}),
          timeout
        ]);
      }
    }catch(e){
      if(e && e.native) throw e;
      if(e && e.timeout) throw e;
      if(timedOut || (e && e.name==='AbortError')){ const err=new Error('timeout'); err.offline=true; err.timeout=true; throw err; }
      const err = new Error('offline'); err.offline = true; err.detail = (e && (e.message||e.name)) || ''; throw err;
    }finally{ clearTimeout(timer); }
    const text = await res.text();
    let json=null; try{ json = text ? JSON.parse(text) : null; }catch(e){}
    if(!res.ok){
      const err = new Error((json && (json.message||json.msg||json.error)) || ('HTTP '+res.status));
      err.status = res.status; err.code = json && json.code; err.body = (text||'').slice(0,200); throw err;
    }
    return json;
  },
  /* What to tell the user. With sharing built in (App Store build) the server
     is ours, so set-up problems (URL, key, paused project, missing SQL) are
     never the user's to fix: they get a plain message instead. Problems people
     can act on (offline, expired, too big, too many links) keep their wording. */
  explain(e){
    if(SHARE_BUILTIN && e && !e.tooLarge && !/^SB(403|410|413|429|507)$/.test(e.code||'') && e.code!=='42501'){
      if(e.offline && !e.timeout) return 'No internet connection. Check it and try again.';
      return 'Live links are unavailable right now. Please try again in a little while.';
    }
    return this.explainSetup(e);
  },
  explainSetup(e){
    if(!e) return 'Unknown error';
    if(e.offline && inClaudeFrame()) return 'This page is running inside Claude, which doesn\'t let pages send data to other websites, so it can\'t reach Supabase. Create and update live links from the iPhone app (or your hosted copy of the app) instead.';
    if(e.timeout) return 'No answer from Supabase within 15 seconds. Check the Project URL (it looks like https://abcdefgh.supabase.co) and that the project isn\'t paused.';
    if(e.offline) return 'Couldn\'t connect to Supabase'+(e.detail?' ('+e.detail+')':'')+'. Check the internet connection and that the Project URL looks like https://abcdefgh.supabase.co.';
    if(e.status===404 && !e.code) return 'Supabase answered "not found" (404). The Project URL is probably wrong: use the one from Project Settings → Data API, like https://abcdefgh.supabase.co.';
    if(e.status===540 || /paused/i.test(e.message||'')) return 'The Supabase project is paused. Open the Supabase dashboard and click Resume project.';
    if(e.code==='PGRST202' || /could not find the function/i.test(e.message)) return 'The database isn\'t set up yet: run sharing/supabase_setup.sql in the Supabase SQL Editor.';
    if(e.code==='SB403' || e.code==='42501' || /wrong edit key/i.test(e.message)) return 'This link belongs to another copy of the tournament. Stop sharing and create a new link.';
    if(e.code==='SB410') return 'This link expired: it wasn\'t updated for '+SHARE_KEEP_DAYS+' days, so it was removed. Create a new link to share again.';
    if(e.code==='SB413' || e.tooLarge) return 'This tournament is too big to share ('+(e.kb||'over 1024')+' KB, the limit is 1024 KB).';
    if(e.code==='SB429' && /new links/i.test(e.message)) return 'Too many new links from this network today. Try again tomorrow.';
    if(e.code==='SB429') return 'Updating too often. Trying again in a moment.';
    if(e.code==='SB507') return 'The sharing storage is full, so no new links can be made right now. Existing links keep working.';
    if(e.status===401 || e.status===403 || /api key/i.test(e.message)) return 'Supabase rejected the key. Paste the publishable (or anon) key from Project Settings → API Keys.';
    return e.message;
  }
};
/* Running as the web version inside Claude? (Its page may not contact other websites.) */
function inClaudeFrame(){
  if(window.__SB_NATIVE__ || Native.has('sbStore')) return false;
  try{ if(window.claude && typeof window.claude.use==='function') return true; }catch(e){}
  try{ if(/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/.test(location.hostname)) return true; }catch(e){}
  try{ return window.top!==window.self && /claude/.test(document.referrer||''); }catch(e){ return true; }
}
/* Accept what people paste: dashboard links, trailing /rest/v1, missing https. */
function normalizeSupabaseUrl(u){
  u = String(u||'').trim();
  const dash = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]{10,40})/i);
  if(dash) return 'https://'+dash[1].toLowerCase()+'.supabase.co';
  if(/^[a-z0-9]{15,40}$/i.test(u)) return 'https://'+u.toLowerCase()+'.supabase.co';     // just the project ref
  if(!/^https?:\/\//i.test(u) && u) u = 'https://'+u;
  return u.replace(/\/(rest|auth)\/v1.*$/i,'').replace(/\/+$/,'');
}

/* The read-only copy of one tournament that a link shows. */
const SHARE_PLAYER_FIELDS = ['id','name','gender','clubId','skillLevel','rankingPoints','nationality','createdAt'];
function buildShareSnapshot(tid){
  const t = state.tournaments.find(x=>x.id===tid); if(!t) return null;
  const {share, ...tournament} = t;
  const regs = state.registrations.filter(r=>r.tournamentId===tid || state.events.some(e=>e.id===r.eventId && e.tournamentId===tid))
    .map(r=>({id:r.id, tournamentId:r.tournamentId, eventId:r.eventId, playerId:r.playerId, partnerId:r.partnerId||null, status:r.status, createdAt:r.createdAt}));
  const events = state.events.filter(e=>e.tournamentId===tid);
  const eventIds = new Set(events.map(e=>e.id));
  const inT = x => x.tournamentId===tid || eventIds.has(x.eventId);   // entries and draws link by event
  const entries = state.entries.filter(inT);
  const playerIds = new Set();
  regs.forEach(r=>{ playerIds.add(r.playerId); if(r.partnerId) playerIds.add(r.partnerId); });
  entries.forEach(e=> entryPlayerIds(e).forEach(p=>playerIds.add(p)));
  const players = state.players.filter(p=>playerIds.has(p.id)).map(p=>{ const o={}; SHARE_PLAYER_FIELDS.forEach(k=>{ if(p[k]!==undefined) o[k]=p[k]; }); return o; });
  const clubIds = new Set(players.map(p=>p.clubId).filter(Boolean));
  return {
    v:1, tournament,
    events, entries, registrations: regs, players,
    clubs: state.clubs.filter(c=>clubIds.has(c.id)).map(c=>({id:c.id, name:c.name, createdAt:c.createdAt})),
    draws: state.draws.filter(inT),
    matches: state.matches.filter(inT),
    courts: state.courts.filter(c=>c.tournamentId===tid)
  };
}
function shareLinkFor(t){
  const cfg = shareConfig();
  if(!t || !t.share || !cfg.viewerUrl) return '';
  // Built-in project: the viewer page knows it, so the link is just the page and a random id.
  if(SHARE_BUILTIN && cfg.url===SHARE_DEFAULTS.url && cfg.key===SHARE_DEFAULTS.key) return cfg.viewerUrl.replace(/#.*$/,'') + '#s=' + t.share.id;
  const m = cfg.url.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co$/i);
  const where = m ? 'p='+m[1].toLowerCase() : 'u='+encodeURIComponent(cfg.url);
  return cfg.viewerUrl.replace(/#.*$/,'') + '#s=' + t.share.id + '&' + where + '&k=' + encodeURIComponent(cfg.key);
}

/* Keeps every shared tournament's copy up to date. Data changes schedule a
   sync; unchanged tournaments are skipped; failures retry with backoff. */
const ShareSync = (function(){
  const lastSent = {};          // tid -> JSON last published successfully
  const status = {};            // tid -> {state:'syncing'|'ok'|'error', at, error}
  let timer=null, busy=false, again=false, retryMs=0;
  function schedule(delay){
    if(VIEWER) return;
    clearTimeout(timer);
    timer = setTimeout(run, delay==null ? 2000 : delay);
  }
  function setStatus(tid, s){ status[tid] = Object.assign({}, status[tid], s); ShareUI.refresh(tid); }
  async function publish(t, force){
    const snap = buildShareSnapshot(t.id); if(!snap) return;
    const json = JSON.stringify(snap);
    if(!force && lastSent[t.id]===json) return;
    const bytes = shareBytes(json);
    if(bytes > SHARE_MAX_BYTES){ const err=new Error('too large'); err.tooLarge=true; err.kb=Math.ceil(bytes/1024); throw err; }
    setStatus(t.id, {state:'syncing'});
    const at = await ShareAPI.rpc(shareConfig(), 'sb_publish', {p_id:t.share.id, p_key:t.share.key, p_data:snap});
    lastSent[t.id] = json;
    setStatus(t.id, {state:'ok', at: at || nowIso(), error:null});
  }
  async function run(force){
    if(busy){ again=true; return; }
    const cfg = shareConfig(); if(!cfg.ready) return;
    const shared = state.tournaments.filter(isShareLive);
    if(!shared.length) return;
    busy=true;
    let failed=false, soon=false;
    for(const t of shared){
      try{ await publish(t, force); }
      catch(e){
        console.error('share sync', e);
        if(e.code==='SB429' && !/new links/i.test(e.message)){ soon=true; continue; }   // updating too fast: just try again shortly
        if(e.code==='SB410'){   // expired on the server: stop syncing it and tell the organiser
          setStatus(t.id, {state:'error', error:ShareAPI.explain(e), expired:true});
          await Store.update('tournaments', t.id, {share: Object.assign({}, t.share, {expired:true, expiredAt: nowIso()})});
          continue;
        }
        // Permanent problems wait for the next change instead of retrying on a timer.
        const permanent = e.tooLarge || ['SB400','SB403','SB413','42501'].includes(e.code);
        if(!permanent) failed=true;
        setStatus(t.id, {state:'error', error:ShareAPI.explain(e), offline:!!e.offline});
      }
    }
    busy=false;
    if(failed){ retryMs = Math.min(retryMs ? retryMs*2 : 5000, 120000); schedule(retryMs); }
    else { retryMs = 0; if(soon) schedule(1500); }
    if(again){ again=false; schedule(500); }
  }
  window.addEventListener('online', ()=>schedule(500));
  return {schedule, run, publish, status:tid=>status[tid]||null, forget(tid){ delete lastSent[tid]; delete status[tid]; },
    markPublished(tid, at, json){ lastSent[tid]=json; status[tid]={state:'ok', at: at||nowIso(), error:null}; }};
})();


/* ---------- Viewer mode (someone opened a share link) ---------- */
const ViewerMode = (function(){
  let updatedAt=null, pollTimer=null, polling=false;
  const COLS = ['tournaments','clubs','players','events','registrations','entries','draws','matches','courts'];
  function apply(row){
    const d = row.data || {};
    COLS.forEach(c=>{ state[c] = c==='tournaments' ? (d.tournament?[d.tournament]:[]) : (d[c]||[]); });
    state.notifications=[]; state.auditLog=[]; state.settings=[];
    state.tid = d.tournament ? d.tournament.id : null;
    if(state.followPlayerId === undefined){
      let f=null; try{ f = localStorage.getItem('sb-follow-'+VIEWER.id); }catch(e){}
      state.followPlayerId = (f && state.players.some(p=>p.id===f)) ? f : null;
    }
    updatedAt = row.updated_at;
    state.viewerUpdatedAt = updatedAt; state.viewerError = null; state.viewerOffline = false;
    state.ready = true;
    if(d.tournament) document.title = d.tournament.name + ' · Live';
  }
  async function load(){
    const rows = await ShareAPI.rpc(VIEWER, 'sb_get', {p_id:VIEWER.id});
    const row = Array.isArray(rows) ? rows[0] : rows;
    if(!row || !row.data){ state.viewerError='gone'; state.ready=true; render(); return; }
    apply(row); render();
  }
  async function poll(){
    if(polling || document.visibilityState==='hidden') return;
    polling = true;
    try{
      const ts = await ShareAPI.rpc(VIEWER, 'sb_updated_at', {p_id:VIEWER.id});
      if(ts===null){ state.viewerError='gone'; render(); }
      else if(ts!==updatedAt || state.viewerError){ await load(); }
      else if(state.viewerOffline){ state.viewerOffline=false; render(); }
    }catch(e){
      if(!state.viewerOffline){ state.viewerOffline = true; render(); }
    }finally{ polling=false; }
  }
  async function start(){
    state.role='public'; state.view='tdetail'; state.tab='overview'; state.viewingPlayerId=null;
    document.body.classList.add('viewer-mode');
    render();
    try{ await load(); }
    catch(e){ state.ready=true; state.viewerError = e.offline ? 'offline' : 'error'; state.viewerErrorMsg = ShareAPI.explain(e); render(); }
    pollTimer = setInterval(poll, 10000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') poll(); });
    window.addEventListener('online', poll);
  }
  function errorScreen(){
    const e = state.viewerError;
    const title = e==='gone' ? 'This tournament is no longer shared' : e==='offline' ? 'You\'re offline' : 'Couldn\'t load this tournament';
    const msg = e==='gone' ? 'The organiser stopped sharing it, or the link expired (links are removed '+SHARE_KEEP_DAYS+' days after the tournament last changed), or the link is incomplete. Ask the organiser for a new link.'
      : e==='offline' ? 'Check your internet connection. The page will try again by itself.' : (state.viewerErrorMsg||'');
    return `<div class="empty-hero"><span class="kicker">Shuttle Bracket</span><h2>${esc(title)}</h2><p>${esc(msg)}</p>
      ${e!=='gone'?`<div class="hero-actions"><button class="btn btn-primary" id="btnViewerRetry">${ICONS.refresh} Try again</button></div>`:''}</div>`;
  }
  return {start, load, poll, errorScreen};
})();

/* ---------- Registration link (viewer) ----------
   Opened with &r=<code>: a Register tab where players sign up for events. The
   sign-up goes to Supabase (sb_register) and waits there until the organiser's
   app collects it; it then appears in the shared copy as pending, and as
   confirmed once the organiser confirms it. */
const EVENT_TYPE_LABELS = {singles:'Singles', doubles:'Doubles', mixed_doubles:'Mixed doubles', team:'Team', americano:'Americano'};
function viewerSignups(){

}
function saveViewerSignup(x){

}
function updateViewerSignup(ref, patch){

/* Where a sign-up sent from this browser has got to, from the shared copy (or, before the
   organiser's app has it, what this browser did with it: withdrawn while still waiting). */
function viewerSignupStatus(su){
  const k = normPlayerName(su.name);
  const reg = state.registrations.find(r=>r.eventId===su.eventId && [r.playerId, r.partnerId].some(id=>id && normPlayerName(playerName(id))===k));
  return reg ? reg.status : su.withdrawn ? 'withdrawn' : 'sent';
}
/* A sign-up made from this browser can be changed or withdrawn here (sb_change) until the
   event's draw is made: it carries the id the server gave it and the code only this browser has. */
function viewerSignupEditable(su){
  const ev = eventById(su.eventId), t = currentTournament();
  return !!(su.ref && su.token && su.change!=='withdraw' && ev && t && VIEWER && VIEWER.reg && !eventDraw(ev.id) && ev.status!=='completed'
    && !['in_progress','completed','cancelled'].includes(t.status) && !['withdrawn','rejected'].includes(viewerSignupStatus(su)));
}
const SIGNUP_CHANGE_NOTE = {withdraw:'Withdrawal sent to the organiser', modify:'Change sent to the organiser'};
const SIGNUP_STATUS = {sent:['Sent','','Waiting for the organiser to collect it'], pending:['Received','gold','The organiser will confirm it'], confirmed:['Confirmed','court',''],
  waitlisted:['Waiting list','',''], rejected:['Not accepted','danger',''], withdrawn:['Withdrawn','danger','']};

      return `<div class="ev-pop-row su-mine"><span class="grow main-txt">${esc(su.name)}${su.partner?' / '+esc(su.partner):''}<div class="sub-txt">${esc(ev.name)}${note?' &middot; '+esc(note):''}</div>
        ${edit ? `<div class="row" style="gap:6px;margin-top:6px"><button class="btn btn-sm" data-su-change="${esc(su.ref)}">${ICONS.edit} Change</button><button class="btn btn-sm btn-danger" data-su-withdraw="${esc(su.ref)}">Withdraw</button></div>` : ''}</span><span class="pill ${cls}">${esc(label)}</span></div>`;
    }).join('') : '';
  const cards = evs.map(ev=>{

  return head + mineHtml + (evs.length ? `<div class="section-h"><h3>Events</h3></div>` + cards : `<div class="empty-tab">No events yet.</div>`);

async function sendSignupChange(btn){
  const ref = btn.getAttribute('data-ref'), su = viewerSignups().find(x=>x.ref===ref), ev = su && eventById(su.eventId);
  if(!su || !ev) return;
  const val = id=>((document.getElementById(id)||{}).value||'').trim().replace(/\s+/g,' ');
  const emailOf = id=>val(id).replace(/\s/g,'').toLowerCase();
  const mode = regEmailMode(currentTournament());
  const req = {kind:'modify', ref, token:su.token, eventId:ev.id, club:val('scClub')};
  if(mode!=='off') req.email = emailOf('scEmail');
  if(isDoublesType(ev.type)){ req.partner = {name:val('spName'), gender:val('spGender'), club:val('spClub')}; if(mode!=='off') req.partner.email = emailOf('spEmail'); }
  // The same checks as a sign-up, with the name and gender as they were.
  const problem = signupProblem(ev, Object.assign({name:su.name, gender:su.gender || 'male', email:req.email}, {partner:req.partner}), true);
  const msg = document.getElementById('suMsg');
  if(problem){ msg.textContent = problem; return; }
  msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await ShareAPI.rpc(VIEWER, 'sb_change', {p_id:VIEWER.id, p_code:VIEWER.reg, p_req:req});
    updateViewerSignup(ref, {club:req.club, email:req.email||'', partner:req.partner ? req.partner.name : su.partner, partnerInfo:req.partner||su.partnerInfo||null,
      change: res==='sent' ? 'modify' : su.change||''});
    closeGenericDialog();
    toast(res==='sent' ? 'Change sent. The organiser\'s app will update your entry.' : 'Sign-up changed.');
    render();
  }catch(e){
    msg.textContent = signupError(e);
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}
async function withdrawSignup(ref){
  const su = viewerSignups().find(x=>x.ref===ref), ev = su && eventById(su.eventId);
  if(!su || !ev || !viewerSignupEditable(su)) return;
  if(!await confirmDialog('Withdraw ' + su.name + (su.partner ? ' / ' + su.partner : '') + ' from ' + ev.name + '? To play after all, you would have to sign up again.', {title:'Withdraw from ' + ev.name + '?', okLabel:'Withdraw'})) return;
  try{
    const res = await ShareAPI.rpc(VIEWER, 'sb_change', {p_id:VIEWER.id, p_code:VIEWER.reg, p_req:{kind:'withdraw', ref, token:su.token, eventId:ev.id}});
    updateViewerSignup(ref, res==='withdrawn' ? {withdrawn:true, change:''} : {change:'withdraw'});
    toast(res==='withdrawn' ? 'Withdrawn.' : 'Withdrawal sent. The organiser\'s app will take you off the list.');
  }catch(e){ toast(signupError(e), true); }
  render();
}
function signupProblem(ev, req, change){
  if(!change && !registrationInfo(currentTournament()).open) return 'Registration for this tournament is closed.';
  if(req.name.length<2) return 'Enter your full name.';
  if(!req.gender) return 'Choose your gender.';
  const mode = regEmailMode(currentTournament());
  const emailProblem = (v, whose)=> v ? (v.length>120 || !EMAIL_RE.test(v) ? 'Check '+whose+' email address.' : '')
    : (mode==='required' ? 'Enter '+whose+' email address.' : '');
  if(mode!=='off'){ const e = emailProblem(req.email, 'your'); if(e) return e; }
  if(req.partner && mode!=='off'){ const e = emailProblem(req.partner.email, 'your partner\'s'); if(e) return e; }
  if(req.partner){
    if(req.partner.name.length<2) return 'Enter your partner\'s full name.';
    if(!req.partner.gender) return 'Choose your partner\'s gender.';
    if(normPlayerName(req.partner.name)===normPlayerName(req.name)) return 'Your partner has to be someone else.';
    if(ev.type==='mixed_doubles' && req.partner.gender===req.gender) return 'Mixed doubles pairs are one man and one woman.';
  }
  return '';
}
function signupError(e){
  if(e && /^SB4\d\d$/.test(e.code||'') && e.message) return e.message;   // the server's messages are written for players
  if(e && e.offline && !e.timeout) return 'No internet connection. Check it and try again.';
  return 'Couldn\'t send your sign-up right now. Please try again in a little while.';
}
async function sendSignup(btn){
  const ev = eventById(btn.getAttribute('data-event')); if(!ev || !VIEWER) return;
  const val = id=>((document.getElementById(id)||{}).value||'').trim().replace(/\s+/g,' ');
  const req = {eventId:ev.id, name:val('suName'), gender:val('suGender'), club:val('suClub')};
  if(isDoublesType(ev.type)) req.partner = {name:val('spName'), gender:val('spGender'), club:val('spClub')};
  if(regEmailMode(currentTournament())!=='off'){
    req.email = val('suEmail').replace(/\s/g,'').toLowerCase();
    if(req.partner) req.partner.email = val('spEmail').replace(/\s/g,'').toLowerCase();
  }
  const msg = document.getElementById('suMsg');
  const problem = signupProblem(ev, req);
  if(problem){ msg.textContent = problem; return; }
  msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const token = randomToken(32);   // kept only in this browser; the server stores its hash
    const ref = await ShareAPI.rpc(VIEWER, 'sb_register', {p_id:VIEWER.id, p_code:VIEWER.reg, p_req:Object.assign({manage:token}, req)});
    saveViewerSignup({eventId:ev.id, name:req.name, partner:req.partner ? req.partner.name : '', at:nowIso(),
      ref: typeof ref==='string' ? ref : '', token, gender:req.gender, club:req.club, email:req.email||'', partnerInfo:req.partner||null});
    closeGenericDialog();
    toast('Sign-up sent. The organiser will confirm it.');
    render();
  }catch(e){
    msg.textContent = signupError(e);
    btn.disabled = false; btn.textContent = 'Send';
  }
}


/* ============ AMERICANO FINAL ============
   After the rounds, the organiser can play one final between the top four of
   the standings (bracket 'AMF'). Default pairing is 1st+4th vs 2nd+3rd so the
   two teams are balanced; for Mixed it is top man + 2nd woman vs 2nd man + top
   woman. The final doesn't change the standings; it decides Champion (winners)
   and Runner-up (losers). */
const AM_FINAL_BO3 = { bestOf:3, pointsToWin:21, winBy:2, capPoints:30, deuceEnabled:true };
function americanoFinalMatch(eventId){ return eventMatches(eventId).find(m=>m.bracket==='AMF') || null; }
function americanoRoundMatches(eventId){ return eventMatches(eventId).filter(m=>m.bracket==='AM'); }
function americanoRoundsDone(eventId){
  const ms = americanoRoundMatches(eventId);
  return ms.length>0 && ms.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status));
}

function groupLetter(g){ return String(g.name||'').replace(/^Group\s+/i,'') || '?'; }
function ordinal(n){ const v = n%100; return n + ((v>10 && v<14) ? 'th' : (['th','st','nd','rd'][n%10] || 'th')); }
/* "Places 3–4 of the groups", for the plate heading. */
function plateNote(ms){
  const srcs = ms.flatMap(m=>[m.src1, m.src2]).filter(Boolean);
  const ranks = [...new Set(srcs.map(x=>x.rank))].sort((a,b)=>a-b);
  if(!ranks.length) return '';
  return ranks.length===1 ? ordinal(ranks[0])+' places' : 'Places '+ranks[0]+'–'+ranks[ranks.length-1]+' of the groups';
}

/* The matches whose winner (or loser) goes into this one. */
function feedersOf(m){ return state.matches.filter(f=>f.id!==m.id && (f.nextMatchId===m.id || f.loserNextMatchId===m.id)); }
/* "Quarterfinal 2": the round, numbered when the round has more than one match. */
function matchNumberLabel(m){
  const same = state.matches.filter(x=>x.eventId===m.eventId && x.drawId===m.drawId && x.bracket===m.bracket && x.round===m.round && !!x.isThirdPlace===!!m.isThirdPlace)
    .sort((a,b)=>a.position-b.position);
  const i = same.findIndex(x=>x.id===m.id);
  return roundLabelForMatch(m) + (same.length>1 && i>=0 ? ' '+(i+1) : '');
}
/* Like matchSideName, but a slot waiting on an earlier match says which one:
   "Winner of Quarterfinal 1" / "Loser of Semifinal 2". Used in match lists. */
function matchSideLabel(m, slot){
  const n = matchSideName(m, slot);
  if(n!=='TBD') return n;
  const f = state.matches.find(x=>x.nextMatchId===m.id && x.nextMatchSlot===slot);
  if(f) return 'Winner of ' + matchNumberLabel(f);
  const l = state.matches.find(x=>x.loserNextMatchId===m.id && x.loserNextMatchSlot===slot);
  if(l) return 'Loser of ' + matchNumberLabel(l);
  return n;
}
/* The name shown for one side of a match: the entry, else its placeholder
   ("A1" = winner of Group A), else TBD (waiting for an earlier match). */
function matchSideName(m, slot){
  const e = entryById(slot===1 ? m.entry1Id : m.entry2Id);
  if(e) return entryName(e);
  const src = slot===1 ? m.src1 : m.src2;
  return src ? src.label : 'TBD';
}
