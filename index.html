/* ============================== MATCH COMPLETION / ADVANCEMENT ============================== */
/* Shared, idempotent completion path used by live scoring, walkovers,
   retirements, and admin corrections. A completed winner is never advanced
   twice: re-completion only happens via an explicit forceCorrection (which is
   audit-logged) and even then re-propagates deterministically. */
async function completeMatch(match, result, opts){
  opts = opts||{};
  const alreadyDone = ['completed','walkover','retired','bye'].includes(match.status);
  if(alreadyDone && !opts.forceCorrection){
    return; // idempotency guard - never silently re-advance a decided match
  }
  const patch = {
    games: result.games||match.games||[], status: result.status,
    winnerEntryId: result.winnerEntryId, actualEnd: nowIso(), updatedAt: nowIso()
  };
  if(!match.actualStart && (result.status==='completed'||result.status==='walkover'||result.status==='retired')) patch.actualStart = match.actualStart || nowIso();
  await Store.update('matches', match.id, patch);
  const loserEntryId = result.winnerEntryId===match.entry1Id ? match.entry2Id : match.entry1Id;

  if(match.nextMatchId){
    const next = matchById(match.nextMatchId) || await singleDoc('matches', match.nextMatchId);
    if(next && (opts.forceCorrection || (match.nextMatchSlot===1 ? !next.entry1Id : !next.entry2Id))){
      const field = match.nextMatchSlot===1 ? 'entry1Id' : 'entry2Id';
      await Store.update('matches', match.nextMatchId, {[field]: result.winnerEntryId});
      await maybeResolveByeLive(match.nextMatchId);
    }
  }
  if(match.loserNextMatchId && loserEntryId && result.status!=='bye'){
    const nextL = matchById(match.loserNextMatchId) || await singleDoc('matches', match.loserNextMatchId);
    if(nextL && (opts.forceCorrection || (match.loserNextMatchSlot===1 ? !nextL.entry1Id : !nextL.entry2Id))){
      const field = match.loserNextMatchSlot===1 ? 'entry1Id' : 'entry2Id';
      await Store.update('matches', match.loserNextMatchId, {[field]: loserEntryId});
      await maybeResolveByeLive(match.loserNextMatchId);
    }
  }
  if(match.grKind==='gf1' && result.status==='completed' && result.winnerEntryId===match.entry2Id){
    await maybeCreateBracketReset(match);
  }
  if(!opts.silent){
    await notify(match.tournamentId, null, 'match_completed',
      entryName(entryById(match.entry1Id)) + ' vs ' + entryName(entryById(match.entry2Id)) + ' - result recorded.');
  }
  if(opts.forceCorrection){
    await audit(match.tournamentId, state.role, 'score_correction', 'Score corrected for match ' + match.id + ' after completion.');
  }
  if(match.bracket==='GRP') await fillKnockoutFromGroups(match.eventId);
  await checkEventCompletion(match.eventId);
}
/* Small helper: read a match doc that may not yet be in local state (e.g. was
   just added in the same tick). Falls back to in-memory state first. */
async function singleDoc(col, id){
  const local = col==='matches' ? matchById(id) : null;
  if(local) return local;
  try{
    const rows = await Store.getAll(col, []);
    return rows.find(r=>r.id===id) || null;
  }catch(e){ return null; }
}
async function maybeResolveByeLive(matchId){
  const m = matchById(matchId) || await singleDoc('matches', matchId);
  if(!m || m.status==='completed' || m.status==='bye') return;
  const has1=!!m.entry1Id, has2=!!m.entry2Id;
  if(has1!==has2){
    // The other player may still be coming from an unfinished match: wait for it.
    const list = state.matches.filter(x=>x.eventId===m.eventId && x.drawId===m.drawId);
    if(slotAwaitsFeeder(m, has1?2:1, list)) return;
    const winnerEntryId = has1?m.entry1Id:m.entry2Id;
    await Store.update('matches', matchId, {status:'bye', winnerEntryId});
    if(m.nextMatchId){
      const next = matchById(m.nextMatchId) || await singleDoc('matches', m.nextMatchId);
      if(next && (m.nextMatchSlot===1 ? !next.entry1Id : !next.entry2Id)){
        await Store.update('matches', m.nextMatchId, {[m.nextMatchSlot===1?'entry1Id':'entry2Id']: winnerEntryId});
        await maybeResolveByeLive(m.nextMatchId);
      }
    }
  }
}
/* Draws made before the fix could have semi-finals/finals wrongly marked "Bye"
   (the first finalist was pushed through before the other match was played).
   This puts those matches back to playable and takes the wrongly advanced
   player out of the next round again. Matches already played are left alone. */
async function repairFalseByes(){
  if(VIEWER) return 0;
  const PLAYED = ['completed','walkover','retired','in_progress'];
  const groups = {};
  state.matches.forEach(m=>{ const k=(m.eventId||'')+'|'+(m.drawId||''); (groups[k]=groups[k]||[]).push(Object.assign({}, m)); });
  const patches = {};   // matchId -> patch
  const touchedEvents = new Set();
  for(const list of Object.values(groups)){
    if(!list.some(m=>m.status==='bye')) continue;
    const byId = Object.fromEntries(list.map(m=>[m.id,m]));
    const hasFeeder = m => list.some(f=>f.nextMatchId===m.id || f.loserNextMatchId===m.id);
    const isFalse = m => {
      if(m.status!=='bye' || !hasFeeder(m)) return false;
      const n = (m.entry1Id?1:0) + (m.entry2Id?1:0);
      if(n===2 || n===0) return true;
      return slotAwaitsFeeder(m, m.entry1Id?2:1, list);
    };
    let guard=0, changed=true;
    while(changed && guard++<60){
      changed=false;
      for(const m of list){
        if(!isFalse(m)) continue;
        const next = m.nextMatchId ? byId[m.nextMatchId] : null;
        if(next && PLAYED.includes(next.status)) continue;          // the next round was already played: leave it
        const oldWinner = m.winnerEntryId;
        m.status = (m.entry1Id && m.entry2Id) ? 'scheduled' : 'pending'; m.winnerEntryId = null;
        patches[m.id] = Object.assign(patches[m.id]||{}, {status:m.status, winnerEntryId:null});
        if(next && oldWinner){
          const field = m.nextMatchSlot===1 ? 'entry1Id' : 'entry2Id';
          if(next[field]===oldWinner){
            next[field] = null;
            const p2 = {[field]: null};
            if(next.status==='scheduled'){ next.status='pending'; p2.status='pending'; }
            patches[next.id] = Object.assign(patches[next.id]||{}, p2);
          }
        }
        touchedEvents.add(m.eventId);
        changed = true;
      }
    }
  }
  const ids = Object.keys(patches);
  if(!ids.length) return 0;
  for(const id of ids) await Store.update('matches', id, Object.assign({updatedAt: nowIso()}, patches[id]));
  for(const eid of touchedEvents){ const ev = eventById(eid); if(ev && ev.status==='completed') await Store.update('events', eid, {status:'in_progress'}); }
  return ids.length;
}
async function maybeCreateBracketReset(gf1){
  const already = state.matches.find(m=> m.grKind==='gf2' && m.drawId===gf1.drawId);
  if(already) return;
  await Store.add('matches', {
    tournamentId:gf1.tournamentId, eventId:gf1.eventId, drawId:gf1.drawId,
    bracket:'GF', round:2, position:0, groupId:null,
    entry1Id:gf1.entry1Id, entry2Id:gf1.entry2Id, courtId:null, scheduledStart:null, estDurationMin:30,
    actualStart:null, actualEnd:null, status:'scheduled', games:[], winnerEntryId:null,
    nextMatchId:null, nextMatchSlot:null, loserNextMatchId:null, loserNextMatchSlot:null,
    isThirdPlace:false, grKind:'gf2'
  });

async function checkEventCompletion(eventId){
  const ev = eventById(eventId); if(!ev || ev.status==='completed') return;
  const matches = eventMatches(eventId);
  if(!matches.length) return;
  /* Mexicano Americano generates one round at a time with no fixed round
     count, so "every match generated so far is done" doesn't mean the event
     is over - the admin decides that by not generating another round. */
  if(ev.drawFormat==='americano' && (ev.americanoVariant||'classic')==='mexicano' && !matches.some(m=>m.bracket==='AMF')) return;
  /* Groups + knockout: finishing the groups is only half the event. */
  const draw = eventDraw(eventId);
  if(draw && draw.format==='group_knockout' && !matches.some(m=>m.bracket==='SE')) return;
  const gf2Pending = matches.some(m=>m.grKind==='gf2' && !['completed'].includes(m.status));
  const allDone = matches.every(m=> ['completed','bye','walkover','retired','cancelled'].includes(m.status) || (m.grKind==='gf2'));
  const decisive = matches.filter(m=> !(m.grKind==='gf1' && m.status==='completed' && m.winnerEntryId===m.entry2Id));
  const reallyDone = decisive.every(m=> ['completed','bye','walkover','retired','cancelled'].includes(m.status));
  if(reallyDone && !gf2Pending && ev.status!=='completed'){
    await Store.update('events', eventId, {status:'completed'});
    await notify(ev.tournamentId, null, 'results_published', 'Results published for ' + ev.name + '.');
  }
}

/* ---- Live scoring: point-event log keeps Undo exact ---- */
function currentGameOf(match){
  const games = match.games||[];
  if(!games.length) return {a:0,b:0,log:[]};
  const last = games[games.length-1];
  return ScoreRules.gameWinner(last) ? {a:0,b:0,log:[]} : last;
}
function gamesPlayedCount(match){
  return (match.games||[]).filter(g=>ScoreRules.gameWinner(g)).length;
}
async function addPoint(match, side){
  const cfg = scoringFor(eventById(match.eventId), tournamentById(match.tournamentId), match);
  let games = (match.games||[]).map(g=>({...g, log:(g.log||[]).slice()}));
  if(!games.length || ScoreRules.gameWinner(games[games.length-1], cfg)) games.push({a:0,b:0,log:[]});
  const g = games[games.length-1];
  g.log.push(side);
  const sc = ScoreRules.scoreFromLog(g.log);
  g.a = sc.a; g.b = sc.b;
  if(!ScoreRules.validGameScore(g, cfg)){ g.log.pop(); const sc2=ScoreRules.scoreFromLog(g.log); g.a=sc2.a; g.b=sc2.b; return; }
  const winner = ScoreRules.matchWinner(games, cfg);
  await act(async ()=>{
    const patch = {games, status: match.status==='scheduled'||match.status==='pending' ? 'in_progress' : match.status};
    if(!match.actualStart) patch.actualStart = nowIso();
    if(winner){
      await completeMatch({...match, games}, {status:'completed', winnerEntryId: winner===1?match.entry1Id:match.entry2Id, games});
    } else {
      await Store.update('matches', match.id, patch);
    }
  });
}
async function undoPoint(match){
  let games = (match.games||[]).map(g=>({...g, log:(g.log||[]).slice()}));
  if(!games.length) return;
  let last = games[games.length-1];
  if(ScoreRules.gameWinner(last) && games.length>1){
    // last game already decided and it's the only entry on the board (no new
    // game started yet) - undo re-opens that decided game
  }
  if(!last.log || !last.log.length){
    if(games.length>1){ games.pop(); last = games[games.length-1]; }
    else return;
  }
  last.log.pop();
  const sc = ScoreRules.scoreFromLog(last.log);
  last.a = sc.a; last.b = sc.b;
  await act(async ()=> Store.update('matches', match.id, {games, status:'in_progress', winnerEntryId:null}));
}
async function endGameManually(match){
  const games = (match.games||[]).map(g=>({...g}));
  if(!games.length) return;
  const last = games[games.length-1];
  if(last.a===last.b){ toast('Scores are tied - keep playing or edit manually', true); return; }
  games.push({a:0,b:0,log:[]});
  await act(async ()=> Store.update('matches', match.id, {games}));
}
async function endMatchDecision(match, kind, winnerEntryId){
  /* kind: 'walkover' | 'retired' - picks a winner without full score entry. */
  await completeMatch(match, {status:kind, winnerEntryId, games:match.games||[]});
}
async function cancelMatch(match, reason){
  return act(async ()=>{
    await Store.update('matches', match.id, {status:'cancelled'});

  });
}
async function correctScore(match, games){
  const cfg = scoringFor(eventById(match.eventId), tournamentById(match.tournamentId), match);
  const winner = ScoreRules.matchWinner(games, cfg);
  if(!winner){ toast('Corrected score does not produce a valid winner', true); return; }
  await completeMatch(match, {status:'completed', winnerEntryId: winner===1?match.entry1Id:match.entry2Id, games}, {forceCorrection:true});
}

function csvEsc(v){ v = v==null?'':String(v); if(/[",\n\r]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCSV(columns, rows){
  const header = columns.map(c=>csvEsc(c.label)).join(',');
  const lines = rows.map(r=> columns.map(c=> csvEsc(typeof c.get==='function'?c.get(r):r[c.key])).join(','));
  return [header, ...lines].join('\r\n');
}
async function downloadCSV(filename, csv){
  if(Native.has('sbShare')){ Native.post('sbShare', {filename, text:'\ufeff'+csv}); return; }
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  try{
    const downloads = await claude.use('downloads');
    if(downloads){
      try{
        await downloads.save({filename, data: blob});
        return;
      }catch(err){
        if(err && err.code === 'declined') return;
        toast('Could not save the file ('+((err&&err.code)||'unknown')+').');
        return;
      }
    }
  }catch(e){}
  // Fallback: no downloads capability available in this view (e.g. previewing outside the viewer).
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast('Exported ' + filename);
  }catch(e){ console.error(e); toast('Export failed', true); }
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randomGame(cfg, forcedWinner){
  cfg = cfg||DEFAULT_SCORING;
  const winSide = forcedWinner || (Math.random()<0.5?1:2);
  const winScore = cfg.pointsToWin;
  const loseScore = Math.floor(Math.random()* (winScore-2)) + (Math.random()<0.3? winScore-2 : 0);
  const lose = Math.min(loseScore, winScore-2);
  return winSide===1 ? {a:winScore,b:Math.max(0,lose),log:[]} : {a:Math.max(0,lose),b:winScore,log:[]};
}
function randomMatchGames(cfg){
  cfg = cfg||DEFAULT_SCORING;
  const need = ScoreRules.gamesNeeded(cfg);
  const games=[]; let w1=0,w2=0;
  while(w1<need && w2<need){
    const side = Math.random()<0.5?1:2;
    const g = randomGame(cfg, side);
    games.push(g);
    if(side===1) w1++; else w2++;
  }
  return games;
}

/* Deterministic-ish simulated progress: schedules every playable match onto a
   court/time, completes most of them with valid random scores, and leaves a
   realistic mix behind - including exactly one live in-progress match. */
async function simulateDemoResults(tid, msId, wsId, mdId, xdId, courtIds){
  const cfg = DEFAULT_SCORING;
  const now = Date.now();
  let courtCursor = 0, timeCursor = now - 3*3600000;
  function nextSlot(){
    const court = courtIds[courtCursor % courtIds.length];
    const start = new Date(timeCursor).toISOString();
    courtCursor++;
    if(courtCursor % courtIds.length === 0) timeCursor += 40*60000;
    return {court, start};
  }
  async function scheduleAll(matches){
    for(const m of matches){
      if(m.entry1Id && m.entry2Id){
        const {court,start} = nextSlot();
        await Store.update('matches', m.id, {courtId:court, scheduledStart:start, status: m.status==='pending'?'pending':'scheduled'});
      }
    }
  }
  async function completeRandom(m, cfgLocal){
    const games = randomMatchGames(cfgLocal||cfg);
    const winner = ScoreRules.matchWinner(games, cfgLocal||cfg);
    const fresh = matchById(m.id) || m;
    await completeMatch(fresh, {status:'completed', winnerEntryId: winner===1?fresh.entry1Id:fresh.entry2Id, games}, {silent:true});
  }

  /* --- Men's Singles: complete round 1, one semifinal, leave the other
     semifinal live-in-progress, final + third place remain scheduled/TBD --- */
  let msMatches = eventMatches(msId);
  await scheduleAll(msMatches);
  const msR1 = msMatches.filter(m=>m.bracket==='SE'&&m.round===1&&!m.isThirdPlace);
  for(const m of msR1){ if(m.status!=='bye') await completeRandom(m); }
  msMatches = eventMatches(msId);
  const msSemis = msMatches.filter(m=>m.bracket==='SE'&&m.round===2&&!m.isThirdPlace).sort((a,b)=>a.position-b.position);
  if(msSemis[0]) await completeRandom(msSemis[0]);
  if(msSemis[1] && msSemis[1].entry1Id && msSemis[1].entry2Id){
    const live = matchById(msSemis[1].id);
    const g = {a:11,b:8,log:['a','a','b','a','a','a','b','a','b','b','b','a','a','a','a','a','a','a','b','b']};
    await Store.update('matches', live.id, {games:[g], status:'in_progress', actualStart:new Date(now-6*60000).toISOString(), courtId: courtIds[0], scheduledStart:new Date(now-6*60000).toISOString()});
    state._demoLiveMatchId = live.id;
  }

  /* --- Women's Singles (double elim): complete WB round 1 only --- */
  let wsMatches = eventMatches(wsId);
  await scheduleAll(wsMatches);
  const wsR1 = wsMatches.filter(m=>m.bracket==='WB'&&m.round===1);
  for(const m of wsR1){ if(m.status!=='bye') await completeRandom(m); }

  /* --- Men's Doubles (groups + knockout): finish groups, generate knockout,
     complete half of the knockout round 1 --- */
  let mdMatches = eventMatches(mdId);
  await scheduleAll(mdMatches);
  const grpMatches = mdMatches.filter(m=>m.bracket==='GRP');
  for(const m of grpMatches){ if(m.status!=='bye') await completeRandom(m); }
  const mdEventObj = {id:mdId};
  await generateKnockoutFromGroups(mdEventObj);
  let mdKO = eventMatches(mdId).filter(m=>m.bracket==='SE'&&m.round===1);
  await scheduleAll(mdKO);
  for(let i=0;i<mdKO.length;i++){ if(i%2===0 && mdKO[i].status!=='bye') await completeRandom(mdKO[i]); }

  /* --- Mixed Doubles: freshly scheduled, nothing played yet --- */
  const xdMatches = eventMatches(xdId);
  await scheduleAll(xdMatches);
}

/* A pop-up that lists live data (event players, seeds) redraws its body after
   every change; closing the dialog stops it. */
let dialogRefresher = null;
function setDialogRefresher(fn){
  dialogRefresher = fn;
  const dlg = document.getElementById('dlgGeneric');
  if(dlg) dlg.addEventListener('close', ()=>{ if(dialogRefresher===fn) dialogRefresher = null; }, {once:true});
}
function refreshOpenDialog(){
  const dlg = document.getElementById('dlgGeneric');
  if(!dialogRefresher || !dlg || !dlg.open) return;
  try{ dialogRefresher(); }catch(e){ console.error(e); }
}

function globalSearchResults(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return null;
  const players = state.players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
  const tournaments = state.tournaments.filter(t=>t.name.toLowerCase().includes(q)).slice(0,4);
  const clubs = state.clubs.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4);
  const events = state.events.filter(e=>e.name.toLowerCase().includes(q)).slice(0,4);
  return {players, tournaments, clubs, events};
}
function renderSearchResults(){
  if(!state.searchOpen) return '';
  const r = globalSearchResults(state.search);
  if(!r) return `<div class="search-results open"><div class="sr-empty">Start typing to search.</div></div>`;
  const total = r.players.length+r.tournaments.length+r.clubs.length+r.events.length;
  if(!total) return `<div class="search-results open"><div class="sr-empty">No matches for "${esc(state.search)}".</div></div>`;
  function group(title, items, render){
    if(!items.length) return '';
    return `<div class="sr-group"><h4>${title}</h4>${items.map(render).join('')}</div>`;
  }
  return `<div class="search-results open">
    ${group('Tournaments', r.tournaments, t=>`<button class="sr-item" data-open-tournament="${t.id}">${esc(t.name)}<div class="sr-sub">${esc(t.status)}</div></button>`)}
    ${group('Events', r.events, e=>`<button class="sr-item" data-open-tournament="${e.tournamentId}" data-open-tab="events" data-open-event-id="${e.id}">${esc(e.name)}<div class="sr-sub">${(tournamentById(e.tournamentId)||{}).name||''}</div></button>`)}
    ${group('Players', r.players, p=>`<button class="sr-item" data-open-player="${p.id}">${esc(p.name)}<div class="sr-sub">${esc((clubById(p.clubId)||{}).name||'No club')}</div></button>`)}
    ${group('Clubs', r.clubs, c=>`<button class="sr-item" data-open-club="${c.id}">${esc(c.name)}<div class="sr-sub">Club &middot; show its players</div></button>`)}
  </div>`;
}

function renderView(){

    return `<div class="layout">
      <aside class="panel sidebar">${renderTournamentSidebar()}</aside>
      <main class="panel main"><div class="main-inner">${inner}</div></main>
    </div>`;
  }
  return `<div class="layout no-sidebar"><main class="panel main"><div class="main-inner">${inner}</div></main></div>`;
}
function viewBody(){
  if(VIEWER){
    if(state.viewerError && (state.viewerError==='gone' || !state.tournaments.length)) return ViewerMode.errorScreen();
    if(!state.ready) return `<div class="loading-tab">Loading the tournament&hellip;</div>`;
    return renderTournamentDetail();
  }
  if(!state.ready) return `<div class="loading-tab">Loading&hellip;</div>`;
  switch(state.view){
    case 'dashboard': return renderDashboard();
    case 'tournaments': return renderTournamentsList();
    case 'tdetail': return renderTournamentDetail();
    case 'players': return renderPlayersRegistry();
    case 'rankings': return renderRankingsView();
    case 'reports': return renderReportsView();
    case 'settings': return renderSettingsView();
    case 'guide': return renderGuideView();
    case 'home': return renderPlayerHome();
    case 'mytournaments': return renderMyTournaments();
    case 'mymatches': return renderMyMatches();
    case 'schedule': return renderGlobalSchedule();
    case 'results': return renderGlobalResults();
    case 'draws': return renderGlobalDraws();
    case 'live': return renderGlobalLive();
    case 'profile': return renderProfileView();
    case 'more': return renderMoreView();
    default: return renderDashboard();
  }
}

  const map = {draft:'',registration_open:'court',registration_closed:'',draw_published:'gold',in_progress:'live',completed:'court',cancelled:'danger'};
  const cls = map[status]||'';
  const label = (status||'').replace(/_/g,' ');

  if(state.role==='admin') return [['overview','Overview'],['events','Events'],['matches','Matches'],['results','Results'],['settings','Settings']];
  if(state.role==='player') return [['overview','Overview'],['mymatches','My Matches'],['draws','Draws'],['results','Results'],['register','Register']];
  const pub = [['overview','Overview'],['live','Live'],['schedule','Schedule'],['draws','Draws'],['results','Results'],['players','Players']];
  if(!VIEWER) return pub;
  // The live link keeps to what spectators want: what's on court, what's next, results, and the table.
  const n = viewerMatchLists(currentTournament());
  return [['live','Live'+(n.live.length?' '+n.live.length:'')],['completed','Completed'],['standings','Standings']];
}
function renderTournamentDetail(){
  const t = currentTournament();

        ${t.status!=='completed'?`<button class="btn btn-sm m-overflow" id="btnFinishTournament">${ICONS.trophy} Finish tournament</button>`:`<button class="btn btn-sm m-overflow" id="btnReopenTournament">${ICONS.undo} Reopen tournament</button>`}
        ${t.status!=='completed'?`<button class="btn btn-sm m-overflow" id="btnEditTournament">${ICONS.edit} Edit tournament</button>`:''}

    </div>

const SETUP_TABS = [['draws','Draws','trophy'],['players','Players','users'],['courts','Courts','court'],['general','General','edit']];
function renderSetupTabs(){

function ringSvg(pct, color){
  pct = clamp(pct,0,100);
  const r=26, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color||'var(--court)'}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${Math.round(pct)}%</text>
  </svg>`;
}
function renderOverviewTab(t){
  const evs = tEvents(t.id);
  const matches = tMatches(t.id);
  const regs = tRegistrations(t.id);
  const courts = tCourts(t.id);
  const completed = matches.filter(m=>['completed','walkover','retired','bye'].includes(m.status));
  const live = matches.filter(m=>m.status==='in_progress');
  const scheduled = matches.filter(m=>['scheduled','called'].includes(m.status));
  const pct = matches.length ? Math.round(100*completed.length/matches.length) : 0;
  const upcoming = matches.filter(m=>m.scheduledStart && ['scheduled','called'].includes(m.status)).sort((a,b)=>a.scheduledStart.localeCompare(b.scheduledStart)).slice(0,6);
  const recent = completed.slice().sort((a,b)=>(b.actualEnd||b.updatedAt||'').localeCompare(a.actualEnd||a.updatedAt||'')).slice(0,6);
  const regByStatus = {confirmed:0, pending:0, waitlisted:0, withdrawn:0, rejected:0};
  regs.forEach(r=> regByStatus[r.status] = (regByStatus[r.status]||0)+1);
  const roleTabs = tabsForRole().map(x=>x[0]);
  const go = k => (roleTabs.includes(k) || (state.role==='admin' && ['players','courts','schedule','draws'].includes(k))) ? `data-tab="${k}" role="button"` : '';
  return `
    ${renderChampionsCard(t)}
    ${state.role==='admin' && t.status!=='completed' && evs.length && evs.every(e=>e.status==='completed') ? `<div class="finish-hint">Every event is finished. <button class="btn btn-sm btn-primary" id="btnFinishTournament">${ICONS.trophy} Finish tournament</button></div>`:''}
    <div class="stat-grid">
      <div class="stat-tile accent" ${go('players')}><div class="stat-num">${new Set(regs.map(r=>r.playerId)).size}</div><div class="stat-label">Registered players</div></div>
      <div class="stat-tile" ${go('events')}><div class="stat-num">${evs.length}</div><div class="stat-label">Events</div></div>
      <div class="stat-tile gold" ${go('matches')}><div class="stat-num">${live.length}</div><div class="stat-label">Live matches</div></div>
      <div class="stat-tile" ${go('schedule')}><div class="stat-num">${scheduled.length}</div><div class="stat-label">Scheduled</div></div>
      <div class="stat-tile" ${go('results')}><div class="stat-num">${completed.length}/${matches.length}</div><div class="stat-label">Completed</div></div>
      <div class="stat-tile" ${go('courts')}><div class="stat-num">${courts.filter(c=>c.active).length}/${courts.length}</div><div class="stat-label">Courts active</div></div>
    </div>
    <div class="section-h"><h3>Match progress</h3></div>
    <div class="ring-wrap">${ringSvg(pct)}<div class="ring-label"><strong>${completed.length} of ${matches.length} matches played</strong>${live.length? live.length+' live right now':'No live matches right now'}</div></div>
    <div class="section-h"><h3>Registration status</h3></div>
    ${Object.entries(regByStatus).map(([k,v])=>`<div class="bar-row"><span class="bar-label">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${regs.length?Math.round(100*v/regs.length):0}%"></div></div><span class="bar-num">${v}</span></div>`).join('')}
    <div class="section-h"><h3>Upcoming matches</h3></div>
    ${upcoming.length ? upcoming.map(renderMatchListRow).join('') : `<div class="empty-tab">Nothing scheduled yet.</div>`}
    <div class="section-h"><h3>Recent results</h3></div>
    ${recent.length ? recent.map(renderMatchListRow).join('') : `<div class="empty-tab">No results yet.</div>`}
  `;
}

function renderEventCard(ev){
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam).length || state.registrations.filter(r=>r.eventId===ev.id && r.status==='confirmed').length;
  const draw = eventDraw(ev.id);
  const ms = eventMatches(ev.id).filter(m=>m.entry1Id && m.entry2Id && !['bye','cancelled'].includes(m.status));
  const done = ms.filter(m=>['completed','walkover','retired'].includes(m.status)).length;

  return `<div class="cat-card ev-card" data-open-event="${ev.id}">

  </div>`;
}
/* ---------- Event players & seeds pop-ups (Settings -> Draws) ---------- */
function eventSeedsMatter(ev){ return !['round_robin','americano'].includes(ev.drawFormat||'single_elimination'); }
function eventPlayersBody(ev){
  const doubles = isDoublesType(ev.type);
  const regs = state.registrations.filter(r=>r.eventId===ev.id);
  const taken = new Set();
  regs.filter(r=>r.status!=='withdrawn' && r.status!=='rejected').forEach(r=>{ taken.add(r.playerId); if(r.partnerId) taken.add(r.partnerId); });
  const available = state.players.filter(p=>!taken.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const opts = `${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}`;
  const add = available.length ? `<div class="ev-pop-add">
      <select data-admin-player-select="${ev.id}" aria-label="Player"><option value="">Add a player&hellip;</option>${opts}</select>
      ${doubles?`<select data-admin-partner-select="${ev.id}" aria-label="Partner"><option value="">Partner&hellip;</option>${opts}</select>`:''}
      <button class="btn btn-primary btn-sm" data-admin-register-event="${ev.id}">${ICONS.plus} Add</button>
    </div>` : `<p class="helptext" style="margin-top:0">Everyone in Players is already in this event.</p>`;
  const rows = regs.slice().sort((a,b)=>playerName(a.playerId).localeCompare(playerName(b.playerId))).map(r=>`<div class="ev-pop-row">
      <span class="grow main-txt">${esc(playerName(r.playerId))}${r.partnerId?` / ${esc(playerName(r.partnerId))}`:(doubles?' <span class="sub-txt">(needs a partner)</span>':'')}</span>
      <select data-reg-status="${r.id}" aria-label="Status">${['pending','confirmed','waitlisted','withdrawn','rejected'].map(st=>`<option value="${st}" ${r.status===st?'selected':''}>${st}</option>`).join('')}</select>
    </div>`).join('');
  return add + (regs.length ? rows : `<div class="empty-tab">No one registered yet.</div>`)
    + `<p class="helptext" style="margin-bottom:0">Only <b>confirmed</b> ${doubles?'pairs':'players'} are in the draw.</p>`;
}
function openEventPlayersDialog(evId){
  const ev = eventById(evId); if(!ev) return;
  const title = ()=>{ const n = state.registrations.filter(r=>r.eventId===ev.id).length; return ev.name + ' · ' + n + (isDoublesType(ev.type)?' pair':' player') + (n===1?'':'s'); };
  openDialog(title(), eventPlayersBody(ev), `<button type="button" class="btn btn-primary" data-close>Done</button>`);
  setDialogRefresher(()=>{ const e = eventById(evId); if(!e) return closeGenericDialog();
    document.getElementById('genericTitle').textContent = title();
    const keep = [...document.querySelectorAll('#genericBody .ev-pop-add select')].map(x=>x.value);
    document.getElementById('genericBody').innerHTML = eventPlayersBody(e);
    document.querySelectorAll('#genericBody .ev-pop-add select').forEach((x,i)=>{ if(keep[i] && [...x.options].some(o=>o.value===keep[i])) x.value = keep[i]; });
  });
}
function eventSeedsBody(ev){
  const rankByPlayer = rankingPointsByPlayer(ev.tournamentId);
  const entries = eventEntries(ev.id).filter(en=>!en.isAmericanoTeam);
  if(!entries.length) return `<div class="empty-tab">No confirmed ${isDoublesType(ev.type)?'pairs':'players'} yet.</div>`;
  return `<p class="helptext" style="margin-top:0">1 = strongest. Seeds are kept apart and get any byes first; the rest are drawn at random.</p>
    ${entries.length>=2 ? `<button type="button" class="btn btn-sm" data-suggest-seeds="${ev.id}" style="margin-bottom:6px">${ICONS.chart} Suggest from rankings</button>` : ''}
    ${entries.slice().sort((a,b)=>(validSeed(a.seed)??1e9)-(validSeed(b.seed)??1e9) || entryName(a).localeCompare(entryName(b))).map(en=>{ const pts = entryRanking(en, rankByPlayer).points; return `<div class="ev-pop-row">
      <span class="grow main-txt">${esc(entryName(en))}${pts?` <span class="sub-txt" title="${en.player2Id?'Average ranking points of the pair':'Ranking points'}">&middot; ${fmtPts(pts)} pts${en.player2Id?' avg':''}</span>`:''}</span>
      <input type="number" min="1" class="mono" style="width:60px" data-seed-input="${en.id}" value="${en.seed==null?'':en.seed}" placeholder="&ndash;" aria-label="Seed">
    </div>`; }).join('')}`;
}
async function openEventSeedsDialog(evId){
  const ev = eventById(evId); if(!ev) return;
  // Before a draw exists, bring the entries in line with the confirmed registrations.
  if(!eventDraw(ev.id)) await buildEntriesFromRegistrations(ev, {quiet:true});
  openDialog('Seeds · ' + ev.name, eventSeedsBody(ev), `<button type="button" class="btn btn-primary" data-close>Done</button>`);
  setDialogRefresher(()=>{
    const e = eventById(evId); if(!e) return closeGenericDialog();
    if(document.activeElement && document.activeElement.matches && document.activeElement.matches('#genericBody [data-seed-input]')) return;   // don't redraw under the cursor
    document.getElementById('genericBody').innerHTML = eventSeedsBody(e);
  });
}
/* Americano rotates partners into doubles, so it isn't offered for singles events
   (it stays listed only for an old singles event already set to it, so it can be changed). */
const DRAW_FORMATS = [['single_elimination','Single elimination'],['double_elimination','Double elimination'],['round_robin','Round robin'],['group_knockout','Groups + knockout'],['americano','Americano']];
function formatAllowedForType(format, type){ return !(format==='americano' && type==='singles'); }
function drawFormatOptionsHtml(type, selected){
  return DRAW_FORMATS.filter(([v])=>formatAllowedForType(v, type) || v===selected)
    .map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join('');
}
function renderEventDrawCard(t, ev){
  const regs = state.registrations.filter(r=>r.eventId===ev.id);
  const entries = eventEntries(ev.id).filter(en=>!en.isAmericanoTeam);
  const draw = eventDraw(ev.id);
  const doubles = isDoublesType(ev.type);
  const confirmed = regs.filter(r=>r.status==='confirmed').length, pending = regs.filter(r=>r.status==='pending').length;
  const seeded = entries.filter(e=>validSeed(e.seed)!=null).length;
  const fmt = ev.drawFormat||'single_elimination', variant = ev.americanoVariant||'classic';
  const hint = (()=>{
    if(fmt==='group_knockout') return `Groups: ${describeScoring(scoringFor(ev, t, {bracket:'GRP'}))} · knockout: ${describeScoring(scoringFor(ev, t, {bracket:'SE'}))}`;
    if(fmt!=='americano') return '';
    const n = entries.length || confirmed;
    let h = variant.replace(/^./,c=>c.toUpperCase()) + ' · ' + describeScoring(scoringFor(ev, t));
    if(variant==='classic' && n) h += '. ' + americanoPlanSummary(n);
    if(variant==='mexicano' && n && n%4) h += `. ${n%4} sit out each round; games even out every ${americanoEqualRoundsStep(n)} rounds.`;
    return h;
  })();
  const mex = draw && draw.format==='americano' && variant==='mexicano';
  return `
    <div class="card ev-setup">
      <div class="ev-sum">
        <span class="grow"><b>${confirmed} ${doubles&&fmt!=='americano'?(confirmed===1?'pair':'pairs'):(confirmed===1?'player':'players')}</b>${pending?` <span class="pill">${pending} pending</span>`:''}${eventSeedsMatter(ev)&&seeded?` <span class="sub-txt">&middot; ${seeded} seeded</span>`:''}</span>
        <button type="button" class="btn btn-sm" data-ev-players="${ev.id}">${ICONS.users} Players</button>
        ${eventSeedsMatter(ev)?`<button type="button" class="btn btn-sm" data-ev-seeds="${ev.id}">${ICONS.chart} Seeds</button>`:''}
      </div>
      <div class="field-row">
        <div class="field" style="flex:1"><label>Format</label><select id="fDrawFormat" data-event-id="${ev.id}">
          ${drawFormatOptionsHtml(ev.type||'singles', ev.drawFormat)}
        </select></div>
        <div class="field" id="fGroupSizeWrap" style="width:96px" ${fmt!=='group_knockout'?'hidden':''}><label>Group size</label><input type="number" id="fGroupSize" min="3" max="6" value="${(draw&&draw.groupSize)||4}"></div>
      </div>
      <label class="row" id="fThirdPlaceWrap" style="font-size:12.5px;gap:6px;margin-top:6px" ${['single_elimination','group_knockout'].includes(fmt)?'':'hidden'}><input type="checkbox" id="fThirdPlace" ${ev.thirdPlaceMatch?'checked':''}> Third place match</label>
      ${hint?`<div class="helptext" style="margin-top:6px">${esc(hint)} <span class="sub-txt">(Edit event to change)</span></div>`:''}
      <div class="ev-setup-acts">
        <button class="btn btn-primary btn-sm" id="btnGenerateDraw">${ICONS.sparkles} ${draw?'Regenerate draw':'Generate draw'}</button>
        ${draw && draw.format==='group_knockout' && !eventMatches(ev.id).some(m=>m.bracket==='SE') ? `<button class="btn btn-sm" id="btnGenKnockout">Add knockout bracket</button>`:''}
        ${mex ? `<button class="btn btn-sm" id="btnGenNextMexicanoRound">${ICONS.sparkles} Next round</button>`:''}
        ${draw && ev.status!=='completed' ? `<button class="btn btn-sm btn-finish" data-finish-event="${ev.id}">${ICONS.trophy} Finish event</button>`:''}
        ${draw && ev.status==='completed' ? `<button class="btn btn-sm" data-reopen-event="${ev.id}">${ICONS.undo} Reopen event</button>`:''}
      </div>
    </div>
  `;
}
function renderBracketColumns(matches, containerId, editable){
  if(!matches.length) return `<div class="empty-tab">No matches in this bracket yet.</div>`;
  const byRoundPos = {};
  matches.forEach(m=>{ (byRoundPos[m.round]=byRoundPos[m.round]||[]).push(m); });
  const roundNums = Object.keys(byRoundPos).map(Number).sort((a,b)=>a-b);
  const maxRound = roundNums.length?Math.max(...roundNums):0;
  const cols = roundNums.map(r=>{
    const ms = byRoundPos[r].slice().sort((a,b)=>a.position-b.position);
    const cards = ms.map(m=>renderMatchCard(m, maxRound, editable)).join('');
    return `<div class="round-col"><div class="round-label">${esc(roundLabelFor(ms[0].bracket, r, maxRound, ms[0].isThirdPlace))}</div>${cards}</div>`;
  }).join('');
  return `<div class="bracket-wrap"><div class="bracket" id="${containerId}"><svg class="bracket-lines" id="${containerId}Lines"></svg>${cols}</div></div>`;
}
function bracketScoreCells(m, key){
  const live = m.status==='in_progress';
  return `<span class="score mono mc-g">${(m.games||[]).map((g,i)=>{ const w=ScoreRules.gameWinner(g); const won=(w===1&&key==='a')||(w===2&&key==='b'); const cur = live && i===m.games.length-1 && !w;
    return `<span class="mc-c ${won?'w':''} ${cur?'cur':''}">${g[key]}</span>`; }).join('')}</span>`;
}
function renderMatchCard(m, maxRound, editable){
  const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
  const playable = e1 && e2 && !['completed','bye','cancelled'].includes(m.status);
  const w = m.winnerEntryId;
  return `<div class="match-card ${playable&&editable?'playable':''}" data-match-id="${m.id}" ${m.nextMatchId?`data-next="${m.nextMatchId}"`:''} ${playable&&editable?`data-open-live="${m.id}"`:''} ${!playable?`data-open-match="${m.id}"`:''}>
    <div class="m-slot ${!e1?'tbd':''} ${w&&w===m.entry1Id?'winner':''}"><span class="name">${e1&&validSeed(e1.seed)?`<span class="seed-tag" title="Seed ${validSeed(e1.seed)}">${validSeed(e1.seed)}</span>`:''}${esc(matchSideName(m,1))}</span>${e1&&m.games&&m.games.length?bracketScoreCells(m,'a'):''}</div>
    <div class="m-slot ${!e2?'tbd':''} ${w&&w===m.entry2Id?'winner':''}"><span class="name">${e2&&validSeed(e2.seed)?`<span class="seed-tag" title="Seed ${validSeed(e2.seed)}">${validSeed(e2.seed)}</span>`:''}${esc(matchSideName(m,2))}</span>${e2&&m.games&&m.games.length?bracketScoreCells(m,'b'):''}</div>
    <div class="m-status ${m.status==='bye'?'bye':''} ${m.status==='in_progress'?'live':''}">${m.status==='bye'?'Bye':m.status==='in_progress'?'Live':m.status==='completed'?'Final':m.status==='walkover'?'Walkover':(m.scheduledStart?esc(fmtTime(m.scheduledStart)):'TBD')}</div>
  </div>`;
}
function renderStandingsTable(rows){
  if(!rows.length) return `<div class="empty-tab">No entries.</div>`;
  return `<div class="table-scroll"><table class="standings"><thead><tr><th>#</th><th>Entry</th><th class="num">P</th><th class="num">W-L</th><th class="num">Game diff</th><th class="num">Point diff</th></tr></thead>
  <tbody>${rows.map((r,i)=>`<tr class="rank-${i+1}"><td class="rk mono">${i+1}</td><td>${esc(entryName(r.entry))}</td><td class="num mono">${r.played}</td><td class="num mono">${r.wins}-${r.losses}</td>
    <td class="num mono">${r.gameDiff>0?'+':''}${r.gameDiff}</td><td class="num mono">${r.pointDiff>0?'+':''}${r.pointDiff}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderRoundRobinMatchList(matches, editable, sitOutByRound){
  const byRound={}; matches.forEach(m=>(byRound[m.round]=byRound[m.round]||[]).push(m));
  const rowFn = m=>renderScoreboard(m, {actions: editable && state.role==='admin' && !matchLocked(m), hideEvent:true});
  return Object.keys(byRound).map(Number).sort((a,b)=>a-b).map(r=>{
    const sit = (sitOutByRound && sitOutByRound[r]) || [];
    return `
    <div class="sub-txt" style="margin:10px 0 4px;font-weight:700;font-size:12px">Round ${r}${sit.length?` <span style="font-weight:500;color:var(--muted)">&middot; sitting out: ${sit.map(pid=>esc(playerName(pid))).join(', ')}</span>`:''}</div>
    ${byRound[r].slice().sort((a,b)=>a.position-b.position).map(rowFn).join('')}
  `;}).join('');
}
function renderBracketForEvent(ev, editable){
  const draw = eventDraw(ev.id);
  if(!draw) return `<div class="empty-tab">No draw generated for this event yet.</div>`;
  const matches = eventMatches(ev.id);
  if(draw.format==='round_robin'){
    const entries = eventEntries(ev.id);
    const standing = computeGroupStandings(entries.map(e=>e.id), matches, draw.tiebreak);
    return renderStandingsTable(standing) + `<div class="section-h"><h3>Matches</h3></div>` + renderRoundRobinMatchList(matches, editable);
  }
  if(draw.format==='group_knockout'){
    const groupsHtml = (draw.groups||[]).map(g=>{
      const gMatches = matches.filter(m=>m.groupId===g.id);
      const standing = computeGroupStandings(g.entryIds, gMatches, draw.tiebreak);
      return `<div class="group-card card"><h4>${esc(g.name)}</h4>${renderStandingsTable(standing)}
        <div class="sub-txt" style="margin:10px 0 4px;font-weight:700;font-size:12px">Matches</div>${renderRoundRobinMatchList(gMatches, editable)}</div>`;
    }).join('');
    const koMatches = matches.filter(m=>m.bracket==='SE');
    return `<div class="group-grid">${groupsHtml}</div>` +
      (koMatches.length ? `<div class="section-h"><h3>Knockout stage</h3></div>${renderBracketColumns(koMatches,'bracketMain',editable)}` :
      `<div class="section-h"><h3>Knockout stage</h3></div><div class="empty-tab">This draw was made before the knockout was generated with the groups. Use "Add knockout bracket" (Settings &rarr; Draws) to add it; qualifiers fill in as each group finishes.</div>`);
  }
  if(draw.format==='double_elimination'){
    const wb = matches.filter(m=>m.bracket==='WB'), lb = matches.filter(m=>m.bracket==='LB'), gf = matches.filter(m=>m.bracket==='GF').sort((a,b)=>a.round-b.round);
    return `<div class="bracket-section wb"><h4>Winners bracket</h4>${renderBracketColumns(wb,'bracketWB',editable)}</div>
      <div class="bracket-section lb"><h4>Losers bracket</h4>${renderBracketColumns(lb,'bracketLB',editable)}</div>
      <div class="bracket-section gf"><h4>Grand final${gf.length>1?' (bracket reset)':''}</h4><div class="cat-grid" style="max-width:440px">${gf.map(m=>renderMatchCard(m,1,editable)).join('')}</div></div>`;
  }
  if(draw.format==='americano'){
    const individualEntries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
    const standing = computeAmericanoStandings(individualEntries, matches);
    const standingsHtml = (ev.americanoVariant==='mixed')
      ? `<div class="group-grid">
          <div class="group-card card"><h4>Men</h4>${renderAmericanoStandingsTable(standing.filter(r=>{const p=playerById(r.playerId); return p&&normGender(p.gender)==='male';}))}</div>
          <div class="group-card card"><h4>Women</h4>${renderAmericanoStandingsTable(standing.filter(r=>{const p=playerById(r.playerId); return p&&normGender(p.gender)==='female';}))}</div>
        </div>`
      : renderAmericanoStandingsTable(standing);
    const fin = americanoFinalMatch(ev.id);
    const rankNote = americanoRankingNote(ev);
    const isAdmin = editable && state.role==='admin';
    const canAdd = isAdmin && (ev.americanoVariant||'classic')!=='mexicano' && !fin;
    return renderAmericanoFinalCard(ev, fin, editable) + standingsHtml + rankNote + `<div class="section-h"><h3>Rounds</h3>${canAdd?`<button class="btn btn-sm no-print" data-add-am-rounds="${ev.id}">${ICONS.plus} Add rounds</button>`:''}</div>` + renderRoundRobinMatchList(matches.filter(m=>m.bracket!=='AMF'), editable, draw.americanoSitOut);
  }
  return renderBracketColumns(matches.filter(m=>m.bracket==='SE'), 'bracketMain', editable);
}
function renderAmericanoFinalCard(ev, fin, editable){
  const isAdmin = editable && state.role==='admin';
  if(!fin){
    if(!isAdmin) return '';
    const ready = americanoRoundsDone(ev.id);
    return `<div class="am-final-card no-print"><div class="row-h"><h4>Final</h4><button class="btn btn-sm btn-primary" data-am-final="${ev.id}">Create final</button></div>
      <div class="helptext">${ready ? 'All rounds are scored. Pick the top four players for a final.' : 'When the rounds are done, the top four can play a final for the title.'}</div></div>`;
  }
  const rowFn = m=>renderScoreboard(m, {actions: editable && state.role==='admin' && !matchLocked(m), hideEvent:true});
  const w = fin.winnerEntryId && entryById(fin.winnerEntryId);
  const sc = scoringFor(ev, tournamentById(ev.tournamentId), fin);
  return `<div class="am-final-card"><div class="row-h"><h4>Final</h4>${isAdmin && fin.status!=='completed' ? `<button class="btn btn-sm btn-ghost no-print" data-am-final-remove="${ev.id}">Remove</button>`:''}</div>
    <div class="helptext" style="margin-bottom:6px">${esc(describeScoring(sc))}</div>
    ${rowFn(fin)}
    ${w ? `<div class="am-final-champ">${ICONS.trophy||''} Champions: ${esc(entryName(w))}</div>`:''}</div>`;
}

function drawBracketConnectorsFor(containerId){
  const container = document.getElementById(containerId);
  const svg = document.getElementById(containerId+'Lines');
  if(!container||!svg) return;
  const w=container.scrollWidth, h=container.scrollHeight;
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.style.width=w+'px'; svg.style.height=h+'px';
  svg.innerHTML='';
  const rect0 = container.getBoundingClientRect();
  container.querySelectorAll('.match-card[data-next]').forEach(card=>{
    const nextId = card.getAttribute('data-next');
    const nextCard = container.querySelector('.match-card[data-match-id="'+nextId+'"]');
    if(!nextCard) return;
    const r1=card.getBoundingClientRect(), r2=nextCard.getBoundingClientRect();
    const x1=r1.right-rect0.left, y1=r1.top+r1.height/2-rect0.top;
    const x2=r2.left-rect0.left, y2=r2.top+r2.height/2-rect0.top;
    const midX=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
    svg.appendChild(path);
  });
}
function drawAllBracketConnectors(){
  ['bracketMain','bracketWB','bracketLB'].forEach(id=>{ if(document.getElementById(id)) drawBracketConnectorsFor(id); });
}
window.addEventListener('resize', ()=>{ requestAnimationFrame(drawAllBracketConnectors); });

function applyMatchFilters(matches, f){
  f = f||{};
  return matches.filter(m=>{
    if(f.eventId && m.eventId!==f.eventId) return false;
    if(f.courtId && m.courtId!==f.courtId) return false;
    if(f.status && m.status!==f.status) return false;
    if(f.date && (!m.scheduledStart || m.scheduledStart.slice(0,10)!==f.date)) return false;
    if(VIEWER && state.followPlayerId && !matchHasPlayer(m, state.followPlayerId)) return false;
    if(f.player){
      const q=f.player.toLowerCase();
      const names = matchEntryPlayerIds(m).map(pid=>playerName(pid).toLowerCase());
      if(!names.some(n=>n.includes(q))) return false;
    }
    return true;
  });
}
/* "Clear filters" for a filter bar: shown only while one of its filters is set. */

  const f = state.filters[key]||{};
  if(!fields.some(k=>f[k]!=null && f[k]!=='')) return '';
  return `<button type="button" class="btn btn-sm btn-clear-filters" data-clear-filters="${key}:${fields.join(',')}" title="Clear filters">${ICONS.x} Clear filters</button>`;
}

function renderMatchesTab(t){
  // One place for every match: on court now, the schedule (by start time), not yet scheduled, then results.
  const f = state.filters.matches = state.filters.matches||{};
  const all = applyMatchFilters(tMatches(t.id), f).filter(m=>(m.entry1Id||m.entry2Id||m.src1||m.src2||feedersOf(m).length) && m.status!=='bye' && (f.status==='cancelled' || m.status!=='cancelled'));
  const DONE = ['completed','walkover','retired'];
  const live = all.filter(m=>m.status==='in_progress');
  const sched = all.filter(m=>m.scheduledStart && !DONE.includes(m.status) && m.status!=='in_progress')
    .sort((a,b)=>a.scheduledStart.localeCompare(b.scheduledStart) || ((courtById(a.courtId)||{}).name||'').localeCompare((courtById(b.courtId)||{}).name||'', undefined, {numeric:true}));
  const unsched = all.filter(m=>!m.scheduledStart && !DONE.includes(m.status) && m.status!=='in_progress')
    .sort((a,b)=> (a.entry1Id&&a.entry2Id?0:1)-(b.entry1Id&&b.entry2Id?0:1) || a.round-b.round || a.position-b.position);
  const tm = m=> m.actualEnd || m.updatedAt || m.scheduledStart || '';
  const done = all.filter(m=>DONE.includes(m.status)).sort((a,b)=>tm(b).localeCompare(tm(a)));
  const card = m=>renderScoreboard(m, {actions: state.role==='admin' && !matchLocked(m), hideTime: !!m.scheduledStart && !DONE.includes(m.status), hideEvent: !!f.eventId});
  const grid = list=>`<div class="sb-grid">${list.map(card).join('')}</div>`;
  const section = (title, n, body)=>`<div class="mt-sec"><h3>${title}<span class="n">${n}</span></h3>${body}</div>`;
  const byTime = [];
  sched.forEach(m=>{ const k = fmtDateTime(m.scheduledStart); const last = byTime[byTime.length-1]; if(last && last.k===k) last.ms.push(m); else byTime.push({k, ms:[m]}); });
  const ev = f.eventId && eventById(f.eventId);
  return `
    <div data-more-scope>
    ${renderFilterBar(t,'matches',{more: moreMenuBtn()})}
    <div class="export-row no-print">
      ${state.role==='admin' && !tLocked(t)?`<button class="btn btn-sm btn-primary" id="btnAssignAny">${ICONS.calendar} Schedule a match&hellip;</button>`:''}
      <button class="btn btn-sm m-overflow" id="btnExportCourtSchedule">${ICONS.download} Export schedule CSV</button>
      <button class="btn btn-sm m-overflow" id="btnExportResults">${ICONS.download} Export results CSV</button>
      <button class="btn btn-sm m-overflow" id="btnPrintSchedule">${ICONS.print} Print</button>
    </div>
    </div>
    ${ev && ev.drawFormat==='americano' && eventDraw(ev.id) ? `<div class="helptext" style="margin:-4px 0 10px">Standings and the final for ${esc(ev.name)} are under Results and Settings &rarr; Draws.</div>`:''}
    ${!all.length ? `<div class="empty-tab">${ev && !eventDraw(ev.id) ? `No draw for ${esc(ev.name)} yet.${state.role==='admin' && !tLocked(t) ? ` <button type="button" class="btn btn-sm btn-primary" data-goto-draws="${ev.id}" style="margin-left:6px">${ICONS.sparkles} Generate the draw</button>` : ''}` : 'No matches match these filters.'}</div>` : ''}
    ${live.length ? section('<span class="sb-live">&#9679;</span> On court now', live.length, grid(live)) : ''}
    ${sched.length ? section('Schedule', sched.length, byTime.map(g=>`<div class="vm-time">${esc(g.k)}</div>${grid(g.ms)}`).join('')) : ''}
    ${unsched.length ? section('Not scheduled yet', unsched.length, grid(unsched)) : ''}
    ${done.length ? section('Completed', done.length, grid(done)) : ''}
  `;
}
function renderMatchRowActionable(m){ return renderScoreboard(m, {actions: state.role==='admin' && !matchLocked(m)}); }
/* One scoreboard card for every match list: event and round on top, then one
   line per side - names on the left, a score cell per game on the right.
   The winning side is bold with an accent bar; a live match highlights the
   game being played. opts.actions adds the admin buttons underneath. */
function renderScoreboard(m, opts){
  opts = opts||{};
  const ev = eventById(m.eventId), court = courtById(m.courtId);
  const e1 = entryById(m.entry1Id), e2 = entryById(m.entry2Id);
  const live = m.status==='in_progress', done = ['completed','walkover','retired'].includes(m.status);
  const games = (m.games && m.games.length) ? m.games : (live ? [{a:0,b:0}] : []);
  const fp = followedPlayer();
  const cell = (g,i,key)=>{
    const other = key==='a'?'b':'a', w = ScoreRules.gameWinner(g);
    const won = (w===1 && key==='a') || (w===2 && key==='b');
    const cur = live && i===games.length-1 && !w;
    return `<span class="sb-c ${won?'w':''} ${cur?'cur':''}">${g[key]}</span>`;
  };
  const line = (e, key)=>{
    const won = done && e && m.winnerEntryId===e.id;
    const me = fp && e && entryPlayerIds(e).includes(fp.id);
    return `<div class="sb-line ${won?'win':''} ${me?'me':''} ${!e?'tbd':''}">
      <span class="sb-nm">${esc(e?entryName(e):matchSideLabel(m, key==='a'?1:2))}${won?`<span class="sb-tick" aria-label="winner">${ICONS.check}</span>`:''}</span>
      <span class="sb-g mono">${games.map((g,i)=>cell(g,i,key)).join('')}</span></div>`;
  };
  const status = live ? `<span class="sb-live">&#9679; LIVE</span>`
    : m.status==='walkover' ? 'Walkover' : m.status==='retired' ? 'Retired' : done ? 'Final'
    : ['cancelled','postponed','bye'].includes(m.status) ? esc(m.status.replace(/_/g,' '))
    : opts.hideTime ? '' : (m.scheduledStart ? esc(fmtDateTime(m.scheduledStart)) : 'Not scheduled');
  const e1ok = e1 && e2;
  const scoreIssue = (m.games||[]).length ? ScoreRules.matchProblem(m.games, scoringFor(ev, tournamentById(m.tournamentId), m)) : null;
  const canPlay = e1ok && !['completed','bye','cancelled'].includes(m.status);
  const canStart = canPlay && !live && ['scheduled','called','pending','postponed'].includes(m.status);
  const acts = opts.actions ? `<div class="sb-acts no-print">
      ${canStart?`<button class="btn btn-sm btn-start" data-start-match="${m.id}">${ICONS.bolt} Start</button>`:''}
      ${canPlay?`<button class="btn btn-sm ${canStart?'':'btn-primary'}" data-open-live="${m.id}">${live?'Update score':'Score'}</button>`:''}
      ${live && !(m.games||[]).some(g=>g.a||g.b) ? `<button class="btn btn-sm btn-ghost" data-unstart-match="${m.id}" title="Not started after all">Undo start</button>`:''}
      ${m.status==='completed'?`<button class="btn btn-sm" data-open-correct="${m.id}">${ICONS.edit} Edit score</button>`:''}
      <span class="grow"></span>
      <button class="btn btn-sm sb-ic" data-open-schedule="${m.id}" title="Schedule" aria-label="Schedule">${ICONS.calendar}</button>
      ${canPlay?`<button class="btn btn-sm" data-open-decide="${m.id}" title="Walkover or retirement">W/O</button>`:''}
    </div>` : '';
  return `<div class="sb ${live?'live':''} ${done?'done':''}" data-match-id="${m.id}" data-open-match="${m.id}">
    <div class="sb-meta"><span class="sb-ev">${opts.hideEvent?'':esc((ev||{}).name||'')+' &middot; '}${esc(roundLabelForMatch(m))}</span><span class="sb-when">${[court?esc(court.name):'', status].filter(Boolean).join(' &middot; ')}</span></div>
    ${line(e1,'a')}${line(e2,'b')}
    ${scoreIssue && opts.actions ? `<div class="sb-warn">${ICONS.warn}<span>This score isn't possible: ${esc(scoreIssue.reason)}. Tap Edit score to fix it.</span></div>` : ''}
    ${acts}
  </div>`;
}

function renderScheduleTab(t){

  const times = [...new Set(matches.map(m=>m.scheduledStart))].sort();

  `;
}

function renderEventResultsCard(ev){
  const draw = eventDraw(ev.id);
  const head = (st)=>`<div class="res-h"><h3>${esc(ev.name)}</h3>${st?`<span class="pill ${st==='Final'?'gold':st==='In progress'?'court':''}">${st}</span>`:''}</div>`;
  if(!draw) return `<div class="card res-card">${head('')}<div class="sub-txt">Draw not generated yet.</div></div>`;
  const matches = eventMatches(ev.id);
  const placements = computeEventPlacements(ev.id);
  const isAm = draw.format==='americano';
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  const stats = {};
  if(isAm){
    computeAmericanoStandings(entries, matches).forEach(r=>{ const en = entries.find(e=>e.player1Id===r.playerId); if(en) stats[en.id] = r; });
  } else {
    computeGroupStandings(entries.map(e=>e.id), matches.filter(m=>m.entry1Id && m.entry2Id), TIEBREAK_DEFAULT).forEach(r=>{ stats[r.entryId] = r; });
  }
  const rows = entries.map(e=>({entry:e, st:stats[e.id]||{played:0,wins:0,losses:0,pointsFor:0}, ...(placements[e.id]||{points:0,label:'',provisional:true})}))
    .sort((a,b)=> (b.provisional?0:b.points)-(a.provisional?0:a.points) || ((a.rank||999)-(b.rank||999)) || (b.st.wins-a.st.wins) || (b.st.pointsFor-a.st.pointsFor));
  const played = matches.some(m=>['completed','walkover','retired'].includes(m.status));
  const final = ev.status==='completed' || (played && matches.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status)));
  const st = final ? 'Final' : played ? 'In progress' : 'Not started';
  const fp = followedPlayer();
  const champ = rows.filter(r=>r.label==='Champion').map(r=>entryName(r.entry));
  return `<div class="card res-card">
    ${head(st)}
    ${champ.length ? `<div class="champ-banner">${ICONS.trophy}<span><small>Champion</small>${esc(champ.join(' & '))}</span></div>` : ''}
    <div class="table-scroll"><table class="data-table res-table"><thead><tr><th class="rk">#</th><th>${isDoublesType(ev.type)&&!isAm?'Team':'Player'}</th><th class="num">W-L</th><th class="num" title="Rally points won">Pts won</th><th class="num" title="Ranking points">Rank pts</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${fp && entryPlayerIds(r.entry).includes(fp.id)?'me-row':''} ${r.label==='Champion'?'champ':''}">
      <td class="rk mono">${i+1}</td>
      <td><div class="res-nm">${esc(entryName(r.entry))}</div>${r.label && r.label!=='Not started'?`<div class="res-pl">${esc(r.label.replace(' (still in)',' · still in'))}</div>`:''}</td>
      <td class="num mono"><span class="w">${r.st.wins}</span>-<span class="l">${r.st.losses}</span></td>
      <td class="num mono">${r.st.pointsFor}</td>
      <td class="num mono res-rp">${r.provisional?'&ndash;':r.points}</td></tr>`).join('')}</tbody></table></div>
    ${isAm ? americanoRankingNote(ev) : ''}
    ${rows.some(r=>r.provisional) ? `<div class="helptext" style="margin-top:6px">Rank points are given once every match in the event is played.</div>` : ''}
    <div class="res-foot no-print"><button class="btn btn-sm btn-ghost m-overflow" data-export-standings="${ev.id}">${ICONS.download} Export</button></div>
  </div>`;
}

/* "My games": one player's day at a glance - live now, next up, results and standings. */
function renderFollowTab(t){
  const p = followedPlayer();
  if(!p) return `<div class="empty-tab">Choose a player above to follow their matches.</div>`;
  const ms = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && matchHasPlayer(m, p.id));
  const side = m => entryPlayerIds(entryById(m.entry1Id)).includes(p.id) ? 1 : 2;
  const decided = ms.filter(m=>['completed','walkover','retired'].includes(m.status));
  const live = ms.filter(m=>m.status==='in_progress');
  const upcoming = ms.filter(m=>!['completed','walkover','retired','in_progress','bye','cancelled'].includes(m.status))
    .sort((a,b)=>(a.scheduledStart||'9999').localeCompare(b.scheduledStart||'9999'));
  const won = decided.filter(m=>m.winnerEntryId === (side(m)===1?m.entry1Id:m.entry2Id));
  let pf=0, pa=0;
  decided.concat(live).forEach(m=>(m.games||[]).forEach(g=>{ const mine = side(m)===1?g.a:g.b, theirs = side(m)===1?g.b:g.a; pf+=mine|0; pa+=theirs|0; }));
  const club = clubById(p.clubId);
  const opp = m => entryName(entryById(side(m)===1?m.entry2Id:m.entry1Id));
  const partner = m => { const e = entryById(side(m)===1?m.entry1Id:m.entry2Id); const other = entryPlayerIds(e).find(x=>x!==p.id); return other ? playerName(other) : ''; };
  const where = m => [m.scheduledStart?fmtDateTime(m.scheduledStart):'', (courtById(m.courtId)||{}).name||''].filter(Boolean).join(' · ');
  const row = (m, kind)=>{
    const s = side(m), score = (m.games||[]).map(g=>(s===1?g.a:g.b)+'-'+(s===1?g.b:g.a)).join(', ');
    const w = kind==='done' && m.winnerEntryId === (s===1?m.entry1Id:m.entry2Id);
    return `<div class="list-row fm-row ${kind==='live'?'live':''}" data-open-match="${m.id}">
      ${kind==='done' ? `<span class="wl ${w?'w':'l'}">${w?'W':'L'}</span>` : kind==='live' ? `<span class="wl live">${ICONS.bolt}</span>` : `<span class="wl next">${ICONS.calendar}</span>`}
      <span class="grow"><span class="main-txt">vs ${esc(opp(m))}</span>
        <div class="sub-txt">${esc((eventById(m.eventId)||{}).name||'')}${partner(m)?' · with '+esc(partner(m)):''}${where(m)?' · '+esc(where(m)):''}</div></span>
      ${score?`<span class="mono fm-score">${score.split(', ').map(g=>`<span>${esc(g)}</span>`).join(' ')}</span>`:''}
    </div>`;
  };
  // standing in each event the player is in (individual entry for Americano)
  const standings = tEvents(t.id).map(ev=>{
    const en = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam).find(e=>entryPlayerIds(e).includes(p.id));
    if(!en || !eventDraw(ev.id)) return null;
    const pl = Object.assign({}, (computeEventPlacements(ev.id)||{})[en.id] || {});
    const stillToPlay = ms.some(m=>m.eventId===ev.id && !['completed','walkover','retired','bye','cancelled'].includes(m.status));
    if(!pl.label || (pl.label==='Did not play' && stillToPlay)) pl.label = stillToPlay ? 'Upcoming' : (pl.label||'In progress');
    return `<div class="list-row"><span class="grow main-txt">${esc(ev.name)}</span><span class="pill ${pl.label==='Champion'?'gold':'court'}">${esc(pl.label||'In progress')}</span>${pl.points!=null && !pl.provisional?`<span class="mono sub-txt">${pl.points} pts</span>`:''}</div>`;
  }).filter(Boolean);
  return `

/* ---------- LIVE LINK (viewer) ---------- */
const VM_DONE = ['completed','walkover','retired'];
function viewerMatchLists(t){
  const empty = {live:[], upcoming:[], completed:[]};
  if(!t) return empty;
  const fp = followedPlayer(), evF = (state.filters.vw||{}).eventId;
  const ms = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && m.status!=='bye' && m.status!=='cancelled'
    && (!evF || m.eventId===evF) && (!fp || matchHasPlayer(m, fp.id)));
  const time = m=> m.actualEnd || m.updatedAt || m.scheduledStart || '';
  return {
    live: ms.filter(m=>m.status==='in_progress'),
    upcoming: ms.filter(m=>!VM_DONE.includes(m.status) && m.status!=='in_progress')
      .sort((a,b)=>(a.scheduledStart||'9999').localeCompare(b.scheduledStart||'9999') || a.round-b.round || a.position-b.position),
    completed: ms.filter(m=>VM_DONE.includes(m.status)).sort((a,b)=>time(b).localeCompare(time(a)))
  };
}
function viewerDefaultTab(t){
  const l = viewerMatchLists(t);
  return (l.live.length || l.upcoming.length) ? 'live' : 'completed';
}
/* Sponsors are typed as one text: split on commas or new lines. */
function sponsorList(t){
  return String((t&&t.sponsors)||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
}
/* Running sponsor text under the tabs on the live link. The track holds the
   list twice and slides by half its width, so the loop is seamless. The phase
   comes from the clock, so re-rendering (live updates) doesn't restart it. */
function renderSponsorTicker(t){
  const list = sponsorList(t);
  if(!list.length) return '';
  const run = list.map(x=>`<span>${esc(x)}</span>`).join('<i aria-hidden="true">&bull;</i>') + '<i aria-hidden="true">&bull;</i>';
  const dur = Math.max(12, Math.round(list.join('   ').length * 0.35));
  const delay = -((Date.now()/1000) % dur);
  return `<div class="sponsor-ticker" role="region" aria-label="Sponsors"><span class="st-label">Sponsors</span>
    <div class="st-viewport"><div class="st-track" style="--st-dur:${dur}s;animation-delay:${delay.toFixed(2)}s"><div class="st-run">${run}</div><div class="st-run" aria-hidden="true">${run}</div></div></div></div>`;
}
function viewerEventFilter(t){
  const evs = tEvents(t.id).filter(e=>eventDraw(e.id));
  if(evs.length<2) return '';
  const f = state.filters.vw = state.filters.vw||{};
  return `<div class="filter-bar"><select data-filter="vw.eventId" aria-label="Event"><option value="">All events</option>${evs.map(e=>`<option value="${e.id}" ${f.eventId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>${clearFiltersBtn('vw', ['eventId'])}</div>`;
}
/* A two-line scoreboard row: event and round on top, one line per side with game scores. */
function renderViewerMatch(m, hideTime){ return renderScoreboard(m, {hideTime}); }

function renderViewerUpcoming(t){

  if(!l.length) return followNote() + viewerEventFilter(t) + `<div class="empty-tab">No more matches to play${followedPlayer()?' for '+esc(followedPlayer().name):''}.</div>`;

  return followNote() + viewerEventFilter(t) + groups.map(g=>`<div class="vm-time">${esc(g.k)}</div>${g.ms.map(m=>renderViewerMatch(m, true)).join('')}`).join('');

function renderViewerStandings(t){
  const f = state.filters.vw = state.filters.vw||{};
  const evs = tEvents(t.id).filter(e=>eventDraw(e.id) && (!f.eventId || e.id===f.eventId));
  if(!evs.length) return viewerEventFilter(t) + `<div class="empty-tab">Standings appear once the draw is out.</div>`;
  const fp = followedPlayer();
  const body = evs.map(ev=>{
    const draw = eventDraw(ev.id), matches = eventMatches(ev.id);
    const st = ev.status==='completed' || (matches.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status)) && matches.some(m=>VM_DONE.includes(m.status))) ? 'Final' : matches.some(m=>VM_DONE.includes(m.status)) ? 'In progress' : 'Not started';
    const champ = eventChampions(ev.id);
    let inner = champ.length ? `<div class="champ-banner">${ICONS.trophy}<span><small>Champion</small>${esc(champ.join(' & '))}</span></div>` : '';
    if(draw.format==='americano'){
      const ind = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
      const standing = computeAmericanoStandings(ind, matches);
      const fin = americanoFinalMatch(ev.id);
      inner = (fin ? `<div class="vm-sub">Final</div>${renderViewerMatch(fin)}<div class="vm-sub">Table</div>` : '') +
        (ev.americanoVariant==='mixed'
          ? `<div class="vm-sub">Men</div>${renderAmericanoStandingsTable(standing.filter(r=>normGender((playerById(r.playerId)||{}).gender)==='male'))}<div class="vm-sub">Women</div>${renderAmericanoStandingsTable(standing.filter(r=>normGender((playerById(r.playerId)||{}).gender)==='female'))}`
          : renderAmericanoStandingsTable(standing)) + americanoRankingNote(ev);
    } else if(draw.format==='round_robin'){
      inner = renderStandingsTable(computeGroupStandings(eventEntries(ev.id).map(e=>e.id), matches, draw.tiebreak));
    } else {
      if(draw.format==='group_knockout') inner = (draw.groups||[]).map(g=>`<div class="vm-sub">${esc(g.name)}</div>${renderStandingsTable(computeGroupStandings(g.entryIds, matches.filter(m=>m.groupId===g.id), draw.tiebreak))}`).join('');
      const ko = matches.some(m=>m.bracket && m.bracket!=='GRP');
      if(ko){
        const pl = computeEventPlacements(ev.id);
        const rows = eventEntries(ev.id).map(e=>({e, ...(pl[e.id]||{points:0,label:''})})).filter(r=>r.label && r.label!=='Group stage')
          .sort((a,b)=>(b.points-a.points) || entryName(a.e).localeCompare(entryName(b.e)));
        inner += (draw.format==='group_knockout' ? `<div class="vm-sub">Knockout</div>` : '') + `<div class="vm-ko">${rows.map(r=>`<div class="vm-ko-row ${fp && entryPlayerIds(r.e).includes(fp.id)?'me':''}"><span class="vm-nm">${esc(entryName(r.e))}</span><span class="pill ${r.label==='Champion'?'gold':/still in/.test(r.label)?'court':''}">${esc(r.label.replace(' (still in)',' · still in'))}</span></div>`).join('')}</div>`;
      }
    }
    return `<div class="vm-card"><div class="vm-card-h"><h3>${esc(ev.name)}</h3><span class="pill ${st==='Final'?'gold':st==='In progress'?'court':''}">${st}</span></div>${inner}</div>`;
  }).join('');
  return (f.eventId ? '' : renderChampionsCard(t)) + viewerEventFilter(t) + body;
}

function renderLiveScoringScreen(m){
  const ev = eventById(m.eventId), t = tournamentById(m.tournamentId);
  const cfg = scoringFor(ev, t, m);
  const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
  const games = m.games||[];
  const openGame = games.length && !ScoreRules.gameWinner(games[games.length-1],cfg);
  const cur = openGame ? games[games.length-1] : {a:0,b:0,log:[]};
  const priorGames = openGame ? games.slice(0,-1) : games;
  const matchDone = ['completed','walkover','retired','bye'].includes(m.status);
  const winner = m.winnerEntryId;
  const court = courtById(m.courtId);
  return `
    <button class="back-link" data-close-live="1">${ICONS.back} Back to matches</button>

/* A page inside the artifact viewer's sandboxed frame cannot rely on the
   browser's native confirm()/alert()/prompt() — some hosts block them
   outright (the call throws or silently no-ops), which would make every
   "Delete" button look like it does nothing. This is a real in-page dialog
   instead, so it always shows and always resolves. */
function confirmDialog(message, opts){
  opts = opts||{};
  const dlg = document.getElementById('dlgConfirm');
  document.getElementById('confirmTitle').textContent = opts.title || 'Are you sure?';
  document.getElementById('confirmMsg').textContent = message;
  const okBtn = document.getElementById('confirmOk');
  okBtn.textContent = opts.okLabel || 'Delete';
  okBtn.className = 'btn ' + (opts.danger===false ? 'btn-primary' : 'btn-danger');
  return new Promise(resolve=>{
    let done=false;
    function finish(v){ if(done) return; done=true; dlg.removeEventListener('cancel', onCancel); if(dlg.open) dlg.close(); resolve(v); }
    function onCancel(e){ e.preventDefault(); finish(false); }
    okBtn.onclick = ()=>finish(true);
    document.getElementById('confirmCancel').onclick = ()=>finish(false);
    dlg.addEventListener('cancel', onCancel);
    if(!dlg.open) dlg.showModal();
  });
}
function stdFoot(saveId, saveLabel){
  return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="${saveId}">${saveLabel||'Save'}</button>`;
}

/* ---------- CUSTOM DATE PICKER ----------
   Native <input type=date> pickers render as a browser-chrome popup that gets
   clipped by the scrolling dialog body (.dlg-body{overflow-y:auto}) in some
   browsers, and behave inconsistently inside a top-layer <dialog>. This is a
   small self-contained calendar widget instead: a text input (still just
   holding a plain YYYY-MM-DD string in .value, so every existing read of
   .value keeps working unchanged) plus a popover calendar. */
/* minFrom: id of another date field; days before its date can't be picked (e.g. end date >= start date). */
function dateFieldHtml(id, value, placeholder, minFrom){
  return `<div class="date-field"><input type="text" class="date-input" id="${id}" data-datepicker ${minFrom?`data-min-from="${minFrom}"`:''} readonly value="${esc(value||'')}" placeholder="${placeholder||'Select date'}" autocomplete="off">${ICONS.calendar.replace('<svg ', '<svg class="date-ic" ')}</div>`;
}
function dpYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dpParse(s){ const m = s && /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
const dpState = {input:null};
function dpMin(input){
  const id = input && input.getAttribute('data-min-from'), el = id && document.getElementById(id);
  return el && dpParse(el.value) ? el.value : '';
}
function dpClose(){
  const pop = document.getElementById('dpPopover');
  if(pop) pop.remove();
  document.removeEventListener('mousedown', dpOutsideHandler, true);
  window.removeEventListener('resize', dpReposition);
  document.removeEventListener('scroll', dpReposition, true);
  dpState.input = null;
}
function dpOutsideHandler(e){
  const pop = document.getElementById('dpPopover');
  if(pop && !pop.contains(e.target) && e.target!==dpState.input) dpClose();
}
function dpReposition(){
  const pop = document.getElementById('dpPopover');
  if(!pop || !dpState.input) return;
  const r = dpState.input.getBoundingClientRect();
  if(r.bottom < 0 || r.top > window.innerHeight){ dpClose(); return; }
  const popH = pop.offsetHeight||300, popW = pop.offsetWidth||264;
  let top = r.bottom + 6; if(top + popH > window.innerHeight - 8) top = Math.max(8, r.top - popH - 6);
  let left = r.left; if(left + popW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - popW - 8);
  pop.style.top = top+'px'; pop.style.left = left+'px';
}
function dpRenderGrid(){
  const {viewYear, viewMonth, input} = dpState;
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const selected = dpParse(input.value);
  const todayStr = dpYmd(new Date());
  const min = dpMin(input);
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="dp-cell dp-empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = dpYmd(new Date(viewYear, viewMonth, d));
    const isSel = selected && iso===dpYmd(selected);
    const isToday = iso===todayStr;
    cells += `<div class="dp-cell"><button type="button" class="dp-day ${isSel?'dp-sel':''} ${isToday&&!isSel?'dp-today':''}" data-dp-day="${iso}" ${min && iso<min?'disabled':''}>${d}</button></div>`;
  }
  const monthName = first.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  return `<div class="dp-head"><button type="button" class="icon-btn" data-dp-nav="-1">&lsaquo;</button><span class="dp-month">${esc(monthName)}</span><button type="button" class="icon-btn" data-dp-nav="1">&rsaquo;</button></div>
    <div class="dp-dow">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-foot"><button type="button" class="btn btn-sm" data-dp-today="1" ${min && todayStr<min?'disabled':''}>Today</button><button type="button" class="btn btn-sm" data-dp-clear="1">Clear</button></div>`;
}
function dpOpen(input){
  if(dpState.input===input) return;
  dpClose();
  dpState.input = input;
  const base = dpParse(input.value) || dpParse(dpMin(input)) || new Date();
  dpState.viewYear = base.getFullYear(); dpState.viewMonth = base.getMonth();
  const pop = document.createElement('div');
  pop.id='dpPopover'; pop.className='dp-popover';
  pop.innerHTML = dpRenderGrid();
  (input.closest('dialog') || document.body).appendChild(pop);
  dpReposition();
  pop.addEventListener('click', dpPopoverClick);
  setTimeout(()=>{
    document.addEventListener('mousedown', dpOutsideHandler, true);
    window.addEventListener('resize', dpReposition);
    document.addEventListener('scroll', dpReposition, true);
  }, 0);
}
function dpSetValue(iso){
  const input = dpState.input;
  input.value = iso;
  input.dispatchEvent(new Event('change', {bubbles:true}));
  dpClose();
}
function dpPopoverClick(e){
  const day = e.target.closest('[data-dp-day]'); if(day){ if(day.disabled) return; dpSetValue(day.getAttribute('data-dp-day')); return; }
  const nav = e.target.closest('[data-dp-nav]');
  if(nav){
    dpState.viewMonth += parseInt(nav.getAttribute('data-dp-nav'),10);
    if(dpState.viewMonth<0){ dpState.viewMonth=11; dpState.viewYear--; }
    if(dpState.viewMonth>11){ dpState.viewMonth=0; dpState.viewYear++; }
    const pop = document.getElementById('dpPopover'); pop.innerHTML = dpRenderGrid(); dpReposition();
    return;
  }
  if(e.target.closest('[data-dp-today]:not(:disabled)')){ dpSetValue(dpYmd(new Date())); return; }
  if(e.target.closest('[data-dp-clear]')){ dpSetValue(''); return; }
}
document.addEventListener('focusin', e=>{ if(e.target.matches && e.target.matches('[data-datepicker]')) dpOpen(e.target); });
document.addEventListener('click', e=>{ if(e.target.matches && e.target.matches('[data-datepicker]')) dpOpen(e.target); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dpState.input) dpClose(); });

/* Americano games follow badminton scoring by default: one game to 21, a side
   must win by 2, and 30 is the hard stop (30-29 wins). Shorter games use the
   usual caps (11 -> 15, 15 -> 21). "No deuce" is a straight race to the target. */
const AMERICANO_POINT_PRESETS = [21, 15, 11];
const AMERICANO_CAPS = {11:15, 15:21, 21:30};
function americanoCap(points){ return AMERICANO_CAPS[points] || (points + 9); }
function americanoScoringFromPoints(points, deuce){
  points = points || 21;
  // amRule:2 marks rules saved with the deuce option (events from before it are upgraded, see scoringFor).
  if(deuce===false) return { bestOf:1, pointsToWin:points, winBy:1, capPoints:points, deuceEnabled:false, amRule:2 };
  return { bestOf:1, pointsToWin:points, winBy:2, capPoints:americanoCap(points), deuceEnabled:true, amRule:2 };
}
const AMERICANO_DEFAULT_SCORING = americanoScoringFromPoints(21, true);
/* Reads an Americano event's rules back into the dialog's two controls. */
function americanoPointsFromScoring(sc){
  if(!sc) return {points:21, deuce:true};
  if(sc.amRule!==2) return {points: sc.pointsToWin || 21, deuce:true};   // older event: now deuce
  return {points: sc.pointsToWin || 21, deuce: !!sc.deuceEnabled};
}
/* One-line description of a scoring rule, e.g. "1 game to 21, win by 2, 30 max". */
function describeScoring(cfg){
  cfg = cfg || DEFAULT_SCORING;
  const games = (cfg.bestOf||3)===1 ? '1 game' : 'Best of '+cfg.bestOf+' games';
  return cfg.deuceEnabled
    ? games+' to '+cfg.pointsToWin+', win by '+(cfg.winBy||2)+', '+(cfg.capPoints||30)+' max'
    : games+', first to '+cfg.pointsToWin+' points (no deuce)';
}
