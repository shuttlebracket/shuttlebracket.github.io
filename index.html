        ${matchStatusPill(m)}
      </div></td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`}
  `;
}


/* ---------- PLAYER-ROLE TABS (within a tournament) ---------- */
function renderRegisterTab(t){
  const me = myPlayer();
  if(!me) return `<div class="empty-tab">Pick a player profile from the role switcher (top right) to register.</div>`;
  const ri = registrationInfo(t);
  const evs = tEvents(t.id).filter(e=> !['completed','cancelled'].includes(e.status));
  const myRegs = state.registrations.filter(r=>(r.playerId===me.id || r.partnerId===me.id) && r.tournamentId===t.id);
  const banner = ri.open
    ? `<div class="reg-banner open">${ICONS.check}<span>Registration is open${ri.deadline?` until <b>${esc(fmtDeadline(ri.deadline))}</b>`:''}.</span></div>`
    : ri.reason==='deadline'
      ? `<div class="reg-banner closed">${ICONS.warn}<span>Registration closed on <b>${esc(fmtDeadline(ri.deadline))}</b>. Only the organiser can add late entries or withdrawals now.</span></div>`
      : `<div class="reg-banner closed">${ICONS.warn}<span>Registration isn't open for this tournament.</span></div>`;
  return `
    ${banner}
    <div class="helptext" style="margin-bottom:10px">Registering as <strong>${esc(me.name)}</strong>.</div>
    ${evs.map(ev=>{
      const reg = myRegs.find(r=>r.eventId===ev.id && r.status!=='withdrawn' && r.status!=='rejected');
      const doubles = isDoublesType(ev.type);
      if(reg){
        const partnerId = reg.playerId===me.id ? reg.partnerId : reg.playerId;
        return `<div class="list-row"><span class="grow main-txt">${esc(ev.name)}${partnerId?` <span class="sub-txt">with ${esc((playerById(partnerId)||{}).name||'')}</span>`:''}</span>${regStatusPill(reg.status)}
          ${ri.open && reg.playerId===me.id?`<button class="btn btn-sm btn-danger" data-withdraw-reg="${reg.id}">Withdraw</button>`:''}</div>`;
      }
      if(!ri.open) return `<div class="list-row"><span class="grow main-txt">${esc(ev.name)} <span class="sub-txt">${esc(ev.type.replace(/_/g,' '))}</span></span><span class="pill">Closed</span></div>`;
      const myG = normGender(me.gender);

/* "My games": one player's day at a glance - live now, next up, results and standings. */
function renderFollowTab(t){
  const p = followedPlayer();
  if(!p) return `<div class="empty-tab">Choose a player above to follow their matches.</div>`;
  const ms = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && matchHasPlayer(m, p.id));
  const side = m => entryPlayerIds(entryById(m.entry1Id)).includes(p.id) ? 1 : 2;
  const decided = ms.filter(m=>['completed','walkover','retired'].includes(m.status));
  const live = ms.filter(m=>m.status==='in_progress');
  const upcoming = ms.filter(m=>!['completed','walkover','retired','in_progress','bye','cancelled'].includes(m.status))
    .sort((a,b)=>(a.scheduledStart||'9999').localeCompare(b.scheduledStart||'9999'));
  const won = decided.filter(m=>m.winnerEntryId === (side(m)===1?m.entry1Id:m.entry2Id));
  let pf=0, pa=0;
  decided.concat(live).forEach(m=>(m.games||[]).forEach(g=>{ const mine = side(m)===1?g.a:g.b, theirs = side(m)===1?g.b:g.a; pf+=mine|0; pa+=theirs|0; }));
  const club = clubById(p.clubId);
  const opp = m => entryName(entryById(side(m)===1?m.entry2Id:m.entry1Id));
  const partner = m => { const e = entryById(side(m)===1?m.entry1Id:m.entry2Id); const other = entryPlayerIds(e).find(x=>x!==p.id); return other ? playerName(other) : ''; };
  const where = m => [m.scheduledStart?fmtDateTime(m.scheduledStart):'', (courtById(m.courtId)||{}).name||''].filter(Boolean).join(' · ');
  const row = (m, kind)=>{
    const s = side(m), score = (m.games||[]).map(g=>(s===1?g.a:g.b)+'-'+(s===1?g.b:g.a)).join(', ');
    const w = kind==='done' && m.winnerEntryId === (s===1?m.entry1Id:m.entry2Id);
    return `<div class="list-row fm-row ${kind==='live'?'live':''}" data-open-match="${m.id}">
      ${kind==='done' ? `<span class="wl ${w?'w':'l'}">${w?'W':'L'}</span>` : kind==='live' ? `<span class="wl live">${ICONS.bolt}</span>` : `<span class="wl next">${ICONS.calendar}</span>`}
      <span class="grow"><span class="main-txt">vs ${esc(opp(m))}</span>
        <div class="sub-txt">${esc((eventById(m.eventId)||{}).name||'')}${partner(m)?' · with '+esc(partner(m)):''}${where(m)?' · '+esc(where(m)):''}</div></span>
      ${score?`<span class="mono fm-score">${score.split(', ').map(g=>`<span>${esc(g)}</span>`).join(' ')}</span>`:''}
    </div>`;
  };
  // standing in each event the player is in (individual entry for Americano)
  const standings = tEvents(t.id).map(ev=>{
    const en = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam).find(e=>entryPlayerIds(e).includes(p.id));
    if(!en || !eventDraw(ev.id)) return null;
    const pl = Object.assign({}, (computeEventPlacements(ev.id)||{})[en.id] || {});
    const stillToPlay = ms.some(m=>m.eventId===ev.id && !['completed','walkover','retired','bye','cancelled'].includes(m.status));
    if(!pl.label || (pl.label==='Did not play' && stillToPlay)) pl.label = stillToPlay ? 'Upcoming' : (pl.label||'In progress');
    const rp = eventRankPoints(ev.id)[p.id] || 0;
    return `<div class="list-row"><span class="grow main-txt">${esc(ev.name)}</span><span class="pill ${pl.label==='Champion'?'gold':'court'}">${esc(pl.label||'In progress')}</span>${rp?`<span class="mono sub-txt">${rp} pts</span>`:''}</div>`;
  }).filter(Boolean);
  return `
    <div class="follow-hero">
      <div class="fh-name">${esc(p.name)}</div>
      <div class="fh-sub">${esc((club||{}).name||'')}</div>
      <div class="fh-stats">
        <div><b>${decided.length}</b><span>Played</span></div>
        <div><b>${won.length}-${decided.length-won.length}</b><span>Won-lost</span></div>
        <div><b>${pf}-${pa}</b><span>Points</span></div>
        <div><b>${upcoming.length}</b><span>To play</span></div>
      </div>
    </div>
    ${live.length ? `<div class="section-h"><h3>Playing now</h3></div>${live.map(m=>row(m,'live')).join('')}` : ''}
    <div class="section-h"><h3>Next up</h3></div>
    ${upcoming.length ? upcoming.map(m=>row(m,'next')).join('') : `<div class="empty-tab">No more matches scheduled.</div>`}
    <div class="section-h"><h3>Results</h3></div>
    ${decided.length ? decided.slice().sort((a,b)=>(b.actualEnd||b.updatedAt||'').localeCompare(a.actualEnd||a.updatedAt||'')).map(m=>row(m,'done')).join('') : `<div class="empty-tab">No results yet.</div>`}
    ${standings.length ? `<div class="section-h"><h3>Standing</h3></div>${standings.join('')}` : ''}
  `;
}
/* ---------- LIVE LINK (viewer) ---------- */
const VM_DONE = ['completed','walkover','retired'];
function viewerMatchLists(t){
  const empty = {live:[], upcoming:[], completed:[]};
  if(!t) return empty;
  const fp = followedPlayer(), evF = (state.filters.vw||{}).eventId;
  const ms = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && m.status!=='bye' && m.status!=='cancelled'
    && (!evF || m.eventId===evF) && (!fp || matchHasPlayer(m, fp.id)));
  const time = m=> m.actualEnd || m.updatedAt || m.scheduledStart || '';
  return {
    live: ms.filter(m=>m.status==='in_progress'),
    upcoming: ms.filter(m=>!VM_DONE.includes(m.status) && m.status!=='in_progress')
      .sort((a,b)=>(a.scheduledStart||'9999').localeCompare(b.scheduledStart||'9999') || a.round-b.round || a.position-b.position),
    completed: ms.filter(m=>VM_DONE.includes(m.status)).sort((a,b)=>time(b).localeCompare(time(a)))
  };
}
function viewerDefaultTab(t){
  if(VIEWER && VIEWER.reg && registrationInfo(t).open) return 'signup';
  const l = viewerMatchLists(t);
  return (l.live.length || l.upcoming.length) ? 'live' : 'completed';
}
/* Sponsors are typed as one text: split on commas or new lines. */
function sponsorList(t){
  return String((t&&t.sponsors)||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
}
/* Running sponsor text under the tabs on the live link. The track holds the
   list twice and slides by half its width, so the loop is seamless. The phase
   comes from the clock, so re-rendering (live updates) doesn't restart it. */
function renderSponsorTicker(t){
  const list = sponsorList(t);
  if(!list.length) return '';
  const run = list.map(x=>`<span>${esc(x)}</span>`).join('<i aria-hidden="true">&bull;</i>') + '<i aria-hidden="true">&bull;</i>';
  const dur = Math.max(12, Math.round(list.join('   ').length * 0.35));
  const delay = -((Date.now()/1000) % dur);
  return `<div class="sponsor-ticker" role="region" aria-label="Sponsors"><span class="st-label">Sponsors</span>
    <div class="st-viewport"><div class="st-track" style="--st-dur:${dur}s;animation-delay:${delay.toFixed(2)}s"><div class="st-run">${run}</div><div class="st-run" aria-hidden="true">${run}</div></div></div></div>`;
}
function viewerEventFilter(t){
  const evs = tEvents(t.id).filter(e=>eventDraw(e.id));
  if(evs.length<2) return '';

/* A two-line scoreboard row: event and round on top, one line per side with game scores. */

function renderViewerUpcoming(t){

function renderViewerStandings(t){
  const f = state.filters.vw = state.filters.vw||{};
  const evs = tEvents(t.id).filter(e=>eventDraw(e.id) && (!f.eventId || e.id===f.eventId));
  if(!evs.length) return viewerEventFilter(t) + `<div class="empty-tab">Standings appear once the draw is out.</div>`;
  const fp = followedPlayer();
  const body = evs.map(ev=>{
    const draw = eventDraw(ev.id), matches = eventMatches(ev.id);
    const st = ev.status==='completed' || (matches.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status)) && matches.some(m=>VM_DONE.includes(m.status))) ? 'Final' : matches.some(m=>VM_DONE.includes(m.status)) ? 'In progress' : 'Not started';
    const champ = eventChampions(ev.id);
    let inner = champ.length ? `<div class="champ-banner">${ICONS.trophy}<span><small>Champion</small>${esc(champ.join(' & '))}</span></div>` : '';
    if(draw.format==='americano'){
      const ind = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
      const standing = computeAmericanoStandings(ind, matches);
      const fin = americanoFinalMatch(ev.id);
      inner = (fin ? `<div class="vm-sub">Final</div>${renderViewerMatch(fin)}<div class="vm-sub">Table</div>` : '') +
        (ev.americanoVariant==='mixed'
          ? `<div class="vm-sub">Men</div>${renderAmericanoStandingsTable(standing.filter(r=>normGender((playerById(r.playerId)||{}).gender)==='male'))}<div class="vm-sub">Women</div>${renderAmericanoStandingsTable(standing.filter(r=>normGender((playerById(r.playerId)||{}).gender)==='female'))}`
          : renderAmericanoStandingsTable(standing)) + americanoRankingNote(ev);
    } else if(draw.format==='round_robin'){
      inner = renderStandingsTable(computeGroupStandings(eventEntries(ev.id).map(e=>e.id), matches, draw.tiebreak));
    } else {
      if(draw.format==='group_knockout') inner = (draw.groups||[]).map(g=>`<div class="vm-sub">${esc(g.name)}</div>${renderStandingsTable(computeGroupStandings(g.entryIds, matches.filter(m=>m.groupId===g.id), draw.tiebreak))}`).join('');
      const ko = matches.some(m=>m.bracket && m.bracket!=='GRP');
      if(ko){
        const pl = computeEventPlacements(ev.id);
        const rows = eventEntries(ev.id).map(e=>({e, ...(pl[e.id]||{points:0,label:''})})).filter(r=>r.label && r.label!=='Group stage')
          .sort((a,b)=>(b.points-a.points) || entryName(a.e).localeCompare(entryName(b.e)));
        inner += (draw.format==='group_knockout' ? `<div class="vm-sub">Knockout</div>` : '') + `<div class="vm-ko">${rows.map(r=>`<div class="vm-ko-row ${fp && entryPlayerIds(r.e).includes(fp.id)?'me':''}"><span class="vm-nm">${esc(entryName(r.e))}</span><span class="pill ${r.label==='Champion'?'gold':/still in/.test(r.label)?'court':''}">${esc(r.label.replace(' (still in)',' · still in'))}</span></div>`).join('')}</div>`;
      }
    }
    return `<div class="vm-card"><div class="vm-card-h"><h3>${esc(ev.name)}</h3><span class="pill ${st==='Final'?'gold':st==='In progress'?'court':''}">${st}</span></div>${inner}</div>`;
  }).join('');
  return (f.eventId ? '' : renderChampionsCard(t)) + viewerEventFilter(t) + body;
}

function isPhone(){ try{ return window.matchMedia('(max-width:700px)').matches; }catch(e){ return false; } }
function moreMenuBtn(label, always){
  return `<button type="button" class="btn btn-sm m-more-btn ${always?'always':'mobile-only'}" data-more-menu="1" aria-label="${esc(label||'More actions')}" title="${esc(label||'More actions')}">${ICONS.more}</button>`;

function openMoreSheet(trigger){
  const scope = trigger.closest('[data-more-scope]') || trigger.parentElement;
  const items = [...scope.querySelectorAll('.m-overflow, .m-menu-only')].filter(b=>b.tagName==='BUTTON' || b.tagName==='A');

/* A page inside the artifact viewer's sandboxed frame cannot rely on the
   browser's native confirm()/alert()/prompt() — some hosts block them
   outright (the call throws or silently no-ops), which would make every
   "Delete" button look like it does nothing. This is a real in-page dialog
   instead, so it always shows and always resolves. */
function confirmDialog(message, opts){
  opts = opts||{};
  // In the iOS app: a native alert (NativeConfirm.swift); the page's pop-up if that fails.
  if(Native.has('sbConfirm')){
    return window.webkit.messageHandlers.sbConfirm.postMessage({title: opts.title || 'Are you sure?', message: String(message||''), okLabel: opts.okLabel || 'Delete', danger: opts.danger!==false})
      .then(v=>v===true, ()=>confirmDialogPage(message, opts));
  }
  return confirmDialogPage(message, opts);
}
function confirmDialogPage(message, opts){
  const dlg = document.getElementById('dlgConfirm');
  document.getElementById('confirmTitle').textContent = opts.title || 'Are you sure?';
  document.getElementById('confirmMsg').textContent = message;
  const okBtn = document.getElementById('confirmOk');
  okBtn.textContent = opts.okLabel || 'Delete';
  okBtn.className = 'btn ' + (opts.danger===false ? 'btn-primary' : 'btn-danger');
  return new Promise(resolve=>{
    let done=false;
    function finish(v){ if(done) return; done=true; dlg.removeEventListener('cancel', onCancel); if(dlg.open) dlg.close(); resolve(v); }
    function onCancel(e){ e.preventDefault(); finish(false); }
    okBtn.onclick = ()=>finish(true);
    document.getElementById('confirmCancel').onclick = ()=>finish(false);
    dlg.addEventListener('cancel', onCancel);
    if(!dlg.open) dlg.showModal();
  });
}
function stdFoot(saveId, saveLabel){
  return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="${saveId}">${saveLabel||'Save'}</button>`;
}

/* Americano games follow badminton scoring by default: one game to 21, a side
   must win by 2, and 30 is the hard stop (30-29 wins). Shorter games use the
   usual caps (11 -> 15, 15 -> 21). "No deuce" is a straight race to the target. */
const AMERICANO_POINT_PRESETS = [21, 15, 11];
const AMERICANO_CAPS = {11:15, 15:21, 21:30};
function americanoCap(points){ return AMERICANO_CAPS[points] || (points + 9); }
/* Padel Americanos usually play a fixed number of points instead ("21 points"):
   the match ends when they've all been played, so 12-9 is a result. Odd totals
   only, so there is always a winner. */
const AMERICANO_TOTAL_PRESETS = [21, 25, 31, 15];
function americanoScoringFromPoints(points, deuce, total){
  points = points || 21;
  if(total) return { bestOf:1, pointsToWin:points, totalPoints:points, winBy:1, capPoints:points, deuceEnabled:false, amRule:2 };
  // amRule:2 marks rules saved with the deuce option (events from before it are upgraded, see scoringFor).
  if(deuce===false) return { bestOf:1, pointsToWin:points, winBy:1, capPoints:points, deuceEnabled:false, amRule:2 };
  return { bestOf:1, pointsToWin:points, winBy:2, capPoints:americanoCap(points), deuceEnabled:true, amRule:2 };
}
const AMERICANO_DEFAULT_SCORING = americanoScoringFromPoints(21, true);
/* Reads an Americano event's rules back into the dialog's two controls. */
function americanoPointsFromScoring(sc){
  if(!sc) return {points:21, deuce:true, total:false};
  if(sc.amRule!==2) return {points: sc.pointsToWin || 21, deuce:true, total:false};   // older event: now deuce
  return {points: sc.pointsToWin || 21, deuce: !!sc.deuceEnabled, total: !!sc.totalPoints};
}
/* One-line description of a scoring rule, e.g. "1 game to 21, win by 2, 30 max". */
function describeScoring(cfg){
  cfg = cfg || DEFAULT_SCORING;
  if(isSetScoring(cfg)){
    const n = cfg.bestOf||3, G = cfg.gamesPerSet||6;
    const sets = n===1 ? (G===8 ? 'Pro set to 8' : '1 set to '+G) : 'Best of '+n+' sets'+(G!==6 ? ' to '+G : '');
    const fin = n>1 && cfg.finalSet==='super' ? ', match tiebreak to '+(cfg.superTo||10)+' for the deciding set'
      : n>1 && cfg.finalSet==='advantage' ? ', deciding set without tiebreak' : '';
    return sets+', tiebreak at '+G+'-'+G+fin+(cfg.deuce==='golden' ? ', golden point' : '');
  }
  if(cfg.totalPoints) return '1 game, '+cfg.totalPoints+' points played';
  const games = (cfg.bestOf||3)===1 ? '1 game' : 'Best of '+cfg.bestOf+' games';
  return cfg.deuceEnabled
    ? games+' to '+cfg.pointsToWin+', win by '+(cfg.winBy||2)+', '+(cfg.capPoints||30)+' max'
    : games+', first to '+cfg.pointsToWin+' points (no deuce)';
}

function rerenderPreservingFocus(el){
  const key = el.getAttribute('data-filter') || el.id;
  const isText = el.tagName!=='SELECT' && !['checkbox','date','number','time'].includes(el.type);
  const selStart = el.selectionStart, selEnd = el.selectionEnd;
  // Only typing fields get focus back. Focusing a <select> again after the redraw
  // makes iPhone open its picker a second time, so let dropdowns go.
  if(!isText || el.readOnly){ try{ el.blur(); }catch(e){} render(); return; }
  render();
  if(key){
    const again = document.querySelector(`[data-filter="${key}"]`) || (el.id?document.getElementById(el.id):null);
    if(again){
      again.focus();
      if(isText && again.setSelectionRange && selStart!=null){ try{ again.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function handleFilterInput(el){
  const raw = el.getAttribute('data-filter'); if(!raw) return;
  const [key, field] = raw.split('.');
  state.filters[key] = state.filters[key]||{};
  let val = el.type==='checkbox' ? el.checked : el.value;
  state.filters[key][field] = (val===''||val==null) ? null : val;
  if(raw==='matches.eventId' && state.filters[key][field]) state.filters.drawEventId = state.filters[key][field];   // Settings -> Draws follows
  rerenderPreservingFocus(el);
}

      const btn = document.getElementById('btnTestShare'); if(btn) btn.disabled = true;

      if(nurl!==rawUrl){ const el=document.getElementById('setShareUrl'); if(el) el.value = nurl; }
      try{

  ];
  // Walk up from the actual click target level by level (not attr-by-attr across the
  // whole ancestor chain) so a nested control (e.g. a delete button inside a card that
  // itself opens on click) always wins over the outer card's own handler.
  let node = e.target;

document.addEventListener('change', async (e)=>{
  const t = currentTournament();
  const target = e.target;

  if(target.id==='themeToggleNoop') return;
  if(target.closest && target.closest('#themeToggle')){
    const btn = target.closest('button[data-theme]'); if(!btn) return;
    try{ localStorage.setItem('sb-theme', btn.getAttribute('data-theme')); }catch(err){}
    applyStoredTheme(); return;
  }
  if(target.matches('[data-filter]')){ handleFilterInput(target); return; }
  if(target.id==='globalSearch'){ state.search=target.value; state.searchOpen=true; rerenderPreservingFocus(target); return; }
  if(target.id==='selViewingPlayer'){ setViewingPlayer(target.value||null); return; }
  if(target.id==='setTStatus'){ try{ target.blur(); }catch(err){} await setTournamentStatus(t, target.value); render(); return; }
  if(target.id==='viewerFollow'){ setFollow(target.value||null); return; }
  if(target.matches('[data-reg-status], [data-seed-input], #fDrawFormat, #fThirdPlace, #fGroupSize, #fKoSize, #fPlateSize')){
    const regL = target.matches('[data-reg-status]') && state.registrations.find(r=>r.id===target.getAttribute('data-reg-status'));
    const entL = target.matches('[data-seed-input]') && entryById(target.getAttribute('data-seed-input'));
    const evL = eventById((regL&&regL.eventId) || (entL&&entL.eventId) || target.getAttribute('data-event-id') || state.eventId);
    const msg = evL && lockReason(tournamentById(evL.tournamentId), evL);
    if(msg){ toast(msg, true); render(); return; }
  }
  if(target.matches('[data-reg-status]')){
    const reg = state.registrations.find(r=>r.id===target.getAttribute('data-reg-status'));
    if(reg) await setRegistrationStatus(reg, target.value);
    render(); return;
  }
  if(target.matches('[data-seed-input]')){
    const entryId = target.getAttribute('data-seed-input');
    const seed = validSeed(target.value.trim());
    const en = entryById(entryId);
    const clash = seed!=null && en && eventEntries(en.eventId).find(x=>x.id!==entryId && validSeed(x.seed)===seed);
    await act(async ()=> Store.update('entries', entryId, {seed}));
    if(clash) toast('Seed '+seed+' is also given to '+entryName(clash)+' - give each seed to one entry.', true);
    if(target.value.trim() && seed==null) target.value = '';
    return;
  }
  if(target.id==='fKoSize' || target.id==='fPlateSize' || target.id==='fGroupSize'){
    const ev = eventById(target.getAttribute('data-event-id') || state.eventId);
    if(ev && target.id!=='fGroupSize') await updateEvent(ev.id, {[target.id==='fKoSize'?'koSize':'plateSize']: parseInt(target.value,10)||0});
    const e2 = ev && eventById(ev.id), wrap = document.getElementById('fKoWrap');
    if(e2 && wrap){ const n = eventEntries(e2.id).filter(x=>!x.isAmericanoTeam).length || state.registrations.filter(r=>r.eventId===e2.id && r.status==='confirmed').length;
      wrap.innerHTML = koFieldsHtml(e2, n, parseInt((document.getElementById('fGroupSize')||{}).value,10)||4); }
    return;
  }
  if(target.id==='fDrawFormat' && PRO_FORMATS.includes(target.value) && !Pro.has()){
    const ev = eventById(target.getAttribute('data-event-id') || state.eventId);
    target.value = ev && !PRO_FORMATS.includes(ev.drawFormat) ? ev.drawFormat : 'single_elimination';
    openPaywall('formats'); return;
  }
  if(target.id==='fDrawFormat'){
    const wrap = document.getElementById('fGroupSizeWrap');
    if(wrap) wrap.hidden = target.value!=='group_knockout';
    const kw = document.getElementById('fKoWrap'); if(kw) kw.hidden = target.value!=='group_knockout';
    const tp = document.getElementById('fThirdPlaceWrap');
    if(tp) tp.hidden = !['single_elimination','group_knockout'].includes(target.value);
    const eventId = target.getAttribute('data-event-id');
    if(eventId) await updateEvent(eventId, {drawFormat: target.value});
    return;
  }
  if(target.id==='qpVariant'){ qpDraft().variant = target.value; render(); return; }
  if(target.id==='qpPoints'){ qpDraft().points = parseInt(target.value,10)||21; return; }
  if(target.id==='fReportTournament'){ state.tid = target.value||null; render(); return; }
  if(target.id==='fDrawEventSelect'){ state.filters.drawEventId = target.value; render(); return; }
  if(target.id==='fTPlayerAddEvent' || target.id==='fTPlayerAddPlayer'){
    syncMixedPartnerOptions(eventById(document.getElementById('fTPlayerAddEvent').value), genderOfPlayerId(document.getElementById('fTPlayerAddPlayer').value), document.getElementById('fTPlayerAddPartner'));
    return;
  }
  if(target.matches('[data-admin-player-select]')){
    const evId = target.getAttribute('data-admin-player-select');
    syncMixedPartnerOptions(eventById(evId), genderOfPlayerId(target.value), document.querySelector('[data-admin-partner-select="'+evId+'"]'));
    return;
  }
});

function postRenderHooks(){
  // The current screen's buttons (New tournament, Add player, Share, ⋯) sit in the top bar next to the logo.
  const slot = document.getElementById('topbarActions');
  const acts = !VIEWER && document.querySelector('.main .t-header .t-actions');
  if(slot && acts){ slot.appendChild(acts); }
  document.querySelectorAll('details[data-guide]').forEach(d=>d.addEventListener('toggle', ()=>{ state.guideOpen = state.guideOpen||{}; state.guideOpen[d.getAttribute('data-guide')] = d.open; }));
  const addForm = document.getElementById('tAddPlayerForm');
  if(addForm) addForm.addEventListener('toggle', ()=>{ state.tAddOpen = addForm.open; });
  // Keep the active tab visible in the sideways-scrolling tab strip (phones).
  const strip = document.querySelector('.tabs'), act = strip && strip.querySelector('.tab.active');
  if(strip && act && strip.scrollWidth > strip.clientWidth){
    const want = act.offsetLeft - (strip.clientWidth - act.offsetWidth)/2;
    strip.scrollLeft = Math.max(0, want);
  }
  if((state.view==='tdetail' && state.tab==='draws') || ['draws','results'].includes(state.view)){
    requestAnimationFrame(drawAllBracketConnectors);
  }
  const fp = followedPlayer();
  if(fp && state.tab==='draws'){
    document.querySelectorAll('#tabBody [data-match-id], #tabBody [data-open-match]').forEach(el=>{
      const m = matchById(el.getAttribute('data-match-id') || el.getAttribute('data-open-match'));
      if(m && matchHasPlayer(m, fp.id)) el.classList.add('me-match');
    });
  }
}
function applyStoredTheme(){
  let pref='auto';
  try{ pref = localStorage.getItem('sb-theme') || 'auto'; }catch(e){}
  const root = document.documentElement;
  if(pref==='light') root.setAttribute('data-theme','light');
  else if(pref==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  document.querySelectorAll('button[data-theme]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-theme')===pref);
  });
}

/* While typing, the bottom tab bar steps aside (body.kb-open). Only fields that
   bring up the keyboard count: a select opens a menu. The class is checked
   again after every redraw, because a field removed by the redraw (e.g. a
   filter that redraws the page when changed) never reports losing focus. */
const KB_FIELD_SEL = 'textarea, input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=range]):not([type=file]):not([type=color])';
function syncKbOpen(){
  const a = document.activeElement;
  if(!(a && a.isConnected && a.matches && a.matches(KB_FIELD_SEL))) document.body.classList.remove('kb-open');
}
document.addEventListener('focusin', e=>{ if(e.target.matches && e.target.matches(KB_FIELD_SEL)) document.body.classList.add('kb-open'); });
/* Pop-ups animate in once when opened (class anim-in), not again when the
   keyboard comes and goes and the sheet changes position. */
(function(){
  const proto = window.HTMLDialogElement && HTMLDialogElement.prototype;
  if(!proto || !proto.showModal) return;
  const showModal = proto.showModal;
  proto.showModal = function(){ this.classList.add('anim-in'); return showModal.apply(this, arguments); };
  const done = e=>{ if(e.target instanceof HTMLDialogElement) e.target.classList.remove('anim-in'); };
  document.addEventListener('animationend', done, true);
  document.addEventListener('animationcancel', done, true);   // e.g. the keyboard opened mid-animation
})();
/* On a phone, pop-ups behave like iOS sheets: drag the top (or the action
   sheet's grabber) down and the sheet follows; let go past a quarter of its
   height, or with a flick, and it closes, else it springs back. A form with a
   Save button that has been typed in asks "Discard changes?" first. Cancel /
   Close in the footer are marked (sb-dup-close) and hidden there, as the ✕
   does the same. */
(function sheetDrag(){
  const phone = window.matchMedia('(max-width:700px)');
  const gen = document.getElementById('dlgGeneric'), foot = document.getElementById('genericFoot'), body = document.getElementById('genericBody');
  if(!gen || !foot || !body) return;
  const markFoot = ()=>foot.querySelectorAll('button').forEach(b=>b.classList.toggle('sb-dup-close', b.hasAttribute('data-close') && /^(cancel|close)$/i.test(b.textContent.trim())));
  new MutationObserver(markFoot).observe(foot, {childList:true, subtree:true, characterData:true});
  let dirty = false;
  new MutationObserver(()=>{ dirty = false; }).observe(body, {childList:true});   // new content (openDialog)
  gen.addEventListener('input', e=>{ if(e.target.matches && e.target.matches('textarea, input:not([type=checkbox]):not([type=radio]):not([type=range])')) dirty = true; });
  const unsaved = dlg=>dlg===gen && dirty && !!foot.querySelector('.btn-primary:not([data-close])');
  function settle(dlg, closing){
    dlg.classList.remove('dragging');
    dlg.style.setProperty('--drag', closing ? (dlg.offsetHeight + 40) + 'px' : '0px');
    if(closing) setTimeout(()=>{ if(dlg.open) dlg.close(); dlg.style.setProperty('--drag', '0px'); }, 230);
  }
  function drag(dlg, handleSel){
    let start = null;
    dlg.addEventListener('pointerdown', e=>{
      if(!phone.matches || !dlg.open || !e.target.closest(handleSel) || e.target.closest('button, a, input, select, textarea')) return;
      start = {y: e.clientY, t: performance.now(), dy: 0, id: e.pointerId};
      dlg.classList.add('dragging');
      try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
    });
    dlg.addEventListener('pointermove', e=>{
      if(!start || e.pointerId!==start.id) return;
      const dy = e.clientY - start.y;
      start.dy = dy > 0 ? dy : dy / 4;   // a little give upwards
      dlg.style.setProperty('--drag', start.dy + 'px');
    });
    const end = async e=>{
      if(!start || e.pointerId!==start.id) return;
      const {dy, t} = start; start = null;
      const fast = dy > 30 && dy / Math.max(1, performance.now() - t) > 0.6;
      if(!(dy > dlg.offsetHeight * 0.25 || fast)){ settle(dlg, false); return; }
      if(unsaved(dlg)){
        settle(dlg, false);
        if(!await confirmDialog('What you typed in this pop-up hasn’t been saved.', {title:'Discard changes?', okLabel:'Discard'})) return;
      }
      settle(dlg, true);
    };
    dlg.addEventListener('pointerup', end);
    dlg.addEventListener('pointercancel', e=>{ if(start && e.pointerId===start.id){ start = null; settle(dlg, false); } });
  }
  drag(gen, '.dlg-head');
  const sheet = document.getElementById('dlgSheet');
  if(sheet) drag(sheet, '.sheet-grip, .sheet-title');
})();
/* Pop-up forms: Return goes to the next field (the keyboard shows "Next", and
   "Done" on the last one) and never submits the pop-up's form, which would close it. */
document.addEventListener('submit', e=>{ if(e.target && e.target.id==='genericForm') e.preventDefault(); }, true);
const FIELD_SEL = 'input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([disabled]), select:not([disabled]), textarea:not([disabled])';
function dialogFields(dlg){ return [...dlg.querySelectorAll('.dlg-body '+FIELD_SEL)].filter(el=>el.offsetParent!==null); }
function markEnterKeys(dlg){
  const fields = dialogFields(dlg).filter(el=>el.tagName==='INPUT');
  fields.forEach((el,i)=>{ if(!el.hasAttribute('enterkeyhint')) el.setAttribute('enterkeyhint', i===fields.length-1 ? 'done' : 'next'); });
}
/* From iOS 26 the field toolbar (up / down / Done) floats over the page above
   the keyboard instead of being part of it, so the visible area the page is
   told about still includes the strip it covers. The app tells us the iOS
   version (__SB_IOS__); pop-ups then keep clear of that strip too. */
const KB_BAR = (window.__SB_IOS__ || 0) >= 26 ? 60 : 0;
function keyboardHeight(){
  const vv = window.visualViewport; if(!vv) return 0;
  return Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
}
/* Once the keyboard is up, keep the focused field (with its label) in view inside the pop-up. */
function keepFieldInView(el){
  const body = el && el.closest && el.closest('#dlgGeneric .dlg-body');
  if(!body || document.activeElement!==el) return;
  const box = (el.closest('.field') || el).getBoundingClientRect(), input = el.getBoundingClientRect(), b = body.getBoundingClientRect();
  const vv = window.visualViewport, kb = keyboardHeight();
  const visTop = Math.max(b.top, vv ? vv.offsetTop : 0);
  // The body ends above the buttons; the keyboard (and its toolbar) may reach higher still.
  const visBottom = Math.min(b.bottom, (vv ? vv.offsetTop + vv.height : innerHeight) - (kb>100 ? KB_BAR : 0)) - 10;
  // The whole field (label too) when it fits, else at least the box being typed in.
  const bottom = box.bottom - box.top <= visBottom - visTop ? box.bottom : input.bottom;
  if(bottom > visBottom) body.scrollTop += Math.min(bottom - visBottom, Math.max(input.top - visTop, 0));   // only when it's hidden
  else if(input.top < visTop) body.scrollTop -= visTop - Math.min(box.top, input.top) + 8;
}
/* Checked again as the keyboard comes up and the sheet slides with it, and once
   more after iOS's own scrolling to the field, which knows nothing of the buttons. */
function keepFieldInViewSoon(el){ [80, 320, 650].forEach(ms=>setTimeout(()=>keepFieldInView(el), ms)); }
document.addEventListener('focusin', e=>{
  const el = e.target;
  if(!(el && el.closest && el.closest('#dlgGeneric .dlg-body') && el.matches('input,select,textarea'))) return;
  keepFieldInViewSoon(el);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.isComposing && e.target && e.target.id==='qpName'){ e.preventDefault(); qpAddName(); }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.isComposing) return;
  const el = e.target, dlg = el && el.closest && el.closest('dialog');
  if(!dlg || el.tagName!=='INPUT' || ['checkbox','radio','button','submit'].includes(el.type)) return;
  e.preventDefault();
  if(el.id==='qaName'){ const b = dlg.querySelector('[data-quick-add]'); if(b) b.click(); return; }
  const fields = dialogFields(dlg), i = fields.indexOf(el);
  const next = fields.slice(i+1).find(f=>!f.readOnly || f.hasAttribute('data-datepicker'));
  if(next){ next.focus(); if(next.hasAttribute('data-datepicker')) dpOpen(next); }
  else el.blur();
});
/* The part of the screen the keyboard leaves visible, for pop-ups (see #dlgGeneric in the CSS). */
(function(){
  const vv = window.visualViewport; if(!vv) return;
  let settle = null;
  const set = ()=>{
    const r = document.documentElement.style;
    // How far the keyboard (and the floating field toolbar above it) pushes up the bottom of what's visible.
    const kb = keyboardHeight(), bar = kb>100 ? KB_BAR : 0;
    r.setProperty('--vv-h', (vv.height - bar)+'px'); r.setProperty('--vv-top', vv.offsetTop+'px');
    r.setProperty('--kb', (kb ? kb + bar : 0)+'px');
    // The sheet moves with the keyboard: check the field again once it has settled.
    clearTimeout(settle); settle = setTimeout(()=>keepFieldInViewSoon(document.activeElement), 250);
  };
  vv.addEventListener('resize', set); vv.addEventListener('scroll', set); set();
})();
document.addEventListener('focusout', ()=>{ setTimeout(syncKbOpen, 50); });
// Once the sheet has finished sliding up with the keyboard, the field is checked once more.
document.addEventListener('transitionend', e=>{ if(e.target && e.target.id==='dlgGeneric' && /transform|max-height/.test(e.propertyName)) keepFieldInView(document.activeElement); });

/* Public viewer page opened without a live link: explain what it is and let a
   pasted link be opened. No local data, no organiser screens. */
function renderViewerLanding(){
  document.title = 'Shuttle Bracket · Live tournaments';
  app.innerHTML = `<div class="shell viewer-shell"><div class="topbar no-print"><div class="brand"><div class="brand-mark">${ICONS.shuttle}</div>
      <h1 class="brand-name">Shuttle<span class="accent">Bracket</span></h1></div></div>
    <div class="empty-hero" style="margin-top:28px"><span class="kicker">Live tournament viewer</span>
      <h2>Follow a tournament live</h2>
      <p>This page shows live scores, the schedule, results and standings for tournaments shared from the Shuttle Bracket app. Open the live link or scan the QR code the organiser gave you.</p>
      <form id="landingForm" class="row wrap" style="gap:8px;justify-content:center;margin-top:14px">
        <input id="landingLink" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste a live link" aria-label="Live link"
          style="flex:1 1 240px;max-width:420px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit">
        <button class="btn btn-primary" type="submit">Open</button>
      </form>
      <p class="helptext" id="landingMsg" style="margin-top:8px"></p>
    </div><div class="viewer-foot no-print">&copy; ${new Date().getFullYear()} Shuttle Bracket. All rights reserved.<br>${legalLinksHtml()}</div></div>`;
  document.getElementById('landingForm').onsubmit = e=>{
    e.preventDefault();
    const v = document.getElementById('landingLink').value.trim(), i = v.indexOf('#');
    const hash = i>=0 ? v.slice(i) : '';
    if(/[#&]s=/.test(hash)){ location.hash = hash.slice(1); location.reload(); }
    else document.getElementById('landingMsg').textContent = "That doesn't look like a Shuttle Bracket live link. Ask the organiser to share it again.";
  };
}

/* ============================== BOOT ============================== */
const COLLECTIONS = ['tournaments','clubs','players','events','registrations','entries','draws','matches','courts','notifications','auditLog','settings'];
(async function boot(){
  applyStoredTheme();
  if(VIEWER){ ViewerMode.start(); return; }
  if(VIEWER_ONLY){ renderViewerLanding(); window.addEventListener('hashchange', ()=>location.reload()); return; }
  try{
    await Store.init();
    let pending = COLLECTIONS.length;
    COLLECTIONS.forEach(col=>{
      Store.subscribe(col, [], (arr)=>{
        if(col==='tournaments'){ state.quickPlays = arr.filter(x=>x.quickPlay); state.tournaments = arr.filter(x=>!x.quickPlay); }   // quick play games live apart from tournaments
        else state[col] = arr;
        ShareSync.schedule();   // keep live links up to date (no-op when nothing is shared)
        // Startup: render once when every collection has arrived, not once per collection.
        if(pending>0){ pending--; if(pending===0){ state.ready=true; render(); CloudUI.start(); RegInbox.start(); Pro.call('status');
          setTimeout(()=>{ state.tournaments.forEach(t=>{ if(tCourts(t.id).length) syncCourtCount(t.id).catch(()=>{}); }); }, 600);   // older tournaments: court count = courts added
          setTimeout(async ()=>{ try{ const n = await repairFalseByes(); if(n){ toast('Fixed '+n+' knockout match'+(n===1?'':'es')+' that were wrongly shown as byes'); render(); } }catch(e){ console.error('bye repair', e); } }, 300);
        } return; }
        render();
        if(col==='tournaments' || col==='settings') ShareUI.redraw();
      });
    });
    if(!state.ready) render();   // show the loading state while shared data arrives
  }catch(e){
    console.error('Boot failed', e);
    state.ready = true;
    render();
    toast('Could not start data layer - some features may not work.', true);
  }
})();

})();
</script>
