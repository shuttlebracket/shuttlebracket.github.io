        <div class="share-status" id="shareStatus">${statusLine(t)}</div>`;
    }
    return `<div class="field"><label>Live link</label><input id="shareLinkInput" class="share-link" readonly value="${esc(link)}"></div>
      <div class="share-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btnShareCopy">${ICONS.link} Copy link</button>
        <button type="button" class="btn btn-sm" id="btnShareSend">${ICONS.share} Share&hellip;</button>
        <button type="button" class="btn btn-sm" id="btnShareOpen">${ICONS.external} Open</button>
      </div>
      <div class="share-status" id="shareStatus">${statusLine(t)}</div>
      <div class="helptext share-expiry" id="shareExpiry">${expiryLine(t)}</div>
      ${viewerPageStatusHtml()}
      <div class="share-qr">${QR.svg(link, 220)}<div class="helptext">Scan to open. Print it or show it at the venue.</div></div>`;
  }
  function foot(t){
    const cfg = shareConfig();
    if(!cfg.ready) return `<button type="button" class="btn" data-close>Close</button>${state.role==='admin'?`<button type="button" class="btn btn-primary" id="btnShareGoSettings">Open Settings</button>`:''}`;
    if(t.share && t.share.expired) return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="btnShareCreate">${ICONS.link} Create new link</button>`;
    if(!t.share) return `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-primary" id="btnShareCreate">${ICONS.link} Create live link</button>`;
    return `<button type="button" class="btn btn-danger" id="btnShareStop">Stop sharing</button><button type="button" class="btn" id="btnShareSync">${ICONS.refresh} Update now</button><button type="button" class="btn btn-primary" data-close>Done</button>`;
  }
  function open(t){

async function createShareLink(t){
  const share = {id: randomToken(16), key: randomToken(40), createdAt: nowIso()};
  const snap = buildShareSnapshot(t.id);
  const bytes = shareBytes(snap);
  if(bytes > SHARE_MAX_BYTES){ toast(ShareAPI.explain({tooLarge:true, kb:Math.ceil(bytes/1024)}), true); return false; }
  let at;
  try{
    at = await ShareAPI.rpc(shareConfig(), 'sb_publish', {p_id:share.id, p_key:share.key, p_data:snap});
  }catch(e){ toast(ShareAPI.explain(e), true); return false; }
  ShareSync.forget(t.id);
  ShareSync.markPublished(t.id, at, JSON.stringify(snap));
  await updateTournament(t.id, {share});
  await audit(t.id, state.role, 'share_link_created', 'Live share link created.');
  toast('Live link created');
  return true;
}
async function stopSharing(t){
  if(!t.share) return;
  if(!t.share.expired) try{ await ShareAPI.rpc(shareConfig(), 'sb_unpublish', {p_id:t.share.id, p_key:t.share.key}); }
  catch(e){
    if(!await confirmDialog('Couldn\'t remove the online copy ('+ShareAPI.explain(e)+'). Turn sharing off in the app anyway? The old link may keep showing the last update.', {okLabel:'Turn off', title:'Stop sharing?'})) return;
  }
  await updateTournament(t.id, {share:null});
  ShareSync.forget(t.id);
  await audit(t.id, state.role, 'share_link_removed', 'Live share link removed.');
  toast('Sharing stopped');
}
async function copyText(text){
  if(Native.has('sbCopy')){ Native.post('sbCopy', text); return true; }
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function shareLinkNative(t){
  const link = shareLinkFor(t); if(!link) return;
  const title = t.name + ' - live results';
  if(Native.has('sbShareURL')){ Native.post('sbShareURL', {url:link, title}); return; }
  if(navigator.share){ try{ await navigator.share({title, text:title, url:link}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  if(await copyText(link)) toast('Link copied'); else toast('Copy the link from the box above', true);
}

/* ---------- Viewer mode (someone opened a share link) ---------- */
const ViewerMode = (function(){
  let updatedAt=null, pollTimer=null, polling=false;
  const COLS = ['tournaments','clubs','players','events','registrations','entries','draws','matches','courts'];
  function apply(row){
    const d = row.data || {};
    COLS.forEach(c=>{ state[c] = c==='tournaments' ? (d.tournament?[d.tournament]:[]) : (d[c]||[]); });
    state.notifications=[]; state.auditLog=[]; state.settings=[];
    state.tid = d.tournament ? d.tournament.id : null;
    if(state.followPlayerId === undefined){
      let f=null; try{ f = localStorage.getItem('sb-follow-'+VIEWER.id); }catch(e){}
      state.followPlayerId = (f && state.players.some(p=>p.id===f)) ? f : null;
    }
    updatedAt = row.updated_at;
    state.viewerUpdatedAt = updatedAt; state.viewerError = null; state.viewerOffline = false;
    state.ready = true;
    if(d.tournament) document.title = d.tournament.name + ' · Live';
  }
  async function load(){
    const rows = await ShareAPI.rpc(VIEWER, 'sb_get', {p_id:VIEWER.id});
    const row = Array.isArray(rows) ? rows[0] : rows;
    if(!row || !row.data){ state.viewerError='gone'; state.ready=true; render(); return; }
    apply(row); render();
  }
  async function poll(){
    if(polling || document.visibilityState==='hidden') return;
    polling = true;
    try{
      const ts = await ShareAPI.rpc(VIEWER, 'sb_updated_at', {p_id:VIEWER.id});
      if(ts===null){ state.viewerError='gone'; render(); }
      else if(ts!==updatedAt || state.viewerError){ await load(); }
      else if(state.viewerOffline){ state.viewerOffline=false; render(); }
    }catch(e){
      if(!state.viewerOffline){ state.viewerOffline = true; render(); }
    }finally{ polling=false; }
  }
  async function start(){
    state.role='public'; state.view='tdetail'; state.tab='overview'; state.viewingPlayerId=null;
    document.body.classList.add('viewer-mode');
    render();
    try{ await load(); }
    catch(e){ state.ready=true; state.viewerError = e.offline ? 'offline' : 'error'; state.viewerErrorMsg = ShareAPI.explain(e); render(); }
    pollTimer = setInterval(poll, 10000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') poll(); });
    window.addEventListener('online', poll);
  }
  function errorScreen(){
    const e = state.viewerError;
    const title = e==='gone' ? 'This tournament is no longer shared' : e==='offline' ? 'You\'re offline' : 'Couldn\'t load this tournament';
    const msg = e==='gone' ? 'The organiser stopped sharing it, or the link expired (links are removed '+SHARE_KEEP_DAYS+' days after the tournament last changed), or the link is incomplete. Ask the organiser for a new link.'
      : e==='offline' ? 'Check your internet connection. The page will try again by itself.' : (state.viewerErrorMsg||'');
    return `<div class="empty-hero"><span class="kicker">Shuttle Bracket</span><h2>${esc(title)}</h2><p>${esc(msg)}</p>
      ${e!=='gone'?`<div class="hero-actions"><button class="btn btn-primary" id="btnViewerRetry">${ICONS.refresh} Try again</button></div>`:''}</div>`;
  }
  return {start, load, poll, errorScreen};
})();

/* ---------- QR code (byte mode, error correction M) ----------
   Small self-contained encoder following ISO/IEC 18004 so a share link can be
   scanned from a phone at the venue. Returns an SVG string. */
const QR = (function(){
  const ECC_M = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK_M = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const bit = (x,i)=> ((x>>>i)&1)!==0;
  function rawModules(v){
    let r=(16*v+128)*v+64;
    if(v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36; }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v)/8) - ECC_M[v]*BLK_M[v];
  function gmul(x,y){ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; }
  function rsDivisor(deg){
    const r=[]; for(let i=0;i<deg-1;i++) r.push(0); r.push(1);
    let root=1;
    for(let i=0;i<deg;i++){
      for(let j=0;j<r.length;j++){ r[j]=gmul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; }
      root=gmul(root,2);
    }
    return r;
  }
  function rsRemainder(data, div){
    const r=div.map(()=>0);
    for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=gmul(c,f); }); }
    return r;
  }
  function alignPositions(v, size){
    if(v===1) return [];
    const n=Math.floor(v/7)+2;
    const step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2;
    const r=[6];
    for(let pos=size-7; r.length<n; pos-=step) r.splice(1,0,pos);
    return r;
  }
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v=1;
    for(;v<=40;v++){
      const ccBits = v<10?8:16;
      if(4+ccBits+bytes.length*8 <= dataCodewords(v)*8) break;
    }
    if(v>40) throw new Error('Text too long for a QR code');
    const size=v*4+17, cap=dataCodewords(v);
    // --- data bits
    const bits=[]; const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, v<10?8:16); bytes.forEach(b=>put(b,8));
    put(0, Math.min(4, cap*8-bits.length));
    put(0, (8-bits.length%8)%8);
    for(let p=0xEC; bits.length<cap*8; p^=0xEC^0x11) put(p,8);
    const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    // --- error correction + interleave
    const nb=BLK_M[v], eccLen=ECC_M[v], raw=Math.floor(rawModules(v)/8);
    const nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), div=rsDivisor(eccLen);
    const blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const dat=data.slice(k, k+shortLen-eccLen+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat,div);
      if(i<nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const cw=[];
    for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==shortLen-eccLen || j>=nShort) cw.push(b[i]); });
    // --- function patterns
    const mod=[], fn=[];
    for(let y=0;y<size;y++){ mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const setF=(x,y,d)=>{ mod[y][x]=d; fn[y][x]=true; };
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)), x=cx+dx, y=cy+dy; if(x>=0&&x<size&&y>=0&&y<size) setF(x,y,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap=alignPositions(v,size), na=ap.length;
    for(let i=0;i<na;i++) for(let j=0;j<na;j++){
      if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) setF(ap[i]+dx, ap[j]+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1);

      const d=(0<<3)|mask;               // ECC level M = 00

      setF(8,7,bit(b,6)); setF(8,8,bit(b,7)); setF(7,8,bit(b,8));
      for(let i=9;i<15;i++) setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++) setF(size-1-i,8,bit(b,i));
      for(let i=8;i<15;i++) setF(8,size-15+i,bit(b,i));

    };
    drawFormat(0);
    if(v>=7){
      let r=v; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25);
      const b=(v<<12)|r;

    // --- codewords, zig-zag
    let i=0;
    for(let right=size-1; right>=1; right-=2){

      for(let vert=0; vert<size; vert++) for(let j=0;j<2;j++){
        const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if(!fn[y][x] && i<cw.length*8){ mod[y][x]=bit(cw[i>>>3], 7-(i&7)); i++; }

    // --- choose the mask with the lowest penalty
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
      (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!fn[y][x] && maskFn[m](x,y)) mod[y][x]=!mod[y][x]; };
    const penalty=()=>{
      let p=0, dark=0;
      const line=get=>{ let run=1; for(let k=1;k<size;k++){ if(get(k)===get(k-1)){ run++; if(run===5) p+=3; else if(run>5) p++; } else run=1; }
        const s=[]; for(let k=0;k<size;k++) s.push(get(k)?1:0); const str=s.join('');
        let idx=-1; while((idx=str.indexOf('1011101',idx+1))!==-1){
          const before=str.slice(Math.max(0,idx-4),idx), after=str.slice(idx+7,idx+11);
          if((idx<4||before==='0000') || (idx+11>size||after==='0000')) p+=40; } };
      for(let y=0;y<size;y++) line(k=>mod[y][k]);
      for(let x=0;x<size;x++) line(k=>mod[k][x]);
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x]; if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) p+=3; }
      for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(mod[y][x]) dark++;
      const total=size*size; p+=Math.floor(Math.abs(dark*20-total*10)/total)*10;
      return p;
    };
    let best=0, bestP=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){ bestP=p; best=m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return {size, modules:mod};
  }
  function svg(text, px){
    const q=encode(text), n=q.size+8;
    let d='';
    for(let y=0;y<q.size;y++) for(let x=0;x<q.size;x++) if(q.modules[y][x]) d+=`M${x+4} ${y+4}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${n} ${n}" width="${px||200}" height="${px||200}" shape-rendering="crispEdges" role="img" aria-label="QR code for the share link"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {encode, svg};
})();

/* ============================== MATCH GRAPH BUILDERS ============================== */
function baseMatch(f){
  return {
    tournamentId:f.tournamentId, eventId:f.eventId, drawId:f.drawId,
    bracket:f.bracket, round:f.round, position:f.position, groupId:f.groupId||null,
    entry1Id: f.e1?f.e1.id:null, entry2Id: f.e2?f.e2.id:null,
    courtId:null, scheduledStart:null, estDurationMin:30,
    actualStart:null, actualEnd:null,
    status:'pending', games:[], winnerEntryId:null,
    nextMatchId:null, nextMatchSlot:null,
    loserNextMatchId:null, loserNextMatchSlot:null,
    isThirdPlace: !!f.isThirdPlace, grKind: f.grKind||null,
    updatedAt: nowIso()
  };
}
function markSchedulable(list){
  list.forEach(m=>{
    if(m.status==='bye'||m.status==='completed') return;
    m.status = (m.entry1Id && m.entry2Id) ? 'scheduled' : 'pending';
  });
}
function propagateWinnerOnly(m, byId){
  if(m.nextMatchId && byId[m.nextMatchId]){
    const nxt = byId[m.nextMatchId];
    if(m.nextMatchSlot===1) nxt.entry1Id = m.winnerEntryId; else nxt.entry2Id = m.winnerEntryId;
  }
}
/* A slot is still "waiting" while any match that feeds it (winner or loser) is
   undecided. Only a slot that can never be filled makes a real bye. */
const DECIDED_STATUSES = ['completed','walkover','retired','bye','cancelled'];
function slotAwaitsFeeder(m, slot, list){
  if(m['src'+slot] && !m['entry'+slot+'Id']) return true;   // group-stage qualifier not decided yet
  return list.some(f=> f.id!==m.id && !DECIDED_STATUSES.includes(f.status) &&
    ((f.nextMatchId===m.id && f.nextMatchSlot===slot) || (f.loserNextMatchId===m.id && f.loserNextMatchSlot===slot)));
}
function resolveByeCascade(list){
  const byId = Object.fromEntries(list.map(m=>[m.id,m]));
  let changed=true, guard=0;
  while(changed && guard<40){
    changed=false; guard++;
    for(const m of list){
      if(m.status==='bye' || m.status==='completed') continue;
      const has1=!!m.entry1Id, has2=!!m.entry2Id;
      if(has1!==has2 && !slotAwaitsFeeder(m, has1?2:1, list)){
        m.status='bye';
        m.winnerEntryId = has1 ? m.entry1Id : m.entry2Id;
        propagateWinnerOnly(m, byId);
        changed=true;
      } else if(has1 && has2 && m.status==='pending'){
        m.status='scheduled';
        changed=true;
      }
    }
  }
}

function buildSingleElimination(ctx, entries, opts){
  opts = opts||{};
  const plans = DrawGenerator.singleEliminationPlan(entries.length);
  if(!plans.length) return [];
  const list=[]; const byRoundPos={};
  for(const p of plans){
    const e1 = p.entry1Index!=null?entries[p.entry1Index]:null;
    const e2 = p.entry2Index!=null?entries[p.entry2Index]:null;
    const m = baseMatch({...ctx, bracket:'SE', round:p.round, position:p.position, e1, e2});
    m.id = uid();
    if(e1 && e1.src) m.src1 = e1.src;   // placeholder, e.g. {groupId, rank, label:'A1'}
    if(e2 && e2.src) m.src2 = e2.src;
    list.push(m);
    (byRoundPos[p.round]=byRoundPos[p.round]||{})[p.position]=m;
  }
  const maxRound = Math.max(...list.map(m=>m.round));
  for(let r=1;r<maxRound;r++){
    const thisRound=byRoundPos[r], nextRound=byRoundPos[r+1];
    if(!thisRound||!nextRound) continue;
    Object.keys(thisRound).forEach(posStr=>{
      const pos=+posStr, m=thisRound[pos];
      const nextPos=Math.floor(pos/2);
      const next=nextRound[nextPos];
      if(!next) return;
      m.nextMatchId=next.id; m.nextMatchSlot=(pos%2===0)?1:2;
    });
  }
  if(opts.thirdPlace && byRoundPos[maxRound-1]){
    const semis = Object.values(byRoundPos[maxRound-1]).sort((a,b)=>a.position-b.position);
    if(semis.length===2){
      const tp = baseMatch({...ctx, bracket:'SE', round:maxRound, position:99, e1:null, e2:null});
      tp.id = uid(); tp.isThirdPlace = true;
      semis[0].loserNextMatchId=tp.id; semis[0].loserNextMatchSlot=1;
      semis[1].loserNextMatchId=tp.id; semis[1].loserNextMatchSlot=2;
      list.push(tp);
    }
  }
  markSchedulable(list);
  resolveByeCascade(list);
  return list;
}

function buildRoundRobin(ctx, entries){
  const schedule = DrawGenerator.roundRobinSchedule(entries.length);
  const list=[];
  const bracket = ctx.groupId ? 'GRP' : 'RR';
  schedule.forEach((pairs, ri)=>{
    pairs.forEach((pair, pi)=>{
      const m = baseMatch({...ctx, bracket, round:ri+1, position:pi, groupId:ctx.groupId||null, e1:entries[pair[0]], e2:entries[pair[1]]});
      m.id = uid();
      list.push(m);
    });
  });
  markSchedulable(list);
  return list;
}

/* ============ CLASSIC AMERICANO SCHEDULE ============
   Goal: every registered player plays the SAME number of games, and never
   partners the same person twice - ideally partnering every other player
   exactly once.

   Everyone-partners-everyone-once needs n(n-1)/2 partnerships at 2 per game,
   i.e. n(n-1)/4 games, which is a whole number only when n % 4 is 0 or 1:
   - n % 4 == 0 (4, 8, 12...): circle method; each round is a perfect
     matching of partners, n/4 games, nobody sits. n-1 rounds, n-1 games each.
   - n % 4 == 1 (5, 9, 13...): circle method with a phantom seat; one player
     sits each round (each exactly once). n rounds, n-1 games each.
   - n % 4 == 2 or 3 (6, 7, 10, 11...): a perfect schedule is mathematically
     impossible. We build the next best thing: n rounds, 2 (or 3) players sit
     each round, everyone sits exactly 2 (or 3) times, so everyone plays
     n-2 (or n-3) games with that many DIFFERENT partners - never a repeat.
     Found by a randomized search (MRV-ordered backtracking perfect matching
     per round, with restarts); verified 0 failures across thousands of runs
     for 4-40 players, typically < 10 ms.
   Returns rounds as indices into the player list: [{games:[[[a,b],[c,d]]...], sit:[...]}]. */
function americanoShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function americanoPerfectMatching(players, used, cost){
  const left = new Set(players), out = [];
  let nodes = 0;
  function rec(){
    if(left.size===0) return true;
    if(++nodes > 5000) return false;
    let best=null, bestOpts=null;
    for(const p of left){
      const opts=[]; for(const q of left){ if(q!==p && !used[p][q]) opts.push(q); }
      if(!bestOpts || opts.length<bestOpts.length){ best=p; bestOpts=opts; if(!opts.length) return false; }
    }
    americanoShuffle(bestOpts);
    if(cost){ const k={}; bestOpts.forEach(q=>{ k[q]=cost(best,q)+Math.random()*0.5; }); bestOpts.sort((a,b)=>k[a]-k[b]); }
    left.delete(best);
    for(const q of bestOpts){
      left.delete(q); out.push([best,q]);
      if(rec()) return true;
      out.pop(); left.add(q);
    }
    left.add(best);
    return false;
  }
  return rec() ? out : null;
}
/* Pair a round's teams into games, preferring opponents who have met least. */
function americanoPairTeams(teams, oppCount){
  const pool = americanoShuffle(teams.slice()), games = [];
  const met = (t1,t2)=> t1.reduce((s,a)=> s + t2.reduce((x,b)=> x + (oppCount[a][b]||0), 0), 0);
  while(pool.length>1){
    const t = pool.shift();
    let bi = 0, bv = Infinity;
    pool.forEach((u,i)=>{ const v = met(t,u); if(v<bv){ bv=v; bi=i; } });
    const u = pool.splice(bi,1)[0];
    t.forEach(a=>u.forEach(b=>{ oppCount[a][b]=(oppCount[a][b]||0)+1; oppCount[b][a]=(oppCount[b][a]||0)+1; }));
    games.push([t,u]);
  }
  return games;
}
function americanoSchedule(n){
  if(n<4) return null;
  const mod = n%4;
  const oppCount = Array.from({length:n},()=>({}));
  if(mod===0 || mod===1){
    return DrawGenerator.roundRobinSchedule(n).map(pairs=>{
      const inRound = new Set(pairs.flat());
      return {games: americanoPairTeams(pairs, oppCount), sit: [...Array(n).keys()].filter(p=>!inRound.has(p))};
    });
  }
  const s = mod, R = n, sitsPer = s;
  // First choice: breaks rotate through the players in a fixed cycle (round r: the next
  // s players in a shuffled order sit), so everyone's breaks are evenly spaced - never
  // two in a row and no long runs of games. Partners are then matched round by round.
  const rotDeadline = Date.now() + 2000;
  while(Date.now() < rotDeadline){
    const perm = americanoShuffle([...Array(n).keys()]);
    const used = Array.from({length:n},()=>new Uint8Array(n));
    const plan = [];
    for(let r=0;r<R;r++){
      const sit = []; for(let j=0;j<s;j++) sit.push(perm[(r*s+j)%n]);
      const sitSet = new Set(sit);
      let m = null;
      for(let tries=0; tries<40 && !m; tries++) m = americanoPerfectMatching([...Array(n).keys()].filter(p=>!sitSet.has(p)), used);
      if(!m) break;
      m.forEach(([a,b])=>{ used[a][b]=used[b][a]=1; });
      plan.push({sit, pairs:m});
    }
    if(plan.length===R) return plan.map(f=>({games: americanoPairTeams(f.pairs, oppCount), sit: f.sit}));
  }
  const deadline = Date.now() + 4000;
  while(Date.now() < deadline){
    const used = Array.from({length:n},()=>new Uint8Array(n));
    const sitsLeft = new Array(n).fill(sitsPer);
    const plan = [];
    let ok = true;
    let prevSit = new Set();
    for(let r=0;r<R && ok;r++){
      const roundsLeft = R - r;
      let found = null;
      for(let tries=0; tries<30 && !found; tries++){
        // never sit out two rounds in a row: last round's sitters only sit again if they must
        const forced=[], cand=[];
        const strict = Date.now() < deadline - 1500;   // last resort: allow it rather than fail
        for(let p=0;p<n;p++){
          if(!sitsLeft[p]) continue;
          if(!strict){ if(sitsLeft[p]===roundsLeft) forced.push(p); else cand.push(p); continue; }
          // a player with k breaks left needs at least 2k-1 rounds to fit them without two in a row
          const need = prevSit.has(p) ? 2*sitsLeft[p] : 2*sitsLeft[p]-1;
          if(prevSit.has(p)) continue;
          if(need>=roundsLeft) forced.push(p); else cand.push(p);
        }
        if(forced.length > s) break;
        const sit = forced.slice(), pool = cand.slice();
        while(sit.length < s && pool.length){
          const tot = pool.reduce((a,p)=>a+sitsLeft[p],0);
          let x = Math.random()*tot, idx=0;
          for(;idx<pool.length;idx++){ x-=sitsLeft[pool[idx]]; if(x<=0) break; }
          if(idx>=pool.length) idx=pool.length-1;
          sit.push(pool[idx]); pool.splice(idx,1);
        }
        if(sit.length < s) break;
        const sitSet = new Set(sit);
        const m = americanoPerfectMatching([...Array(n).keys()].filter(p=>!sitSet.has(p)), used);
        if(m) found = {sit, pairs:m};
      }
      if(!found){ ok=false; break; }
      found.sit.forEach(p=>sitsLeft[p]--);
      prevSit = new Set(found.sit);
      found.pairs.forEach(([a,b])=>{ used[a][b]=used[b][a]=1; });
      plan.push(found);
    }
    if(ok) return plan.map(f=>({games: americanoPairTeams(f.pairs, oppCount), sit: f.sit}));
  }
  return null;
}
/* ============ FAIR ROUND ORDER ============
   The set of rounds fixes who partners whom and how many games each player
   gets; the ORDER of rounds decides how breaks fall. Order them so nobody sits
   out two rounds in a row (also across the previous round, prevSit) and breaks
   are spread evenly, which keeps runs of back-to-back games as short as the
   player count allows. rounds: [{sit:Set}], players: ids. Returns an index order. */
function americanoFairOrder(rounds, players, prevSit){
  const R = rounds.length;
  const idx = [...Array(R).keys()];
  if(R<2 || !rounds.some(r=>r.sit.size)) return idx;
  prevSit = prevSit || new Set();
  const cost = order=>{
    let c = 0;
    for(const p of players){
      let streak = 0, lastSat = prevSit.has(p);
      for(let i=0;i<R;i++){
        if(rounds[order[i]].sit.has(p)){ if(lastSat) c += 10000; c += streak*streak; streak = 0; lastSat = true; }
        else { streak++; lastSat = false; }
      }
      c += streak*streak;
    }
    return c;
  };
  let best = idx.slice(), bestC = cost(best);
  const deadline = Date.now() + 250;
  for(let restart=0; restart<60 && Date.now()<deadline; restart++){
    let cur = restart ? americanoShuffle(idx.slice()) : idx.slice(), cc = cost(cur), improved = true;
    while(improved && Date.now()<deadline){
      improved = false;
      for(let i=0;i<R;i++) for(let j=i+1;j<R;j++){
        [cur[i],cur[j]] = [cur[j],cur[i]];
        const c2 = cost(cur);
        if(c2 < cc){ cc = c2; improved = true; } else { [cur[i],cur[j]] = [cur[j],cur[i]]; }
      }
    }
    if(cc < bestC){ bestC = cc; best = cur.slice(); }
  }
  return best;
}
/* With fewer courts than matches, a round's matches are played one after the
   other: start each round with the match that shares the fewest players with
   the previous round's last match, so nobody goes straight from one to the next. */
function americanoOrderGamesInRound(games, prevLastPlayers, playersOf){
  if(!prevLastPlayers || games.length<2) return games;
  const overlap = g=> playersOf(g).filter(p=>prevLastPlayers.has(p)).length;
  return games.slice().sort((a,b)=>overlap(a)-overlap(b));
}
/* Human summary of what the schedule guarantees for n players. */
function americanoPlanSummary(n){
  if(n<4) return 'Americano needs at least 4 players.';
  const mod = n%4;
  if(mod<=1) return `${n} players: everyone partners every other player exactly once and plays ${n-1} games` + (mod===1?' (one player sits out each round).':'.');
  const g = n - mod;
  return `${n} players: partnering everyone exactly once is mathematically impossible (needs a player count where n % 4 is 0 or 1, e.g. ${n-mod} or ${n+4-mod}). Everyone still plays exactly ${g} games with ${g} different partners - no repeats - and sits out ${mod} rounds, never two in a row.`;
}
/* Classic Americano draw: individual entries in, ad-hoc two-player "team"
   entries (tagged isAmericanoTeam) minted per round out, since matches
   reference entries. Sitting players are recorded on the draw (sitOut) rather
   than as fake matches. Ranking is by individual points (computeAmericanoStandings). */
function buildAmericano(ctx, entries){
  let plan = americanoSchedule(entries.length);
  if(!plan) throw new Error('Could not build an Americano schedule for ' + entries.length + ' players.');
  const order = americanoFairOrder(plan.map(rd=>({sit:new Set(rd.sit)})), [...Array(entries.length).keys()]);
  plan = order.map(i=>plan[i]);
  let prevLast = null;
  plan = plan.map(rd=>{ const games = americanoOrderGamesInRound(rd.games, prevLast, g=>g.flat()); prevLast = new Set(games[games.length-1].flat()); return {...rd, games}; });
  const teamEntries = [], matches = [], sitOut = {};
  plan.forEach((rd, ri)=>{
    const roundNum = ri+1;
    if(rd.sit.length) sitOut[roundNum] = rd.sit.map(i=>entries[i].player1Id);
    rd.games.forEach(([t1,t2], gi)=>{
      const mk = ([a,b])=>{
        const team = {id: uid(), eventId:ctx.eventId, player1Id:entries[a].player1Id, player2Id:entries[b].player1Id,
          seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
        teamEntries.push(team); return team;
      };
      const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:gi, e1:mk(t1), e2:mk(t2)});
      m.id = uid();
      matches.push(m);
    });
  });
  markSchedulable(matches);
  return {matches, teamEntries, sitOut};
}
/* ============ ADDING MORE AMERICANO ROUNDS ============
   Extends an existing Classic/Mixed Americano draw by `count` rounds while
   keeping it fair:
   - Games stay balanced: each round, the players who have played the MOST
     so far are the ones who sit (ties broken by fewest sit-outs, then at
     random), so games never differ by more than 1 and are equal whenever the
     round count allows (see americanoEqualRoundsStep).
   - Partners repeat as little as possible: each round's partner matching
     only uses pairs that have partnered <= L times, for the smallest L that
     still yields a full matching (L=0 first, i.e. brand-new partners).
   - Classic with everyone level: whole extra cycles reuse the proven
     americanoSchedule (random player order), so each added cycle again
     partners everyone once (for player counts where that's possible).
   - Mixed: teams are always one man + one woman. */
function americanoCycleLength(n, mixed){
  if(mixed) return n;              // n = men (= women); every man meets every woman once
  return n%4===0 ? n-1 : n;
}
/* Smallest round count that keeps everyone's game count equal. */
function americanoEqualRoundsStep(n, mixedMenCount){
  const gcd=(a,b)=> b?gcd(b,a%b):a;
  if(mixedMenCount){ const m=mixedMenCount, playTeams = m - (m%2); return m / gcd(m, playTeams); }
  const playing = n - (n%4);
  return n / gcd(n, playing);
}
function americanoMoreRounds(n, count, hist, genders){
  const games = hist.games.slice(), sits = hist.sits.slice();
  const pc = hist.partner.map(r=>r.slice()), opp = hist.opp.map(o=>({...o}));
  const rounds = [];
  const idxs = [...Array(n).keys()];
  let lastSit = new Set(hist.lastSit||[]);
  const pickSitters = (pool, k)=> americanoShuffle(pool.slice()).sort((a,b)=> (games[b]-games[a]) || ((lastSit.has(a)?1:0)-(lastSit.has(b)?1:0)) || (sits[a]-sits[b])).slice(0,k);
  const commit = (pairs, sit, gamesPaired)=>{
    pairs.forEach(([a,b])=>{ pc[a][b]++; pc[b][a]++; });
    pairs.flat().forEach(p=>games[p]++); sit.forEach(p=>sits[p]++);
    rounds.push({games: gamesPaired || americanoPairTeams(pairs, opp), sit});
    lastSit = new Set(sit);
  };
  let left = count;
  // Whole fresh cycles for Classic when everyone is level.
  if(!genders && n%4<=1){
    const cyc = americanoCycleLength(n, false);
    while(left >= cyc && games.every(g=>g===games[0])){
      const perm = americanoShuffle(idxs.slice());
      let plan = americanoSchedule(n);
      if(!plan) break;
      plan = americanoFairOrder(plan.map(rd=>({sit:new Set(rd.sit.map(i=>perm[i]))})), idxs, lastSit).map(i=>plan[i]);
      plan.forEach(rd=>{
        const mapped = rd.games.map(([t1,t2])=>[t1.map(i=>perm[i]), t2.map(i=>perm[i])]);
        mapped.forEach(([t1,t2])=> t1.forEach(a=>t2.forEach(b=>{ opp[a][b]=(opp[a][b]||0)+1; opp[b][a]=(opp[b][a]||0)+1; })));
        commit(mapped.flat(), rd.sit.map(i=>perm[i]), mapped);
      });
      left -= cyc;
    }
  }
  for(let r=0; r<left; r++){
    let sit;
    if(genders){
      const men = idxs.filter(i=>genders[i]==='male'), women = idxs.filter(i=>genders[i]==='female');
      const t = Math.min(men.length, women.length), playTeams = t - (t%2);
      sit = [...pickSitters(men, men.length-playTeams), ...pickSitters(women, women.length-playTeams)];
    } else {
      sit = pickSitters(idxs, n%4);
    }
    const sitSet = new Set(sit), playing = idxs.filter(p=>!sitSet.has(p));
    let pairs = null;
    const maxPc = Math.max(0, ...pc.map(row=>Math.max(0,...row)));
    const costFn = (p,q)=> pc[p][q];
    for(let L=0; L<=maxPc+1 && !pairs; L++){
      const blocked = idxs.map(p=>{ const row=new Uint8Array(n); for(let q=0;q<n;q++) row[q] = (pc[p][q]>L || (genders && genders[p]===genders[q])) ? 1 : 0; return row; });
      let best = null, bestCost = Infinity;
      for(let tries=0; tries<25; tries++){
        const m = americanoPerfectMatching(playing, blocked, costFn);
        if(!m) continue;
        const c = m.reduce((s,[a,b])=>s+pc[a][b]*pc[a][b], 0);
        if(c<bestCost){ bestCost=c; best=m; if(c===0) break; }
      }
      pairs = best;
    }
    if(!pairs) throw new Error('Could not build extra round ' + (rounds.length+1) + '.');
    commit(pairs, sit);
  }
  return rounds;
}
async function addAmericanoRounds(event, count){
  return act(async ()=>{
    const draw = eventDraw(event.id);
    if(!draw || draw.format!=='americano') throw new Error('Generate the Americano draw first.');
    const variant = event.americanoVariant||'classic';
    if(variant==='mexicano') throw new Error('Mexicano adds rounds one at a time with "Next round".');
    if(americanoFinalMatch(event.id)) throw new Error('Remove the final before adding more rounds.');
    count = Math.max(1, Math.min(60, parseInt(count,10)||1));
    const pids = eventEntries(event.id).filter(e=>!e.isAmericanoTeam).map(e=>e.player1Id);
    const n = pids.length;
    if(n<4) throw new Error('Americano needs at least 4 players.');
    const idx = {}; pids.forEach((p,i)=>{ idx[p]=i; });
    const matches = eventMatches(event.id).filter(m=>m.bracket==='AM');
    const lastRound = matches.length ? Math.max(...matches.map(m=>m.round)) : 0;
    const hist = {games:new Array(n).fill(0), sits:new Array(n).fill(0),
      partner:Array.from({length:n},()=>new Array(n).fill(0)), opp:Array.from({length:n},()=>({}))};
    matches.forEach(m=>{
      const t1 = entryById(m.entry1Id), t2 = entryById(m.entry2Id);
      if(!t1||!t2) return;
      const a = entryPlayerIds(t1).map(p=>idx[p]), b = entryPlayerIds(t2).map(p=>idx[p]);
      if(a.length!==2 || b.length!==2 || [...a,...b].some(x=>x===undefined)) return;
      [...a,...b].forEach(x=>hist.games[x]++);
      [a,b].forEach(([x,y])=>{ hist.partner[x][y]++; hist.partner[y][x]++; });
      a.forEach(x=>b.forEach(y=>{ hist.opp[x][y]=(hist.opp[x][y]||0)+1; hist.opp[y][x]=(hist.opp[y][x]||0)+1; }));
    });
    Object.values(draw.americanoSitOut||{}).forEach(list=>(list||[]).forEach(p=>{ if(idx[p]!==undefined) hist.sits[idx[p]]++; }));
    hist.lastSit = ((draw.americanoSitOut||{})[lastRound]||[]).map(p=>idx[p]).filter(x=>x!==undefined);
    const genders = variant==='mixed' ? pids.map(p=>normGender((playerById(p)||{}).gender)) : null;
    const plan = americanoMoreRounds(n, count, hist, genders);
    const ctx = {tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id};
    const newEntries = [], newMatches = [], sitOut = {...(draw.americanoSitOut||{})};
    const lastMs = matches.filter(m=>m.round===lastRound).sort((a,b)=>b.position-a.position);
    let prevLast = lastMs.length ? new Set([lastMs[0].entry1Id,lastMs[0].entry2Id].map(entryById).filter(Boolean).flatMap(entryPlayerIds).map(p=>idx[p])) : null;
    plan.forEach((rd, ri)=>{
      const roundNum = lastRound + ri + 1;
      if(rd.sit.length) sitOut[roundNum] = rd.sit.map(i=>pids[i]);
      const games = americanoOrderGamesInRound(rd.games, prevLast, g=>g.flat());
      prevLast = new Set(games[games.length-1].flat());
      games.forEach(([t1,t2], gi)=>{
        const mk = ([a,b])=>{
          const team = {id:uid(), eventId:event.id, player1Id:pids[a], player2Id:pids[b],
            seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
          newEntries.push(team); return team;
        };
        const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:gi, e1:mk(t1), e2:mk(t2)});
        m.id = uid(); newMatches.push(m);
      });
    });
    markSchedulable(newMatches);
    for(const te of newEntries) await Store.add('entries', te, te.id);
    for(const m of newMatches) await Store.add('matches', m, m.id);
    await Store.update('draws', draw.id, {americanoSitOut: sitOut});
    if(event.status==='completed') await Store.update('events', event.id, {status:'draw_published'});
    toast('Added ' + plan.length + ' round' + (plan.length>1?'s':'') + ' (rounds ' + (lastRound+1) + '-' + (lastRound+plan.length) + ')');
  });
}
function openAddAmericanoRoundsDialog(ev){
  const draw = eventDraw(ev.id);
  if(!draw || draw.format!=='americano'){ toast('Generate the Americano draw first', true); return; }
  const variant = ev.americanoVariant||'classic';
  const pids = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam).map(e=>e.player1Id);
  const n = pids.length;
  const men = variant==='mixed' ? pids.filter(p=>normGender((playerById(p)||{}).gender)==='male').length : 0;
  const cyc = americanoCycleLength(variant==='mixed'?men:n, variant==='mixed');
  const step = americanoEqualRoundsStep(n, variant==='mixed'?men:0);
  const existing = eventMatches(ev.id).filter(m=>m.bracket==='AM');
  const lastRound = existing.length ? Math.max(...existing.map(m=>m.round)) : 0;
  const partnered = new Set();
  existing.forEach(m=>[m.entry1Id,m.entry2Id].forEach(eid=>{ const e=entryById(eid); if(e&&e.player2Id) partnered.add([e.player1Id,e.player2Id].sort().join('|')); }));
  const possible = variant==='mixed' ? men*(n-men) : n*(n-1)/2;
  const fresh = Math.max(0, possible - partnered.size);
  const body = `
    <div class="helptext" style="margin-bottom:10px">Currently ${lastRound} round${lastRound===1?'':'s'} for ${n} players. New rounds are appended after round ${lastRound}; existing matches and scores are kept.</div>
    <div class="field"><label>Rounds to add</label><input type="number" id="fAmAddCount" min="1" max="60" value="${cyc}"></div>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">
      <button type="button" class="btn btn-sm" data-am-preset="${step}">${step} round${step>1?'s':''}</button>
      ${cyc!==step?`<button type="button" class="btn btn-sm" data-am-preset="${cyc}">Full cycle (${cyc})</button>`:''}
      <button type="button" class="btn btn-sm" data-am-preset="${cyc*2}">2 cycles (${cyc*2})</button>
    </div>
    <div class="helptext" id="fAmAddNote"></div>`;
  openDialog('Add Americano rounds', body, stdFoot('btnSaveAmAdd','Add rounds'));
  const inp = document.getElementById('fAmAddCount'), note = document.getElementById('fAmAddNote');
  const refresh = ()=>{
    const c = Math.max(1, parseInt(inp.value,10)||1);
    const equal = c % step === 0;
    note.innerHTML = (equal
      ? `Everyone gets the same number of extra games.`
      : `Game counts will differ by 1 between players - use a multiple of <b>${step}</b> to keep them equal.`)
      + ` ${fresh ? `${fresh} pair${fresh===1?' has':'s have'} never partnered yet - they're used first; after that` : 'Every possible pair has partnered already, so'} repeat partners are spread as evenly as possible.`;
  };
  inp.addEventListener('input', refresh);
  document.querySelectorAll('[data-am-preset]').forEach(b=>b.addEventListener('click', ()=>{ inp.value = b.getAttribute('data-am-preset'); refresh(); }));
  refresh();
  document.getElementById('btnSaveAmAdd').onclick = async ()=>{
    const c = parseInt(inp.value,10);
    if(!c || c<1){ toast('Enter how many rounds to add', true); return; }
    await addAmericanoRounds(eventById(ev.id), c);
    closeGenericDialog(); render();
  };
}
/* Mixed Americano (PadelMix): every team is one man + one woman, requiring an
   equal head count of each and at least 4 of each. The female half of each
   team rotates by a fixed offset each round so every man partners every
   woman exactly once over n rounds; opponents are then drawn from the same
   verified round-robin schedule (reused as an index-pairing, not a partner
   list here) so head-to-heads vary too. */
function buildMixedAmericano(ctx, entries){
  const males = entries.filter(e=>{ const p=playerById(e.player1Id); return p && normGender(p.gender)==='male'; });
  const females = entries.filter(e=>{ const p=playerById(e.player1Id); return p && normGender(p.gender)==='female'; });
  if(males.length<4 || females.length<4 || males.length!==females.length){
    throw new Error('Mixed Americano needs an equal number of men and women, at least 4 of each.');
  }
  const n = males.length;
  const oppSchedule = DrawGenerator.roundRobinSchedule(n);
  // round r: man i partners woman (i+r) mod n; teams meet as in a round robin
  let rounds = [];
  for(let r=0;r<n;r++){
    const pairs = oppSchedule[r % Math.max(oppSchedule.length,1)] || [];
    const teamPlayers = males.map((m,i)=>[m.player1Id, females[(i+r)%n].player1Id]);
    const inPlay = new Set(pairs.flat());
    const sit = new Set(); teamPlayers.forEach((tp,ti)=>{ if(!inPlay.has(ti)) tp.forEach(x=>sit.add(x)); });
    rounds.push({teamPlayers, pairs, sit});
  }
  const all = entries.map(e=>e.player1Id);
  rounds = americanoFairOrder(rounds, all).map(i=>rounds[i]);
  const teamEntries = [], matches = [], sitOut = {};
  let prevLast = null;
  rounds.forEach((rd, ri)=>{
    const roundNum = ri+1;
    if(rd.sit.size) sitOut[roundNum] = [...rd.sit];
    const pairs = americanoOrderGamesInRound(rd.pairs, prevLast, ([a,b])=>[...rd.teamPlayers[a], ...rd.teamPlayers[b]]);
    if(pairs.length){ const [a,b] = pairs[pairs.length-1]; prevLast = new Set([...rd.teamPlayers[a], ...rd.teamPlayers[b]]); }
    const teams = {};
    const team = ti=> teams[ti] || (teams[ti] = (()=>{ const t = {id:uid(), eventId:ctx.eventId, player1Id:rd.teamPlayers[ti][0], player2Id:rd.teamPlayers[ti][1],
      seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum}; teamEntries.push(t); return t; })());
    pairs.forEach(([a,b], pi)=>{
      const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:pi, e1:team(a), e2:team(b)});
      m.id = uid(); matches.push(m);
    });
  });
  markSchedulable(matches);
  return {matches, teamEntries, sitOut};
}
/* Mexicano pairing: given individual entries already ordered strongest-first
   (random for round 1, by live standings afterwards), splits them into
   foursomes and pairs rank 1&3 vs 2&4 within each foursome (the standard
   Mexicano pattern) so matches stay close as the field separates. Anyone left
   over (count not a multiple of 4) sits out that round. */
function mexicanoFoursomePairs(orderedIndividualEntries){
  const n = orderedIndividualEntries.length;
  const groups = [];
  let i=0;
  for(; i+4<=n; i+=4) groups.push(orderedIndividualEntries.slice(i,i+4));
  const sitOut = orderedIndividualEntries.slice(i);
  const teamPairs = groups.map(g=>[[g[0],g[2]],[g[1],g[3]]]);
  return {teamPairs, sitOut};
}
/* Who sits out a Mexicano round (player count not a multiple of 4): whoever has
   played the most, but never someone who sat out the round before, then fewest
   breaks so far. Keeps game counts equal and breaks spread out. */
function mexicanoSitters(orderedIndividualEntries, k, games, sits, lastSit, runOf){
  if(k<=0) return [];
  const pool = americanoShuffle(orderedIndividualEntries.slice());
  const run = e=> (runOf && runOf[e.player1Id]) || 0;
  pool.sort((a,b)=> ((lastSit.has(a.player1Id)?1:0)-(lastSit.has(b.player1Id)?1:0)) || ((games[b.player1Id]||0)-(games[a.player1Id]||0)) || (run(b)-run(a)) || ((sits[a.player1Id]||0)-(sits[b.player1Id]||0)));
  return pool.slice(0,k);
}
function buildMexicanoRound(ctx, orderedIndividualEntries, roundNum, sitters){
  let ordered = orderedIndividualEntries;
  if(sitters){ const out = new Set(sitters.map(e=>e.id)); ordered = orderedIndividualEntries.filter(e=>!out.has(e.id)).concat(sitters); }
  const {teamPairs, sitOut} = mexicanoFoursomePairs(ordered);
  const teamEntries=[], matches=[];
  teamPairs.forEach(([tA,tB], pi)=>{
    const teamA = {id:uid(), eventId:ctx.eventId, player1Id:tA[0].player1Id, player2Id:tA[1].player1Id,
      seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
    const teamB = {id:uid(), eventId:ctx.eventId, player1Id:tB[0].player1Id, player2Id:tB[1].player1Id,
      seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum};
    teamEntries.push(teamA, teamB);
    const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:pi, e1:teamA, e2:teamB});
    m.id = uid();
    matches.push(m);
  });
  markSchedulable(matches);
  return {matches, teamEntries, sitOut};
}
/* Admin action for the Mexicano variant: draws are generated one round at a
   time (unlike Classic/Mixed, whose full schedule is built up front) because
   each round's pairing depends on standings the previous round produced. */
async function generateNextMexicanoRound(event){
  return act(async ()=>{
    const draw = eventDraw(event.id);
    if(!draw || draw.format!=='americano' || (event.americanoVariant||'classic')!=='mexicano'){
      throw new Error('This is only for Mexicano-variant Americano events.');
    }
    if(americanoFinalMatch(event.id)) throw new Error('Remove the final before generating another round.');
    const matches = americanoRoundMatches(event.id);
    const individualEntries = eventEntries(event.id).filter(e=>!e.isAmericanoTeam);
    if(!individualEntries.length) throw new Error('No players to pair.');
    const lastRound = matches.length ? Math.max(...matches.map(m=>m.round)) : 0;
    const roundMatches = matches.filter(m=>m.round===lastRound);
    if(lastRound>0 && roundMatches.some(m=>!['completed','walkover','retired','bye'].includes(m.status))){
      throw new Error('Finish scoring round ' + lastRound + ' before generating the next one.');
    }
    const standing = computeAmericanoStandings(individualEntries, matches);
    const byPlayerId = {}; individualEntries.forEach(e=>{ byPlayerId[e.player1Id]=e; });
    const orderedEntries = standing.map(r=>byPlayerId[r.playerId]).filter(Boolean);
    const nextRound = lastRound+1;
    const games = {}, sits = {};
    matches.forEach(m=>[m.entry1Id,m.entry2Id].forEach(eid=>{ const e=entryById(eid); if(e) entryPlayerIds(e).forEach(p=>{ games[p]=(games[p]||0)+1; }); }));
    const sitMap = (draw.americanoSitOut && !Array.isArray(draw.americanoSitOut)) ? draw.americanoSitOut : {};
    Object.values(sitMap).forEach(list=>(list||[]).forEach(p=>{ sits[p]=(sits[p]||0)+1; }));
    const lastSit = new Set(sitMap[lastRound]||[]);
    // how many rounds in a row each player has been on court: the longest runs rest first
    const runOf = {};
    orderedEntries.forEach(e=>{ let r=0; for(let k=lastRound; k>=1 && !(sitMap[k]||[]).includes(e.player1Id); k--) r++; runOf[e.player1Id]=r; });
    const sitters = mexicanoSitters(orderedEntries, orderedEntries.length % 4, games, sits, lastSit, runOf);
    const built = buildMexicanoRound({tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id}, orderedEntries, nextRound, sitters);
    if(built.sitOut.length) await Store.update('draws', draw.id, {americanoSitOut: {...sitMap, [nextRound]: built.sitOut.map(e=>e.player1Id)}});
    for(const te of built.teamEntries) await Store.add('entries', te, te.id);
    for(const m of built.matches) await Store.add('matches', m, m.id);
    toast('Round ' + nextRound + ' generated' + (built.sitOut.length ? (' - ' + built.sitOut.map(e=>playerName(e.player1Id)).join(', ') + ' sit out (not a multiple of 4)') : ''));
  });
}
/* ============ AMERICANO FINAL ============
   After the rounds, the organiser can play one final between the top four of
   the standings (bracket 'AMF'). Default pairing is 1st+4th vs 2nd+3rd so the
   two teams are balanced; for Mixed it is top man + 2nd woman vs 2nd man + top
   woman. The final doesn't change the standings; it decides Champion (winners)
   and Runner-up (losers). */
const AM_FINAL_BO3 = { bestOf:3, pointsToWin:21, winBy:2, capPoints:30, deuceEnabled:true };
function americanoFinalMatch(eventId){ return eventMatches(eventId).find(m=>m.bracket==='AMF') || null; }
function americanoRoundMatches(eventId){ return eventMatches(eventId).filter(m=>m.bracket==='AM'); }
function americanoRoundsDone(eventId){
  const ms = americanoRoundMatches(eventId);
  return ms.length>0 && ms.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status));
}
function americanoFinalDefaultTeams(ev){
  const individual = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  const standing = computeAmericanoStandings(individual, americanoRoundMatches(ev.id));
  if((ev.americanoVariant||'classic')==='mixed'){
    const g = s=>standing.filter(r=>normGender((playerById(r.playerId)||{}).gender)===s).map(r=>r.playerId);
    const men = g('male'), women = g('female');
    if(men.length>=2 && women.length>=2) return [[men[0], women[1]], [men[1], women[0]]];
  }
  const top = standing.slice(0,4).map(r=>r.playerId);
  if(top.length<4) return null;
  return [[top[0], top[3]], [top[1], top[2]]];
}
async function createAmericanoFinal(ev, teamA, teamB, bestOf){
  return act(async ()=>{
    const draw = eventDraw(ev.id);
    if(!draw || draw.format!=='americano') throw new Error('Generate the Americano draw first.');
    if(americanoFinalMatch(ev.id)) throw new Error('This event already has a final.');
    const ids = [...teamA, ...teamB];
    if(ids.some(x=>!x) || new Set(ids).size!==4) throw new Error('Pick four different players.');
    const rounds = americanoRoundMatches(ev.id);
    const lastRound = rounds.length ? Math.max(...rounds.map(m=>m.round)) : 0;
    const mk = ([a,b])=>({id:uid(), eventId:ev.id, player1Id:a, player2Id:b, seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:lastRound+1, americanoFinal:true});
    const tA = mk(teamA), tB = mk(teamB);
    const m = baseMatch({tournamentId:ev.tournamentId, eventId:ev.id, drawId:draw.id, bracket:'AMF', round:lastRound+1, position:0, e1:tA, e2:tB});
    m.id = uid(); m.estDurationMin = bestOf===3 ? 45 : 30;
    markSchedulable([m]);
    await Store.add('entries', tA, tA.id); await Store.add('entries', tB, tB.id);
    await Store.add('matches', m, m.id);
    await Store.update('events', ev.id, {americanoFinalScoring: bestOf===3 ? AM_FINAL_BO3 : null, status: ev.status==='completed' ? 'draw_published' : ev.status});
    await audit(ev.tournamentId, state.role, 'americano_final_created', ev.name + ': ' + entryName(tA) + ' vs ' + entryName(tB));
  }, 'Final created');
}
async function removeAmericanoFinal(ev){
  const m = americanoFinalMatch(ev.id); if(!m) return;
  if((m.games||[]).length && !await confirmDialog('The final already has a score. Remove it anyway?')) return;
  return act(async ()=>{
    await Store.remove('matches', m.id);
    for(const eid of [m.entry1Id, m.entry2Id]) if(eid) await Store.remove('entries', eid);
    const fresh = eventById(ev.id);
    if(fresh && fresh.status==='completed') await Store.update('events', ev.id, {status:'draw_published'});
    await checkEventCompletion(ev.id);
  }, 'Final removed');
}
function openAmericanoFinalDialog(ev){
  const draw = eventDraw(ev.id);
  if(!draw || draw.format!=='americano'){ toast('Generate the Americano draw first', true); return; }
  const individual = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  const standing = computeAmericanoStandings(individual, americanoRoundMatches(ev.id));
  const def = americanoFinalDefaultTeams(ev);
  if(!def){ toast('A final needs at least 4 players', true); return; }
  const done = americanoRoundsDone(ev.id);
  const opts = sel => standing.map((r,i)=>`<option value="${r.playerId}" ${r.playerId===sel?'selected':''}>#${i+1} ${esc(playerName(r.playerId))} (${r.pointsFor})</option>`).join('');
  const pick = (id, sel)=>`<select id="${id}" class="am-final-pick">${opts(sel)}</select>`;
  const mixed = (ev.americanoVariant||'classic')==='mixed';
  const body = `
    ${done ? '' : `<div class="am-warn">Some round matches aren't scored yet, so the top four may still change.</div>`}
    <div class="helptext" style="margin-bottom:10px">The top four play one final. Winners are Champions, the other pair Runners-up; everyone else keeps their standings place.</div>
    ${mixed ? '' : `<div class="seg" id="amFinalPreset" role="group" aria-label="Pairing">
      <button type="button" class="active" data-am-pair="14">1+4 v 2+3</button>
      <button type="button" data-am-pair="13">1+3 v 2+4</button>
      <button type="button" data-am-pair="12">1+2 v 3+4</button>

    <div class="am-final-teams">

function buildGroupsStage(ctx, entries, groupSize){
  const groupIdxs = DrawGenerator.splitGroups(entries.length, groupSize||4);
  const groups = groupIdxs.map((idxs,gi)=>({
    id: uid(), name: 'Group ' + String.fromCharCode(65+gi), entryIds: idxs.map(i=>entries[i].id)
  }));
  let matches=[];
  groups.forEach(g=>{
    const groupEntries = g.entryIds.map(id=>entries.find(e=>e.id===id));
    matches = matches.concat(buildRoundRobin({...ctx, groupId:g.id}, groupEntries));
  });
  return {groups, matches};
}

/* Knockout seeding for groups + knockout, as placeholders: group winners are
   the top seeds (A1, B1, ...), then runners-up (A2, B2, ...), which pairs
   A1 v B2, B1 v A2 (A1 v D2, B1 v C2, ... with four groups). Any first-round
   pairing of two players from the same group is then swapped with another
   qualifier of the same rank. A group smaller than the number of qualifiers
   only supplies as many as it has players. */
function groupLetter(g){ return String(g.name||'').replace(/^Group\s+/i,'') || '?'; }
function knockoutQualifierOrder(groups, qualifiersPerGroup){
  const order = [];
  for(let r=0;r<qualifiersPerGroup;r++){
    groups.forEach(g=>{ if((g.entryIds||[]).length>r) order.push({groupId:g.id, rank:r+1, label:groupLetter(g)+(r+1)}); });
  }
  const r1 = DrawGenerator.singleEliminationPlan(order.length).filter(p=>p.round===1 && p.entry1Index!=null && p.entry2Index!=null);
  const opponentOf = i => { const q = r1.find(q=>q.entry1Index===i || q.entry2Index===i); return q ? order[q.entry1Index===i ? q.entry2Index : q.entry1Index] : null; };
  for(let pass=0; pass<4; pass++){
    let changed = false;
    for(const p of r1){
      const a = order[p.entry1Index], b = order[p.entry2Index];
      if(a.groupId!==b.groupId) continue;
      const bad = a.rank>=b.rank ? p.entry1Index : p.entry2Index, keep = bad===p.entry1Index ? b : a;
      for(let j=0;j<order.length;j++){
        if(j===bad || order[j].rank!==order[bad].rank || order[j].groupId===keep.groupId) continue;
        const opp = opponentOf(j);
        if(opp && opp!==order[j] && opp.groupId===order[bad].groupId) continue;
        [order[bad], order[j]] = [order[j], order[bad]]; changed = true; break;
      }
    }
    if(!changed) break;
  }
  return order;
}
function buildKnockoutPlaceholders(ctx, groups, qualifiersPerGroup, opts){
  const order = knockoutQualifierOrder(groups, qualifiersPerGroup);
  if(order.length<2) return [];
  return buildSingleElimination(ctx, order.map(src=>({id:null, src})), opts);
}
/* The matches whose winner (or loser) goes into this one. */
function feedersOf(m){ return state.matches.filter(f=>f.id!==m.id && (f.nextMatchId===m.id || f.loserNextMatchId===m.id)); }
/* "Quarterfinal 2": the round, numbered when the round has more than one match. */
function matchNumberLabel(m){
  const same = state.matches.filter(x=>x.eventId===m.eventId && x.drawId===m.drawId && x.bracket===m.bracket && x.round===m.round && !!x.isThirdPlace===!!m.isThirdPlace)
    .sort((a,b)=>a.position-b.position);
  const i = same.findIndex(x=>x.id===m.id);
  return roundLabelForMatch(m) + (same.length>1 && i>=0 ? ' '+(i+1) : '');
}
/* Like matchSideName, but a slot waiting on an earlier match says which one:
   "Winner of Quarterfinal 1" / "Loser of Semifinal 2". Used in match lists. */
function matchSideLabel(m, slot){
  const n = matchSideName(m, slot);
  if(n!=='TBD') return n;
  const f = state.matches.find(x=>x.nextMatchId===m.id && x.nextMatchSlot===slot);
  if(f) return 'Winner of ' + matchNumberLabel(f);
  const l = state.matches.find(x=>x.loserNextMatchId===m.id && x.loserNextMatchSlot===slot);
  if(l) return 'Loser of ' + matchNumberLabel(l);
  return n;
}
/* The name shown for one side of a match: the entry, else its placeholder
   ("A1" = winner of Group A), else TBD (waiting for an earlier match). */
function matchSideName(m, slot){
  const e = entryById(slot===1 ? m.entry1Id : m.entry2Id);
  if(e) return entryName(e);
  const src = slot===1 ? m.src1 : m.src2;
  return src ? src.label : 'TBD';
}

function buildDoubleElimination(ctx, entries, opts){
  opts = opts||{};
  const N = entries.length;
  if(N<2) return [];
  const S = DrawGenerator.nextPowerOfTwo(N);
  const n = Math.log2(S);
  if(n<=1) return buildSingleElimination(ctx, entries, opts);

  const plans = DrawGenerator.singleEliminationPlan(N);
  const wbByRoundPos = {};
  const all = [];
  for(const p of plans){
    const e1 = p.entry1Index!=null?entries[p.entry1Index]:null;
    const e2 = p.entry2Index!=null?entries[p.entry2Index]:null;
    const m = baseMatch({...ctx, bracket:'WB', round:p.round, position:p.position, e1, e2});
    m.id = uid();
    all.push(m);
    (wbByRoundPos[p.round]=wbByRoundPos[p.round]||{})[p.position]=m;
  }
  for(let r=1;r<n;r++){
    const thisRound=wbByRoundPos[r], nextRound=wbByRoundPos[r+1];
    Object.keys(thisRound).forEach(posStr=>{
      const pos=+posStr, m=thisRound[pos];
      const nextPos=Math.floor(pos/2);
      const next=nextRound[nextPos];
      m.nextMatchId=next.id; m.nextMatchSlot=(pos%2===0)?1:2;
    });
  }
  const wbFinal = wbByRoundPos[n][0];

  let lbRoundNum=1;
  const lb=[];
  function mkLB(pos){
    const m = baseMatch({...ctx, bracket:'LB', round:lbRoundNum, position:pos, e1:null, e2:null});
    m.id = uid(); lb.push(m); return m;
  }
  const r1Matches = Object.values(wbByRoundPos[1]).sort((a,b)=>a.position-b.position);
  let survivors = [];
  for(let i=0;i<r1Matches.length;i+=2){
    const m = mkLB(i/2);
    r1Matches[i].loserNextMatchId = m.id; r1Matches[i].loserNextMatchSlot = 1;
    r1Matches[i+1].loserNextMatchId = m.id; r1Matches[i+1].loserNextMatchSlot = 2;
    survivors.push(m);
  }
  lbRoundNum++;
  for(let r=2;r<=n;r++){
    const wbLosers = Object.values(wbByRoundPos[r]).sort((a,b)=>a.position-b.position);
    const dropIn = [];
    for(let i=0;i<wbLosers.length;i++){
      const m = mkLB(i);
      survivors[i].nextMatchId = m.id; survivors[i].nextMatchSlot = 1;
      wbLosers[i].loserNextMatchId = m.id; wbLosers[i].loserNextMatchSlot = 2;
      dropIn.push(m);
    }
    lbRoundNum++;
    if(r<n){
      const compressed=[];
      for(let i=0;i<dropIn.length;i+=2){
        const m = mkLB(i/2);
        dropIn[i].nextMatchId = m.id; dropIn[i].nextMatchSlot = 1;
        dropIn[i+1].nextMatchId = m.id; dropIn[i+1].nextMatchSlot = 2;
        compressed.push(m);
      }
      lbRoundNum++;
      survivors = compressed;
    } else {
      survivors = dropIn;
    }
  }
  const lbFinal = survivors[0];

  const gf1 = baseMatch({...ctx, bracket:'GF', round:1, position:0, e1:null, e2:null});
  gf1.id = uid(); gf1.grKind='gf1';
  wbFinal.nextMatchId = gf1.id; wbFinal.nextMatchSlot = 1;
  lbFinal.nextMatchId = gf1.id; lbFinal.nextMatchSlot = 2;

  const list = all.concat(lb, [gf1]);
  markSchedulable(list);
  resolveByeCascade(list);
  return list;
}

/* Modal dialogs live in the browser's "top layer", above everything else on the
   page, so a toast in the page body would be hidden behind an open dialog (and
   its dimmed backdrop). The toast host therefore moves into the top-most open
   dialog while one is open, and back to the page when it closes. */
function placeToastHost(){
  const host=document.getElementById('toastHost'); if(!host) return null;
  const open=[...document.querySelectorAll('dialog[open]')];
  const parent = open.length ? open[open.length-1] : document.body;
  if(host.parentElement!==parent) parent.appendChild(host);
  return host;
}
document.addEventListener('close', ()=>setTimeout(placeToastHost, 0), true);
function toast(msg, isError){
  const host=placeToastHost();
  if(!host) return;
  const el=document.createElement('div'); el.className='toast'+(isError?' error':''); el.textContent=msg;
  host.appendChild(el);
  if(Native.has('sbHaptic')) Native.post('sbHaptic', isError?'error':'success');
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, isError ? 4500 : 2600);
}

/* ---------- Registration window ----------
   A tournament takes self-registrations while its status is "registration open"
   and its deadline (regCloseDate, optional) hasn't passed. After that only an
   admin can add players (recorded as late entries). */
function regDeadline(t){
  const v = t && t.regCloseDate; if(!v) return null;
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T23:59:59') : new Date(v);   // date-only = end of that day
  return isNaN(d) ? null : d;
}

  if(t.status!=='registration_open') return {open:false, deadline, reason:'status'};
  if(deadline && Date.now() > deadline.getTime()) return {open:false, deadline, reason:'deadline'};
  return {open:true, deadline};
}
