/* Modal dialogs live in the browser's "top layer", above everything else on the
   page, so a toast in the page body would be hidden behind an open dialog (and
   its dimmed backdrop). The toast host therefore moves into the top-most open
   dialog while one is open, and back to the page when it closes. */
function placeToastHost(){
  const host=document.getElementById('toastHost'); if(!host) return null;
  const open=[...document.querySelectorAll('dialog[open]')];
  const parent = open.length ? open[open.length-1] : document.body;
  if(host.parentElement!==parent) parent.appendChild(host);
  return host;
}
document.addEventListener('close', ()=>setTimeout(placeToastHost, 0), true);
function toast(msg, isError){
  const host=placeToastHost();
  if(!host) return;
  [...host.children].forEach(x=>{ if(x.textContent===msg) x.remove(); });   // same message again: show it once
  while(host.children.length >= 2) host.firstElementChild.remove();          // at most two at a time
  const el=document.createElement('div'); el.className='toast'+(isError?' error':''); el.textContent=msg;
  host.appendChild(el);
  if(Native.has('sbHaptic')) Native.post('sbHaptic', isError?'error':'success');
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, isError ? 4500 : 2600);
}

function currentTournament(){ return tournamentById(state.tid); }

/* ---------- Registration window ----------
   A tournament takes self-registrations while its status is "registration open"
   and its deadline (regCloseDate, optional) hasn't passed. After that only an
   admin can add players (recorded as late entries). */
function regDeadline(t){
  const v = t && t.regCloseDate; if(!v) return null;
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T23:59:59') : new Date(v);   // date-only = end of that day
  return isNaN(d) ? null : d;
}
function registrationInfo(t){
  if(!t) return {open:false, reason:'none'};
  const deadline = regDeadline(t);
  if(t.status!=='registration_open') return {open:false, deadline, reason:'status'};
  if(deadline && Date.now() > deadline.getTime()) return {open:false, deadline, reason:'deadline'};
  return {open:true, deadline};
}
/* Whether the registration link asks for an email address: 'off', 'optional' or 'required'
   (the organiser's choice in the tournament's settings). */
function regEmailMode(t){ return t && (t.regEmail==='optional' || t.regEmail==='required') ? t.regEmail : 'off'; }
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function fmtDeadline(d){ return d ? fmtDateTime(d.toISOString()) : ''; }
/* Statuses the organiser picks. "Finished" only comes from Finish tournament (it
   publishes champions); "Draw published" is only kept for tournaments that have it. */
const TOURNAMENT_STATUSES = [['draft','Draft (hidden from players)'],['registration_open','Registration open'],['registration_closed','Registration closed'],['in_progress','In progress'],['cancelled','Cancelled']];
function tournamentStatusOptions(current){
  const list = TOURNAMENT_STATUSES.slice();
  if(current==='draw_published') list.splice(3, 0, ['draw_published','Draw published']);
  if(current==='completed') list.push(['completed','Finished']);
  return list.map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('');
}
/* Status pill that knows about the deadline: "Registration open until 5 Oct" /
   "Registration closed" instead of a stale "registration open". */
function tournamentStatusPill(t, withTime, bare){
  if(t && t.status==='registration_open'){
    const ri = registrationInfo(t);
    if(ri.open) return `<span class="pill court">Registration open${ri.deadline && !bare?' until '+esc(withTime?fmtDeadline(ri.deadline):fmtDate(ri.deadline.toISOString())):''}</span>`;
    return `<span class="pill">Registration closed</span>`;
  }
  return statusPill(t ? t.status : '');
}
function lateEntryNote(t){
  const ri = registrationInfo(t);
  if(ri.open) return '';
  const why = ri.reason==='deadline' ? 'The registration deadline ('+fmtDeadline(ri.deadline)+') has passed' : 'Registration isn\'t open for this tournament';
  return `<div class="helptext late-note">${ICONS.warn}<span>${esc(why)}. As admin you can still add players; they're recorded as late entries.</span></div>`;
}
function tEvents(tid){ return state.events.filter(e=>e.tournamentId===tid); }
function tMatches(tid){ return state.matches.filter(m=>m.tournamentId===tid); }
function tEntries(tid){ const evIds=new Set(tEvents(tid).map(e=>e.id)); return state.entries.filter(e=>evIds.has(e.eventId)); }
function tRegistrations(tid){ return state.registrations.filter(r=>r.tournamentId===tid); }
function tCourts(tid){ return state.courts.filter(c=>c.tournamentId===tid); }
function eventMatches(eid){ return state.matches.filter(m=>m.eventId===eid); }
function eventEntries(eid){ return state.entries.filter(e=>e.eventId===eid); }
function eventDraw(eid){ return state.draws.find(d=>d.eventId===eid) || null; }
function playerById(id){ return state.players.find(p=>p.id===id) || null; }
function clubById(id){ return state.clubs.find(c=>c.id===id) || null; }
function entryById(id){ return state.entries.find(e=>e.id===id) || null; }
function eventById(id){ return state.events.find(e=>e.id===id) || null; }
function matchById(id){ return state.matches.find(m=>m.id===id) || null; }
function courtById(id){ return state.courts.find(c=>c.id===id) || null; }
function tournamentById(id){ return state.tournaments.find(t=>t.id===id) || (state.quickPlays||[]).find(t=>t.id===id) || null; }
/* Quick play: a one-off Americano game (a hidden tournament with one event). It
   is left out of tournament lists, rankings, player stats, and it never counts as an active tournament for the Free limit. */
function isQuickPlay(tid){ const t = tournamentById(tid); return !!(t && t.quickPlay); }
function quickPlayIds(){ return new Set((state.quickPlays||[]).map(t=>t.id)); }

function playerName(id){ const p=playerById(id); return p?p.name:'Unknown'; }
function entryName(entry){
  if(!entry) return 'TBD';
  const p1 = playerName(entry.player1Id);
  if(entry.player2Id) return p1 + ' / ' + playerName(entry.player2Id);
  return p1;
}
function entryPlayerIds(entry){ if(!entry) return []; return [entry.player1Id, entry.player2Id].filter(Boolean); }
function matchEntryPlayerIds(m){
  return [...entryPlayerIds(entryById(m.entry1Id)), ...entryPlayerIds(entryById(m.entry2Id))];
}
/* Live link only: a viewer can follow one player (usually themselves). Their
   choice is remembered in their own browser for that link. */
function followedPlayer(){ return (VIEWER && state.followPlayerId) ? playerById(state.followPlayerId) : null; }
function matchHasPlayer(m, pid){ return matchEntryPlayerIds(m).includes(pid); }
function setFollow(pid){
  state.followPlayerId = pid || null;
  try{ if(pid) localStorage.setItem('sb-follow-'+VIEWER.id, pid); else localStorage.removeItem('sb-follow-'+VIEWER.id); }catch(e){}
  const p = followedPlayer();
  if(p){ const ev = state.events.find(e=>state.entries.some(en=>en.eventId===e.id && entryPlayerIds(en).includes(p.id)) && eventDraw(e.id)); if(ev) state.filters.drawEventId = ev.id; }
  render(); window.scrollTo(0,0);
}
function followNote(){
  const p = followedPlayer(); if(!p) return '';
  return `<div class="follow-note">${ICONS.user}<span>Showing <b>${esc(p.name)}</b> only</span><button type="button" class="btn btn-sm" id="btnUnfollow">Show everyone</button></div>`;
}
function isKnockoutStageMatch(event, match){ return !!(event && match && event.drawFormat==='group_knockout' && match.bracket && match.bracket!=='GRP'); }
function scoringFor(event, tournament, match){
  if(isKnockoutStageMatch(event, match) && event.knockoutScoring) return event.knockoutScoring;
  if(event && match && match.bracket==='AMF' && event.americanoFinalScoring) return event.americanoFinalScoring;
  if(event && event.drawFormat==='americano'){
    // Americano is always one game per match; without its own rule it uses badminton scoring.
    const sc = event.scoringOverride;
    if(!sc) return AMERICANO_DEFAULT_SCORING;
    if(sc.amRule===2) return Object.assign({}, sc, {bestOf:1});
    // Made before the deuce option existed ("race to N" was the only choice then):
    // play badminton scoring to the same target - win by 2, with the usual cap.
    return americanoScoringFromPoints(sc.pointsToWin || 21, true);
  }
  return (event && event.scoringOverride) || (tournament && tournament.scoring) || defaultScoringFor(sportOf(tournament || (event && tournamentById(event.tournamentId))));
}

function matchScoring(m){ return scoringFor(eventById(m.eventId), tournamentById(m.tournamentId), m); }

function isDoublesType(type){ return type==='doubles' || type==='mixed_doubles' || type==='team'; }
/* Entry fee. An event can set its own (ev.entryFee, ev.feePer 'player' | 'pair'
   for doubles); without one it uses the tournament's fee, per player. 0 = free.
   The currency is the tournament's (t.currency, e.g. SEK). */
function eventFee(ev){
  if(!ev) return null;
  const t = tournamentById(ev.tournamentId) || {};
  const own = ev.entryFee!=null && ev.entryFee!=='';
  const amount = Number(own ? ev.entryFee : t.entryFee) || 0;
  if(amount<=0) return null;
  const per = own && isDoublesType(ev.type) && ev.feePer==='pair' ? (ev.type==='team' ? 'team' : 'pair') : 'player';
  return {amount, per, currency:(t.currency||'').trim()};
}
function fmtMoney(amount, currency){
  const frac = amount%1 ? 2 : 0;
  if(/^[A-Z]{3}$/.test(currency||'')){ try{ return new Intl.NumberFormat(undefined, {style:'currency', currency, minimumFractionDigits:frac, maximumFractionDigits:frac}).format(amount); }catch(e){} }
  const n = amount.toLocaleString(undefined, {minimumFractionDigits:frac, maximumFractionDigits:frac});
  return currency ? n + ' ' + currency : n;
}
function feeLabel(ev){ const f = eventFee(ev); return f ? fmtMoney(f.amount, f.currency) + ' per ' + f.per : ''; }


/* ============================== STANDINGS / STATS ============================== */
const TIEBREAK_DEFAULT = ['wins','h2h','gameDiff','pointDiff','pointsFor'];
function computeGroupStandings(entryIds, matches, tiebreak){
  tiebreak = tiebreak || TIEBREAK_DEFAULT;
  const rows = {};
  entryIds.forEach(id=> rows[id] = {entryId:id, entry:entryById(id), played:0, wins:0, losses:0, gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, h2h:{}});
  matches.filter(m=> m.status==='completed'||m.status==='walkover'||m.status==='retired').forEach(m=>{
    if(!rows[m.entry1Id] || !rows[m.entry2Id]) return;
    let g1=0,g2=0,p1=0,p2=0;
    const cfg = matchScoring(m); (m.games||[]).forEach((g,i)=>{ const w=ScoreRules.gameWinner(g,cfg,i); if(w===1) g1++; else if(w===2) g2++; const [x,y]=ScoreRules.tally(g,cfg,i); p1+=x; p2+=y; });
    rows[m.entry1Id].played++; rows[m.entry2Id].played++;
    rows[m.entry1Id].gamesWon+=g1; rows[m.entry1Id].gamesLost+=g2;
    rows[m.entry2Id].gamesWon+=g2; rows[m.entry2Id].gamesLost+=g1;
    rows[m.entry1Id].pointsFor+=p1; rows[m.entry1Id].pointsAgainst+=p2;
    rows[m.entry2Id].pointsFor+=p2; rows[m.entry2Id].pointsAgainst+=p1;
    const winner = m.winnerEntryId;
    if(winner===m.entry1Id){ rows[m.entry1Id].wins++; rows[m.entry2Id].losses++; rows[m.entry1Id].h2h[m.entry2Id]='W'; rows[m.entry2Id].h2h[m.entry1Id]='L'; }
    else if(winner===m.entry2Id){ rows[m.entry2Id].wins++; rows[m.entry1Id].losses++; rows[m.entry2Id].h2h[m.entry1Id]='W'; rows[m.entry1Id].h2h[m.entry2Id]='L'; }
  });
  const list = Object.values(rows);
  list.forEach(r=>{ r.gameDiff = r.gamesWon-r.gamesLost; r.pointDiff = r.pointsFor-r.pointsAgainst; });
  list.sort((a,b)=>{
    for(const key of tiebreak){
      if(key==='wins'){ if(b.wins!==a.wins) return b.wins-a.wins; }
      else if(key==='h2h'){ const ah=a.h2h[b.entryId], bh=b.h2h[a.entryId]; if(ah==='W'&&bh==='L') return -1; if(ah==='L'&&bh==='W') return 1; }
      else if(key==='gameDiff'){ if(b.gameDiff!==a.gameDiff) return b.gameDiff-a.gameDiff; }
      else if(key==='pointDiff'){ if(b.pointDiff!==a.pointDiff) return b.pointDiff-a.pointDiff; }
      else if(key==='pointsFor'){ if(b.pointsFor!==a.pointsFor) return b.pointsFor-a.pointsFor; }
    }
    return entryName(a.entry).localeCompare(entryName(b.entry));
  });
  return list;
}
/* Americano ranking is per PLAYER, not per entry, since a player's "entry"
   (team) changes every round. individualEntries = the one-per-player
   registration entries (player2Id null); matches carry ad-hoc team entries. */
/* Americano / Mexicano table order. 'wins' (default): most matches won, then
   most points won, then best point difference. 'points': classic Americano,
   total points won first (wins only break ties). Set per event in Edit event. */
const AMERICANO_RANKINGS = [['wins','Wins first, then points'],['points','Points (classic Americano)']];
function americanoRankingFor(ev){ return (ev && ev.americanoRanking==='points') ? 'points' : 'wins'; }
/* Win bonus: for every match won, the points difference of that match (21-15
   = 6) is added to each winner's points (the Points column). 'none' turns it
   off. Set per event in Edit event. */
const AMERICANO_BONUSES = [['margin','Points difference of each match won'],['none','No bonus']];
function americanoBonusFor(ev){ return (ev && ev.americanoBonus==='none') ? 'none' : 'margin'; }
function americanoRankingLabel(ev){
  const bonus = americanoBonusFor(ev)==='margin' ? ' (points include the winning margin of each win)' : '';
  return (americanoRankingFor(ev)==='points' ? 'Ranked by points, then wins' : 'Ranked by wins, then points') + bonus;
}
function americanoRankingNote(ev){ return `<div class="helptext" style="margin-top:6px">${esc(americanoRankingLabel(ev))}.</div>`; }
function computeAmericanoStandings(individualEntries, matches, ranking){
  const rows = {};
  individualEntries.forEach(e=> rows[e.player1Id] = {playerId:e.player1Id, played:0, wins:0, losses:0, pointsFor:0, pointsAgainst:0, margin:0});
  matches.filter(m=> m.bracket!=='AMF' && (m.status==='completed'||m.status==='walkover'||m.status==='retired') && (m.games||[]).length).forEach(m=>{
    const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
    if(!e1||!e2) return;
    let p1=0,p2=0; (m.games||[]).forEach(g=>{ p1+=g.a||0; p2+=g.b||0; });
    const aWon = m.winnerEntryId===m.entry1Id;
    const margin = Math.abs(p1-p2);
    entryPlayerIds(e1).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p1; rows[pid].pointsAgainst+=p2; if(aWon){ rows[pid].wins++; rows[pid].margin+=margin; } else rows[pid].losses++; });
    entryPlayerIds(e2).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p2; rows[pid].pointsAgainst+=p1; if(aWon) rows[pid].losses++; else { rows[pid].wins++; rows[pid].margin+=margin; } });
  });
  const ref = individualEntries[0] || matches[0], ev = ref && eventById(ref.eventId);
  if(!ranking) ranking = americanoRankingFor(ev);
  const useBonus = americanoBonusFor(ev)==='margin';
  Object.values(rows).forEach(r=>{ r.bonus = useBonus ? r.margin : 0; r.total = r.pointsFor + r.bonus; });
  const diff = r=>r.pointsFor-r.pointsAgainst, name = (a,b)=>playerName(a.playerId).localeCompare(playerName(b.playerId));
  return Object.values(rows).sort(ranking==='points'
    ? (a,b)=> b.total-a.total || b.wins-a.wins || diff(b)-diff(a) || name(a,b)
    : (a,b)=> b.wins-a.wins || b.total-a.total || diff(b)-diff(a) || name(a,b));
}

/* ============================== RANKING POINTS ============================== */
/* Placing scores (stage reached / final standing) order each event's results
   and name the placing; ranking points are matchWinPoints + title bonus below. */
const RANKING_POINTS_TOOLTIP = 'Every match won earns points: group, round robin, Americano and Plate 2 · knockout earlier rounds 3 · Round of 16 4 · Quarterfinal 6 · Semifinal 8 · Final 10 · third-place match 5. Winning the title adds 20. Ranking = sum over all events.';
/* Ranking points (the Rankings page and seeding). Every match won earns
   points, more the deeper into the knockout it is, and the champion of an
   event gets a title bonus. Event placings (Champion, Semifinal, #2 ...)
   still name where each player finished; they no longer give the points. */
const RANK_WIN = {standings:2, early:3, r16:4, qf:6, sf:8, final:10, third:5};
const RANK_TITLE_BONUS = 20;
function matchWinPoints(m){
  if(!m || !m.winnerEntryId || !['completed','walkover','retired'].includes(m.status)) return 0;
  const b = m.bracket;
  if(b==='GRP' || b==='RR' || b==='AM' || b==='PL') return RANK_WIN.standings;   // the plate plays for small placings
  if(m.isThirdPlace) return RANK_WIN.third;
  if(b==='AMF' || b==='GF') return RANK_WIN.final;
  if(b==='LB') return RANK_WIN.early;
  // Single elimination (and the winners bracket, whose final leads to the grand final).
  const d = maxRoundForBracket(m.eventId, b) - m.round + (b==='WB' ? 1 : 0);
  return d<=0 ? RANK_WIN.final : d===1 ? RANK_WIN.sf : d===2 ? RANK_WIN.qf : d===3 ? RANK_WIN.r16 : RANK_WIN.early;
}
/* Ranking points each player earned in one event: their wins, plus the title bonus. */
function eventRankPoints(eventId, placements){
  const out = {};
  const add = (pid, n)=>{ out[pid] = (out[pid]||0) + n; };
  eventMatches(eventId).forEach(m=>{ const n = matchWinPoints(m); if(n){ const e = entryById(m.winnerEntryId); if(e) entryPlayerIds(e).forEach(pid=>add(pid, n)); } });
  const pl = placements || computeEventPlacements(eventId);
  eventEntries(eventId).forEach(en=>{ if(!en.isAmericanoTeam && pl[en.id] && pl[en.id].label==='Champion') entryPlayerIds(en).forEach(pid=>add(pid, RANK_TITLE_BONUS)); });
  return out;
}
function entryRankPoints(entry, byPlayer){ const ids = entryPlayerIds(entry); return ids.length ? (byPlayer[ids[0]]||0) : 0; }
function stagePointsByDistance(distanceFromFinal, won){
  if(won && distanceFromFinal===0) return 100;
  if(distanceFromFinal===0) return 70;
  if(distanceFromFinal===1) return 45;
  if(distanceFromFinal===2) return 25;
  if(distanceFromFinal===3) return 15;
  return 5;
}
function standingPoints(rank){
  if(rank===1) return 100;
  if(rank===2) return 70;
  if(rank===3) return 50;
  if(rank===4) return 35;
  return 10;
}

function roundLabelFor(bracket, round, maxRound, isThirdPlace){
  if(isThirdPlace) return 'Third place';
  if(bracket==='GF') return 'Grand Final';
  if(bracket==='AMF') return 'Final';
  if(bracket==='RR'||bracket==='GRP'||bracket==='AM') return 'Round '+round;
  const fromEnd = maxRound-round, pre = bracket==='PL' ? 'Plate ' : '';
  if(fromEnd===0) return bracket==='LB' ? 'Losers Final' : pre+'Final';
  if(fromEnd===1) return (bracket==='LB'?'Losers ':pre)+'Semifinal';
  if(fromEnd===2) return (bracket==='LB'?'Losers ':pre)+'Quarterfinal';
  if((bracket==='SE' || bracket==='PL') && fromEnd<=5) return pre+'Round of '+Math.pow(2, fromEnd+1);
  return (bracket==='LB'?'Losers Round ':'Round ')+round;
}

/* Standings-based events (Americano, round robin, groups) only hand out finishing
   points once every match is decided. Before that the table shows the position so
   far with no points, and before the first result nobody has a position at all. */
function standingsEventState(matches, finishedOverride){
  const DONE = ['completed','walkover','retired','bye','cancelled'];
  const played = matches.filter(m=>['completed','walkover','retired'].includes(m.status)).length;
  if(!played) return 'not_started';
  const final = finishedOverride===false ? false : finishedOverride===true ? true : matches.every(m=>DONE.includes(m.status));
  return final ? 'final' : 'in_progress';
}
function standingPlacement(pos, st){
  if(st==='not_started') return {points:0, label:'Not started', rank:pos, provisional:true};
  if(st==='in_progress') return {points:0, label:'#'+pos+' so far', rank:pos, provisional:true};
  return {points: standingPoints(pos), label:'#'+pos, rank:pos};
}
function computeEventPlacements(eventId){
  const pl = computeEventPlacementsRaw(eventId);
  const ev = eventById(eventId);
  return ev && ev.status==='completed' ? finalizePlacements(ev, pl) : pl;
}
function computeEventPlacementsRaw(eventId){
  const matches = eventMatches(eventId);
  const entries = eventEntries(eventId);
  const placements = {};
  if(!entries.length) return placements;
  const hasDE = matches.some(m=>m.bracket==='WB'||m.bracket==='LB'||m.bracket==='GF');
  const hasSE = matches.some(m=>m.bracket==='SE');
  const hasGroup = matches.some(m=>m.bracket==='GRP');
  const hasRR = matches.some(m=>m.bracket==='RR');
  const hasAM = matches.some(m=>m.bracket==='AM');
  if(hasSE || hasDE){
    const backbone = matches.filter(m=> hasDE ? m.bracket==='WB' : (m.bracket==='SE' && !m.isThirdPlace));
    const maxRound = backbone.length ? Math.max(...backbone.map(m=>m.round)) : 0;
    const priority = {GF:3, SE:2, WB:2, LB:1};
    const DONE_KO = ['completed','bye','walkover','retired'];
    const koMatches = matches.filter(m=>m.bracket!=='GRP' && m.bracket!=='PL');
    const plateAll = matches.filter(m=>m.bracket==='PL');
    const plMax = plateAll.length ? Math.max(...plateAll.map(m=>m.round)) : 0;
    const byId = {}; koMatches.forEach(m=>{ byId[m.id]=m; });
    entries.forEach(en=>{
      const mine = m=> m.entry1Id===en.id || m.entry2Id===en.id;
      // The plate (places 3-4 and so on): its own small placings, never the title.
      const plate = plateAll.filter(mine);
      if(plate.length && !koMatches.some(mine)){
        const done = plate.filter(m=>DONE_KO.includes(m.status) && m.status!=='bye').sort((a,b)=>b.round-a.round), last = done[0];
        const won = last && last.winnerEntryId===en.id;
        if(last && !last.nextMatchId && !last.isThirdPlace){ placements[en.id] = won ? {points:10, label:'Plate winner'} : {points:8, label:'Plate runner-up'}; return; }
        if(last && !won){ placements[en.id] = {points:5, label:roundLabelFor('PL', last.round, plMax)}; return; }
        const next = plate.filter(m=>!DONE_KO.includes(m.status)).sort((a,b)=>a.round-b.round)[0] || (last && last.nextMatchId && matches.find(m=>m.id===last.nextMatchId));
        placements[en.id] = {points:5, label: next ? roundLabelFor('PL', next.round, plMax)+' (still in)' : 'Plate'};
        return;
      }
      // Group matches of a "groups + knockout" event never decide the stage reached.
      const involved = koMatches.filter(m=> mine(m) && DONE_KO.includes(m.status));
      if(!involved.length){
        const upcoming = koMatches.filter(m=> mine(m) && !m.isThirdPlace).sort((a,b)=>a.round-b.round)[0];
        if(upcoming && matches.some(m=>m.bracket==='GRP')){
          // Qualified from the groups and waiting for the first knockout match.
          const dist = Math.max(0, maxRound-upcoming.round);
          placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(upcoming.bracket, upcoming.round, maxRound)+' (still in)'};
          return;
        }
        if(matches.some(m=>m.bracket==='GRP' && mine(m))){ placements[en.id]={points:5,label:'Group stage'}; return; }
        placements[en.id] = koMatches.some(m=>['completed','walkover','retired'].includes(m.status)) ? {points:0,label:'Did not play'} : {points:0,label:'Not started',provisional:true}; return;
      }
      involved.sort((a,b)=> (priority[b.bracket]-priority[a.bracket]) || (b.round-a.round) || ((a.isThirdPlace?1:0)-(b.isThirdPlace?1:0)));
      const last = involved[0];
      const won = last.winnerEntryId===en.id;
      if(last.isThirdPlace){ placements[en.id] = won ? {points:50,label:'Third place'} : {points:45,label:'Fourth place'}; return; }
      if(won && last.bracket==='GF'){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(won && last.bracket==='SE' && !last.nextMatchId){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(!won && last.bracket==='SE' && !last.nextMatchId){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      // Won and waiting for the next knockout round: they have reached that round.
      const nxt = won && last.bracket==='SE' && last.nextMatchId && byId[last.nextMatchId];
      if(nxt){
        const dist = Math.max(0, maxRound-nxt.round);
        placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(nxt.bracket, nxt.round, maxRound)+' (still in)'};
        return;
      }
      if(last.bracket==='GF' && !won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      if(last.bracket==='LB' && !last.nextMatchId && won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      const dist = Math.max(0, maxRound-last.round);
      placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(last.bracket,last.round,maxRound,last.isThirdPlace)};
    });
  } else if(hasAM){
    const individualEntries = entries.filter(e=>!e.isAmericanoTeam);
    const ev = eventById(eventId);
    const fin = matches.find(m=>m.bracket==='AMF');
    const roundMs = matches.filter(m=>m.bracket==='AM');
    const isMex = ev && (ev.americanoVariant||'classic')==='mexicano';
    // With a final, the event is only over once the final is decided (Mexicano included).
    const finalDone = fin && ['completed','walkover','retired'].includes(fin.status) && fin.winnerEntryId;
    const evDone = ev && ev.status==='completed';
    const useFinal = fin && finalDone;
    const state_ = useFinal ? standingsEventState(matches, roundMs.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status)) ? null : false)
                 : standingsEventState(matches.filter(m=>m.bracket!=='AMF'), evDone ? true : fin ? false : (isMex ? false : null));
    const standing = computeAmericanoStandings(individualEntries, matches);
    if(useFinal && state_==='final'){
      const win = entryById(fin.winnerEntryId), lose = entryById(fin.winnerEntryId===fin.entry1Id ? fin.entry2Id : fin.entry1Id);
      const champs = new Set(win ? entryPlayerIds(win) : []), runners = new Set(lose ? entryPlayerIds(lose) : []);
      let pos = 4;
      standing.forEach(row=>{
        const ent = individualEntries.find(e=>e.player1Id===row.playerId);
        if(!ent) return;
        if(champs.has(row.playerId)) placements[ent.id] = {points:100, label:'Champion', rank:1};
        else if(runners.has(row.playerId)) placements[ent.id] = {points:70, label:'Runner-up', rank:2};
        else { pos++; placements[ent.id] = standingPlacement(pos, 'final'); }
      });
    } else {
      standing.forEach((row,i)=>{
        const ent = individualEntries.find(e=>e.player1Id===row.playerId);
        if(ent) placements[ent.id] = standingPlacement(i+1, state_);
      });
    }
  } else if(hasGroup || hasRR){
    const draw = eventDraw(eventId);
    const groups = (draw && draw.groups && draw.groups.length) ? draw.groups : [{id:null, name:'', entryIds:entries.map(e=>e.id)}];
    groups.forEach(g=>{
      const gEntries = (g.entryIds && g.entryIds.length) ? g.entryIds : entries.map(e=>e.id);
      const gMatches = matches.filter(m=> g.id ? m.groupId===g.id : !m.groupId);
      const standing = computeGroupStandings(gEntries, gMatches, (draw&&draw.tiebreak)||TIEBREAK_DEFAULT);
      // Groups of a "groups + knockout" event are never the final result; a round robin is final once every match is played.
      const ev = eventById(eventId);
      const st = standingsEventState(gMatches, (ev && ev.status==='completed') ? true : (ev && ev.drawFormat==='group_knockout') ? false : null);
      standing.forEach((row,i)=>{ const pl = standingPlacement(i+1, st); if(g.name && pl.label!=='Not started') pl.label += ' · '+g.name; placements[row.entryId] = pl; });
    });
  }
  return placements;
}

/* Mark a match as being played now: it shows as LIVE (0-0) in the app and on the
   live link straight away. Takes a free court if it has none, and warns when a
   player is still on court in another match. */
async function startMatch(m){
  const busy = state.matches.filter(x=>x.id!==m.id && x.status==='in_progress' && x.tournamentId===m.tournamentId);
  const mine = new Set(matchEntryPlayerIds(m));
  const clash = busy.find(x=>matchEntryPlayerIds(x).some(p=>mine.has(p)));
  if(clash){
    const who = matchEntryPlayerIds(clash).filter(p=>mine.has(p)).map(playerName).join(', ');
    if(!await confirmDialog(who + ' is still playing' + (courtById(clash.courtId)?' on '+courtById(clash.courtId).name:'') + '. Start this match anyway?', {title:'Player still on court', okLabel:'Start anyway', danger:false})) return;
  }
  const patch = {status:'in_progress', actualStart:nowIso(), games:m.games||[], updatedAt:nowIso()};
  const courtBusy = m.courtId && busy.some(x=>x.courtId===m.courtId);
  if(!m.courtId || courtBusy){
    const nowMs = Date.now(), endMs = nowMs + (m.estDurationMin||30)*60000;
    const free = tCourts(m.tournamentId).filter(c=>c.active && !busy.some(x=>x.courtId===c.id))
      .sort((a,b)=>(courtOpenFor(b, nowMs, endMs)?1:0)-(courtOpenFor(a, nowMs, endMs)?1:0));   // courts open now first
    if(free.length) patch.courtId = free[0].id;
  }
  await act(async ()=>{ await Store.update('matches', m.id, patch); await markTournamentUnderway(m.tournamentId); });
  const c = courtById(patch.courtId || m.courtId);
  toast('Match started' + (c ? ' on ' + c.name : '') + ' - shown as live');
}
/* ============ FINISHING EVENTS AND TOURNAMENTS ============
   Finishing locks the results: any match not yet played is cancelled (and can be
   restored by reopening), and the final standings decide the champion - also when
   an event is stopped early. */
const DONE_STATUSES = ['completed','walkover','retired','bye','cancelled'];
function eventEntryStats(ev){
  const matches = eventMatches(ev.id), stats = {};
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  if(ev.drawFormat==='americano'){
    computeAmericanoStandings(entries, matches).forEach(r=>{ const en = entries.find(e=>e.player1Id===r.playerId); if(en) stats[en.id] = {...r, pointDiff:r.pointsFor-r.pointsAgainst}; });
  } else {
    computeGroupStandings(entries.map(e=>e.id), matches.filter(m=>m.entry1Id && m.entry2Id), TIEBREAK_DEFAULT).forEach(r=>{ stats[r.entryId] = r; });
  }
  return stats;
}
/* Once an event is finished every placement is final and someone is champion:
   rank by placement points, then position, wins, point difference, points won. */
function finalizePlacements(ev, placements){
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam && placements[e.id]);
  if(!entries.length) return placements;
  entries.forEach(e=>{ const p = placements[e.id]; if(p.label) p.label = p.label.replace(' (still in)',''); });
  if(entries.some(e=>placements[e.id].label==='Champion')){ entries.forEach(e=>{ if(placements[e.id].label!=='Not started') delete placements[e.id].provisional; }); return placements; }
  const st = eventEntryStats(ev), z = {wins:0, pointDiff:0, pointsFor:0};
  const played = entries.filter(e=>(st[e.id]||{}).played);
  if(!played.length) return placements;
  const order = entries.slice().sort((a,b)=>{
    const pa=placements[a.id], pb=placements[b.id], sa=st[a.id]||z, sb=st[b.id]||z;
    return ((pb.provisional?0:pb.points)-(pa.provisional?0:pa.points)) || ((pa.rank||999)-(pb.rank||999)) || (sb.wins-sa.wins) || (sb.pointDiff-sa.pointDiff) || (sb.pointsFor-sa.pointsFor);
  });
  order.forEach((e,i)=>{
    const p = placements[e.id];
    if(i===0){ placements[e.id] = {points:100, label:'Champion', rank:1}; return; }
    if(i===1){ placements[e.id] = {points:70, label:'Runner-up', rank:2}; return; }
    if(p.provisional){ placements[e.id] = {points: standingPoints(i+1), label:'#'+(i+1), rank:i+1}; return; }
  });
  return placements;
}
function eventChampions(evId){
  const pl = computeEventPlacements(evId);
  return eventEntries(evId).filter(e=>!e.isAmericanoTeam && pl[e.id] && pl[e.id].label==='Champion').map(e=>entryName(e));
}
async function finishEvent(ev, quiet){
  const pending = eventMatches(ev.id).filter(m=>!DONE_STATUSES.includes(m.status));
  for(const m of pending) await Store.update('matches', m.id, {status:'cancelled', cancelledByFinish:true, statusBeforeFinish:m.status});
  await Store.update('events', ev.id, {status:'completed', finishedAt:nowIso()});
  const champ = eventChampions(ev.id);
  await notify(ev.tournamentId, null, 'results_published', ev.name + ' finished' + (champ.length ? ' - champion: ' + champ.join(' & ') : '') + '.');
  await audit(ev.tournamentId, state.role, 'event_finished', ev.name + (pending.length ? ' (' + pending.length + ' unplayed matches cancelled)' : ''));
  return champ;
}
async function reopenEvent(ev){
  return act(async ()=>{
    for(const m of eventMatches(ev.id).filter(m=>m.cancelledByFinish))
      await Store.update('matches', m.id, {status: m.statusBeforeFinish || (m.entry1Id && m.entry2Id ? 'scheduled' : 'pending'), cancelledByFinish:false, statusBeforeFinish:null});
    await Store.update('events', ev.id, {status:'in_progress', finishedAt:null});
    const t = tournamentById(ev.tournamentId);
    if(t && t.status==='completed') await Store.update('tournaments', t.id, {status:'in_progress'});
    await audit(ev.tournamentId, state.role, 'event_reopened', ev.name);
  }, 'Event reopened');
}

    (pending ? ' ' + pending + ' match' + (pending===1?' isn\'t':'es aren\'t') + ' played yet and will be cancelled (reopen the event to bring them back).' : '');
  if(!await confirmDialog(msg, {title:'Finish event', okLabel:'Finish event', danger:false})) return;

  await act(async ()=>{ champ = await finishEvent(eventById(ev.id)); });

async function confirmFinishTournament(t){
  const evs = tEvents(t.id).filter(e=>e.status!=='completed');
  const pending = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && !DONE_STATUSES.includes(m.status)).length;
  const msg = 'Finish ' + t.name + '? ' + (evs.length ? 'All ' + evs.length + ' open event' + (evs.length===1?'':'s') + ' will be finished and their champions published from the final standings.' : 'Every event is already finished.') +

/* ============ LOCKED (FINISHED) TOURNAMENTS AND EVENTS ============
   A finished tournament, or a finished event, is read-only until it is reopened:
   no registrations, courts, draws, scheduling or scores. */
function tLocked(t){ return !!t && ['completed','cancelled'].includes(t.status); }
function evLocked(ev){ return !!ev && (ev.status==='completed' || tLocked(tournamentById(ev.tournamentId))); }
function matchLocked(m){ return !!m && evLocked(eventById(m.eventId)); }
function lockReason(t, ev){
  if(tLocked(t)) return t.name + ' is finished. Reopen it (\u22EF \u2192 Reopen tournament) to make changes.';
  if(ev && ev.status==='completed') return ev.name + ' is finished. Reopen the event to make changes.';
  return null;
}
const LOCK_T_IDS = new Set(['btnRegisterPlayerHeader','btnNewEvent','btnNewCourt','btnTournamentAddPlayer','btnNewPlayerFromTournament','btnEditTournament','btnSaveScoring','btnSaveLogistics','btnAssignAny']);
const LOCK_EV_IDS = new Set(['btnGenerateDraw','btnGenKnockout','btnGenNextMexicanoRound','btnFinishMexicano','btnEditEvent','btnSwapEntries']);
/* Called first on every click: returns a message when the click would change something locked. */
function lockedClickMessage(target, t){
  if(!t || state.role!=='admin' || VIEWER) return null;
  const btn = target.closest('button, [data-open-live], [data-open-schedule], [data-open-decide], [data-open-correct]');
  if(!btn) return null;
  if(btn.id && LOCK_T_IDS.has(btn.id)) return lockReason(t, null);
  if(btn.id && LOCK_EV_IDS.has(btn.id)) return lockReason(t, eventById(state.eventId));
  const a = n=>btn.getAttribute(n);
  if(a('data-toggle-court') || a('data-edit-court') || a('data-delete-court') || a('data-delete-event') || a('data-finish-event') || a('data-reopen-event')) return lockReason(t, null);
  if(a('data-board-slot')) return lockReason(t, null);
  if(a('data-clear-draw') || a('data-edit-event') || a('data-gen-draw') || a('data-schedule-all')) return lockReason(t, eventById(a('data-clear-draw') || a('data-edit-event') || a('data-gen-draw') || a('data-schedule-all')));
  const evAttr = a('data-admin-register-event') || a('data-ev-players') || a('data-ev-seeds') || a('data-add-am-rounds') || a('data-am-final') || a('data-am-final-remove') || a('data-am-skip-rest');
  if(evAttr) return lockReason(t, eventById(evAttr));
  const mid = a('data-open-live') || a('data-open-schedule') || a('data-open-decide') || a('data-open-correct') || a('data-start-match') || a('data-unstart-match') || a('data-unskip-match');
  if(mid){ const m = matchById(mid); if(m) return lockReason(t, eventById(m.eventId)); }
  return null;
}

function computePlayerStats(filterFn, opts){
  const skipT = opts && opts.excludeTournamentId;
  const qp = quickPlayIds();   // quick play games never count
  const stats = {};
  function ensure(pid){
    if(!stats[pid]) stats[pid] = {playerId:pid, player:playerById(pid), matchesPlayed:0, wins:0, losses:0,
      gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, tournaments:new Set(), titles:0, rankingPoints:0};
    return stats[pid];
  }
  const placementsByEvent = {};
  state.events.forEach(ev=>{
    if(ev.tournamentId===skipT || qp.has(ev.tournamentId)) return;
    const pl = placementsByEvent[ev.id] = computeEventPlacements(ev.id);
    Object.entries(eventRankPoints(ev.id, pl)).forEach(([pid, n])=>{ ensure(pid).rankingPoints += n; });
  });
  state.entries.forEach(entry=>{
    const pids = entryPlayerIds(entry);
    const ev = eventById(entry.eventId);
    if(!pids.length || !ev || (skipT && ev.tournamentId===skipT) || qp.has(ev.tournamentId)) return;
    const pl = placementsByEvent[ev.id] && placementsByEvent[ev.id][entry.id];
    pids.forEach(pid=>{
      const s = ensure(pid);
      s.tournaments.add(ev.tournamentId);
      if(pl && pl.label==='Champion' && !entry.isAmericanoTeam) s.titles++;
    });
  });
  state.matches.forEach(m=>{
    if(!['completed','walkover','retired'].includes(m.status)) return;
    if((skipT && m.tournamentId===skipT) || qp.has(m.tournamentId)) return;
    [[m.entry1Id,1],[m.entry2Id,2]].forEach(([entryId,side])=>{
      const entry = entryById(entryId); if(!entry) return;
      const pids = entryPlayerIds(entry);
      let g1=0,g2=0,p1=0,p2=0;
      const cfg = matchScoring(m); (m.games||[]).forEach((g,i)=>{ const w=ScoreRules.gameWinner(g,cfg,i); if(w===1)g1++; else if(w===2)g2++; const [x,y]=ScoreRules.tally(g,cfg,i); p1+=x; p2+=y; });
      const won = m.winnerEntryId===entryId;
      const gw = side===1?g1:g2, gl = side===1?g2:g1, pf = side===1?p1:p2, pa = side===1?p2:p1;
      pids.forEach(pid=>{
        const s = ensure(pid);
        s.matchesPlayed++; if(won) s.wins++; else s.losses++;
        s.gamesWon+=gw; s.gamesLost+=gl; s.pointsFor+=pf; s.pointsAgainst+=pa;
      });
    });
  });
  return Object.values(stats).map(s=>({...s, tournamentsCount:s.tournaments.size,
    winPct: s.matchesPlayed ? Math.round(100*s.wins/s.matchesPlayed) : 0
  })).filter(s=> !filterFn || filterFn(s));
}



/* Gender as stored can be "male", "Male", "M", "" ... compare on one spelling. */
function normGender(g){
  const v = String(g||'').trim().toLowerCase();
  if(['male','m','man','men'].includes(v)) return 'male';
  if(['female','f','woman','women'].includes(v)) return 'female';
  return 'unspecified';
}
/* Names compare ignoring case, accents and extra spaces ("José  Diaz" = "jose diaz"). */
function normPlayerName(n){ return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }

/* A seed is a whole number from 1; anything else means unseeded. */
function validSeed(v){ const n = parseInt(v,10); return Number.isFinite(n) && n>=1 ? n : null; }


function maxRoundForBracket(eventId, bracket){
  const ms = eventMatches(eventId).filter(m=>m.bracket===bracket && !m.isThirdPlace);
  return ms.length ? Math.max(...ms.map(m=>m.round)) : 0;
}
function roundLabelForMatch(m){
  return roundLabelFor(m.bracket, m.round, maxRoundForBracket(m.eventId, m.bracket), m.isThirdPlace);
}

    <div class="search-box"><span>${ICONS.search}</span><input id="globalSearch" placeholder="Search players, events..." value="${esc(state.search)}"></div>
    ${renderSearchResults()}
  </div>`;
}
function globalSearchResults(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return null;
  const players = state.players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
  const tournaments = state.tournaments.filter(t=>t.name.toLowerCase().includes(q)).slice(0,4);
  const clubs = state.clubs.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4);
  const events = state.events.filter(e=>e.name.toLowerCase().includes(q)).slice(0,4);
  return {players, tournaments, clubs, events};
}
function renderSearchResults(){
  if(!state.searchOpen) return '';
  const r = globalSearchResults(state.search);
  if(!r) return `<div class="search-results open"><div class="sr-empty">Start typing to search.</div></div>`;
  const total = r.players.length+r.tournaments.length+r.clubs.length+r.events.length;
  if(!total) return `<div class="search-results open"><div class="sr-empty">No matches for "${esc(state.search)}".</div></div>`;
  function group(title, items, render){
    if(!items.length) return '';
    return `<div class="sr-group"><h4>${title}</h4>${items.map(render).join('')}</div>`;
  }
  return `<div class="search-results open">
    ${group('Tournaments', r.tournaments, t=>`<button class="sr-item" data-open-tournament="${t.id}">${esc(t.name)}<div class="sr-sub">${esc(t.status)}</div></button>`)}
    ${group('Events', r.events, e=>`<button class="sr-item" data-open-tournament="${e.tournamentId}" data-open-tab="events" data-open-event-id="${e.id}">${esc(e.name)}<div class="sr-sub">${(tournamentById(e.tournamentId)||{}).name||''}</div></button>`)}
    ${group('Players', r.players, p=>`<button class="sr-item" data-open-player="${p.id}">${esc(p.name)}<div class="sr-sub">${esc((clubById(p.clubId)||{}).name||'No club')}</div></button>`)}
    ${group('Clubs', r.clubs, c=>`<button class="sr-item" data-open-club="${c.id}">${esc(c.name)}<div class="sr-sub">Club &middot; show its players</div></button>`)}
  </div>`;
}

function renderNotifPanel(){
  if(!state.notifOpen) return '';
  const list = visibleNotifications().slice(0,30);
  return `<div class="notif-panel open">
    <div class="notif-head"><h4>Notifications</h4><button class="btn btn-sm btn-ghost" id="btnMarkAllRead">Mark all read</button></div>
    ${list.length ? list.map(n=>`<div class="notif-item ${n.read?'':'unread'}" data-mark-read="${n.id}">
        <span class="notif-dot"></span>
        <div class="notif-body"><p>${esc(n.message)}</p><span class="notif-time">${esc(timeAgo(n.createdAt))}</span></div>
      </div>`).join('') : `<div class="sr-empty">No notifications yet.</div>`}
  </div>`;
}

/* ============================== VIEW DISPATCH ============================== */
function renderView(){
  const withSidebar = !VIEWER && ['dashboard','tournaments','tdetail'].includes(state.view);
  const inner = viewBody();
  if(withSidebar){
    return `<div class="layout">
      <aside class="panel sidebar">${renderTournamentSidebar()}</aside>
      <main class="panel main"><div class="main-inner">${inner}</div></main>
    </div>`;
  }
  return `<div class="layout no-sidebar"><main class="panel main"><div class="main-inner">${inner}</div></main></div>`;
}
function viewBody(){
  if(VIEWER){
    if(state.viewerError && (state.viewerError==='gone' || !state.tournaments.length)) return ViewerMode.errorScreen();
    if(!state.ready) return `<div class="loading-tab">Loading the tournament&hellip;</div>`;
    return renderTournamentDetail();
  }
  if(!state.ready) return `<div class="loading-tab">Loading&hellip;</div>`;
  switch(state.view){
    case 'dashboard': return renderDashboard();
    case 'quickplay': return renderQuickPlaySetup();
    case 'tournaments': return renderTournamentsList();
    case 'tdetail': return renderTournamentDetail();
    case 'players': return renderPlayersRegistry();
    case 'rankings': return renderRankingsView();
    case 'reports': return renderReportsView();
    case 'audit': return renderAuditLogView();
    case 'settings': return renderSettingsView();
    case 'guide': return renderGuideView();
    case 'home': return renderPlayerHome();
    case 'mytournaments': return renderMyTournaments();
    case 'mymatches': return renderMyMatches();
    case 'schedule': return renderGlobalSchedule();
    case 'results': return renderGlobalResults();
    case 'draws': return renderGlobalDraws();
    case 'live': return renderGlobalLive();
    case 'profile': return renderProfileView();
    case 'more': return renderMoreView();
    default: return renderDashboard();
  }
}

function visibleTournaments(){
  if(state.role==='admin') return state.tournaments;
  return state.tournaments.filter(t=>t.status!=='draft');
}
function statusPill(status){
  const map = {draft:'',registration_open:'court',registration_closed:'',draw_published:'gold',in_progress:'live',completed:'court',cancelled:'danger'};
  const cls = map[status]||'';
  const label = (status||'').replace(/_/g,' ');
  return `<span class="pill ${cls}">${status==='in_progress'?'&#9679; ':''}${esc(label)}</span>`;
}
function renderTournamentSidebar(){
  const list = visibleTournaments().slice().sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''));
  return `<div class="sidebar-head"><h2>Tournaments</h2>${state.role==='admin'?`<button class="icon-btn" id="btnNewTournament" title="New tournament">${ICONS.plus}</button>`:''}</div>
    ${list.length ? `<ul class="t-list">${list.map(t=>`
      <li class="t-item ${state.tid===t.id?'active':''}"><button data-select-tournament="${t.id}">
        <span class="t-name">${esc(t.name)}</span>
        <span class="t-meta">${esc(fmtDate(t.startDate))} ${tournamentStatusPill(t, false, true)}</span>
      </button></li>`).join('')}</ul>` : `<p class="empty-note">${state.role==='admin'?'No tournaments yet. Tap + to create one, or load demo data from the Dashboard.':'Nothing published yet.'}</p>`}`;
}


/* ---------- TOURNAMENT DETAIL ---------- */
function tabsForRole(){
  const ct = !VIEWER && currentTournament();
  if(state.role==='admin' && ct && ct.quickPlay) return [['draws','Play'],['matches','Matches']];
  if(state.role==='admin') return [['overview','Overview'],['events','Events'],['matches','Matches'],['results','Results'],['settings','Settings']];
  if(state.role==='player') return [['overview','Overview'],['mymatches','My Matches'],['draws','Draws'],['results','Results'],['register','Register']];
  const pub = [['overview','Overview'],['live','Live'],['schedule','Schedule'],['draws','Draws'],['results','Results'],['players','Players']];
  if(!VIEWER) return pub;
  // The live link keeps to what spectators want: what's on court, what's next, results, and the table.
  const n = viewerMatchLists(currentTournament());
  const tabs = [['live','Live'+(n.live.length?' '+n.live.length:'')],['completed','Completed'],['standings','Standings']];
  return VIEWER.reg ? [['signup','Register'], ...tabs] : tabs;   // opened from the registration link
}
function renderTournamentDetail(){
  const t = currentTournament();
  if(!t) return `<div class="empty-tab">Select a tournament from the sidebar, or <button class="btn btn-sm" id="btnGoTournaments" style="margin-left:6px">browse tournaments</button>.</div>`;
  const tabs = tabsForRole();
  const admin = state.role==='admin' && !VIEWER;
  // General and Courts are one Settings page; an event's draw page sits under Events,
  // the tournament's player list under Overview (their own keys stay valid).
  if(admin && ['general','courts'].includes(state.tab)) state.tab = 'settings';
  if(admin && state.tab==='schedule') state.tab = 'matches';
  const parent = admin && !t.quickPlay ? SUB_PAGES[state.tab] : null;
  if(!parent && !tabs.find(x=>x[0]===state.tab)) state.tab = VIEWER ? viewerDefaultTab(t) : tabs[0][0];
  const topTab = parent || state.tab;
  const backView = 'tournaments';
  return `
    <div class="t-header">
      <div><h2>${esc(t.name)}</h2><div class="t-sub">${t.quickPlay ? `<span class="pill">Quick play</span> <span class="sub-txt">Doesn’t count towards rankings</span>` : esc(fmtDate(t.startDate))}${t.venue?' &middot; '+esc(t.venue):''} ${t.quickPlay ? '' : tournamentStatusPill(t, true)}${!VIEWER && isShareLive(t)?` <span class="pill court" title="Anyone with the link can follow this tournament">${ICONS.link} Live link on</span>`:''}${!VIEWER && t.share && t.share.expired && state.role==='admin'?` <span class="pill" title="Not changed for ${SHARE_KEEP_DAYS} days, so the link was removed">${ICONS.link} Link expired</span>`:''}</div></div>
      ${state.role==='admin' && t.quickPlay ? `<div class="t-actions" data-more-scope data-more-title="${esc(t.name)}">
        <button class="btn btn-sm m-keep" data-qp-new="1">${ICONS.plus} New</button>
        <button class="btn btn-danger btn-sm m-overflow" id="btnDeleteTournament">${ICONS.trash} Delete quick play</button>
        ${moreMenuBtn()}
      </div>` : state.role==='admin' ? `<div class="t-actions" data-more-scope data-more-title="${esc(t.name)}">
        <button class="btn btn-sm" id="btnShareTournament" aria-label="Share live link" title="Share live link">${ICONS.share} Share</button>
        ${t.status!=='completed'?`<button class="btn btn-primary btn-sm m-overflow" id="btnRegisterPlayerHeader">${ICONS.plus} Register player</button>`:''}
        ${t.status!=='completed'?`<button class="btn btn-sm m-overflow" id="btnFinishTournament">${ICONS.trophy} Finish tournament</button>`:`<button class="btn btn-sm m-overflow" id="btnReopenTournament">${ICONS.undo} Reopen tournament</button>`}
        ${t.status!=='completed'?`<button class="btn btn-sm m-overflow" id="btnEditTournament">${ICONS.edit} Edit tournament</button>`:''}
        <button class="btn btn-sm m-overflow" id="btnCopyTournament">${ICONS.plus} Copy as new tournament</button>
        <button class="btn btn-danger btn-sm m-overflow" id="btnDeleteTournament">${ICONS.trash} Delete tournament</button>
        ${moreMenuBtn()}
      </div>` : (!VIEWER && isShareLive(t) ? `<div class="t-actions"><button class="btn btn-sm" id="btnShareTournament">${ICONS.share} Share</button></div>` : '')}
    </div>
    ${VIEWER ? renderFollowBar() : ''}
    <div class="tabs">${tabs.map(([k,label])=>`<button class="tab ${topTab===k?'active':''}" data-tab="${k}">${esc(label)}</button>`).join('')}</div>
    ${VIEWER ? renderSponsorTicker(t) : ''}
    <div id="tabBody">${parent ? `<button type="button" class="back-link no-print" data-tab="${parent}">${ICONS.back} ${esc((tabs.find(x=>x[0]===parent)||[,''])[1])}</button>` : ''}${renderTabBody(t)}</div>
  `;
}
const SUB_PAGES = {draws:'events', players:'overview'};   // organiser pages reached from a tab, not shown as tabs

function ringSvg(pct, color){
  pct = clamp(pct,0,100);
  const r=26, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color||'var(--court)'}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${Math.round(pct)}%</text>
  </svg>`;
}
function renderOverviewTab(t){
  const evs = tEvents(t.id);
  const matches = tMatches(t.id);
  const regs = tRegistrations(t.id);
  const courts = tCourts(t.id);
  const completed = matches.filter(m=>['completed','walkover','retired','bye'].includes(m.status));
  const live = matches.filter(m=>m.status==='in_progress');
  const scheduled = matches.filter(m=>['scheduled','called'].includes(m.status));
  const pct = matches.length ? Math.round(100*completed.length/matches.length) : 0;
  const upcoming = matches.filter(m=>m.scheduledStart && ['scheduled','called'].includes(m.status)).sort((a,b)=>a.scheduledStart.localeCompare(b.scheduledStart)).slice(0,6);
  const recent = completed.slice().sort((a,b)=>(b.actualEnd||b.updatedAt||'').localeCompare(a.actualEnd||a.updatedAt||'')).slice(0,6);
  const regByStatus = {confirmed:0, pending:0, waitlisted:0, withdrawn:0, rejected:0};
  regs.forEach(r=> regByStatus[r.status] = (regByStatus[r.status]||0)+1);
  const roleTabs = tabsForRole().map(x=>x[0]);
  const go = k => (roleTabs.includes(k) || (state.role==='admin' && ['players','courts','schedule','draws'].includes(k))) ? `data-tab="${k}" role="button"` : '';
  return `
    ${renderChampionsCard(t)}
    ${(()=>{ const n = state.role==='admin' && !VIEWER ? regs.filter(r=>r.status==='pending' && r.source==='link').length : 0;
      return n ? `<div class="finish-hint">${n} sign-up${n===1?'':'s'} from the registration link ${n===1?'is':'are'} waiting for you to confirm. <button class="btn btn-sm btn-primary" data-tab="events">Review</button></div>` : ''; })()}
    ${state.role==='admin' && t.status!=='completed' && evs.length && evs.every(e=>e.status==='completed') ? `<div class="finish-hint">Every event is finished. <button class="btn btn-sm btn-primary" id="btnFinishTournament">${ICONS.trophy} Finish tournament</button></div>`:''}
    <div class="stat-grid">
      <div class="stat-tile accent" ${go('players')}><div class="stat-num">${new Set(regs.map(r=>r.playerId)).size}</div><div class="stat-label">Registered players</div></div>
      <div class="stat-tile" ${go('events')}><div class="stat-num">${evs.length}</div><div class="stat-label">Events</div></div>
      <div class="stat-tile gold" ${go('matches')}><div class="stat-num">${live.length}</div><div class="stat-label">Live matches</div></div>
      <div class="stat-tile" ${go('schedule')}><div class="stat-num">${scheduled.length}</div><div class="stat-label">Scheduled</div></div>
      <div class="stat-tile" ${go('results')}><div class="stat-num">${completed.length}/${matches.length}</div><div class="stat-label">Completed</div></div>
      <div class="stat-tile" ${go('courts')}><div class="stat-num">${courts.filter(c=>c.active).length}/${courts.length}</div><div class="stat-label">Courts active</div></div>
    </div>
    <div class="section-h"><h3>Match progress</h3></div>
    <div class="ring-wrap">${ringSvg(pct)}<div class="ring-label"><strong>${completed.length} of ${matches.length} matches played</strong>${live.length? live.length+' live right now':'No live matches right now'}</div></div>
    <div class="section-h"><h3>Registration status</h3></div>
    ${Object.entries(regByStatus).map(([k,v])=>`<div class="bar-row"><span class="bar-label">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${regs.length?Math.round(100*v/regs.length):0}%"></div></div><span class="bar-num">${v}</span></div>`).join('')}
    <div class="section-h"><h3>Upcoming matches</h3></div>
    ${upcoming.length ? upcoming.map(renderMatchListRow).join('') : `<div class="empty-tab">Nothing scheduled yet.</div>`}
    <div class="section-h"><h3>Recent results</h3></div>
    ${recent.length ? recent.map(renderMatchListRow).join('') : `<div class="empty-tab">No results yet.</div>`}
  `;
}
function winnerLabel(m){
  if(!['completed','walkover','retired'].includes(m.status) || !m.winnerEntryId) return '';
  const w = entryById(m.winnerEntryId);
  return w ? esc(entryName(w)) + ' won' : '';
}
function renderMatchListRow(m){ return renderScoreboard(m, {}); }

function matchStatusPill(m){
  const map = {scheduled:'',called:'gold',in_progress:'live',completed:'court',walkover:'gold',retired:'danger',cancelled:'danger',postponed:'danger',bye:'gold',pending:''};
  return `<span class="pill ${map[m.status]||''}">${m.status==='in_progress'?'&#9679; LIVE':esc((m.status||'').replace(/_/g,' '))}</span>`;
}


function renderBracketColumns(matches, containerId, editable){
  if(!matches.length) return `<div class="empty-tab">No matches in this bracket yet.</div>`;
  const byRoundPos = {};
  matches.forEach(m=>{ (byRoundPos[m.round]=byRoundPos[m.round]||[]).push(m); });
  const roundNums = Object.keys(byRoundPos).map(Number).sort((a,b)=>a-b);
  const maxRound = roundNums.length?Math.max(...roundNums):0;
  const cols = roundNums.map(r=>{
    const ms = byRoundPos[r].slice().sort((a,b)=>a.position-b.position);
    const cards = ms.map(m=>renderMatchCard(m, maxRound, editable)).join('');
    return `<div class="round-col"><div class="round-label">${esc(roundLabelFor(ms[0].bracket, r, maxRound, ms[0].isThirdPlace))}</div>${cards}</div>`;
  }).join('');
  return `<div class="bracket-wrap"><div class="bracket" id="${containerId}"><svg class="bracket-lines" id="${containerId}Lines"></svg>${cols}</div></div>`;
}
/* A set won 7-6: the tiebreak points, small, after the loser's games (7-6⁴). */
function tiebreakSup(g, w, key){
  if(!g.tb || !w || (w===1)===(key==='a')) return '';
  return `<sup class="tb-sup">${g.tb[key]|0}</sup>`;
}
function bracketScoreCells(m, key){
  const live = m.status==='in_progress';
  const cfg = matchScoring(m);
  return `<span class="score mono mc-g">${(m.games||[]).map((g,i)=>{ const w=ScoreRules.gameWinner(g,cfg,i); const won=(w===1&&key==='a')||(w===2&&key==='b'); const cur = live && i===m.games.length-1 && !w;
    return `<span class="mc-c ${won?'w':''} ${cur?'cur':''}">${g[key]}${tiebreakSup(g, w, key)}</span>`; }).join('')}</span>`;
}
function renderMatchCard(m, maxRound, editable){
  const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
  const playable = e1 && e2 && !['completed','bye','cancelled'].includes(m.status);
  const w = m.winnerEntryId;
  return `<div class="match-card ${playable&&editable?'playable':''}" data-match-id="${m.id}" ${m.nextMatchId?`data-next="${m.nextMatchId}"`:''} ${playable&&editable?`data-open-live="${m.id}"`:''} ${!playable?`data-open-match="${m.id}"`:''}>
    <div class="m-slot ${!e1?'tbd':''} ${w&&w===m.entry1Id?'winner':''}"><span class="name">${e1&&validSeed(e1.seed)?`<span class="seed-tag" title="Seed ${validSeed(e1.seed)}">${validSeed(e1.seed)}</span>`:''}${esc(matchSideName(m,1))}</span>${e1&&m.games&&m.games.length?bracketScoreCells(m,'a'):''}</div>
    <div class="m-slot ${!e2?'tbd':''} ${w&&w===m.entry2Id?'winner':''}"><span class="name">${e2&&validSeed(e2.seed)?`<span class="seed-tag" title="Seed ${validSeed(e2.seed)}">${validSeed(e2.seed)}</span>`:''}${esc(matchSideName(m,2))}</span>${e2&&m.games&&m.games.length?bracketScoreCells(m,'b'):''}</div>
    <div class="m-status ${m.status==='bye'?'bye':''} ${m.status==='in_progress'?'live':''}">${m.status==='bye'?'Bye':m.status==='in_progress'?'Live':m.status==='completed'?'Final':m.status==='walkover'?'Walkover':(m.scheduledStart?esc(fmtTime(m.scheduledStart)):'TBD')}</div>
  </div>`;
}
function renderStandingsTable(rows){
  if(!rows.length) return `<div class="empty-tab">No entries.</div>`;
  // Tennis and padel count sets and games where badminton counts games and points.
  const ev = rows[0].entry && eventById(rows[0].entry.eventId);
  const sets = !!ev && isSetScoring(scoringFor(ev, tournamentById(ev.tournamentId), {bracket:'GRP'}));
  return `<div class="table-scroll"><table class="standings"><thead><tr><th>#</th><th>Entry</th><th class="num">P</th><th class="num">W-L</th><th class="num">${sets?'Set diff':'Game diff'}</th><th class="num">${sets?'Game diff':'Point diff'}</th></tr></thead>
  <tbody>${rows.map((r,i)=>`<tr class="rank-${i+1}"><td class="rk mono">${i+1}</td><td>${esc(entryName(r.entry))}</td><td class="num mono">${r.played}</td><td class="num mono">${r.wins}-${r.losses}</td>
    <td class="num mono">${r.gameDiff>0?'+':''}${r.gameDiff}</td><td class="num mono">${r.pointDiff>0?'+':''}${r.pointDiff}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderRoundRobinMatchList(matches, editable, sitOutByRound){
  const byRound={}; matches.forEach(m=>(byRound[m.round]=byRound[m.round]||[]).push(m));
  const rowFn = m=>renderScoreboard(m, {actions: editable && state.role==='admin' && !matchLocked(m), hideEvent:true});
  return Object.keys(byRound).map(Number).sort((a,b)=>a-b).map(r=>{
    const sit = (sitOutByRound && sitOutByRound[r]) || [];
    return `
    <div class="sub-txt" style="margin:10px 0 4px;font-weight:700;font-size:12px">Round ${r}${sit.length?` <span style="font-weight:500;color:var(--muted)">&middot; sitting out: ${sit.map(pid=>esc(playerName(pid))).join(', ')}</span>`:''}</div>
    ${byRound[r].slice().sort((a,b)=>a.position-b.position).map(rowFn).join('')}
  `;}).join('');
}
function renderBracketForEvent(ev, editable){
  const draw = eventDraw(ev.id);
  if(!draw) return `<div class="empty-tab">No draw generated for this event yet.</div>`;
  const matches = eventMatches(ev.id);
  if(draw.format==='round_robin'){
    const entries = eventEntries(ev.id);
    const standing = computeGroupStandings(entries.map(e=>e.id), matches, draw.tiebreak);
    return renderStandingsTable(standing) + `<div class="section-h"><h3>Matches</h3></div>` + renderRoundRobinMatchList(matches, editable);
  }
  if(draw.format==='group_knockout'){
    const groupsHtml = (draw.groups||[]).map(g=>{
      const gMatches = matches.filter(m=>m.groupId===g.id);
      const standing = computeGroupStandings(g.entryIds, gMatches, draw.tiebreak);
      return `<div class="group-card card"><h4>${esc(g.name)}</h4>${renderStandingsTable(standing)}
        <div class="sub-txt" style="margin:10px 0 4px;font-weight:700;font-size:12px">Matches</div>${renderRoundRobinMatchList(gMatches, editable)}</div>`;
    }).join('');
    const koMatches = matches.filter(m=>m.bracket==='SE'), plateMs = matches.filter(m=>m.bracket==='PL');
    const plateHtml = plateMs.length ? `<div class="section-h"><h3>Plate</h3><span class="sub-txt">${esc(plateNote(plateMs))}</span></div>${renderBracketColumns(plateMs,'bracketPlate',editable)}` : '';
    return `<div class="group-grid">${groupsHtml}</div>` +
      (koMatches.length ? `<div class="section-h"><h3>Knockout stage</h3></div>${renderBracketColumns(koMatches,'bracketMain',editable)}` :
      `<div class="section-h"><h3>Knockout stage</h3></div><div class="empty-tab">This draw was made before the knockout was generated with the groups. Use "Add knockout bracket" (Events &rarr; the event &rarr; View draw) to add it; qualifiers fill in as each group finishes.</div>`) + plateHtml;
  }
  if(draw.format==='double_elimination'){
    const wb = matches.filter(m=>m.bracket==='WB'), lb = matches.filter(m=>m.bracket==='LB'), gf = matches.filter(m=>m.bracket==='GF').sort((a,b)=>a.round-b.round);
    return `<div class="bracket-section wb"><h4>Winners bracket</h4>${renderBracketColumns(wb,'bracketWB',editable)}</div>
      <div class="bracket-section lb"><h4>Losers bracket</h4>${renderBracketColumns(lb,'bracketLB',editable)}</div>
      <div class="bracket-section gf"><h4>Grand final${gf.length>1?' (bracket reset)':''}</h4><div class="cat-grid" style="max-width:440px">${gf.map(m=>renderMatchCard(m,1,editable)).join('')}</div></div>`;
  }
  if(draw.format==='americano'){
    const individualEntries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
    const standing = computeAmericanoStandings(individualEntries, matches);
    const standingsHtml = (ev.americanoVariant==='mixed')
      ? `<div class="group-grid">
          <div class="group-card card"><h4>Men</h4>${renderAmericanoStandingsTable(standing.filter(r=>{const p=playerById(r.playerId); return p&&normGender(p.gender)==='male';}))}</div>
          <div class="group-card card"><h4>Women</h4>${renderAmericanoStandingsTable(standing.filter(r=>{const p=playerById(r.playerId); return p&&normGender(p.gender)==='female';}))}</div>
        </div>`
      : renderAmericanoStandingsTable(standing);
    const fin = americanoFinalMatch(ev.id);
    const rankNote = americanoRankingNote(ev);
    const isAdmin = editable && state.role==='admin';
    const canAdd = isAdmin && (ev.americanoVariant||'classic')!=='mexicano' && !fin;
    return renderAmericanoFinalCard(ev, fin, editable) + standingsHtml + rankNote + `<div class="section-h"><h3>Rounds</h3>${canAdd?`<button class="btn btn-sm no-print" data-add-am-rounds="${ev.id}">${ICONS.plus} Add rounds</button>`:''}</div>` + renderRoundRobinMatchList(matches.filter(m=>m.bracket!=='AMF'), editable, draw.americanoSitOut);
  }
  return renderBracketColumns(matches.filter(m=>m.bracket==='SE'), 'bracketMain', editable);
}
function renderAmericanoFinalCard(ev, fin, editable){
  const isAdmin = editable && state.role==='admin';
  if(!fin){
    if(!isAdmin) return '';
    const ready = americanoRoundsDone(ev.id);
    const left = americanoRoundMatches(ev.id).filter(m=>!['completed','walkover','retired','bye','cancelled'].includes(m.status)).length;
    const skippable = americanoRoundMatches(ev.id).filter(canSkipMatch).length;
    return `<div class="am-final-card no-print"><div class="row-h"><h4>Final</h4><span class="am-final-btns">${skippable ? `<button class="btn btn-sm" data-am-skip-rest="${ev.id}" title="Matches that won't be played: no points, and the final can be created">Skip unplayed (${skippable})</button>` : ''}<button class="btn btn-sm btn-primary" data-am-final="${ev.id}" ${ready?'':'disabled'} title="${ready?'Create the final':'Finish or skip every round match first'}">Create final</button></span></div>
      <div class="helptext">${ready ? 'All rounds are scored. Create a final for the top four, or tap <b>Finish event</b> to end with the table as it stands.' : 'When the rounds are done, the top four can play a final for the title.' + (left ? ' ' + left + ' round match' + (left===1?'':'es') + ' still to finish.' + (skippable ? ' Out of time? <b>Skip unplayed</b> ends the rounds with the table as it stands (or use <b>W/O</b> → Skip on one match).' : '') : '')}</div></div>`;
  }
  const w = fin.winnerEntryId && entryById(fin.winnerEntryId);
  // The champions sit at the foot of the final's scorecard, with a small cup.
  const champ = w ? `<div class="sb-champ">${ICONS.trophy||''}<span>Champions: ${esc(entryName(w))}</span></div>` : '';
  const rowFn = m=>renderScoreboard(m, {actions: editable && state.role==='admin' && !matchLocked(m), hideEvent:true, foot: champ});
  const sc = scoringFor(ev, tournamentById(ev.tournamentId), fin);
  return `<div class="am-final-card"><div class="row-h"><h4>Final</h4>${isAdmin && fin.status!=='completed' ? `<button class="btn btn-sm btn-ghost no-print" data-am-final-remove="${ev.id}">Remove</button>`:''}</div>
    <div class="helptext" style="margin-bottom:6px">${esc(describeScoring(sc))}</div>
    ${rowFn(fin)}</div>`;
}
function renderAmericanoStandingsTable(rows){

    <td class="num mono" ${r.bonus?`title="${r.pointsFor} won + ${r.bonus} win bonus"`:''}>${r.total ?? r.pointsFor}</td></tr>`).join('')}</tbody></table></div>`;

function drawBracketConnectorsFor(containerId){
  const container = document.getElementById(containerId);
  const svg = document.getElementById(containerId+'Lines');
  if(!container||!svg) return;
  const w=container.scrollWidth, h=container.scrollHeight;
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.style.width=w+'px'; svg.style.height=h+'px';
  svg.innerHTML='';
  const rect0 = container.getBoundingClientRect();
  container.querySelectorAll('.match-card[data-next]').forEach(card=>{
    const nextId = card.getAttribute('data-next');
    const nextCard = container.querySelector('.match-card[data-match-id="'+nextId+'"]');
    if(!nextCard) return;
    const r1=card.getBoundingClientRect(), r2=nextCard.getBoundingClientRect();
    const x1=r1.right-rect0.left, y1=r1.top+r1.height/2-rect0.top;
    const x2=r2.left-rect0.left, y2=r2.top+r2.height/2-rect0.top;
    const midX=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
    svg.appendChild(path);
  });
}
function drawAllBracketConnectors(){
  ['bracketMain','bracketWB','bracketLB','bracketPlate'].forEach(id=>{ if(document.getElementById(id)) drawBracketConnectorsFor(id); });
}
window.addEventListener('resize', ()=>{ requestAnimationFrame(drawAllBracketConnectors); });

/* ---------- MATCHES TAB ---------- */
function applyMatchFilters(matches, f){
  f = f||{};
  return matches.filter(m=>{
    if(f.eventId && m.eventId!==f.eventId) return false;
    if(f.courtId && m.courtId!==f.courtId) return false;
    if(f.status && m.status!==f.status) return false;
    if(f.date && (!m.scheduledStart || m.scheduledStart.slice(0,10)!==f.date)) return false;
    if(VIEWER && state.followPlayerId && !matchHasPlayer(m, state.followPlayerId)) return false;
    if(f.player){
      const q=f.player.toLowerCase();
      const names = matchEntryPlayerIds(m).map(pid=>playerName(pid).toLowerCase());
      if(!names.some(n=>n.includes(q))) return false;
    }
    return true;
  });
}
/* "Clear filters" for a filter bar: shown only while one of its filters is set. */

  const f = state.filters[key]||{};
  if(!fields.some(k=>f[k]!=null && f[k]!=='')) return '';

}

function renderMatchesTab(t){
  // One place for every match: on court now, the schedule (by start time), not yet scheduled, then results.
  const f = state.filters.matches = state.filters.matches||{};
  const all = applyMatchFilters(tMatches(t.id), f).filter(m=>(m.entry1Id||m.entry2Id||m.src1||m.src2||feedersOf(m).length) && m.status!=='bye' && (f.status==='cancelled' || m.status!=='cancelled'));
  const DONE = ['completed','walkover','retired'];
  const live = all.filter(m=>m.status==='in_progress');
  const sched = all.filter(m=>m.scheduledStart && !DONE.includes(m.status) && m.status!=='in_progress')
    .sort((a,b)=>a.scheduledStart.localeCompare(b.scheduledStart) || ((courtById(a.courtId)||{}).name||'').localeCompare((courtById(b.courtId)||{}).name||'', undefined, {numeric:true}));
  const unsched = all.filter(m=>!m.scheduledStart && !DONE.includes(m.status) && m.status!=='in_progress')
    .sort((a,b)=> (a.entry1Id&&a.entry2Id?0:1)-(b.entry1Id&&b.entry2Id?0:1) || a.round-b.round || a.position-b.position);
  const tm = m=> m.actualEnd || m.updatedAt || m.scheduledStart || '';
  const done = all.filter(m=>DONE.includes(m.status)).sort((a,b)=>tm(b).localeCompare(tm(a)));
  const card = m=>renderScoreboard(m, {actions: state.role==='admin' && !matchLocked(m), hideTime: !!m.scheduledStart && !DONE.includes(m.status), hideEvent: !!f.eventId});
  const grid = list=>`<div class="sb-grid">${list.map(card).join('')}</div>`;
  const section = (title, n, body)=>`<div class="mt-sec"><h3>${title}<span class="n">${n}</span></h3>${body}</div>`;
  const byTime = [];
  sched.forEach(m=>{ const k = fmtDateTime(m.scheduledStart); const last = byTime[byTime.length-1]; if(last && last.k===k) last.ms.push(m); else byTime.push({k, ms:[m]}); });
  const ev = f.eventId && eventById(f.eventId);
  const qp = !!t.quickPlay;   // quick play: no courts or times to plan
  const canBoard = state.role==='admin' && !VIEWER && !qp;
  const viewSwitch = canBoard ? `<div class="seg no-print" role="tablist"><button type="button" role="tab" class="${state.matchView!=='board'?'active':''}" data-match-view="list">List</button><button type="button" role="tab" class="${state.matchView==='board'?'active':''}" data-match-view="board">Board</button></div>` : '';
  if(canBoard && state.matchView==='board') return viewSwitch + renderScheduleBoard(t);
  return `
    ${viewSwitch}
    <div data-more-scope>
    ${renderFilterBar(t,'matches',{more: moreMenuBtn()})}
    <div class="export-row no-print">
      ${state.role==='admin' && !tLocked(t) && !qp?`<button class="btn btn-sm btn-primary" id="btnAssignAny">${ICONS.calendar} Schedule a match&hellip;</button>`:''}
      ${qp ? '' : `<button class="btn btn-sm m-overflow" id="btnExportCourtSchedule">${ICONS.download} Export schedule CSV</button>`}
      <button class="btn btn-sm m-overflow" id="btnExportResults">${ICONS.download} Export results CSV</button>
      ${qp ? '' : `<button class="btn btn-sm m-overflow" id="btnPrintSchedule">${ICONS.print} Print</button>`}
    </div>
    </div>
    ${ev && ev.drawFormat==='americano' && eventDraw(ev.id) && !qp ? `<div class="helptext" style="margin:-4px 0 10px">Standings and the final for ${esc(ev.name)} are under Results and Events &rarr; View draw.</div>`:''}
    ${!all.length ? `<div class="empty-tab">${ev && !eventDraw(ev.id) ? `No draw for ${esc(ev.name)} yet.${state.role==='admin' && !tLocked(t) ? ` <button type="button" class="btn btn-sm btn-primary" data-goto-draws="${ev.id}" style="margin-left:6px">${ICONS.sparkles} Generate the draw</button>` : ''}` : 'No matches match these filters.'}</div>` : ''}
    ${live.length ? section('<span class="sb-live">&#9679;</span> On court now', live.length, grid(live)) : ''}
    ${sched.length ? section('Schedule', sched.length, byTime.map(g=>`<div class="vm-time">${esc(g.k)}</div>${grid(g.ms)}`).join('')) : ''}
    ${unsched.length ? section(qp ? 'To play' : 'Not scheduled yet', unsched.length, grid(unsched)) : ''}
    ${done.length ? section('Completed', done.length, grid(done)) : ''}
  `;
}
function renderMatchRowActionable(m){ return renderScoreboard(m, {actions: state.role==='admin' && !matchLocked(m)}); }
/* One scoreboard card for every match list: event and round on top, then one
   line per side - names on the left, a score cell per game on the right.
   The winning side is bold with an accent bar; a live match highlights the
   game being played. opts.actions adds the admin buttons underneath. */
function renderScoreboard(m, opts){
  opts = opts||{};
  const ev = eventById(m.eventId), court = courtById(m.courtId);
  const e1 = entryById(m.entry1Id), e2 = entryById(m.entry2Id);
  const live = m.status==='in_progress', done = ['completed','walkover','retired'].includes(m.status);
  const games = (m.games && m.games.length) ? m.games : (live ? [{a:0,b:0}] : []);
  const fp = followedPlayer();
  const cfg = matchScoring(m);
  const cell = (g,i,key)=>{
    const w = ScoreRules.gameWinner(g,cfg,i);
    const won = (w===1 && key==='a') || (w===2 && key==='b');
    const cur = live && i===games.length-1 && !w;
    return `<span class="sb-c ${won?'w':''} ${cur?'cur':''}">${g[key]}${tiebreakSup(g, w, key)}</span>`;
  };
  // Tennis and padel: the point in the game being played, after the set scores.
  const pts = live && games.length ? ScoreRules.pointSides(games[games.length-1], cfg) : null;
  const ptCell = key=> pts ? `<span class="sb-c pt" title="${pts.tb?'Tiebreak':'Points'}">${pts[key]}</span>` : '';
  const line = (e, key)=>{
    const won = done && e && m.winnerEntryId===e.id;
    const me = fp && e && entryPlayerIds(e).includes(fp.id);
    return `<div class="sb-line ${won?'win':''} ${me?'me':''} ${!e?'tbd':''}">
      <span class="sb-nm">${esc(e?entryName(e):matchSideLabel(m, key==='a'?1:2))}${won?`<span class="sb-tick" aria-label="winner">${ICONS.check}</span>`:''}</span>
      <span class="sb-g mono">${games.map((g,i)=>cell(g,i,key)).join('')}${ptCell(key)}</span></div>`;
  };
  const status = live ? `<span class="sb-live">&#9679; LIVE</span>`
    : m.status==='walkover' ? 'Walkover' : m.status==='retired' ? 'Retired' : done ? 'Final'
    : m.skipped && m.status==='cancelled' ? 'Skipped'
    : ['cancelled','postponed','bye'].includes(m.status) ? esc(m.status.replace(/_/g,' '))
    : opts.hideTime ? '' : (m.scheduledStart ? esc(fmtDateTime(m.scheduledStart)) : 'Not scheduled');
  const e1ok = e1 && e2;
  const scoreIssue = (m.games||[]).length ? ScoreRules.matchProblem(m.games, scoringFor(ev, tournamentById(m.tournamentId), m)) : null;
  const canPlay = e1ok && !['completed','bye','cancelled'].includes(m.status);
  const canStart = canPlay && !live && ['scheduled','called','pending','postponed'].includes(m.status);
  const acts = opts.actions ? `<div class="sb-acts no-print">
      ${canStart?`<button class="btn btn-sm btn-start" data-start-match="${m.id}">${ICONS.bolt} Start</button>`:''}
      ${canPlay?`<button class="btn btn-sm ${canStart?'':'btn-primary'}" data-open-live="${m.id}">${live?'Update score':'Score'}</button>`:''}
      ${live && !(m.games||[]).some(g=>g.a||g.b) ? `<button class="btn btn-sm btn-ghost" data-unstart-match="${m.id}" title="Not started after all">Undo start</button>`:''}
      ${m.status==='completed'?`<button class="btn btn-sm" data-open-correct="${m.id}">${ICONS.edit} Edit score</button>`:''}
      <span class="grow"></span>
      ${isQuickPlay(m.tournamentId) ? '' : `<button class="btn btn-sm sb-ic" data-open-schedule="${m.id}" title="Schedule" aria-label="Schedule">${ICONS.calendar}</button>`}
      ${canPlay?`<button class="btn btn-sm" data-open-decide="${m.id}" title="Walkover or retirement">W/O</button>`:''}
      ${m.skipped && m.status==='cancelled' && m.bracket==='AM' && !americanoFinalMatch(m.eventId) ? `<button class="btn btn-sm btn-ghost" data-unskip-match="${m.id}">Undo skip</button>`:''}
    </div>` : '';
  return `<div class="sb ${live?'live':''} ${done?'done':''} ${m.skipped&&m.status==='cancelled'?'skipped':''}" data-match-id="${m.id}" data-open-match="${m.id}">
    <div class="sb-meta"><span class="sb-ev">${opts.hideEvent?'':esc((ev||{}).name||'')+' &middot; '}${esc(roundLabelForMatch(m))}</span><span class="sb-when">${[court?esc(court.name):'', status].filter(Boolean).join(' &middot; ')}</span></div>
    ${line(e1,'a')}${line(e2,'b')}
    ${opts.foot || ''}
    ${scoreIssue && opts.actions ? `<div class="sb-warn">${ICONS.warn}<span>This score isn't possible: ${esc(scoreIssue.reason)}. Tap Edit score to fix it.</span></div>` : ''}
    ${acts}
  </div>`;
}

function renderScheduleTab(t){

    <tbody>${times.map(time=>`<tr><td class="sched-time-col">${esc(fmtDateTime(time))}</td>${courts.map(c=>{
      const m = grid[time] && grid[time][c.id];
