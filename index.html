/* ============================== CONFLICTS / SCHEDULING ============================== */
function timeOverlap(s1,e1,s2,e2){ return s1<e2 && s2<e1; }
function matchWindow(m){
  if(!m.scheduledStart) return null;
  const start = new Date(m.scheduledStart).getTime();
  if(isNaN(start)) return null;
  const end = start + (m.estDurationMin||30)*60000;
  return {start,end};
}
/* Returns [] when clear, else a list of {type:'court'|'rest', match}. Both
   entries in a doubles pair count as "the same player" being busy. */
/* Minimum rest a player gets after a match before their next one: 2 minutes
   after a one-game match, 15 minutes after best of 3 or best of 5. A tournament
   can raise these (Settings -> Logistics) but never go below them. */
const MIN_REST_SINGLE = 2, MIN_REST_MULTI = 15;
function restMinutesAfter(match){
  const t = tournamentById(match.tournamentId), ev = eventById(match.eventId);
  const cfg = scoringFor(ev, t, match) || {};
  return (cfg.bestOf||3) <= 1
    ? Math.max(MIN_REST_SINGLE, (t && t.restSingleMin) || MIN_REST_SINGLE)
    : Math.max(MIN_REST_MULTI, (t && t.restMultiMin) || MIN_REST_MULTI);
}
/* When can this match's players next start, given matches already scheduled? */
function earliestStartFor(match, excludeId){
  const players = new Set(matchEntryPlayerIds(match));
  let earliest = 0, because = null;
  // A match waiting on earlier winners starts after those matches (and the rest after them).
  for(const f of feedersOf(match)){
    if(f.id===excludeId || DECIDED_STATUSES.includes(f.status)) continue;
    const w = matchWindow(f); if(!w) continue;
    const free = w.end + restMinutesAfter(f)*60000;
    if(free > earliest){ earliest = free; because = f; }
  }
  for(const m of state.matches){
    if(m.id===match.id || m.id===excludeId || m.tournamentId!==match.tournamentId || m.status==='cancelled') continue;
    if(!matchEntryPlayerIds(m).some(p=>players.has(p))) continue;
    const w = matchWindow(m); if(!w) continue;
    const free = w.end + restMinutesAfter(m)*60000;
    if(free > earliest){ earliest = free; because = m; }
  }
  return {time: earliest, because};
}
function checkSchedulingConflict(tournamentId, matchId, courtId, scheduledStart, estDurationMin, restMinutes){
  const win = matchWindow({scheduledStart, estDurationMin});
  if(!win) return [];
  const thisMatch = matchById(matchId) || {};
  const thisPlayers = new Set(matchEntryPlayerIds({...thisMatch, entry1Id:thisMatch.entry1Id, entry2Id:thisMatch.entry2Id}));
  const conflicts=[];
  for(const m of state.matches){
    if(m.id===matchId) continue;
    if(m.tournamentId!==tournamentId) continue;
    if(['cancelled'].includes(m.status)) continue;
    const oWin = matchWindow(m);
    if(!oWin) continue;
    if(courtId && m.courtId===courtId && timeOverlap(win.start,win.end,oWin.start,oWin.end)){
      conflicts.push({type:'court', match:m});
      continue;
    }
    const oPlayers = new Set(matchEntryPlayerIds(m));
    const shared = [...thisPlayers].some(p=>oPlayers.has(p));
    if(shared){
      // Each match is followed by its own rest: 2 min after a one-game match, 15 after best of 3/5.
      const restThis = restMinutesAfter({...thisMatch, tournamentId})*60000;
      const restOther = restMinutesAfter(m)*60000;
      if(timeOverlap(win.start, win.end+restThis, oWin.start, oWin.end+restOther)){
        conflicts.push({type:'rest', match:m, restMin: Math.round((oWin.start < win.start ? restOther : restThis)/60000),
          freeAt: oWin.start < win.start ? oWin.end+restOther : null});
      }
    }
  }
  // Order within a bracket: after the undecided matches feeding this one, before the ones it feeds.
  if(thisMatch.id){
    for(const f of feedersOf(thisMatch)){
      if(DECIDED_STATUSES.includes(f.status)) continue;
      const fWin = matchWindow(f); if(!fWin) continue;
      const freeAt = fWin.end + restMinutesAfter(f)*60000;
      if(win.start < freeAt) conflicts.push({type:'order', match:f, feeder:true, freeAt, restMin: restMinutesAfter(f)});
    }
    const restThis = restMinutesAfter({...thisMatch, tournamentId})*60000;
    [thisMatch.nextMatchId, thisMatch.loserNextMatchId].filter(Boolean).forEach(id=>{
      const d = matchById(id); if(!d || DECIDED_STATUSES.includes(d.status) || d.status==='in_progress') return;
      const dWin = matchWindow(d); if(!dWin) return;
      if(dWin.start < win.end + restThis) conflicts.push({type:'order', match:d, feeder:false});
    });
  }
  return conflicts;
}

/* ============================== STANDINGS / STATS ============================== */
const TIEBREAK_DEFAULT = ['wins','h2h','gameDiff','pointDiff','pointsFor'];
function computeGroupStandings(entryIds, matches, tiebreak){
  tiebreak = tiebreak || TIEBREAK_DEFAULT;
  const rows = {};
  entryIds.forEach(id=> rows[id] = {entryId:id, entry:entryById(id), played:0, wins:0, losses:0, gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, h2h:{}});
  matches.filter(m=> m.status==='completed'||m.status==='walkover'||m.status==='retired').forEach(m=>{
    if(!rows[m.entry1Id] || !rows[m.entry2Id]) return;
    let g1=0,g2=0,p1=0,p2=0;
    (m.games||[]).forEach(g=>{ const w=ScoreRules.gameWinner(g); if(w===1) g1++; else if(w===2) g2++; p1+=g.a||0; p2+=g.b||0; });
    rows[m.entry1Id].played++; rows[m.entry2Id].played++;
    rows[m.entry1Id].gamesWon+=g1; rows[m.entry1Id].gamesLost+=g2;
    rows[m.entry2Id].gamesWon+=g2; rows[m.entry2Id].gamesLost+=g1;
    rows[m.entry1Id].pointsFor+=p1; rows[m.entry1Id].pointsAgainst+=p2;
    rows[m.entry2Id].pointsFor+=p2; rows[m.entry2Id].pointsAgainst+=p1;
    const winner = m.winnerEntryId;
    if(winner===m.entry1Id){ rows[m.entry1Id].wins++; rows[m.entry2Id].losses++; rows[m.entry1Id].h2h[m.entry2Id]='W'; rows[m.entry2Id].h2h[m.entry1Id]='L'; }
    else if(winner===m.entry2Id){ rows[m.entry2Id].wins++; rows[m.entry1Id].losses++; rows[m.entry2Id].h2h[m.entry1Id]='W'; rows[m.entry1Id].h2h[m.entry2Id]='L'; }
  });
  const list = Object.values(rows);
  list.forEach(r=>{ r.gameDiff = r.gamesWon-r.gamesLost; r.pointDiff = r.pointsFor-r.pointsAgainst; });
  list.sort((a,b)=>{
    for(const key of tiebreak){
      if(key==='wins'){ if(b.wins!==a.wins) return b.wins-a.wins; }
      else if(key==='h2h'){ const ah=a.h2h[b.entryId], bh=b.h2h[a.entryId]; if(ah==='W'&&bh==='L') return -1; if(ah==='L'&&bh==='W') return 1; }
      else if(key==='gameDiff'){ if(b.gameDiff!==a.gameDiff) return b.gameDiff-a.gameDiff; }
      else if(key==='pointDiff'){ if(b.pointDiff!==a.pointDiff) return b.pointDiff-a.pointDiff; }
      else if(key==='pointsFor'){ if(b.pointsFor!==a.pointsFor) return b.pointsFor-a.pointsFor; }
    }
    return entryName(a.entry).localeCompare(entryName(b.entry));
  });
  return list;
}
/* Americano ranking is per PLAYER, not per entry, since a player's "entry"
   (team) changes every round. individualEntries = the one-per-player
   registration entries (player2Id null); matches carry ad-hoc team entries. */
/* Americano / Mexicano table order. 'wins' (default): most matches won, then
   most points won, then best point difference. 'points': classic Americano,
   total points won first (wins only break ties). Set per event in Edit event. */
const AMERICANO_RANKINGS = [['wins','Wins first, then points won'],['points','Points won (classic Americano)']];
function americanoRankingFor(ev){ return (ev && ev.americanoRanking==='points') ? 'points' : 'wins'; }
function americanoRankingLabel(ev){ return americanoRankingFor(ev)==='points' ? 'Ranked by points won, then wins' : 'Ranked by wins, then points won'; }
function americanoRankingNote(ev){ return `<div class="helptext" style="margin-top:6px">${esc(americanoRankingLabel(ev))}.</div>`; }
function computeAmericanoStandings(individualEntries, matches, ranking){
  const rows = {};
  individualEntries.forEach(e=> rows[e.player1Id] = {playerId:e.player1Id, played:0, wins:0, losses:0, pointsFor:0, pointsAgainst:0});
  matches.filter(m=> m.bracket!=='AMF' && (m.status==='completed'||m.status==='walkover'||m.status==='retired') && (m.games||[]).length).forEach(m=>{
    const e1=entryById(m.entry1Id), e2=entryById(m.entry2Id);
    if(!e1||!e2) return;
    let p1=0,p2=0; (m.games||[]).forEach(g=>{ p1+=g.a||0; p2+=g.b||0; });
    const aWon = m.winnerEntryId===m.entry1Id;
    entryPlayerIds(e1).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p1; rows[pid].pointsAgainst+=p2; if(aWon) rows[pid].wins++; else rows[pid].losses++; });
    entryPlayerIds(e2).forEach(pid=>{ if(!rows[pid]) return; rows[pid].played++; rows[pid].pointsFor+=p2; rows[pid].pointsAgainst+=p1; if(aWon) rows[pid].losses++; else rows[pid].wins++; });
  });
  if(!ranking){ const en = individualEntries[0] || matches[0]; ranking = americanoRankingFor(en && eventById(en.eventId)); }
  const diff = r=>r.pointsFor-r.pointsAgainst, name = (a,b)=>playerName(a.playerId).localeCompare(playerName(b.playerId));
  return Object.values(rows).sort(ranking==='points'
    ? (a,b)=> b.pointsFor-a.pointsFor || b.wins-a.wins || diff(b)-diff(a) || name(a,b)
    : (a,b)=> b.wins-a.wins || b.pointsFor-a.pointsFor || diff(b)-diff(a) || name(a,b));
}

/* ============================== RANKING POINTS ============================== */
/* Simple, stated formula (shown in a UI tooltip, never hidden):
   Elimination stage reached - Champion 100, Runner-up 70, Semifinal 45,
   Quarterfinal 25, Round of 16 15, earlier rounds 5.
   Group/round-robin final standing - 1st 100, 2nd 70, 3rd 50, 4th 35, else 10. */
const RANKING_POINTS_TOOLTIP = 'Knockout (stage reached): Champion 100 · Runner-up 70 · Third place 50 · Semifinal 45 · Quarterfinal 25 · Round of 16 15 · earlier rounds or group stage 5. Round robin / Americano (final standing): 1st 100 · 2nd 70 · 3rd 50 · 4th 35 · others 10. Americano with a final: winners 100, losers 70. Ranking = sum over all events.';
function stagePointsByDistance(distanceFromFinal, won){
  if(won && distanceFromFinal===0) return 100;
  if(distanceFromFinal===0) return 70;
  if(distanceFromFinal===1) return 45;
  if(distanceFromFinal===2) return 25;
  if(distanceFromFinal===3) return 15;
  return 5;
}
function standingPoints(rank){
  if(rank===1) return 100;
  if(rank===2) return 70;
  if(rank===3) return 50;
  if(rank===4) return 35;
  return 10;
}

function roundLabelFor(bracket, round, maxRound, isThirdPlace){
  if(isThirdPlace) return 'Third place';
  if(bracket==='GF') return 'Grand Final';
  if(bracket==='AMF') return 'Final';
  if(bracket==='RR'||bracket==='GRP'||bracket==='AM') return 'Round '+round;
  const fromEnd = maxRound-round;
  if(fromEnd===0) return bracket==='LB' ? 'Losers Final' : 'Final';
  if(fromEnd===1) return (bracket==='LB'?'Losers ':'')+'Semifinal';
  if(fromEnd===2) return (bracket==='LB'?'Losers ':'')+'Quarterfinal';
  return (bracket==='LB'?'Losers Round ':'Round ')+round;
}

/* Standings-based events (Americano, round robin, groups) only hand out finishing
   points once every match is decided. Before that the table shows the position so
   far with no points, and before the first result nobody has a position at all. */
function standingsEventState(matches, finishedOverride){
  const DONE = ['completed','walkover','retired','bye','cancelled'];
  const played = matches.filter(m=>['completed','walkover','retired'].includes(m.status)).length;
  if(!played) return 'not_started';
  const final = finishedOverride===false ? false : finishedOverride===true ? true : matches.every(m=>DONE.includes(m.status));
  return final ? 'final' : 'in_progress';
}
function standingPlacement(pos, st){
  if(st==='not_started') return {points:0, label:'Not started', rank:pos, provisional:true};
  if(st==='in_progress') return {points:0, label:'#'+pos+' so far', rank:pos, provisional:true};
  return {points: standingPoints(pos), label:'#'+pos, rank:pos};
}
function computeEventPlacements(eventId){
  const pl = computeEventPlacementsRaw(eventId);
  const ev = eventById(eventId);
  return ev && ev.status==='completed' ? finalizePlacements(ev, pl) : pl;
}
function computeEventPlacementsRaw(eventId){
  const matches = eventMatches(eventId);
  const entries = eventEntries(eventId);
  const placements = {};
  if(!entries.length) return placements;
  const hasDE = matches.some(m=>m.bracket==='WB'||m.bracket==='LB'||m.bracket==='GF');
  const hasSE = matches.some(m=>m.bracket==='SE');
  const hasGroup = matches.some(m=>m.bracket==='GRP');
  const hasRR = matches.some(m=>m.bracket==='RR');
  const hasAM = matches.some(m=>m.bracket==='AM');
  if(hasSE || hasDE){
    const backbone = matches.filter(m=> hasDE ? m.bracket==='WB' : (m.bracket==='SE' && !m.isThirdPlace));
    const maxRound = backbone.length ? Math.max(...backbone.map(m=>m.round)) : 0;
    const priority = {GF:3, SE:2, WB:2, LB:1};
    const DONE_KO = ['completed','bye','walkover','retired'];
    const koMatches = matches.filter(m=>m.bracket!=='GRP');
    const byId = {}; koMatches.forEach(m=>{ byId[m.id]=m; });
    entries.forEach(en=>{
      const mine = m=> m.entry1Id===en.id || m.entry2Id===en.id;
      // Group matches of a "groups + knockout" event never decide the stage reached.
      const involved = koMatches.filter(m=> mine(m) && DONE_KO.includes(m.status));
      if(!involved.length){
        const upcoming = koMatches.filter(m=> mine(m) && !m.isThirdPlace).sort((a,b)=>a.round-b.round)[0];
        if(upcoming && matches.some(m=>m.bracket==='GRP')){
          // Qualified from the groups and waiting for the first knockout match.
          const dist = Math.max(0, maxRound-upcoming.round);
          placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(upcoming.bracket, upcoming.round, maxRound)+' (still in)'};
          return;
        }
        if(matches.some(m=>m.bracket==='GRP' && mine(m))){ placements[en.id]={points:5,label:'Group stage'}; return; }
        placements[en.id] = koMatches.some(m=>['completed','walkover','retired'].includes(m.status)) ? {points:0,label:'Did not play'} : {points:0,label:'Not started',provisional:true}; return;
      }
      involved.sort((a,b)=> (priority[b.bracket]-priority[a.bracket]) || (b.round-a.round) || ((a.isThirdPlace?1:0)-(b.isThirdPlace?1:0)));
      const last = involved[0];
      const won = last.winnerEntryId===en.id;
      if(last.isThirdPlace){ placements[en.id] = won ? {points:50,label:'Third place'} : {points:45,label:'Fourth place'}; return; }
      if(won && last.bracket==='GF'){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(won && last.bracket==='SE' && !last.nextMatchId){ placements[en.id]={points:100,label:'Champion'}; return; }
      if(!won && last.bracket==='SE' && !last.nextMatchId){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      // Won and waiting for the next knockout round: they have reached that round.
      const nxt = won && last.bracket==='SE' && last.nextMatchId && byId[last.nextMatchId];
      if(nxt){
        const dist = Math.max(0, maxRound-nxt.round);
        placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(nxt.bracket, nxt.round, maxRound)+' (still in)'};
        return;
      }
      if(last.bracket==='GF' && !won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      if(last.bracket==='LB' && !last.nextMatchId && won){ placements[en.id]={points:70,label:'Runner-up'}; return; }
      const dist = Math.max(0, maxRound-last.round);
      placements[en.id] = {points: stagePointsByDistance(dist,false), label: roundLabelFor(last.bracket,last.round,maxRound,last.isThirdPlace)};
    });
  } else if(hasAM){
    const individualEntries = entries.filter(e=>!e.isAmericanoTeam);
    const ev = eventById(eventId);
    const fin = matches.find(m=>m.bracket==='AMF');
    const roundMs = matches.filter(m=>m.bracket==='AM');
    const isMex = ev && (ev.americanoVariant||'classic')==='mexicano';
    // With a final, the event is only over once the final is decided (Mexicano included).
    const finalDone = fin && ['completed','walkover','retired'].includes(fin.status) && fin.winnerEntryId;
    const evDone = ev && ev.status==='completed';
    const useFinal = fin && finalDone;
    const state_ = useFinal ? standingsEventState(matches, roundMs.every(m=>['completed','walkover','retired','bye','cancelled'].includes(m.status)) ? null : false)
                 : standingsEventState(matches.filter(m=>m.bracket!=='AMF'), evDone ? true : fin ? false : (isMex ? false : null));
    const standing = computeAmericanoStandings(individualEntries, matches);
    if(useFinal && state_==='final'){
      const win = entryById(fin.winnerEntryId), lose = entryById(fin.winnerEntryId===fin.entry1Id ? fin.entry2Id : fin.entry1Id);
      const champs = new Set(win ? entryPlayerIds(win) : []), runners = new Set(lose ? entryPlayerIds(lose) : []);
      let pos = 4;
      standing.forEach(row=>{
        const ent = individualEntries.find(e=>e.player1Id===row.playerId);
        if(!ent) return;
        if(champs.has(row.playerId)) placements[ent.id] = {points:100, label:'Champion', rank:1};
        else if(runners.has(row.playerId)) placements[ent.id] = {points:70, label:'Runner-up', rank:2};
        else { pos++; placements[ent.id] = standingPlacement(pos, 'final'); }
      });
    } else {
      standing.forEach((row,i)=>{
        const ent = individualEntries.find(e=>e.player1Id===row.playerId);
        if(ent) placements[ent.id] = standingPlacement(i+1, state_);
      });
    }
  } else if(hasGroup || hasRR){
    const draw = eventDraw(eventId);
    const groups = (draw && draw.groups && draw.groups.length) ? draw.groups : [{id:null, name:'', entryIds:entries.map(e=>e.id)}];
    groups.forEach(g=>{
      const gEntries = (g.entryIds && g.entryIds.length) ? g.entryIds : entries.map(e=>e.id);
      const gMatches = matches.filter(m=> g.id ? m.groupId===g.id : !m.groupId);
      const standing = computeGroupStandings(gEntries, gMatches, (draw&&draw.tiebreak)||TIEBREAK_DEFAULT);
      // Groups of a "groups + knockout" event are never the final result; a round robin is final once every match is played.
      const ev = eventById(eventId);
      const st = standingsEventState(gMatches, (ev && ev.status==='completed') ? true : (ev && ev.drawFormat==='group_knockout') ? false : null);
      standing.forEach((row,i)=>{ const pl = standingPlacement(i+1, st); if(g.name && pl.label!=='Not started') pl.label += ' · '+g.name; placements[row.entryId] = pl; });
    });
  }
  return placements;
}

/* Mark a match as being played now: it shows as LIVE (0-0) in the app and on the
   live link straight away. Takes a free court if it has none, and warns when a
   player is still on court in another match. */
async function startMatch(m){
  const busy = state.matches.filter(x=>x.id!==m.id && x.status==='in_progress' && x.tournamentId===m.tournamentId);
  const mine = new Set(matchEntryPlayerIds(m));
  const clash = busy.find(x=>matchEntryPlayerIds(x).some(p=>mine.has(p)));
  if(clash){
    const who = matchEntryPlayerIds(clash).filter(p=>mine.has(p)).map(playerName).join(', ');
    if(!await confirmDialog(who + ' is still playing' + (courtById(clash.courtId)?' on '+courtById(clash.courtId).name:'') + '. Start this match anyway?', {title:'Player still on court', okLabel:'Start anyway', danger:false})) return;
  }
  const patch = {status:'in_progress', actualStart:nowIso(), games:m.games||[], updatedAt:nowIso()};
  const courtBusy = m.courtId && busy.some(x=>x.courtId===m.courtId);
  if(!m.courtId || courtBusy){
    const free = tCourts(m.tournamentId).filter(c=>c.active && !busy.some(x=>x.courtId===c.id));
    if(free.length) patch.courtId = free[0].id;
  }
  await act(async ()=>{ await Store.update('matches', m.id, patch); });
  const c = courtById(patch.courtId || m.courtId);
  toast('Match started' + (c ? ' on ' + c.name : '') + ' - shown as live');
}
/* ============ FINISHING EVENTS AND TOURNAMENTS ============
   Finishing locks the results: any match not yet played is cancelled (and can be
   restored by reopening), and the final standings decide the champion - also when
   an event is stopped early. */
const DONE_STATUSES = ['completed','walkover','retired','bye','cancelled'];
function eventEntryStats(ev){
  const matches = eventMatches(ev.id), stats = {};
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  if(ev.drawFormat==='americano'){
    computeAmericanoStandings(entries, matches).forEach(r=>{ const en = entries.find(e=>e.player1Id===r.playerId); if(en) stats[en.id] = {...r, pointDiff:r.pointsFor-r.pointsAgainst}; });
  } else {
    computeGroupStandings(entries.map(e=>e.id), matches.filter(m=>m.entry1Id && m.entry2Id), TIEBREAK_DEFAULT).forEach(r=>{ stats[r.entryId] = r; });
  }
  return stats;
}
/* Once an event is finished every placement is final and someone is champion:
   rank by placement points, then position, wins, point difference, points won. */
function finalizePlacements(ev, placements){
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam && placements[e.id]);
  if(!entries.length) return placements;
  entries.forEach(e=>{ const p = placements[e.id]; if(p.label) p.label = p.label.replace(' (still in)',''); });
  if(entries.some(e=>placements[e.id].label==='Champion')){ entries.forEach(e=>{ if(placements[e.id].label!=='Not started') delete placements[e.id].provisional; }); return placements; }
  const st = eventEntryStats(ev), z = {wins:0, pointDiff:0, pointsFor:0};
  const played = entries.filter(e=>(st[e.id]||{}).played);
  if(!played.length) return placements;
  const order = entries.slice().sort((a,b)=>{
    const pa=placements[a.id], pb=placements[b.id], sa=st[a.id]||z, sb=st[b.id]||z;
    return ((pb.provisional?0:pb.points)-(pa.provisional?0:pa.points)) || ((pa.rank||999)-(pb.rank||999)) || (sb.wins-sa.wins) || (sb.pointDiff-sa.pointDiff) || (sb.pointsFor-sa.pointsFor);
  });
  order.forEach((e,i)=>{
    const p = placements[e.id];
    if(i===0){ placements[e.id] = {points:100, label:'Champion', rank:1}; return; }
    if(i===1){ placements[e.id] = {points:70, label:'Runner-up', rank:2}; return; }
    if(p.provisional){ placements[e.id] = {points: standingPoints(i+1), label:'#'+(i+1), rank:i+1}; return; }
  });
  return placements;
}
function eventChampions(evId){
  const pl = computeEventPlacements(evId);
  return eventEntries(evId).filter(e=>!e.isAmericanoTeam && pl[e.id] && pl[e.id].label==='Champion').map(e=>entryName(e));
}
async function finishEvent(ev, quiet){
  const pending = eventMatches(ev.id).filter(m=>!DONE_STATUSES.includes(m.status));
  for(const m of pending) await Store.update('matches', m.id, {status:'cancelled', cancelledByFinish:true, statusBeforeFinish:m.status});
  await Store.update('events', ev.id, {status:'completed', finishedAt:nowIso()});
  const champ = eventChampions(ev.id);
  await notify(ev.tournamentId, null, 'results_published', ev.name + ' finished' + (champ.length ? ' - champion: ' + champ.join(' & ') : '') + '.');
  await audit(ev.tournamentId, state.role, 'event_finished', ev.name + (pending.length ? ' (' + pending.length + ' unplayed matches cancelled)' : ''));
  return champ;
}
async function reopenEvent(ev){
  return act(async ()=>{
    for(const m of eventMatches(ev.id).filter(m=>m.cancelledByFinish))
      await Store.update('matches', m.id, {status: m.statusBeforeFinish || (m.entry1Id && m.entry2Id ? 'scheduled' : 'pending'), cancelledByFinish:false, statusBeforeFinish:null});
    await Store.update('events', ev.id, {status:'in_progress', finishedAt:null});
    const t = tournamentById(ev.tournamentId);
    if(t && t.status==='completed') await Store.update('tournaments', t.id, {status:'in_progress'});
    await audit(ev.tournamentId, state.role, 'event_reopened', ev.name);
  }, 'Event reopened');
}
async function confirmFinishEvent(ev){
  const pending = eventMatches(ev.id).filter(m=>m.entry1Id && m.entry2Id && !DONE_STATUSES.includes(m.status)).length;
  const msg = 'Finish ' + ev.name + '? The final standings are locked in and the champion is published.' +
    (pending ? ' ' + pending + ' match' + (pending===1?' isn\'t':'es aren\'t') + ' played yet and will be cancelled (reopen the event to bring them back).' : '');
  if(!await confirmDialog(msg, {title:'Finish event', okLabel:'Finish event', danger:false})) return;
  let champ = [];
  await act(async ()=>{ champ = await finishEvent(eventById(ev.id)); });
  toast(champ.length ? '🏆 ' + champ.join(' & ') + ' - champion of ' + ev.name : ev.name + ' finished');
}
async function confirmFinishTournament(t){
  const evs = tEvents(t.id).filter(e=>e.status!=='completed');
  const pending = tMatches(t.id).filter(m=>m.entry1Id && m.entry2Id && !DONE_STATUSES.includes(m.status)).length;
  const msg = 'Finish ' + t.name + '? ' + (evs.length ? 'All ' + evs.length + ' open event' + (evs.length===1?'':'s') + ' will be finished and their champions published from the final standings.' : 'Every event is already finished.') +
    (pending ? ' ' + pending + ' unplayed match' + (pending===1?'':'es') + ' will be cancelled.' : '');
  if(!await confirmDialog(msg, {title:'Finish tournament', okLabel:'Finish tournament', danger:false})) return;
  await act(async ()=>{
    for(const ev of evs) await finishEvent(eventById(ev.id), true);
    await Store.update('tournaments', t.id, {status:'completed', finishedAt:nowIso()});
    await notify(t.id, null, 'results_published', t.name + ' is finished. Final results are published.');
    await audit(t.id, state.role, 'tournament_finished', t.name);
  }, 'Tournament finished - champions published');
  state.tab = 'overview';
}
/* ============ LOCKED (FINISHED) TOURNAMENTS AND EVENTS ============
   A finished tournament, or a finished event, is read-only until it is reopened:
   no registrations, courts, draws, scheduling or scores. */
function tLocked(t){ return !!t && ['completed','cancelled'].includes(t.status); }
function evLocked(ev){ return !!ev && (ev.status==='completed' || tLocked(tournamentById(ev.tournamentId))); }
function matchLocked(m){ return !!m && evLocked(eventById(m.eventId)); }
function lockReason(t, ev){
  if(tLocked(t)) return t.name + ' is finished. Reopen it (\u22EF \u2192 Reopen tournament) to make changes.';
  if(ev && ev.status==='completed') return ev.name + ' is finished. Reopen the event to make changes.';
  return null;
}
const LOCK_T_IDS = new Set(['btnRegisterPlayerHeader','btnNewEvent','btnNewCourt','btnTournamentAddPlayer','btnNewPlayerFromTournament','btnEditTournament','btnSaveScoring','btnSaveLogistics','btnAssignAny']);
const LOCK_EV_IDS = new Set(['btnGenerateDraw','btnGenKnockout','btnGenNextMexicanoRound','btnFinishMexicano','btnEditEvent','btnSwapEntries']);
/* Called first on every click: returns a message when the click would change something locked. */
function lockedClickMessage(target, t){
  if(!t || state.role!=='admin' || VIEWER) return null;
  const btn = target.closest('button, [data-open-live], [data-open-schedule], [data-open-decide], [data-open-correct]');
  if(!btn) return null;
  if(btn.id && LOCK_T_IDS.has(btn.id)) return lockReason(t, null);
  if(btn.id && LOCK_EV_IDS.has(btn.id)) return lockReason(t, eventById(state.eventId));
  const a = n=>btn.getAttribute(n);
  if(a('data-toggle-court') || a('data-delete-court') || a('data-delete-event') || a('data-finish-event') || a('data-reopen-event')) return lockReason(t, null);
  const evAttr = a('data-admin-register-event') || a('data-ev-players') || a('data-ev-seeds') || a('data-add-am-rounds') || a('data-am-final') || a('data-am-final-remove');
  if(evAttr) return lockReason(t, eventById(evAttr));
  const mid = a('data-open-live') || a('data-open-schedule') || a('data-open-decide') || a('data-open-correct') || a('data-start-match') || a('data-unstart-match');
  if(mid){ const m = matchById(mid); if(m) return lockReason(t, eventById(m.eventId)); }
  return null;
}
async function confirmReopenTournament(t){
  if(!await confirmDialog('Reopen ' + t.name + '? You can add events and players again. Finished events keep their results and champions - reopen an event from Settings \u2192 Draws to play on.', {title:'Reopen tournament', okLabel:'Reopen', danger:false})) return;
  await act(async ()=>{
    await Store.update('tournaments', t.id, {status:'in_progress', finishedAt:null});
    await audit(t.id, state.role, 'tournament_reopened', t.name);
  }, 'Tournament reopened');
}
function lockedNote(t, ev){
  const tl = tLocked(t);
  return `<div class="locked-note">${ICONS.check}<span>${tl ? 'This tournament is finished, so it can\'t be changed. Reopen it from the &#8943; menu at the top.' : esc(ev.name)+' is finished, so its players, draw and scores can\'t be changed.'}</span>${!tl && ev ? `<button class="btn btn-sm" data-reopen-event="${ev.id}">${ICONS.undo} Reopen event</button>`:''}</div>`;
}
function renderChampionsCard(t){
  const rows = tEvents(t.id).filter(e=>e.status==='completed').map(e=>({e, c:eventChampions(e.id)})).filter(r=>r.c.length);
  if(!rows.length) return '';
  return `<div class="champs-card"><div class="champs-h">${ICONS.trophy} Champions</div>
    ${rows.map(r=>`<div class="champs-row"><span class="champs-ev">${esc(r.e.name)}</span><span class="champs-nm">${esc(r.c.join(' & '))}</span></div>`).join('')}</div>`;
}
function computePlayerStats(filterFn){
  const stats = {};
  function ensure(pid){
    if(!stats[pid]) stats[pid] = {playerId:pid, player:playerById(pid), matchesPlayed:0, wins:0, losses:0,
      gamesWon:0, gamesLost:0, pointsFor:0, pointsAgainst:0, tournaments:new Set(), titles:0, rankingPoints:0};
    return stats[pid];
  }
  const placementsByEvent = {};
  state.events.forEach(ev=>{ placementsByEvent[ev.id] = computeEventPlacements(ev.id); });
  state.entries.forEach(entry=>{
    const pids = entryPlayerIds(entry);
    const ev = eventById(entry.eventId);
    if(!pids.length || !ev) return;
    const pl = placementsByEvent[ev.id] && placementsByEvent[ev.id][entry.id];
    pids.forEach(pid=>{
      const s = ensure(pid);
      s.tournaments.add(ev.tournamentId);
      if(pl){ s.rankingPoints += pl.points; if(pl.label==='Champion') s.titles++; }
    });
  });
  state.matches.forEach(m=>{
    if(!['completed','walkover','retired'].includes(m.status)) return;
    [[m.entry1Id,1],[m.entry2Id,2]].forEach(([entryId,side])=>{
      const entry = entryById(entryId); if(!entry) return;
      const pids = entryPlayerIds(entry);
      let g1=0,g2=0,p1=0,p2=0;
      (m.games||[]).forEach(g=>{ const w=ScoreRules.gameWinner(g); if(w===1)g1++; else if(w===2)g2++; p1+=g.a||0; p2+=g.b||0; });
      const won = m.winnerEntryId===entryId;
      const gw = side===1?g1:g2, gl = side===1?g2:g1, pf = side===1?p1:p2, pa = side===1?p2:p1;
      pids.forEach(pid=>{
        const s = ensure(pid);
        s.matchesPlayed++; if(won) s.wins++; else s.losses++;
        s.gamesWon+=gw; s.gamesLost+=gl; s.pointsFor+=pf; s.pointsAgainst+=pa;
      });
    });
  });
  return Object.values(stats).map(s=>({...s, tournamentsCount:s.tournaments.size,
    winPct: s.matchesPlayed ? Math.round(100*s.wins/s.matchesPlayed) : 0
  })).filter(s=> !filterFn || filterFn(s));
}

/* Gender as stored can be "male", "Male", "M", "" ... compare on one spelling. */
function normGender(g){
  const v = String(g||'').trim().toLowerCase();
  if(['male','m','man','men'].includes(v)) return 'male';
  if(['female','f','woman','women'].includes(v)) return 'female';
  return 'unspecified';
}
/* Mixed doubles pairs are one man and one woman. Returns why a pair can't
   register (or enter the draw), or '' when it can. Other events: always ''. */
function mixedPairProblem(ev, playerId, partnerId){
  if(!ev || ev.type!=='mixed_doubles' || !playerId || !partnerId) return '';
  return mixedGenderProblem(playerById(playerId), playerById(partnerId));
}
/* a, b: {name, gender} (b may be a player not saved yet). */
function mixedGenderProblem(a, b){
  const pair = [a||{}, b||{}];
  const unset = pair.filter(p=>normGender(p.gender)==='unspecified');
  if(unset.length) return 'Mixed doubles needs one man and one woman. Set the gender (Male or Female) for '+unset.map(p=>p.name||'this player').join(' and ')+' first.';
  const g = normGender(pair[0].gender);
  if(g===normGender(pair[1].gender)) return 'Mixed doubles needs one man and one woman - '+pair[0].name+' and '+pair[1].name+' are both '+(g==='male'?'men':'women')+'.';
  return '';
}
/* Partner pickers: for a mixed doubles event, grey out players who can't pair
   with the chosen player (same gender, or no gender set). playerGender may be
   unknown (no player chosen yet), which only rules out players without one. */
function syncMixedPartnerOptions(ev, playerGender, partnerSel){
  if(!partnerSel) return;
  const mixed = !!ev && ev.type==='mixed_doubles';
  const g = playerGender ? normGender(playerGender) : null;
  [...partnerSel.options].forEach(o=>{
    if(!o.value) return;
    const og = normGender((playerById(o.value)||{}).gender);
    o.disabled = mixed && (og==='unspecified' || (!!g && g!=='unspecified' && og===g));
  });
  if(partnerSel.selectedIndex>0 && partnerSel.options[partnerSel.selectedIndex].disabled) partnerSel.value = '';
}
function genderOfPlayerId(id){ const p = id && playerById(id); return p ? p.gender : null; }
/* Duplicate check for players: names match ignoring case, accents and extra
   spaces ("José  Diaz" = "jose diaz"). Two people can share a name, so this
   warns and asks rather than refusing. */
function normPlayerName(n){ return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function playersNamed(name, excludeId){
  const k = normPlayerName(name);
  return k ? state.players.filter(p=>p.id!==excludeId && normPlayerName(p.name)===k) : [];
}
function describePlayer(p){
  const club = p.clubId && (state.clubs.find(c=>c.id===p.clubId)||{}).name;
  const g = normGender(p.gender);
  return [p.name, club || 'no club', g==='unspecified' ? 'gender not set' : g].join(' · ');
}
function duplicatePlayerNote(name, excludeId){

  return d.length ? `${ICONS.warn.replace('<svg ','<svg width="13" height="13" style="vertical-align:-2px" aria-hidden="true" ')} Already in Players: ${d.map(p=>esc(describePlayer(p))).join('; ')}` : '';

/* ---- Registration (player self-service; admin confirms) ---- */
function findDuplicateRegistration(eventId, playerId){
  return state.registrations.find(r=> r.eventId===eventId && r.playerId===playerId && r.status!=='withdrawn' && r.status!=='rejected');
}
async function registerForEvent(tournamentId, eventId, playerId, partnerId){
  if(!playerId){ toast('Pick a player profile first', true); return; }
  const ri = registrationInfo(tournamentById(tournamentId));
  if(!ri.open){
    toast(ri.reason==='deadline' ? 'Registration closed on '+fmtDeadline(ri.deadline)+'. Only the organiser can add late entries.' : 'Registration isn\'t open for this tournament.', true);
    return;
  }
  if(partnerId && partnerId===playerId){ toast('A pair cannot be the same player twice', true); return; }
  const mixedIssue = mixedPairProblem(eventById(eventId), playerId, partnerId);
  if(mixedIssue){ toast(mixedIssue, true); return; }
  if(findDuplicateRegistration(eventId, playerId)){ toast('Already registered for this event', true); return; }
  if(partnerId && findDuplicateRegistration(eventId, partnerId)){ toast('Partner is already registered for this event', true); return; }
  return act(async ()=>{
    const id = await Store.add('registrations', {tournamentId, eventId, playerId, partnerId:partnerId||null, status:'pending', registeredAt: nowIso()});
    await notify(tournamentId, playerId, 'registration_submitted', 'Registration submitted for ' + (eventById(eventId)||{}).name + '.');
    return id;
  }, 'Registered - awaiting confirmation');
}
/* Admin manually registering a player (spec: "Allow admins to manually register
   players") — same validation as self-service, but confirmed immediately rather
   than left pending. */
async function adminRegisterPlayer(tournamentId, eventId, playerId, partnerId){
  if(!playerId){ toast('Pick a player first', true); return; }
  if(partnerId && partnerId===playerId){ toast('A pair cannot be the same player twice', true); return; }
  const mixedIssue = mixedPairProblem(eventById(eventId), playerId, partnerId);
  if(mixedIssue){ toast(mixedIssue, true); return; }
  if(findDuplicateRegistration(eventId, playerId)){ toast('That player is already registered for this event', true); return; }
  if(partnerId && findDuplicateRegistration(eventId, partnerId)){ toast('That partner is already registered for this event', true); return; }
  return act(async ()=>{
    const late = !registrationInfo(tournamentById(tournamentId)).open;
    const id = await Store.add('registrations', {tournamentId, eventId, playerId, partnerId:partnerId||null, status:'confirmed', registeredAt: nowIso(), lateEntry: late});
    await notify(tournamentId, playerId, 'registration_confirmed', 'Registered for ' + (eventById(eventId)||{}).name + ' by the tournament admin.');
    if(late) await audit(tournamentId, 'admin', 'late_registration', (playerById(playerId)||{}).name + ' added to ' + (eventById(eventId)||{}).name + ' after registration closed.');
    return id;
  }, 'Player registered');
}
async function setRegistrationStatus(reg, status){
  return act(async ()=>{

    if(status==='confirmed') await notify(reg.tournamentId, reg.playerId, 'registration_confirmed', 'Your registration for ' + (eventById(reg.eventId)||{}).name + ' is confirmed.');
    if(status==='withdrawn') await handleWithdrawal(reg);

/* Withdrawing after a draw is generated must not corrupt the bracket: give
   any remaining unplayed match a walkover to the opponent (or leave TBD if
   there is no opponent yet), never leave a dangling reference. */
async function handleWithdrawal(reg){
  const entry = state.entries.find(e=> e.registrationId===reg.id) || state.entries.find(e=> e.player1Id===reg.playerId && e.eventId===reg.eventId) || null;
  if(!entry) return;
  const affected = eventMatches(entry.eventId).filter(m=> (m.entry1Id===entry.id||m.entry2Id===entry.id) && !['completed'].includes(m.status));
  for(const m of affected){
    const isSide1 = m.entry1Id===entry.id;
    const oppId = isSide1 ? m.entry2Id : m.entry1Id;
    if(oppId){
      await completeMatch(m, {status:'walkover', winnerEntryId:oppId, games:m.games||[]}, {silent:true});
    } else {
      await Store.update('matches', m.id, isSide1 ? {entry1Id:null} : {entry2Id:null});
    }
  }
  await audit(reg.tournamentId, state.role, 'player_withdrawn', playerName(reg.playerId) + ' withdrew from ' + (eventById(reg.eventId)||{}).name + '.');
}

/* Build actual draw entries from confirmed registrations (paired for doubles). */
async function buildEntriesFromRegistrations(event, opts){
  return act(async ()=>{
    const allRegs = await Store.getAll('registrations', [['eventId', event.id]]);
    const regs = allRegs.filter(r=> r.status==='confirmed');
    const existing = await Store.getAll('entries', [['eventId', event.id]]);
    // Seeds are set on entries, which are rebuilt here (Generate draw does it too): keep them.
    const pairKey = (a,b)=>[a,b].filter(Boolean).sort().join('+');
    const seedFor = {};
    existing.forEach(en=>{ const sd = validSeed(en.seed); if(sd==null) return;
      if(en.registrationId) seedFor['r:'+en.registrationId] = sd;
      seedFor['p:'+pairKey(en.player1Id, en.player2Id)] = sd; });
    const doubles = isDoublesType(event.type);
    const seen = new Set();
    const badMixed = [];
    /* An entry that is still valid (same registration, or the same players)
       keeps its id, so matches already played stay linked to it when a draw
       is regenerated keeping played matches. Americano team entries belong
       to the draw: they are left alone here (generating the draw replaces them). */
    const reusable = existing.filter(en=>!en.isAmericanoTeam), used = new Set();
    const plan = [];
    for(const r of regs){
      if(seen.has(r.id)) continue;
      if(doubles && !r.partnerId) continue; // needs a partner before entering
      if(mixedPairProblem(event, r.playerId, r.partnerId)){ badMixed.push(playerName(r.playerId)+' / '+playerName(r.partnerId)); continue; }
      seen.add(r.id);
      const p2 = doubles ? r.partnerId : null;
      const old = reusable.find(en=>!used.has(en.id) && en.registrationId===r.id)
        || reusable.find(en=>!used.has(en.id) && pairKey(en.player1Id, en.player2Id)===pairKey(r.playerId, p2));
      if(old) used.add(old.id);
      plan.push({old, data:{
        eventId:event.id, player1Id:r.playerId, player2Id: p2,
        seed: seedFor['r:'+r.id] ?? seedFor['p:'+pairKey(r.playerId, p2)] ?? null,
        clubId:(playerById(r.playerId)||{}).clubId || null, registrationId:r.id
      }});
    }
    for(const en of existing) if(!used.has(en.id) && !en.isAmericanoTeam) await Store.remove('entries', en.id);
    for(const {old, data} of plan){
      if(old) await Store.update('entries', old.id, data);
      else await Store.add('entries', data);
    }
    if(badMixed.length) toast('Left out of '+event.name+' (mixed doubles needs one man and one woman): '+badMixed.join(', '), true);
  }, opts && opts.quiet ? null : 'Entries built from confirmed registrations');
}

/* A seed is a whole number from 1; anything else means unseeded. */
function validSeed(v){ const n = parseInt(v,10); return Number.isFinite(n) && n>=1 ? n : null; }
/* Ranking points per player (the Rankings page numbers), keyed by player id.
   With excludeTournamentId, points from that tournament's events are left
   out, so seeding rests on earlier tournaments: once a draw exists, byes
   already earn provisional "still in" points, which mustn't feed back into
   this event's (or a sister event's) seeding. */
function rankingPointsByPlayer(excludeTournamentId){
  const out = {};
  computePlayerStats().forEach(s=>{ out[s.playerId] = {...s}; });
  if(excludeTournamentId){
    state.events.filter(e=>e.tournamentId===excludeTournamentId).forEach(e=>{
      const pl = computeEventPlacements(e.id);
      eventEntries(e.id).forEach(en=>{
        const pts = (pl[en.id]||{}).points||0;
        if(pts) entryPlayerIds(en).forEach(pid=>{ if(out[pid]) out[pid].rankingPoints = Math.max(0, out[pid].rankingPoints - pts); });
      });
    });
  }
  return out;
}
/* An entry's ranking. A doubles pair gets the average of its two players'
   individual points (an unranked partner counts as 0), so one strong player
   with a weak partner isn't seeded like two strong players. */
function entryRanking(entry, byPlayer){
  const players = entryPlayerIds(entry).map(pid=>{ const s = byPlayer[pid]||{}; return {id:pid, name:playerName(pid), points:s.rankingPoints||0, wins:s.wins||0}; });
  const n = players.length || 1;
  const avg = k => Math.round(players.reduce((t,p)=>t+p[k], 0) / n * 10) / 10;
  return {points: avg('points'), wins: avg('wins'), players};
}
function fmtPts(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
/* Suggested seeds from the rankings: entries with ranking points (pairs: the
   average of both players), strongest
   first (ties: more wins, then name). How many: the usual 2 seeds below 8
   entries, 4 below 16, 8 below 32, 16 from 32 - raised to the number of byes
   so every bye goes to a seed - and never more than the ranked entries. */
function suggestedSeeds(ev){
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  const byPlayer = rankingPointsByPlayer(ev.tournamentId);
  const ranked = entries.map(e=>({entry:e, ...entryRanking(e, byPlayer)})).filter(r=>r.points>0)
    .sort((a,b)=> b.points-a.points || b.wins-a.wins || entryName(a.entry).localeCompare(entryName(b.entry)));
  const n = entries.length;
  const standard = n<8 ? 2 : n<16 ? 4 : n<32 ? 8 : 16;
  const byes = DrawGenerator.nextPowerOfTwo(n) - n;
  const count = Math.min(ranked.length, Math.max(standard, byes));
  return ranked.slice(0, count).map((r,i)=>({...r, seed:i+1}));
}
function openSuggestSeedsDialog(ev){
  const msg = lockReason(tournamentById(ev.tournamentId), ev);
  if(msg){ toast(msg, true); return; }
  const list = suggestedSeeds(ev);
  if(!list.length){ toast('None of these players has ranking points yet - points come from finished tournaments. Set seeds by hand instead.', true); return; }
  const entries = eventEntries(ev.id).filter(e=>!e.isAmericanoTeam);
  const hasSeeds = entries.some(e=>validSeed(e.seed)!=null);
  const body = `
    <div class="helptext" style="margin-bottom:10px">Based on ranking points (Rankings page, from earlier tournaments)${isDoublesType(ev.type)?'; a pair gets the average of its two players\' points (unranked counts as 0)':''}. ${list.length} of ${entries.length} entries seeded; the rest are placed at random. Byes go to the highest seeds.</div>
    <div class="table-scroll"><table class="standings"><thead><tr><th>Seed</th><th>Entry</th><th class="num">Points</th></tr></thead>
    <tbody>${list.map(r=>`<tr><td class="mono">${r.seed}</td><td>${esc(entryName(r.entry))}${r.players.length>1?`<div class="sub-txt">(${r.players.map(p=>esc(p.name)+' '+fmtPts(p.points)).join(' + ')}) &divide; 2</div>`:''}</td><td class="num mono">${fmtPts(r.points)}</td></tr>`).join('')}</tbody></table></div>
    ${hasSeeds ? `<div class="helptext" style="margin-top:10px">Applying replaces the seeds already set for this event.</div>` : ''}
    <div class="helptext" style="margin-top:6px">You can still change any seed afterwards. ${eventDraw(ev.id) ? 'Regenerate the draw to use them.' : 'Generate the draw to use them.'}</div>`;
  openDialog('Suggested seeds', body, stdFoot('btnApplySuggestedSeeds', 'Apply seeds'));
  document.getElementById('btnApplySuggestedSeeds').onclick = async ()=>{
    const seedOf = Object.fromEntries(list.map(r=>[r.entry.id, r.seed]));
    await act(async ()=>{
      for(const e of entries){
        const want = seedOf[e.id] ?? null;
        if((validSeed(e.seed) ?? null)!==want) await Store.update('entries', e.id, {seed:want});
      }
    }, 'Seeds applied from rankings');
    closeGenericDialog(); render();
    openEventSeedsDialog(ev.id);   // back to the seeds list, now filled in
  };
}

/* ---- Draw generation ---- */
async function generateDraw(event, opts){
  opts = opts || {};
  const tournament = tournamentById(event.tournamentId);
  await buildEntriesFromRegistrations(event);
  const entriesRaw = (eventEntries(event.id).length ? eventEntries(event.id) : await Store.getAll('entries', [['eventId', event.id]])).filter(e=>!e.isAmericanoTeam);
  if(entriesRaw.length < 2){ toast('Need at least 2 confirmed entries to generate a draw', true); return; }
  if(!formatAllowedForType(event.drawFormat, event.type||'singles')){ toast('Americano isn’t available for singles events. Pick another format.', true); return; }
  if(event.drawFormat==='americano' && entriesRaw.length < 4){ toast('Americano needs at least 4 confirmed entries', true); return; }
  /* Seeds first (1, 2, 3 ...), then unseeded players in random order. The
     knockout plan puts the first entry at seed 1, spreads seeds apart and
     gives byes to the top of this order, so byes go to the highest seeds;
     groups use the same order to spread seeds across groups. */
  const seeded = entriesRaw.filter(e=>validSeed(e.seed)!=null).sort((a,b)=>validSeed(a.seed)-validSeed(b.seed));
  const unseeded = entriesRaw.filter(e=>validSeed(e.seed)==null).sort(()=> Math.random()-0.5);
  const ordered = [...seeded, ...unseeded];
  const ctx = {tournamentId: event.tournamentId, eventId: event.id, drawId:null};
  const format = event.drawFormat || 'single_elimination';

  return act(async ()=>{
    const existingDraw = eventDraw(event.id);
    if(existingDraw && existingDraw.status==='published' && !opts.confirmedRegen){
      toast('This draw is already published - use "Regenerate" to confirm.', true); return;
    }
    if(existingDraw && opts.keepPlayed){
      const why = keepPlayedUnavailable(event, existingDraw, format);
      if(why){ toast(why, true); return; }
      await regenerateKeepingPlayed(event, existingDraw, ordered, ctx);
      return;
    }
    if(existingDraw){
      for(const m of eventMatches(event.id)) await Store.remove('matches', m.id);
      if(existingDraw.format==='americano'){
        for(const te of eventEntries(event.id).filter(e=>e.isAmericanoTeam)) await Store.remove('entries', te.id);
      }
      await Store.remove('draws', existingDraw.id);
      if(existingDraw.status==='published') await audit(event.tournamentId, state.role, 'draw_regenerated', 'Draw regenerated for ' + event.name + '.');
    }
    const drawId = uid();
    ctx.drawId = drawId;
    let matches = [], groups = null, americanoSitOut = null;
    if(format==='round_robin'){
      matches = buildRoundRobin(ctx, ordered);
    } else if(format==='americano'){
      const variant = event.americanoVariant||'classic';
      let built;
      if(variant==='mixed') built = buildMixedAmericano(ctx, ordered);
      else if(variant==='mexicano') built = buildMexicanoRound(ctx, ordered.slice().sort(()=>Math.random()-0.5), 1);
      else built = buildAmericano(ctx, ordered);
      matches = built.matches;
      americanoSitOut = variant==='mexicano' ? (built.sitOut.length ? {1: built.sitOut.map(e=>e.player1Id)} : null) : (built.sitOut || null);
      for(const te of built.teamEntries) await Store.add('entries', te, te.id);
    } else if(format==='group_knockout'){
      const built = buildGroupsStage(ctx, ordered, opts.groupSize||4);
      groups = built.groups;
      matches = built.matches.concat(buildKnockoutPlaceholders(ctx, groups, opts.qualifiersPerGroup||2, {thirdPlace:event.thirdPlaceMatch}));
    } else if(format==='double_elimination'){
      matches = buildDoubleElimination(ctx, ordered, {thirdPlace:event.thirdPlaceMatch});
    } else {
      matches = buildSingleElimination(ctx, ordered, {thirdPlace:event.thirdPlaceMatch});
    }
    await Store.add('draws', {
      eventId:event.id, format, groups: groups||[], status:'published', generatedAt: nowIso(),
      qualifiersPerGroup: opts.qualifiersPerGroup||2, groupSize: opts.groupSize||4, tiebreak: TIEBREAK_DEFAULT,
      americanoSitOut
    }, drawId);
    for(const m of matches) await Store.add('matches', m, m.id);
    await Store.update('events', event.id, {status:'draw_published'});
    await notify(event.tournamentId, null, 'draw_published', 'Draw published for ' + event.name + '.');
  }, 'Draw generated');
}

/* ---------- Regenerating a draw that has played matches ----------
   "Keep played matches" keeps every match that is finished or in progress
   (between players still in the event) with its result, and redraws only the
   matches not played yet. It works where matches are independent pairings:
   round robin, and the group stage of groups + knockout (the groups stay as
   they are; new entries join the smallest groups, withdrawn ones leave; the
   knockout placeholders are rebuilt), and Americano (see below). Brackets
   depend on earlier rounds, so those can only be redrawn completely. */
const PLAYED_STATUSES = ['completed','walkover','retired','in_progress'];
function playedMatches(eventId){ return eventMatches(eventId).filter(m=>PLAYED_STATUSES.includes(m.status)); }
function keepPlayedUnavailable(event, draw, format){
  if(!draw) return 'There is no draw yet.';
  if(format!==draw.format) return 'The format is changing, so the draw has to be made again from the start.';
  if(format==='americano' && playedMatches(event.id).some(m=>m.bracket==='AMF')) return 'The Americano final has been played, so the draw can only be redrawn completely.';
  if(format==='single_elimination' || format==='double_elimination') return 'In a knockout bracket later rounds depend on earlier results, so it can only be redrawn completely.';
  if(format==='group_knockout' && playedMatches(event.id).some(m=>m.bracket!=='GRP')) return 'The knockout stage has started, so the draw can only be redrawn completely.';
  return '';
}
function keepGroupsFor(oldGroups, ordered){
  const ids = new Set(ordered.map(e=>e.id));
  const groups = (oldGroups||[]).map(g=>({...g, entryIds:(g.entryIds||[]).filter(id=>ids.has(id))}));
  const placed = new Set(groups.flatMap(g=>g.entryIds));
  for(const e of ordered){
    if(placed.has(e.id) || !groups.length) continue;
    groups.slice().sort((a,b)=>a.entryIds.length-b.entryIds.length)[0].entryIds.push(e.id);
  }
  return groups.filter(g=>g.entryIds.length);
}
async function regenerateKeepingPlayed(event, draw, ordered, ctx){
  if(draw.format==='americano') return regenerateAmericanoKeepingPlayed(event, draw, ordered, ctx);
  const inEvent = new Set(ordered.map(e=>e.id));
  const all = eventMatches(event.id);
  const kept = all.filter(m=>PLAYED_STATUSES.includes(m.status) && inEvent.has(m.entry1Id) && inEvent.has(m.entry2Id));
  const keptIds = new Set(kept.map(m=>m.id));
  for(const m of all) if(!keptIds.has(m.id)) await Store.remove('matches', m.id);
  ctx.drawId = draw.id;
  const pairKey = (a,b)=>[a,b].sort().join('|');
  const done = new Set(kept.map(m=>pairKey(m.entry1Id, m.entry2Id)));
  const byId = Object.fromEntries(ordered.map(e=>[e.id,e]));
  let groups = draw.groups||[], fresh = [];
  if(draw.format==='group_knockout'){
    groups = keepGroupsFor(draw.groups, ordered);
    groups.forEach(g=>{ fresh = fresh.concat(buildRoundRobin({...ctx, groupId:g.id}, g.entryIds.map(id=>byId[id]))); });
  } else {
    fresh = buildRoundRobin(ctx, ordered);
  }
  fresh = fresh.filter(m=>!done.has(pairKey(m.entry1Id, m.entry2Id)));
  if(draw.format==='group_knockout') fresh = fresh.concat(buildKnockoutPlaceholders(ctx, groups, draw.qualifiersPerGroup||2, {thirdPlace:event.thirdPlaceMatch}));
  await Store.update('draws', draw.id, {groups, generatedAt: nowIso()});
  for(const m of fresh) await Store.add('matches', m, m.id);
  await Store.update('events', event.id, {status: kept.length ? 'in_progress' : 'draw_published'});
  if(draw.format==='group_knockout') await fillKnockoutFromGroups(event.id);
  await audit(event.tournamentId, state.role, 'draw_regenerated', 'Draw regenerated for ' + event.name + ', keeping ' + kept.length + ' played match' + (kept.length===1?'':'es') + '.');
  await notify(event.tournamentId, null, 'draw_published', 'Draw updated for ' + event.name + '.');
}
/* Americano, keeping played matches. Played rounds are kept (renumbered 1..k
   if unplayed rounds sat between them) and the rest is drawn again for the
   current players:
   - Classic / Mixed: everyone is brought up to the same number of games L -
     at least what a full schedule gives (or what the old draw planned), and
     more if a late entry needs it - in new rounds where the players furthest
     behind play first (random among equals), partners are matched to repeat
     as little as possible and opponents to meet as little as possible. When
     the numbers can't come out exactly equal, games differ by at most one.
   - Mexicano: the open round is paired again from the current standings
     (completing a part-played round with the players who haven't played it). */
function americanoFullScheduleGames(n, mixedMen){
  if(mixedMen) return mixedMen - (mixedMen%2);
  const mod = n%4; return mod<=1 ? n-1 : n-mod;
}
function americanoHistory(matches, pids){
  const n = pids.length, idx = {}; pids.forEach((p,i)=>{ idx[p]=i; });
  const h = {games:new Array(n).fill(0), partner:Array.from({length:n},()=>new Array(n).fill(0)), opp:Array.from({length:n},()=>({}))};
  matches.forEach(m=>{
    const t1 = entryPlayerIds(entryById(m.entry1Id)).map(p=>idx[p]), t2 = entryPlayerIds(entryById(m.entry2Id)).map(p=>idx[p]);
    [...t1,...t2].forEach(x=>{ if(x!==undefined) h.games[x]++; });
    [t1,t2].forEach(([x,y])=>{ if(x!==undefined && y!==undefined){ h.partner[x][y]++; h.partner[y][x]++; } });
    t1.forEach(x=>t2.forEach(y=>{ if(x!==undefined && y!==undefined){ h.opp[x][y]=(h.opp[x][y]||0)+1; h.opp[y][x]=(h.opp[y][x]||0)+1; } }));
  });
  return h;
}
/* Games still to play per player (d) and how many games that makes (G), for a
   target of L games each. Each game takes `per` players from every group
   (Classic: 4 from everyone; Mixed: 2 men + 2 women). If a group's total isn't
   a whole number of games, the players with the fewest games get one extra. */
function americanoDeficits(games, L, groups, per){
  const d = games.map(g=>Math.max(0, L-g));
  const G = Math.max(...groups.map(gr=>Math.ceil(gr.reduce((s,i)=>s+d[i],0)/per)));
  let extras = 0;
  groups.forEach(gr=>{
    let need = per*G - gr.reduce((s,i)=>s+d[i],0);
    while(need>0){
      const order = americanoShuffle(gr.slice()).sort((a,b)=>(games[a]+d[a])-(games[b]+d[b]));
      for(const i of order){ if(need<=0) break; d[i]++; need--; extras++; }
    }
  });
  return {d, G, extras, ok: Math.max(0,...d) <= G};
}
function americanoRestRounds(hist, d, G, groups, per, genders, roundSize){
  const n = d.length, idxs = [...Array(n).keys()];
  const pc = hist.partner.map(r=>r.slice()), opp = hist.opp.map(o=>({...o}));
  d = d.slice();
  const rounds = [];
  let left = G;
  while(left>0){
    let g = Math.min(roundSize, left, ...groups.map(gr=>Math.floor(gr.filter(i=>d[i]>0).length/per)));
    let pick = null;
    for(; g>=1; g--){
      pick = groups.map(gr=>americanoShuffle(gr.filter(i=>d[i]>0)).sort((a,b)=>d[b]-d[a]).slice(0, per*g)).flat();
      const sel = new Set(pick);
      if(Math.max(0, ...idxs.map(i=>d[i]-(sel.has(i)?1:0))) <= left-g) break;
    }
    if(g<1 || !pick) throw new Error('Could not schedule the remaining Americano games.');
    let pairs = null;
    const maxPc = Math.max(0, ...pc.map(row=>Math.max(0,...row)));
    for(let lim=0; lim<=maxPc+1 && !pairs; lim++){
      const blocked = idxs.map(p=>{ const row=new Uint8Array(n); for(let q=0;q<n;q++) row[q] = (pc[p][q]>lim || (genders && genders[p]===genders[q])) ? 1 : 0; return row; });
      let best = null, bestCost = Infinity;
      for(let tries=0; tries<25; tries++){
        const m = americanoPerfectMatching(pick, blocked, (p,q)=>pc[p][q]);
        if(!m) continue;
        const c = m.reduce((s,[a,b])=>s+pc[a][b]*pc[a][b], 0);
        if(c<bestCost){ bestCost=c; best=m; if(c===0) break; }
      }
      pairs = best;
    }
    if(!pairs) throw new Error('Could not pair partners for round ' + (rounds.length+1) + '.');
    pairs.forEach(([a,b])=>{ pc[a][b]++; pc[b][a]++; });
    pick.forEach(i=>d[i]--);
    const sel = new Set(pick);
    rounds.push({games: americanoPairTeams(pairs, opp), sit: idxs.filter(i=>!sel.has(i))});
    left -= g;
  }
  return rounds;
}
async function regenerateAmericanoKeepingPlayed(event, draw, ordered, ctx){
  const variant = event.americanoVariant||'classic';
  const pids = ordered.map(e=>e.player1Id);
  const n = pids.length;
  if(n<4) throw new Error('Americano needs at least 4 players.');
  const genders = variant==='mixed' ? pids.map(p=>normGender((playerById(p)||{}).gender)) : null;
  const all = eventMatches(event.id);
  const oldAm = all.filter(m=>m.bracket==='AM');
  const kept = oldAm.filter(m=>PLAYED_STATUSES.includes(m.status));
  const keptIds = new Set(kept.map(m=>m.id));
  ctx.drawId = draw.id;
  // What the old draw planned per player (so a regenerate doesn't shorten the event).
  const planned = americanoHistory(oldAm, pids).games;
  // Remove unplayed matches (and an unplayed final) and team entries no kept match uses.
  for(const m of all) if(!keptIds.has(m.id)) await Store.remove('matches', m.id);
  const keptTeams = new Set(kept.flatMap(m=>[m.entry1Id, m.entry2Id]));
  for(const te of eventEntries(event.id).filter(e=>e.isAmericanoTeam && !keptTeams.has(e.id))) await Store.remove('entries', te.id);
  // Renumber kept rounds 1..k.
  const roundMap = {}; [...new Set(kept.map(m=>m.round))].sort((a,b)=>a-b).forEach((r,i)=>{ roundMap[r]=i+1; });
  for(const m of kept) if(roundMap[m.round]!==m.round){
    await Store.update('matches', m.id, {round: roundMap[m.round]});
    for(const eid of [m.entry1Id, m.entry2Id]) await Store.update('entries', eid, {americanoRound: roundMap[m.round]});
  }
  const lastKept = Object.keys(roundMap).length;
  const keptNow = kept.map(m=>({...m, round: roundMap[m.round]}));
  const sitOut = {};
  for(let r=1; r<=lastKept; r++){
    const inRound = new Set(keptNow.filter(m=>m.round===r).flatMap(m=>[m.entry1Id,m.entry2Id]).map(entryById).flatMap(entryPlayerIds));
    const sit = pids.filter(p=>!inRound.has(p)); if(sit.length) sitOut[r] = sit;
  }
  const hist = americanoHistory(keptNow, pids);
  const newEntries = [], newMatches = [];
  const addRound = (roundNum, games, prevLast)=>{
    americanoOrderGamesInRound(games, prevLast, g=>g.flat()).forEach(([t1,t2], gi)=>{
      const mk = ([a,b])=>{ const t = {id:uid(), eventId:event.id, player1Id:pids[a], player2Id:pids[b], seed:null, clubId:null, registrationId:null, isAmericanoTeam:true, americanoRound:roundNum}; newEntries.push(t); return t; };
      const m = baseMatch({...ctx, bracket:'AM', round:roundNum, position:gi, e1:mk(t1), e2:mk(t2)});
      m.id = uid(); newMatches.push(m);
    });
  };
  if(variant==='mexicano'){
    // Complete a part-played last round, or pair a new one, from the current standings.
    const idx = {}; pids.forEach((p,i)=>{ idx[p]=i; });
    const lastMs = keptNow.filter(m=>m.round===lastKept);
    const playedLast = new Set(lastMs.flatMap(m=>[m.entry1Id,m.entry2Id]).map(entryById).flatMap(entryPlayerIds));
    const fillLast = lastKept>0 && pids.some(p=>!playedLast.has(p)) && pids.filter(p=>!playedLast.has(p)).length>=4 && playedLast.size>0;
    const roundNum = fillLast ? lastKept : lastKept+1;
    const standing = computeAmericanoStandings(ordered, keptNow);
    const byPid = {}; ordered.forEach(e=>{ byPid[e.player1Id]=e; });
    let pool = standing.map(r=>byPid[r.playerId]).filter(Boolean);
    if(fillLast) pool = pool.filter(e=>!playedLast.has(e.player1Id));
    const sits = {}; Object.values(sitOut).forEach(l=>l.forEach(p=>{ sits[p]=(sits[p]||0)+1; }));
    const gamesBy = {}; pids.forEach((p,i)=>{ gamesBy[p]=hist.games[i]; });
    const lastSit = new Set(fillLast ? [] : (sitOut[lastKept]||[]));
    const sitters = mexicanoSitters(pool, pool.length%4, gamesBy, sits, lastSit);
    const built = buildMexicanoRound(ctx, pool, roundNum, sitters);
    built.teamEntries.forEach(t=>newEntries.push(t));
    built.matches.forEach((m,i)=>{ if(fillLast) m.position = lastMs.length+i; newMatches.push(m); });
    const sitIds = built.sitOut.map(e=>e.player1Id);
    if(sitIds.length) sitOut[roundNum] = sitIds; else delete sitOut[roundNum];
  } else {
    let groups, per, roundSize, fullGames;
    if(genders){
      const men = pids.map((p,i)=>i).filter(i=>genders[i]==='male'), women = pids.map((p,i)=>i).filter(i=>genders[i]==='female');
      if(men.length<4 || men.length!==women.length) throw new Error('Mixed Americano needs an equal number of men and women, at least 4 of each.');
      groups = [men, women]; per = 2; roundSize = Math.floor(men.length/2); fullGames = americanoFullScheduleGames(n, men.length);
    } else {
      groups = [pids.map((p,i)=>i)]; per = 4; roundSize = Math.floor(n/4); fullGames = americanoFullScheduleGames(n, 0);
    }
    const L0 = Math.max(fullGames, ...planned, ...hist.games);
    let choice = null;
    for(let L=L0; L<L0+40; L++){
      const r = americanoDeficits(hist.games, L, groups, per);
      if(!r.ok) continue;
      if(!choice) choice = r;
      if(r.extras===0){ choice = r; break; }
      if(L>=L0+8 && choice) break;
    }
    if(!choice) throw new Error('Could not balance the remaining Americano games.');
    // Round-by-round pairing can paint itself into a corner, so try several
    // shuffles and keep the schedule with the fewest repeat partners.
    const repeatScore = rounds=>{
      const pc = hist.partner.map(r=>r.slice());
      rounds.forEach(rd=>rd.games.forEach(([t1,t2])=>[t1,t2].forEach(([x,y])=>{ pc[x][y]++; pc[y][x]++; })));
      let max = 0, sq = 0; pc.forEach((row,i)=>row.forEach((c,j)=>{ if(j>i){ if(c>max) max = c; if(c>1) sq += (c-1)*(c-1); } }));
      return [max, sq];
    };
    let rounds = null, best = null;
    const deadline = Date.now() + 1500;
    for(let attempt=0; attempt<60 && (attempt<3 || Date.now()<deadline); attempt++){
      let r; try{ r = americanoRestRounds(hist, choice.d, choice.G, groups, per, genders, roundSize); }catch(e){ if(attempt>=59 && !rounds) throw e; continue; }
      const sc = repeatScore(r);
      if(!best || sc[0]<best[0] || (sc[0]===best[0] && sc[1]<best[1])){ best = sc; rounds = r; }
      if(best[1]===0) break;
    }
    if(!rounds) throw new Error('Could not schedule the remaining Americano games.');
    let prevLast = null;
    const lastMs = keptNow.filter(m=>m.round===lastKept).sort((a,b)=>b.position-a.position);
    if(lastMs.length){ const idx = {}; pids.forEach((p,i)=>{ idx[p]=i; }); prevLast = new Set([lastMs[0].entry1Id,lastMs[0].entry2Id].map(entryById).flatMap(entryPlayerIds).map(p=>idx[p])); }
    rounds.forEach((rd, ri)=>{
      const roundNum = lastKept + ri + 1;
      if(rd.sit.length) sitOut[roundNum] = rd.sit.map(i=>pids[i]);
      addRound(roundNum, rd.games, prevLast);
      prevLast = new Set(rd.games[rd.games.length-1].flat());
    });
  }
  markSchedulable(newMatches);
  for(const te of newEntries) await Store.add('entries', te, te.id);
  for(const m of newMatches) await Store.add('matches', m, m.id);
  await Store.update('draws', draw.id, {americanoSitOut: Object.keys(sitOut).length ? sitOut : null, generatedAt: nowIso()});
  await Store.update('events', event.id, {status: kept.length ? 'in_progress' : 'draw_published'});
  await audit(event.tournamentId, state.role, 'draw_regenerated', 'Draw regenerated for ' + event.name + ', keeping ' + kept.length + ' played match' + (kept.length===1?'':'es') + '.');
  await notify(event.tournamentId, null, 'draw_published', 'Draw updated for ' + event.name + '.');
}
/* Asks how to regenerate a published draw: 'keep' (played matches stay),
   'all' (start again), or null (cancelled). */
function chooseRegenMode(ev, draw, format){
  const played = playedMatches(ev.id).length;
  if(!played) return confirmDialog('This draw is already published. Regenerating replaces all of its matches and is logged in the audit trail. Continue?', {okLabel:'Regenerate'}).then(ok=>ok?'all':null);
  const why = keepPlayedUnavailable(ev, draw, format);
  const body = `
    <p class="helptext" style="margin-top:0"><b>${played} match${played===1?' has':'es have'} been played</b> (or ${played===1?'is':'are'} in progress) in ${esc(ev.name)}. How should the draw be regenerated?</p>
    <label class="row" style="gap:10px;align-items:flex-start;padding:10px 0;${why?'opacity:.55':''}"><input type="radio" name="regenMode" value="keep" ${why?'disabled':'checked'} style="margin-top:3px">
      <span><b>Keep played matches</b><br><span class="helptext">Their results stay. Only the matches not played yet are drawn again, using the current entries.${format==='group_knockout'?' The groups stay as they are: new entries join the smallest groups.':''}${format==='americano'?((ev.americanoVariant||'classic')==='mexicano'?' The open round is paired again from the current standings.':' New rounds shuffle the players so everyone ends up with the same number of games (or within one), with as few repeat partners as possible.'):''}</span>${why?`<br><span class="helptext">${esc(why)}</span>`:''}</span></label>
    <label class="row" style="gap:10px;align-items:flex-start;padding:10px 0"><input type="radio" name="regenMode" value="all" ${why?'checked':''} style="margin-top:3px">
      <span><b>Regenerate everything</b><br><span class="helptext">Discards all matches and results in this event and makes a new draw.</span></span></label>
    <p class="helptext" style="margin-bottom:0">Either way, this is logged in the audit trail.</p>`;
  openDialog('Regenerate draw', body, `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn btn-danger" id="btnRegenGo">Regenerate</button>`);
  const dlg = document.getElementById('dlgGeneric');
  return new Promise(resolve=>{
    let done = false;
    const finish = v=>{ if(done) return; done = true; dlg.removeEventListener('close', onClose); resolve(v); };
    const onClose = ()=>finish(null);
    dlg.addEventListener('close', onClose);
    document.getElementById('btnRegenGo').onclick = ()=>{
      const sel = document.querySelector('input[name="regenMode"]:checked');
      const v = sel ? sel.value : 'all';
      finish(v); closeGenericDialog();
    };
  });
}

/* Puts group qualifiers into the knockout placeholders. A group's slots are
   filled once all of its matches are decided (and emptied again if a group
   stops being complete); a knockout match that has started is never changed.
   Runs after every group-stage result, including corrections. */
async function fillKnockoutFromGroups(eventId){
  const draw = eventDraw(eventId);
  if(!draw || draw.format!=='group_knockout') return false;
  const matches = eventMatches(eventId);
  const grp = matches.filter(m=>m.bracket==='GRP');
  const standings = {};
  (draw.groups||[]).forEach(g=>{
    const gm = grp.filter(m=>m.groupId===g.id);
    standings[g.id] = gm.length && gm.every(m=>DECIDED_STATUSES.includes(m.status)) ? computeGroupStandings(g.entryIds, gm, draw.tiebreak) : null;
  });
  const qualifier = src => { const st = standings[src.groupId]; return (st && st[src.rank-1]) ? st[src.rank-1].entryId : null; };
  const unstarted = m => m && ['pending','scheduled'].includes(m.status) && !(m.games||[]).length;
  let changed = false;
  for(const m of matches.filter(x=>x.src1 || x.src2)){
    if(m.status==='bye'){
      // A qualifier with a bye already went through: follow a corrected standing while the next round is unplayed.
      const s = m.src1 && !m.src2 ? 1 : (m.src2 && !m.src1 ? 2 : 0);
      const want = s ? qualifier(m['src'+s]) : null;
      const next = m.nextMatchId && matchById(m.nextMatchId);
      if(want && want!==m['entry'+s+'Id'] && unstarted(next)){
        await Store.update('matches', m.id, {['entry'+s+'Id']:want, winnerEntryId:want});
        await Store.update('matches', next.id, {[m.nextMatchSlot===1?'entry1Id':'entry2Id']:want});
        changed = true;
      }
      continue;
    }
    if(!unstarted(m)) continue;
    const patch = {};
    [1,2].forEach(s=>{
      const src = m['src'+s]; if(!src) return;
      const want = qualifier(src);
      if((m['entry'+s+'Id']||null)!==want) patch['entry'+s+'Id'] = want;
    });
    if(Object.keys(patch).length){ await Store.update('matches', m.id, patch); changed = true; }
  }
  if(changed) for(const m of eventMatches(eventId).filter(x=>x.src1 || x.src2)) await maybeResolveByeLive(m.id);
  return changed;
}
/* Draws made before the knockout was generated up front have group matches
   only: add the knockout (with placeholders) and fill what is decided. */
async function generateKnockoutFromGroups(event){
  const draw = eventDraw(event.id);
  if(!draw || draw.format!=='group_knockout') return;
  if(eventMatches(event.id).some(m=>m.bracket==='SE')){ await fillKnockoutFromGroups(event.id); return; }
  return act(async ()=>{
    const ctx = {tournamentId:event.tournamentId, eventId:event.id, drawId:draw.id};
    const koMatches = buildKnockoutPlaceholders(ctx, draw.groups||[], draw.qualifiersPerGroup||2, {thirdPlace:event.thirdPlaceMatch});
    for(const m of koMatches) await Store.add('matches', m, m.id);
    await fillKnockoutFromGroups(event.id);
    if(event.status==='completed') await Store.update('events', event.id, {status:'in_progress'});
    await notify(event.tournamentId, null, 'draw_published', 'Knockout stage added for ' + event.name + '.');
  }, 'Knockout bracket added');
}

async function assignMatchSchedule(match, courtId, scheduledStart, estDurationMin){
  const conflicts = checkSchedulingConflict(match.tournamentId, match.id, courtId, scheduledStart, estDurationMin);
  if(conflicts.length){
    const c = conflicts.find(x=>x.type==='court') || conflicts.find(x=>x.type==='order') || conflicts[0];
    let kind;
    if(c.type==='court') kind = 'That court is already booked at this time.';
    else if(c.type==='order' && c.feeder) kind = 'This match needs the '+(c.match.loserNextMatchId===match.id?'loser':'winner')+' of '+matchNumberLabel(c.match)+', which is scheduled until '+fmtTime(new Date(matchWindow(c.match).end).toISOString())+' (then '+c.restMin+' min rest). Earliest start: '+fmtTime(new Date(c.freeAt).toISOString())+'.';
    else if(c.type==='order') kind = matchNumberLabel(c.match)+' at '+fmtTime(c.match.scheduledStart)+' needs the result of this match. Pick an earlier time, or move '+matchNumberLabel(c.match)+' first.';
    else if(c.freeAt) kind = 'A player needs '+c.restMin+' min rest after their match ('+entryName(entryById(c.match.entry1Id))+' vs '+entryName(entryById(c.match.entry2Id))+'). Earliest start: '+fmtTime(new Date(c.freeAt).toISOString())+'.';
    else kind = 'A player has another match too soon after this one ('+c.restMin+' min rest needed).';
    toast('Scheduling conflict: ' + kind, true);
    return false;
  }
  await act(async ()=>{
    await Store.update('matches', match.id, {courtId, scheduledStart, estDurationMin: estDurationMin||30, status: match.status==='pending'?'pending':'scheduled'});
    await notify(match.tournamentId, null, 'match_scheduled', 'Match scheduled on ' + ((courtById(courtId)||{}).name||'court') + ' at ' + fmtDateTime(scheduledStart) + '.');
  }, 'Match scheduled');
  return true;
}
