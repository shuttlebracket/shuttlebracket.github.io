<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuttle Bracket</title>
<meta name="description" content="Badminton tournament management: registrations, seeded draws, live scoring, scheduling and rankings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f6f5fc; --surface:#ffffff; --surface-2:#eeecf8; --border:#e2dff0;
    --ink:#17142e; --muted:#5f5b7a; --faint:#9a96b3;
    --court:#5a3cf0; --court-ink:#ffffff; --court-soft:#ece8ff;
    --accent2:#d43fd8; --grad:linear-gradient(135deg,#5a3cf0 0%,#8b4cf6 55%,#d43fd8 100%);
    --gold:#f2643b; --gold-soft:#ffece5;
    --danger:#d92d5c; --danger-soft:#fde7ee;
    --win:#12a37f; --win-soft:#e1f6ef;
    --live:#f2643b;
    --shadow: 0 1px 2px rgba(35,24,90,.06), 0 10px 28px rgba(35,24,90,.08);
    --glow: 0 6px 18px rgba(90,60,240,.28);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d0b1a; --surface:#171429; --surface-2:#201c37; --border:#2d2848;
      --ink:#f2f0fb; --muted:#a8a3c6; --faint:#6e6990;
      --court:#8f7dff; --court-ink:#0d0b1a; --court-soft:#241e4a;
      --accent2:#ec6cf0; --grad:linear-gradient(135deg,#6d52ff 0%,#9a5cf7 55%,#e052e4 100%);
      --gold:#ff8a5c; --gold-soft:#34201a;
      --danger:#ff6b90; --danger-soft:#351725;
      --win:#3ddbb0; --win-soft:#12302a;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
      --glow: 0 6px 20px rgba(143,125,255,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0b1a; --surface:#171429; --surface-2:#201c37; --border:#2d2848;
    --ink:#f2f0fb; --muted:#a8a3c6; --faint:#6e6990;
    --court:#8f7dff; --court-ink:#0d0b1a; --court-soft:#241e4a;
    --accent2:#ec6cf0; --grad:linear-gradient(135deg,#6d52ff 0%,#9a5cf7 55%,#e052e4 100%);
    --gold:#ff8a5c; --gold-soft:#34201a;
    --danger:#ff6b90; --danger-soft:#351725;
    --win:#3ddbb0; --win-soft:#12302a;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    --glow: 0 6px 20px rgba(143,125,255,.3);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{
    font-family:"Big Shoulders Display","Public Sans",sans-serif;
    font-weight:800; letter-spacing:.01em; text-transform:uppercase; text-wrap:balance;
    margin:0;
  }
  .mono, .score-num, .stat-num{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  a{color:inherit}
  button{font:inherit}
  input,select,textarea{font:inherit}
  ::selection{background:var(--court); color:var(--court-ink)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

  .shell{ max-width:1280px; margin:0 auto; padding:0 16px 60px; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:30; }
  .brand{ display:flex; align-items:center; gap:9px; flex:none; }
  .brand-mark{ width:32px; height:32px; border-radius:10px; background:var(--grad); color:#fff; box-shadow:var(--glow); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-name{ font-size:18px; line-height:1; }
  .brand-name .accent{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .topbar-spacer{ flex:1; min-width:6px; }
  .topbar-group{ display:flex; align-items:center; gap:6px; }

  .role-switch{ position:relative; }
  .role-btn{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .role-btn svg{ width:14px; height:14px; }
  .role-menu{ position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:8px; width:250px; z-index:40; display:none; }
  .role-menu.open{ display:block; }
  .role-menu h4{ font-size:10.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; font-family:inherit; font-weight:700; padding:4px 6px; }
  .role-opt{ width:100%; text-align:left; border:none; background:transparent; padding:8px 8px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .role-opt:hover{ background:var(--surface-2); }
  .role-opt.active{ background:var(--court-soft); color:var(--court); }
  .role-menu select{ width:100%; margin-top:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:8px; padding:8px; }
  .role-menu .hint{ font-size:11px; color:var(--faint); padding:6px 6px 2px; }

  .icon-toggle-btn{ position:relative; appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--muted); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-toggle-btn:hover{ color:var(--ink); background:var(--surface-2); }
  .icon-toggle-btn svg{ width:16px; height:16px; }
  .badge-dot{ position:absolute; top:-3px; right:-3px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:var(--gold); color:#1a1206; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; }

  .theme-toggle{ display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px; }
  .theme-toggle button{ border:none; background:transparent; color:var(--muted); width:28px; height:28px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .theme-toggle button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .theme-toggle svg{ width:14px; height:14px; }

  .search-wrap{ position:relative; }
  .search-box{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:0 10px; height:34px; width:190px; }
  .search-box svg{ width:14px; height:14px; color:var(--faint); flex:none; }
  .search-box input{ border:none; background:none; outline:none; color:var(--ink); font-size:13px; width:100%; }
  .search-results{ position:absolute; left:0; top:calc(100% + 6px); width:320px; max-width:80vw; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:60vh; overflow-y:auto; z-index:40; display:none; }
  .search-results.open{ display:block; }
  .sr-group h4{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 12px 2px; font-family:inherit; font-weight:700; }
  .sr-item{ display:block; width:100%; text-align:left; border:none; background:none; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  .sr-item:hover{ background:var(--surface-2); }
  .sr-item .sr-sub{ color:var(--muted); font-size:11.5px; }
  .sr-empty{ padding:16px 12px; color:var(--faint); font-size:12.5px; text-align:center; }

  .notif-panel{ position:absolute; right:0; top:calc(100% + 6px); width:340px; max-width:88vw; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:70vh; overflow-y:auto; z-index:40; display:none; }
  .notif-panel.open{ display:block; }
  .notif-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  .notif-head h4{ font-size:13px; font-family:inherit; font-weight:700; text-transform:none; letter-spacing:0; }
  .notif-item{ padding:10px 12px; border-bottom:1px solid var(--border); font-size:12.5px; display:flex; gap:8px; cursor:pointer; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--surface-2); }
  .notif-item.unread{ background:var(--court-soft); }
  .notif-dot{ width:7px; height:7px; border-radius:50%; background:var(--court); flex:none; margin-top:5px; }
  .notif-item.unread .notif-dot{ background:var(--gold); }
  .notif-item:not(.unread) .notif-dot{ background:transparent; }
  .notif-body p{ margin:0; }
  .notif-time{ color:var(--faint); font-size:11px; }

  /* ---------- primary nav ---------- */
  .primary-nav{ display:flex; gap:4px; flex-wrap:wrap; background:var(--surface-2); padding:4px; border-radius:12px; margin-bottom:16px; }
  .primary-nav button{ border:none; background:transparent; padding:8px 13px; border-radius:9px; font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .primary-nav button.active{ background:var(--surface); color:var(--court); box-shadow:var(--shadow); }

  /* ---------- buttons ---------- */
  .btn{ appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:10px; font-weight:600; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn:hover{ border-color:var(--faint); }
  .btn:active{ transform:translateY(1px); }
  .btn svg{ width:15px; height:15px; flex:none; }
  .btn-primary{ background:var(--grad); border-color:transparent; color:#fff; box-shadow:var(--glow); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; padding:8px 10px; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:8px; }
  .btn-lg{ padding:14px 18px; font-size:15px; border-radius:14px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .icon-btn{ appearance:none; border:1px solid transparent; background:transparent; color:var(--muted); width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- layout ---------- */
  /* minmax(0,1fr): a plain 1fr column can never shrink below its widest
     content (a table, a bracket, a long tab row), which is what pushed whole
     pages wider than a phone screen. */
  .layout{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:18px; align-items:start; }
  .layout.no-sidebar{ grid-template-columns:minmax(0,1fr); }
  .main, .main-inner{ min-width:0; }
  @media (max-width:860px){ .layout{ grid-template-columns:minmax(0,1fr); } .sidebar{ order:2; position:static; } .main{ order:1; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .sidebar{ padding:12px; position:sticky; top:68px; max-height:calc(100vh - 90px); overflow-y:auto; }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 2px;}
  .sidebar-head h2{ font-size:12.5px; margin:0; color:var(--muted); letter-spacing:.08em; }
  .t-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .t-item{ border-radius:10px; }
  .t-item button{ width:100%; text-align:left; background:transparent; color:var(--ink); font:inherit; border:1px solid transparent; border-radius:10px; padding:9px 10px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .t-item button:hover{ background:var(--surface-2); }
  .t-item.active button{ background:var(--court-soft); border-color:var(--court); }
  .t-name{ font-weight:700; font-size:13.5px; }
  .t-meta{ font-size:11px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .empty-note{ font-size:12.5px; color:var(--faint); padding:10px 6px; }

  .main{ min-height:400px; }
  .main-inner{ padding:16px 18px; }
  .empty-hero{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding:44px 20px; }
  .empty-hero .kicker{ color:var(--court); font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; }
  .empty-hero h2{ font-size:27px; margin:0; max-width:24ch; }
  .empty-hero p{ color:var(--muted); max-width:50ch; margin:0; font-size:13.5px; }
  .empty-hero .hero-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .t-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .t-header h2{ font-size:24px; margin:0 0 4px; }
  .t-header .t-sub{ color:var(--muted); font-size:12.5px; }
  .t-header .t-actions{ display:flex; gap:8px; flex:0 1 auto; min-width:0; flex-wrap:wrap; }

  /* screens reached from the bottom bar need no title: the bar already says where you are */
  .t-header.page-h > div:first-child{ display:none; }
  .t-header.page-h{ justify-content:flex-end; }
  .t-header.page-h:not(:has(.t-actions > *)){ display:none; }
  .topbar-actions{ display:flex; align-items:center; }
  .topbar-actions:empty{ display:none; }
  .topbar-actions .t-actions{ display:flex; gap:8px; flex-wrap:nowrap; }
  @media (max-width:700px){
    .topbar{ flex-wrap:nowrap; }
    .topbar .brand{ min-width:0; }
    .topbar-group{ margin-left:auto; }
    .topbar-actions .t-actions{ gap:6px; }
    .topbar-actions .btn{ width:38px; height:38px; padding:0; justify-content:center; font-size:0; gap:0; border-radius:12px; }
    .topbar-actions .btn.m-keep{ width:auto; padding:0 11px; font-size:12.5px; gap:4px; white-space:nowrap; }
    .topbar-actions .btn.m-keep svg{ width:16px; height:16px; }
    .topbar .brand-name{ font-size:14px; }
    .topbar .brand-mark{ width:34px; height:34px; }
    .topbar-spacer{ min-width:0; }
    .topbar-actions .btn svg{ width:18px; height:18px; }
  }
  @media (max-width:389px){ .topbar .brand-name{ display:none; } }
  .back-link{ display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; background:none; border:none; padding:4px 0; margin-bottom:8px; }
  .back-link:hover{ color:var(--ink); }
  .back-link svg{ width:14px; height:14px; }

  .tabs{ display:flex; flex-wrap:wrap; gap:4px; background:var(--surface-2); padding:4px; border-radius:11px; margin-bottom:16px; width:fit-content; max-width:100%; }
  .tab{ border:none; background:transparent; padding:8px 14px; border-radius:8px; font-weight:700; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab.active{ background:var(--surface); color:var(--court); box-shadow:var(--shadow); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
  .pill.gold{ background:var(--gold-soft); color:var(--gold); }
  .pill.court{ background:var(--court-soft); color:var(--court); }
  .pill.danger{ background:var(--danger-soft); color:var(--danger); }
  .pill.live{ background:var(--gold-soft); color:var(--gold); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }

  /* Sponsors: running text under the tabs on the live link */
  .sponsor-ticker{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:7px 12px; margin:-6px 0 16px; overflow:hidden; }
  .st-label{ flex:none; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--court); }
  .st-viewport{ flex:1; min-width:0; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%); }
  .st-track{ display:flex; width:max-content; animation:st-scroll var(--st-dur,20s) linear infinite; }
  .st-run{ display:flex; align-items:center; flex:none; white-space:nowrap; font-size:13px; font-weight:700; color:var(--ink); }
  .st-run span{ padding:0 14px; }
  .st-run i{ font-style:normal; color:var(--accent2); }
  .sponsor-ticker:hover .st-track{ animation-play-state:paused; }
  @keyframes st-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){
    .st-viewport{ -webkit-mask-image:none; mask-image:none; }
    .st-track{ animation:none; width:auto; }
    .st-run{ flex:1 1 auto; min-width:0; white-space:normal; flex-wrap:wrap; row-gap:4px; }
    .st-run > i:last-child{ display:none; }
    .st-run[aria-hidden="true"]{ display:none; }
  }
  .filter-bar .btn-clear-filters{ color:var(--muted); }
  .filter-bar .btn-clear-filters svg{ width:13px; height:13px; }

  .cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .cat-card{ border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; background:var(--surface); position:relative; transition:border-color .12s; }
  .cat-card:hover{ border-color:var(--court); }
  .cat-card h3{ font-size:15px; margin:0 0 6px; text-transform:none; letter-spacing:0; font-family:"Public Sans"; font-weight:700; }
  .cat-card .cat-meta{ color:var(--muted); font-size:11.5px; display:flex; gap:6px; flex-wrap:wrap; }
  .cat-card .cat-del{ position:absolute; top:8px; right:8px; }
  /* Only a real mouse gets hover-revealed controls. On touch screens they always
     show: iOS swallows the first tap on an element whose :hover reveals content,
     which made cards need two taps to open. */
  .cat-card .cat-del + h3{ padding-right:30px; }
  .cat-card:active{ border-color:var(--court); background:var(--surface-2); }
  .stat-tile[data-tab]{ cursor:pointer; }
  .stat-tile[data-tab]:active{ border-color:var(--court); }
  @media (hover:hover) and (pointer:fine){
    .cat-card .cat-del{ opacity:0; }
    .cat-card:hover .cat-del, .cat-card:focus-within .cat-del{ opacity:1; }
  }
  /* iOS Safari/WKWebView only delivers taps to elements that look clickable;
     every element with a tap handler therefore gets a pointer cursor. */
  [data-open-match], [data-open-event], [data-open-player], [data-open-tournament], [data-open-tab],
  [data-open-club], [data-select-tournament], [data-back-events], [data-close]{ cursor:pointer; }

  .card{ border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--surface); }
  .card + .card{ margin-top:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .row.wrap{ flex-wrap:wrap; }

  /* ---------- stat tiles / dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px; }
  .stat-tile{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface); }
  .stat-tile .stat-num{ font-size:24px; font-weight:700; line-height:1.1; }
  .stat-tile .stat-label{ color:var(--muted); font-size:11px; margin-top:3px; letter-spacing:.02em; }
  .stat-tile.accent .stat-num{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat-tile.gold .stat-num{ color:var(--gold); }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-row .bar-label{ width:110px; flex:none; font-size:12px; color:var(--muted); }
  .bar-track{ flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--court); border-radius:5px; }
  .bar-row .bar-num{ width:64px; flex:none; text-align:right; font-size:12px; color:var(--muted); }

  .ring-wrap{ display:flex; align-items:center; gap:14px; }
  .ring-label{ font-size:12px; color:var(--muted); }
  .ring-label strong{ color:var(--ink); display:block; font-size:15px; }

  .section-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 0 10px; flex-wrap:wrap; }
  .section-h h3{ font-size:16px; text-transform:none; letter-spacing:0; font-family:"Public Sans"; font-weight:700; }
  .section-h:first-child{ margin-top:0; }

  .list-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface); flex-wrap:wrap; }
  .list-row .main-txt{ font-weight:600; font-size:13.5px; }
  .list-row .sub-txt{ color:var(--muted); font-size:11.5px; }
  .list-row .grow{ flex:1; min-width:120px; }
  .seed-tag{ display:inline-block; min-width:16px; margin-right:6px; padding:0 4px; border-radius:6px; background:var(--court-soft); color:var(--court); font-size:10.5px; font-weight:800; text-align:center; font-style:normal; }
  .seed-badge{ width:24px; height:24px; border-radius:999px; background:var(--court-soft); color:var(--court); font-weight:700; font-size:11.5px; display:flex; align-items:center; justify-content:center; flex:none; }
  .avatar{ width:30px; height:30px; border-radius:999px; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  .draw-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:12px; background:var(--court-soft); border:1px solid var(--court); margin-top:14px; flex-wrap:wrap; }
  .draw-banner p{ margin:0; font-size:13px; color:var(--ink); }
  .draw-banner strong{ color:var(--court); }
  .generated-note{ display:flex; align-items:center; gap:8px; color:var(--court); font-weight:700; font-size:13px; padding:10px 2px; }
  .conflict-warn{ display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600; margin-top:8px; }
  .conflict-warn svg{ width:15px; height:15px; flex:none; margin-top:1px; }

  /* ---------- bracket ---------- */
  .bracket-wrap{ overflow-x:auto; padding-bottom:10px; }
  .bracket{ position:relative; display:flex; gap:36px; padding:6px 6px 20px; }
  .bracket-lines{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .bracket-lines path{ fill:none; stroke:var(--border); stroke-width:2; }
  .round-col{ display:flex; flex-direction:column; justify-content:space-around; gap:14px; flex:1 1 0; min-width:150px; max-width:230px; }
  .round-label{ text-align:center; font-size:10.5px; letter-spacing:.1em; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:2px; }
  .match-card{ border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden; cursor:default; }
  .match-card.playable, .match-card[data-open-match]{ cursor:pointer; }
  .match-card.playable:hover{ border-color:var(--court); }
  .m-slot{ display:flex; align-items:center; justify-content:space-between; padding:7px 9px; font-size:12.5px; gap:6px; }
  .m-slot + .m-slot{ border-top:1px solid var(--border); }
  .m-slot .name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-slot.tbd .name{ color:var(--faint); font-weight:500; font-style:italic; }
  .m-slot.winner .name{ color:var(--court); }
  .m-slot .score{ font-size:11.5px; color:var(--muted); flex:none; }
  .m-status{ font-size:9.5px; text-align:center; padding:3px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); background:var(--surface-2); }
  .m-status.bye{ color:var(--gold); }
  .m-status.live{ color:var(--gold); font-weight:700; }
  .bracket-section{ margin-bottom:26px; }
  .bracket-section h4{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; font-family:inherit; font-weight:700; }
  .bracket-section.wb h4{ color:var(--court); }
  .bracket-section.lb h4{ color:var(--danger); }
  .bracket-section.gf h4{ color:var(--gold); }

  .group-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .group-card h4{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-family:inherit; font-weight:700; color:var(--muted); }

  /* ---------- standings ---------- */
  table.standings, table.data-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.standings th, table.data-table th{ text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 9px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.standings td, table.data-table td{ padding:8px 9px; border-bottom:1px solid var(--border); }
  table.standings td.num, table.standings th.num, table.data-table td.num, table.data-table th.num{ text-align:right; }
  table.standings tr:last-child td, table.data-table tr:last-child td{ border-bottom:none; }
  table.standings tr.rank-1 .rk{ color:var(--gold); font-weight:800; }
  .table-scroll{ overflow-x:auto; }

  .empty-tab{ padding:36px 12px; text-align:center; color:var(--muted); font-size:13px; }
  .loading-tab{ padding:36px 12px; text-align:center; color:var(--faint); font-size:13px; }
  .error-inline{ padding:9px 12px; border-radius:9px; background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600; margin:8px 0; display:flex; gap:8px; align-items:center; }
  .error-inline svg{ width:14px; height:14px; flex:none; }

  /* ---------- filter bar ---------- */
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .filter-bar select, .filter-bar input{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:9px; padding:7px 9px; font-size:12.5px; }
  .export-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  /* ---------- schedule grid ---------- */
  .sched-scroll{ overflow-x:auto; }
  table.sched-grid{ border-collapse:collapse; width:100%; min-width:640px; }
  table.sched-grid th{ background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px; border:1px solid var(--border); white-space:nowrap; }
  table.sched-grid td{ border:1px solid var(--border); padding:5px; vertical-align:top; min-width:130px; }
  .sched-cell-match{ border-radius:8px; background:var(--court-soft); padding:6px 7px; font-size:11px; cursor:pointer; margin-bottom:4px; }
  .sched-cell-match:hover{ filter:brightness(0.97); }
  .sched-cell-match.live{ background:var(--gold-soft); }
  .sched-time-col{ font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap; }

  .court-chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:12.5px; font-weight:600; background:var(--surface); }
  .court-chip.inactive{ opacity:.5; }
  .court-list{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- live scoring ---------- */
  .live-screen{ display:flex; flex-direction:column; gap:10px; }
  .live-topinfo{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .live-games-strip{ display:flex; gap:6px; flex-wrap:wrap; }
  .live-game-chip{ padding:4px 9px; border-radius:8px; background:var(--surface-2); font-size:12px; font-weight:700; }
  .live-court-card{ display:flex; flex-direction:column; gap:12px; }
  .live-score-board{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .live-side{ border:1px solid var(--border); border-radius:16px; padding:16px 10px; text-align:center; display:flex; flex-direction:column; gap:10px; background:var(--surface); }
  .live-side .side-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live-side .side-score{ font-size:64px; font-weight:800; font-family:"Big Shoulders Display"; line-height:1; }
  .big-btn{ appearance:none; border:none; border-radius:16px; background:var(--court); color:var(--court-ink); font-weight:800; font-size:17px; padding:20px 8px; cursor:pointer; width:100%; touch-action:manipulation; }
  .big-btn:active{ filter:brightness(1.15); transform:scale(.98); }
  .live-controls{ display:flex; gap:8px; flex-wrap:wrap; }
  .live-controls .btn{ flex:1; min-width:100px; justify-content:center; padding:12px; }

  /* ---------- dialogs ---------- */
  dialog{ border:none; border-radius:16px; padding:0; background:var(--surface); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.25); width:min(480px,92vw); max-height:88vh; }
  dialog::backdrop{ background:rgba(16,10,40,.5); backdrop-filter:blur(3px); }
  .dlg-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
  .dlg-head h3{ font-size:16px; margin:0; text-transform:none; letter-spacing:0; font-family:"Public Sans"; font-weight:700; }
  .dlg-body{ padding:16px 18px; display:flex; flex-direction:column; gap:12px; max-height:64vh; overflow-y:auto; }
  .dlg-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); flex-wrap:wrap; }
  [hidden]{ display:none !important; }   /* the attribute must beat display rules such as .field{display:flex} */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--muted); }
  .field input, .field select, .field textarea{ border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:9px; padding:9px 10px; font-size:14px; font-family:inherit; width:100%; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--court); outline-offset:-1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }

  /* ---------- custom date picker (native <input type=date> pickers get clipped
     inside a scrolling dialog body, so dates use this instead) ---------- */
  .date-field{ position:relative; }
  .date-field input.date-input{ padding-right:34px; cursor:pointer; background:var(--bg); }
  .date-field .date-ic{ position:absolute; right:9px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none; }
  .dp-popover{ position:fixed; z-index:999; width:264px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:10px; }
  .dp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .dp-month{ font-weight:700; font-size:13px; }
  .dp-head .icon-btn{ width:26px; height:26px; }
  .dp-dow{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.04em; margin-bottom:2px; }
  .dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .dp-cell{ height:30px; display:flex; align-items:center; justify-content:center; }
  .dp-empty{ visibility:hidden; }
  button.dp-day{ border:none; background:transparent; color:var(--ink); border-radius:8px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  button.dp-day:hover{ background:var(--surface-2); }
  button.dp-day.dp-today{ font-weight:700; color:var(--court); }
  button.dp-day.dp-sel{ background:var(--court); color:#fff; }
  button.dp-day:disabled{ color:var(--faint); opacity:.45; cursor:default; background:transparent; }
  .dp-foot{ display:flex; justify-content:space-between; margin-top:8px; gap:8px; }
  .dp-foot .btn{ flex:1; }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{ flex:1; border:1px solid var(--border); background:var(--bg); color:var(--muted); padding:8px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; min-width:70px; }
  .seg button.active{ background:var(--court); border-color:var(--court); color:var(--court-ink); }
  .helptext{ font-size:11.5px; color:var(--faint); }
  .am-warn{ background:color-mix(in srgb, var(--gold) 12%, transparent); color:var(--ink); border-radius:10px; padding:9px 11px; font-size:12.5px; margin-bottom:10px; }
  .am-final-teams{ display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-top:12px; }
  .am-final-team{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .am-final-team select{ width:100%; min-width:0; padding:9px 8px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font:inherit; font-size:13px; }
  .am-final-lbl{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .am-final-vs{ font-weight:800; color:var(--muted); font-size:12px; padding-top:18px; }
  .am-final-card{ border-radius:16px; padding:14px; background:linear-gradient(135deg, color-mix(in srgb, var(--court) 10%, var(--surface)), color-mix(in srgb, #d43fd8 8%, var(--surface))); border:1px solid color-mix(in srgb, var(--court) 22%, var(--border)); margin-bottom:14px; }
  .am-final-card .row-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .am-final-card h4{ margin:0; font-size:15px; font-weight:800; }
  .am-final-champ{ font-size:13px; font-weight:700; color:var(--court); margin-top:8px; }
  @media (max-width:420px){ .am-final-teams{ grid-template-columns:1fr; } .am-final-vs{ padding:0; text-align:center; } }

  .toast-host{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:80; width:min(360px,92vw); align-items:center; }
  .toast{ background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); text-align:center; }
  .toast.error{ background:var(--danger); color:#fff; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  .t-header > div:first-child{ min-width:0; }
  .t-header h2{ overflow-wrap:anywhere; }
  /* iPhone/iPad zoom the whole page in when you tap a text box whose text is
     smaller than 16px, and stay zoomed, which pushes the layout past the screen.
     On touch screens every text box, dropdown and text area uses 16px. */
  @media (pointer:coarse){
    input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea{ font-size:16px !important; }
  }
  .score-summary{ text-align:center; font-size:11.5px; color:var(--muted); margin:4px 0 10px; }
  /* Score editor: one card per game, name on the left, [-] [score] [+] on the right. */
  .game-block{ border:1px solid var(--border); border-radius:12px; padding:8px 12px 6px; margin-bottom:10px; background:var(--bg); }
  .game-block .g-label{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  .score-row{ display:flex; align-items:center; gap:10px; padding:4px 0; }
  .score-row .who{ flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
  .stepper{ display:flex; align-items:center; gap:6px; flex:none; }
  .stepper button{ width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:20px; font-weight:700; line-height:1; cursor:pointer; touch-action:manipulation; padding:0; }
  .stepper button:active{ background:var(--surface-2); }
  .score-input{ width:58px; height:40px; text-align:center; font-size:18px; font-weight:700; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); padding:0; -moz-appearance:textfield; appearance:textfield; }
  .score-input::-webkit-inner-spin-button, .score-input::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .score-input:focus{ outline:2px solid var(--court); outline-offset:1px; }
  .game-winner-note:empty{ display:none; }
  .game-winner-note.bad{ color:var(--danger) !important; }
  .score-summary.bad{ color:var(--danger); font-weight:700; }
  .reg-banner{ display:flex; gap:8px; align-items:flex-start; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .reg-banner svg{ width:16px; height:16px; flex:none; margin-top:1px; }
  .reg-banner.open{ background:var(--court-soft); color:var(--ink); }
  .reg-banner.closed{ background:var(--surface-2); color:var(--muted); }
  .late-note{ display:flex; gap:6px; align-items:flex-start; margin:8px 0 0; color:var(--gold, #a86b00); }
  .late-note svg{ width:14px; height:14px; flex:none; margin-top:2px; }
  .list-row select{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:9px; padding:8px 10px; font-size:13px; font-family:inherit; max-width:100%; }
  @media (max-width:700px){ .list-row.wrap select{ flex:1 1 100%; min-width:0 !important; } }
  /* Live link: follow a player */
  .follow-bar{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px 10px 8px 12px; margin:0 0 12px; box-shadow:var(--shadow); }
  .follow-bar.on{ border-color:transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--grad) border-box; border:2px solid transparent; }
  .follow-bar .follow-ic{ width:30px; height:30px; border-radius:50%; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .follow-bar .follow-ic svg{ width:16px; height:16px; }
  .follow-bar select{ flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font:inherit; font-size:14px; font-weight:600; padding:6px 0; outline:none; }
  .follow-note{ display:flex; align-items:center; gap:8px; background:var(--court-soft); color:var(--ink); border-radius:10px; padding:8px 10px; margin-bottom:12px; font-size:13px; }
  .follow-note svg{ width:15px; height:15px; color:var(--court); flex:none; }
  .follow-note span{ flex:1; min-width:0; }
  tr.me-row td{ background:var(--court-soft); font-weight:700; }
  tr.me-row td:first-child{ box-shadow:inset 3px 0 0 var(--court); }
  .me-match{ outline:2px solid var(--court); outline-offset:1px; box-shadow:var(--glow) !important; }
  .follow-hero{ background:var(--grad); color:#fff; border-radius:18px; padding:18px; margin-bottom:6px; box-shadow:var(--glow); }
  .follow-hero .fh-name{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .follow-hero .fh-sub{ opacity:.85; font-size:13px; margin-top:2px; min-height:4px; }
  .follow-hero .fh-stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px; }
  .follow-hero .fh-stats div{ background:rgba(255,255,255,.16); border-radius:12px; padding:8px 6px; text-align:center; }
  .follow-hero .fh-stats b{ display:block; font-size:17px; font-family:"JetBrains Mono",ui-monospace,monospace; }
  .follow-hero .fh-stats span{ font-size:10.5px; opacity:.9; text-transform:uppercase; letter-spacing:.04em; }
  .fm-row .wl{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; }
  .fm-row .wl svg{ width:15px; height:15px; }
  .fm-row .wl.w{ background:var(--win-soft); color:var(--win); }
  .fm-row .wl.l{ background:var(--danger-soft); color:var(--danger); }
  .fm-row .wl.live{ background:var(--gold-soft); color:var(--gold); }
  .fm-row .wl.next{ background:var(--court-soft); color:var(--court); }
  .fm-row .fm-score{ font-weight:700; font-size:13px; text-align:right; flex:none; max-width:36%; line-height:1.35; }
  .fm-row .fm-score span{ display:inline-block; white-space:nowrap; }
  .ko-scoring{ margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .dlg-section{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; padding-top:12px; border-top:1px solid var(--border); }
  .score-summary.won{ font-size:13px; color:var(--court); font-weight:700; }

  @media (max-width:520px){
    .t-header h2{ font-size:20px; }
    .live-side .side-score{ font-size:52px; }
    .search-box{ width:120px; }
    .brand-name{ font-size:15px; }
  }

  /* ---------- phone-only pieces (hidden on wider screens) ---------- */
  .mobile-only{ display:none !important; }
  .m-menu-only{ display:none !important; }            /* listed only in the ⋯ sheet, at every width */
  .m-more-btn.always{ display:inline-flex !important; }
  .ev-setup .ev-sum{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--border); }
  .ev-setup .ev-sum .grow{ flex:1; min-width:0; }
  .ev-setup .ev-setup-acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .ev-pop-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .ev-pop-row:last-child{ border-bottom:none; }
  .ev-pop-row .grow{ flex:1; min-width:0; }
  .ev-pop-row select{ width:124px; flex:none; }
  .ev-pop-row input{ flex:none; }
  .ev-pop-row select, .ev-pop-row input{ border:1px solid var(--border); border-radius:8px; padding:5px 6px; background:var(--bg); color:var(--ink); font:inherit; font-size:13px; }
  .ev-pop-add{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .ev-pop-add select{ flex:1 1 150px; min-width:0; border:1px solid var(--border); border-radius:9px; padding:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; }
  .tabbar{ display:none; }
  .sched-list{ display:none; }

    .tabbar{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:2px; position:fixed; left:0; right:0; bottom:0; z-index:60;

    .cat-grid, .group-grid{ grid-template-columns:minmax(0,1fr); }

    table.standings, table.data-table{ font-size:12px; }

  .sheet-list{ background:var(--surface-2); border-radius:14px; overflow:hidden; }
  .sheet-item{ width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; border:none; border-bottom:1px solid var(--border); background:none; color:var(--ink); font:inherit; font-size:15px; font-weight:600; text-align:left; cursor:pointer; }
  .sheet-item:last-child{ border-bottom:none; }
  .sheet-item svg{ width:19px; height:19px; color:var(--muted); flex:none; }
  .sheet-item.danger, .sheet-item.danger svg{ color:var(--danger); }
  .sheet-item.primary, .sheet-item.primary svg{ color:var(--court); }
  .sheet-item:disabled{ opacity:.45; }
  .sheet-cancel{ width:100%; margin-top:8px; padding:14px; border:none; border-radius:14px; background:var(--surface-2); color:var(--ink); font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .m-more-btn svg{ width:18px; height:18px; }
  .ev-subtabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; margin:4px 0 14px; }
  .ev-subtabs button{ flex:1; border:none; background:transparent; color:var(--muted); padding:9px 6px; border-radius:9px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .ev-subtabs button.active{ background:var(--surface); color:var(--court); box-shadow:var(--shadow); }
  .ev-subtabs .n{ font-weight:600; color:var(--faint); margin-left:3px; }
  .court-chip .cc-name{ display:inline-flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; }
  .court-chip .pill.live{ padding:1px 6px; font-size:10px; }
  .court-chip .cc-actions{ display:inline-flex; gap:4px; margin-left:auto; }
  .court-chip .cc-actions .icon-btn{ width:28px; height:28px; }
  .court-chip .cc-actions .icon-btn svg{ width:15px; height:15px; }
  .m-details > summary{ list-style:none; cursor:pointer; }
  .m-details > summary svg{ width:15px; height:15px; flex:none; }
  .m-details > summary{ font-size:14px !important; color:var(--ink) !important; }
  .m-details select{ flex:1 1 150px; min-width:0 !important; padding:9px 10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font:inherit; font-size:13px; }
  .m-details:not([open]) > summary{ margin-bottom:0 !important; }
  .export-row .m-more-btn{ margin-left:auto; }
  .m-details > summary::-webkit-details-marker{ display:none; }
  .filter-count{ display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; border-radius:9px; background:var(--court); color:#fff; font-size:10.5px; font-weight:800; padding:0 4px; margin-left:2px; }

  @media (max-width:700px){
    /* secondary actions live in the "⋯" sheet */
    .m-overflow{ display:none !important; }
    .m-hide{ display:none; }

    /* tournament header: title + two icon buttons */
    .t-header{ flex-wrap:nowrap; align-items:flex-start; margin-bottom:10px; }
    .t-header h2{ font-size:19px; line-height:1.2; }
    .t-header .t-sub{ font-size:12px; line-height:1.6; }
    .t-header .t-actions{ width:auto; flex:none; flex-wrap:nowrap; gap:6px; }
    .t-header .t-actions .btn{ width:38px; height:38px; padding:0; justify-content:center; font-size:0; gap:0; border-radius:12px; }
    .t-header .t-actions .btn.m-keep{ width:auto; padding:0 13px; font-size:13px; gap:6px; }
    .t-header .t-actions .btn svg{ width:18px; height:18px; }
    .back-link{ margin-bottom:2px; }

    .tabs{ display:flex; flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch;
      width:auto; max-width:none; margin:0 -14px 14px; padding:0 14px; gap:2px; background:var(--bg); border-radius:0; border-bottom:1px solid var(--border);
      position:sticky; top:calc(max(10px, env(safe-area-inset-top)) + 49px); z-index:25; }
    .tabs::-webkit-scrollbar{ display:none; }
    .tabs{ justify-content:space-between; }
    .tab{ flex:none; padding:11px 6px 10px; font-size:13px; font-weight:600; text-transform:none; letter-spacing:0; border-radius:0; background:none; box-shadow:none; border-bottom:2.5px solid transparent; margin-bottom:-1px; white-space:nowrap; }
    .tab.active{ background:none; box-shadow:none; color:var(--court); border-bottom-color:var(--court); font-weight:700; }

    .setup-tabs button{ padding:9px 4px; font-size:12.5px; }
    .m-slot{ font-size:14px; padding:8px 10px; }
    .m-slot.winner .name{ font-weight:800; }
    .setup-tabs button svg{ display:none; }
    /* quieter toolbars */
    .filter-bar{ gap:6px; margin-bottom:12px; }
    .filter-bar .m-adv{ display:none !important; }
    .filter-bar.open .m-adv{ display:block !important; }
    .filter-bar.open select.m-adv{ display:block !important; }
    .filter-bar .btn, .export-row .btn{ flex:none; }
    .export-row:not(:has(> :not(.m-overflow))){ display:none; }

    /* compact stats */
    .stat-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px; }
    .stat-tile{ padding:10px 10px; border-radius:12px; }
    .stat-tile .stat-num{ font-size:19px; }
    .stat-tile .stat-label{ font-size:10.5px; line-height:1.25; }

    /* match rows: event on top, names, then score + actions */
    .list-row{ gap:6px 10px; padding:11px 12px; border-radius:12px; }
    .list-row > .pill:first-child{ order:-2; }
    .list-row > .pill:first-child + .grow{ flex-basis:100%; }
    .list-row > .row.no-print{ margin-left:auto; }

    /* people and events: denser cards */
    .cat-grid{ gap:8px; }
    .cat-card{ padding:11px 13px; border-radius:12px; }
    .cat-card h3{ font-size:15px; }
    .cat-card .avatar{ width:34px; height:34px; font-size:14px; }
    .cat-card .row{ margin-bottom:4px !important; }
    .cat-card .cat-meta{ gap:4px; }
    .cat-card .sub-txt{ font-size:12.5px; color:var(--muted); }
    .cat-card .avatar + div h3{ font-size:14.5px; line-height:1.25; }
    .card.m-details{ padding:12px 14px; }

    /* courts: two per row */
    .court-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .court-chip{ padding:10px; }

    .section-h{ margin:18px 0 8px; }
    .card{ padding:14px; }
  }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#000; }
    .shell{ max-width:none; padding:0; }
    .panel{ box-shadow:none; border-color:#ccc; }
    .layout{ grid-template-columns:1fr; }
  }
  /* The narrowest phones (320-360px): tighter tables, and a table that still
     doesn't fit scrolls inside its own box instead of pushing the page wider. */
  @media (max-width:360px){
    table.standings th, table.data-table th, table.standings td, table.data-table td{ padding-left:3px; padding-right:3px; }
    table.standings, table.data-table{ font-size:11.5px; }
    .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  }

/* ============================== SCORING RULES ============================== */
/* Configurable badminton rally-point scoring. Never trust the UI: every save

const DEFAULT_SCORING = { bestOf:3, pointsToWin:21, winBy:2, capPoints:30, deuceEnabled:true };
const ScoreRules = {
  gameWinner(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const a=g.a, b=g.b;
    if(a==null||b==null||a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b)) return null;
    if(a===b) return null;
    if(!cfg.deuceEnabled){
      if(a>=cfg.pointsToWin || b>=cfg.pointsToWin) return a>b?1:2;
      return null;
    }
    const cap = cfg.capPoints||30;
    if(a>=cap||b>=cap) return a>b?1:2;
    const hi=Math.max(a,b), lo=Math.min(a,b);
    if(hi<cfg.pointsToWin) return null;
    if(hi-lo<cfg.winBy) return null;

  gamesNeeded(cfg){ return Math.ceil((cfg&&cfg.bestOf||3)/2); },
  matchWinner(games, cfg){

    for(const g of games){
      const w=this.gameWinner(g,cfg);
      if(w===1) w1++; else if(w===2) w2++;
      if(w1===need) return 1;
      if(w2===need) return 2;

     25-21 when a game ends at 21 or 2 clear): returns a short reason, else null.

  gameProblem(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    const a=g.a|0, b=g.b|0, hi=Math.max(a,b), lo=Math.min(a,b), P=cfg.pointsToWin||21;
    if(!cfg.deuceEnabled){
      return hi>P ? 'the game ends as soon as a side reaches '+P : null;
    }
    const cap=cfg.capPoints||30, by=cfg.winBy||2;
    if(hi>cap) return 'the game ends at '+cap+' at the latest';
    if(hi<=P) return null;                               // not past the target yet

    let w1=0, w2=0;
    for(let i=0;i<games.length;i++){
      const g = games[i];
      const played = (g.a|0) || (g.b|0);
      if((w1>=need || w2>=need) && played) return {index:i, reason:'the match was already won '+Math.max(w1,w2)+'-'+Math.min(w1,w2)+' after game '+i+', so game '+(i+1)+' isn\'t played'};
      const w = this.gameWinner(g, cfg);
      if(!w && played && games.slice(i+1).some(x=>(x.a|0)||(x.b|0))) return {index:i, reason:'game '+(i+1)+' isn\'t finished, so there can\'t be a score for game '+(i+2)};
      if(w===1) w1++; else if(w===2) w2++;
    }
    if(games.length > (cfg.bestOf||3)) return {index:cfg.bestOf||3, reason:'best of '+(cfg.bestOf||3)+' has at most '+(cfg.bestOf||3)+' games'};
    return null;
  },
  validGameScore(g, cfg){
    cfg = cfg || DEFAULT_SCORING;
    if(g.a<0||g.b<0) return false;
    const cap = cfg.capPoints||30;
    if(g.a>cap||g.b>cap) return false;
    return true;
  }
};

/* ============================== DRAW GENERATOR ============================== */
/* Verified seeding via recursive doubling, circle-method round robin, group
   splitting + crossover seeding, and a simplified-but-structurally-correct
   double elimination skeleton (nobody is out after one loss, everybody is out
   after two). */
const DrawGenerator = {
  nextPowerOfTwo(n){ let p=1; while(p<n) p*=2; return p; },
  seedOrder(size){
    let order=[1];
    while(order.length<size){
      const n=order.length*2, next=[];
      for(const s of order){ next.push(s); next.push(n+1-s); }
      order=next;
    }
    return order;
  },
  /* Returns an array of {round, position, entry1Index, entry2Index} plans
     (indices into the ordered entries array, or null = TBD/awaiting winner). */
  singleEliminationPlan(entryCount){
    if(entryCount<2) return [];
    const size=this.nextPowerOfTwo(entryCount);
    const order=this.seedOrder(size);
    const idx=(seed)=> seed<=entryCount ? seed-1 : null;
    const plans=[];
    const r1=size/2;
    for(let i=0;i<r1;i++){
      plans.push({round:1,position:i,entry1Index:idx(order[i*2]),entry2Index:idx(order[i*2+1])});
    }
    let matchesInRound=r1, round=2;
    while(matchesInRound>1){
      const nm=matchesInRound/2;
      for(let i=0;i<nm;i++) plans.push({round,position:i,entry1Index:null,entry2Index:null});
      matchesInRound=nm; round++;
    }
    return plans;
  },
  /* Circle method: works for even and odd counts (odd = bye seat each round).
     Returns schedule[roundIndex] = [[a,b], ...] using indices into `entries`. */
  roundRobinSchedule(entryCount){
    if(entryCount<2) return [];
    let players=[...Array(entryCount).keys()];
    if(players.length%2!==0) players.push(-1);
    const n=players.length, roundsCount=n-1;
    const schedule=[];
    let arr=players.slice();
    for(let r=0;r<roundsCount;r++){
      const pairs=[];
      for(let i=0;i<n/2;i++){
        const a=arr[i], b=arr[n-1-i];
        if(a!==-1 && b!==-1) pairs.push([a,b]);
      }
      schedule.push(pairs);
      const fixed=arr[0];
      const rest=arr.slice(1);
      rest.unshift(rest.pop());
      arr=[fixed,...rest];
    }
    return schedule;
  },
  /* Split ordered entry indices into groups of ~groupSize (default 4). */
  splitGroups(entryCount, groupSize){
    groupSize = groupSize||4;
    const numGroups = Math.max(1, Math.round(entryCount/groupSize));
    const groups = Array.from({length:numGroups}, ()=>[]);
    /* snake distribution across groups keeps top seeds spread evenly */
    let dir=1, g=0;
    for(let i=0;i<entryCount;i++){
      groups[g].push(i);
      if(dir===1){ if(g===numGroups-1) dir=-1; else g++; }
      else { if(g===0) dir=1; else g--; }
    }
    return groups;
  }
};

/* ============================== STORE ============================== */
/* Tries the shared `db` capability; falls back to localStorage (per-viewer
   only, never treated as shared truth) with matching filter/subscribe/emit
   semantics. Generic over any flat top-level collection name. */
const LOCAL_KEY = 'shuttle-bracket-store-v2';
/* Live-sharing defaults. Empty here; scripts/build_web.py fills them from
   sharing/share-config.json so an App Store build works without setup. */
const SHARE_DEFAULTS = {"url": "https://iimurggownawprcgmfas.supabase.co", "key": "sb_publishable_oitaKq-e5EitypzdhwFjaw_TD8mE8Is", "viewerUrl": "https://ashikeks.github.io/shuttle-bracket/"};

   and the built-in values are always used (so an old saved entry can't override them). */
const SHARE_BUILTIN = !!(SHARE_DEFAULTS.url && SHARE_DEFAULTS.key && SHARE_DEFAULTS.viewerUrl);
/* Build stamp: scripts/build_web.py writes the same id into the app and into the
   viewer page, so the app can tell when the viewer page on GitHub is out of date. */
const APP_BUILD = '20261004.083031';
/* Opened from a share link (#s=<id>&p=<project>&k=<key>)? Then this page is a
   read-only live viewer of that one tournament and never touches local data. */
const VIEWER = (function(){
  try{
    const h = new URLSearchParams((location.hash||'').replace(/^#/,''));
    const id = h.get('s'); if(!id || !/^[A-Za-z0-9]{12,40}$/.test(id)) return null;
    const ref = h.get('p'), u = h.get('u'), key = h.get('k');
    const url = (ref && /^[a-z0-9-]{3,64}$/i.test(ref)) ? 'https://'+ref.toLowerCase()+'.supabase.co'
      : (u && /^https:\/\/[^\s]+$/.test(u) ? u.replace(/\/+$/,'') : null);

    return {id, url, key};
  }catch(e){ return null; }

/* iOS app bridge (WKWebView script message handlers). Absent on the web, so
   every call is a feature-detected no-op there. In the iOS app the native
   side injects the saved database as window.__SB_NATIVE_STORE__ before this
   script runs and persists every change to a JSON file in Application
   Support (more durable than WebView localStorage, and included in backups). */
const Native = (function(){
  const h = (window.webkit && window.webkit.messageHandlers) || null;
  return {
    has(name){ return !!(h && h[name]); },
    post(name, body){ try{ h[name].postMessage(body); return true; }catch(e){ return false; } }
  };
})();
const Store = (function(){
  let db=null, mode='local';
  let local = {};
  try{
    const nativeRaw = (typeof window.__SB_NATIVE_STORE__==='string' && window.__SB_NATIVE_STORE__) ? window.__SB_NATIVE_STORE__ : null;
    const raw = VIEWER ? null : (nativeRaw || localStorage.getItem(LOCAL_KEY));
    if(raw) local=JSON.parse(raw)||{};
  }catch(e){}
  const localListeners = {};
  /* For merging with other devices (iCloud sync): every record written here
     carries _mt (last change, ms), and deletions are remembered in
     local[DEL_KEY][col][id] = time, so a record deleted on one device isn't
     brought back by another. DEL_KEY is not a collection. */
  const DEL_KEY = '__deleted';
  const TOMBSTONE_KEEP_MS = 180*864e5;
  function tomb(col){ local[DEL_KEY] = local[DEL_KEY]||{}; return (local[DEL_KEY][col] = local[DEL_KEY][col]||{}); }

  function ensureCol(col){ if(!local[col]) local[col]={}; if(!localListeners[col]) localListeners[col]=new Set(); }
  let nativeSaveTimer = null;
  function flushNative(){ nativeSaveTimer = null; Native.post('sbStore', JSON.stringify(local)); }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
    if(Native.has('sbStore')){ clearTimeout(nativeSaveTimer); nativeSaveTimer = setTimeout(flushNative, 250); }
  }
  const flushIfPending = ()=>{ if(nativeSaveTimer){ clearTimeout(nativeSaveTimer); flushNative(); } };
  window.addEventListener('pagehide', flushIfPending);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushIfPending(); });
  function matchFilters(rec, filters){ return filters.every(([f,v])=> rec[f]===v); }
  function emitLocal(col){
    ensureCol(col);
    localListeners[col].forEach(entry=>{
      let arr = Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, entry.filters));
      arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
      entry.cb(arr);
    });
  }

  async function init(){
    try{
      if(window.claude && window.claude.use){
        const d = await window.claude.use('db');
        if(d){ db=d; mode='db'; return 'db'; }
      }
    }catch(e){ console.error('db init failed, falling back to local', e); }
    mode='local';
    return 'local';
  }

  function subscribe(col, filters, cb){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      try{ filters.forEach(([f,v])=>{ q = q.where(f,'==',v); }); }catch(e){ console.error(e); cb([]); return ()=>{}; }
      return q.onSnapshot(snap=>{
        const arr = snap.docs.map(d=>({id:d.id, ...d.data()}));
        arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
        cb(arr);
      }, err=>{ console.error('db subscribe error', col, err); cb([]); });
    } else {
      ensureCol(col);
      const entry = {filters, cb};
      localListeners[col].add(entry);
      emitLocal(col);
      return ()=> localListeners[col].delete(entry);
    }
  }

  async function getAll(col, filters){
    filters = filters||[];
    if(mode==='db'){
      let q = db.collection(col);
      filters.forEach(([f,v])=>{ q = q.where(f,'==',v); });
      const snap = await q.get();
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    }
    ensureCol(col);
    return Object.entries(local[col]).map(([id,data])=>({id,...data})).filter(r=>matchFilters(r, filters));
  }

  async function add(col, data, id){
    const docId = id || uid();
    if(VIEWER) return docId;   // read-only viewer: never writes
    const body = {...data, createdAt: data.createdAt || nowIso()};
    if(mode==='db'){
      await db.collection(col).doc(docId).set(body);
    } else {
      ensureCol(col);
      local[col][docId] = {...body, _mt: Date.now()};
      if(local[DEL_KEY] && local[DEL_KEY][col]) delete local[DEL_KEY][col][docId];
      saveLocal(); emitLocal(col);
    }
    return docId;
  }
  async function update(col, id, data){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).update(data);
    } else {
      ensureCol(col);
      if(!local[col][id]) return;
      local[col][id] = {...local[col][id], ...data, _mt: Date.now()}; saveLocal(); emitLocal(col);
    }
  }
  async function remove(col, id){
    if(VIEWER) return;
    if(mode==='db'){
      await db.collection(col).doc(id).delete();
    } else {
      ensureCol(col);
      delete local[col][id]; tomb(col)[id] = Date.now(); saveLocal(); emitLocal(col);
    }
  }

  /* Merge a database from another device (iCloud) into this one, record by
     record: the newer change wins (_mt; older records fall back to
     updatedAt/createdAt), and a deletion wins over any change made before it.
     Returns {changed} - whether anything on this device changed. The merged
     result is saved (and so written back to iCloud) whenever it differs from
     the incoming copy, so both sides end up the same. */
  function recTime(r){ return r ? (r._mt || Date.parse(r.updatedAt||'') || Date.parse(r.createdAt||'') || 0) : 0; }
  function mergeRemote(remote){
    if(mode!=='local' || VIEWER || !remote || typeof remote!=='object') return {changed:false};
    const isCol = k => k!==DEL_KEY && ((local[k] && typeof local[k]==='object') || (remote[k] && typeof remote[k]==='object'));
    const del = {};
    [local[DEL_KEY]||{}, remote[DEL_KEY]||{}].forEach(src=>Object.entries(src).forEach(([c,ids])=>{
      del[c] = del[c]||{};
      Object.entries(ids||{}).forEach(([id,ts])=>{ if(!(del[c][id] >= ts)) del[c][id] = ts; });
    }));
    const out = {}, changedCols = new Set();
    new Set([...Object.keys(local), ...Object.keys(remote)].filter(isCol)).forEach(c=>{
      const L = local[c]||{}, R = remote[c]||{}, res = {};
      new Set([...Object.keys(L), ...Object.keys(R)]).forEach(id=>{
        const l = L[id], r = R[id];
        let pick = !l ? r : !r ? l : (recTime(r) > recTime(l) ? r : l);
        const dts = del[c] && del[c][id];
        if(dts && dts >= recTime(pick)) pick = null;           // deleted after its last change
        else if(dts) delete del[c][id];                         // changed again after the deletion: keep it
        if(pick) res[id] = pick;
        if(JSON.stringify(pick||null) !== JSON.stringify(l||null)) changedCols.add(c);
      });
      out[c] = res;
    });
    const cutoff = Date.now() - TOMBSTONE_KEEP_MS;
    Object.values(del).forEach(ids=>Object.keys(ids).forEach(id=>{ if(ids[id] < cutoff) delete ids[id]; }));
    out[DEL_KEY] = del;
    const differsFromRemote = JSON.stringify(out) !== JSON.stringify(remote);
    local = out;
    if(changedCols.size || differsFromRemote){
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
      if(Native.has('sbStore')){ clearTimeout(nativeSaveTimer); flushNative(); }
    }
    changedCols.forEach(c=>{ if(localListeners[c]) emitLocal(c); });
    return {changed: changedCols.size>0};
  }

  return {init, subscribe, add, update, remove, getAll, mergeRemote, mode:()=>mode};
})();

/* Wrap every write in try/catch so a db failure (offline, quota, revoked
   grant) shows a small inline toast instead of crashing the page. */
async function act(fn, okMsg){
  try{
    const result = await fn();
    if(okMsg) toast(okMsg);
    return result;
  }catch(e){
    console.error(e);
    toast('Error: ' + (e && e.message ? e.message : 'action failed'), true);
  }
}


/* ============================== iCLOUD SYNC (iPhone app) ============================== */
/* The app keeps the database on the device (Application Support). With iCloud
   sync on, the native side (CloudSync.swift) also keeps a copy in the app's
   iCloud container and hands us the copy another device saved; we merge it
   record by record (Store.mergeRemote). Bridge: sbCloud {action} -> reply
   {enabled, available, lastSync, json}. Only present inside the app. */
const CloudUI = (function(){
  let info = {enabled:false, available:false, lastSync:'', known:false};
  let lastCheck = 0, busy = false;
  const has = ()=> Native.has('sbCloud');
  async function call(action){
    if(!has()) return info;
    lastCheck = Date.now();
    try{
      const r = await window.webkit.messageHandlers.sbCloud.postMessage({action});
      if(r && typeof r==='object'){ info = {enabled:!!r.enabled, available:!!r.available, lastSync:r.lastSync||'', known:true}; if(r.json) apply(r.json, action==='pull'); }
    }catch(e){ console.error('iCloud bridge', e); }
    redraw();
    return info;
  }
  function apply(json, quiet){
    let remote; try{ remote = JSON.parse(json); }catch(e){ return; }
    const res = Store.mergeRemote(remote);
    if(res.changed){ if(!quiet) toast('Updated from iCloud'); render(); }
  }
  function redraw(){ const el = document.getElementById('cloudSettingsCard'); if(el) el.outerHTML = card(); }
  function card(){
    if(!has()) return '';
    // Opening Settings re-checks iCloud now and then (e.g. after signing in).
    if(!busy && Date.now()-lastCheck > 15000){ busy = true; setTimeout(()=>call('status').finally(()=>{ busy = false; }), 0); }
    const i = info;
    const when = i.lastSync ? new Date(i.lastSync) : null;
    const status = !i.known ? 'Checking iCloud&hellip;'
      : !i.available ? `${ICONS.warn.replace('<svg ','<svg width="13" height="13" style="vertical-align:-2px" aria-hidden="true" ')} iCloud isn't available. Sign in to iCloud in the iPhone's Settings app. If you are signed in, this build of the app doesn't have iCloud switched on yet (it needs the paid Apple Developer Program; see the README).`
      : i.enabled ? `On. ${when && !isNaN(when) ? 'Last synced '+esc(fmtDateTime(when.toISOString()))+'.' : 'Waiting for the first sync.'}`
      : 'Off. Your data stays on this device only.';
    return `<div class="card" id="cloudSettingsCard">
      <h3 style="font-family:'Public Sans';font-size:14px;text-transform:none;letter-spacing:0;margin-bottom:6px">iCloud sync</h3>
      <p class="helptext" style="margin:0 0 10px">Keep your tournaments, players and results in your iCloud so you can carry on from your other iPhone or iPad signed in to the same Apple ID. Turn it on on each device. Changes made on two devices are combined; if the same item was changed on both, the latest change wins.</p>
      <p class="helptext" style="margin:0 0 10px">${status}</p>
      <div class="row wrap" style="gap:8px">
        ${i.enabled
          ? `<button class="btn btn-sm" id="btnCloudSyncNow" ${i.available?'':'disabled'}>${ICONS.refresh} Sync now</button><button class="btn btn-sm" id="btnCloudOff">Turn off</button>`
          : `<button class="btn btn-sm btn-primary" id="btnCloudOn" ${i.available?'':'disabled'}>Turn on iCloud sync</button>`}
      </div>
    </div>`;
  }
  async function turnOn(){
    if(!await confirmDialog('Your tournaments on this device will be combined with any already in iCloud from your other devices, and kept in step from now on.', {title:'Turn on iCloud sync?', okLabel:'Turn on', danger:false})) return;
    await call('enable'); await call('pull'); toast('iCloud sync is on');
  }
  async function turnOff(){
    if(!await confirmDialog('This device stops syncing. Its data stays here, and the copy in iCloud stays for your other devices.', {title:'Turn off iCloud sync?', okLabel:'Turn off', danger:false})) return;
    await call('disable'); toast('iCloud sync is off');
  }
  // Changes saved on another device arrive here while the app is open.
  window.__sbCloudIncoming = json => { apply(json, false); call('status'); };
  return {start: ()=> has() && call('pull'), card, status: ()=>call('status'), syncNow: async ()=>{ await call('pull'); toast('Synced with iCloud'); }, turnOn, turnOff};
})();

   Only checked from the iPhone app, which can read other sites; cached per session. */
const ViewerPageCheck = { result:null, running:false,
  async run(force){
    const cfg = shareConfig();

    if(this.running || (this.result && !force)) return this.result;

function randomToken(len){

      if(e && e.native) throw e;
      if(e && e.timeout) throw e;
      if(timedOut || (e && e.name==='AbortError')){ const err=new Error('timeout'); err.offline=true; err.timeout=true; throw err; }
      const err = new Error('offline'); err.offline = true; err.detail = (e && (e.message||e.name)) || ''; throw err;
    }finally{ clearTimeout(timer); }
    const text = await res.text();
    let json=null; try{ json = text ? JSON.parse(text) : null; }catch(e){}
    if(!res.ok){
      const err = new Error((json && (json.message||json.msg||json.error)) || ('HTTP '+res.status));
      err.status = res.status; err.code = json && json.code; err.body = (text||'').slice(0,200); throw err;
    }
    return json;
  },
  explain(e){
    if(!e) return 'Unknown error';
    if(e.offline && inClaudeFrame()) return 'This page is running inside Claude, which doesn\'t let pages send data to other websites, so it can\'t reach Supabase. Create and update live links from the iPhone app (or your hosted copy of the app) instead.';
    if(e.timeout) return 'No answer from Supabase within 15 seconds. Check the Project URL (it looks like https://abcdefgh.supabase.co) and that the project isn\'t paused.';
    if(e.offline) return 'Couldn\'t connect to Supabase'+(e.detail?' ('+e.detail+')':'')+'. Check the internet connection and that the Project URL looks like https://abcdefgh.supabase.co.';
    if(e.status===404 && !e.code) return 'Supabase answered "not found" (404). The Project URL is probably wrong: use the one from Project Settings → Data API, like https://abcdefgh.supabase.co.';
    if(e.status===540 || /paused/i.test(e.message||'')) return 'The Supabase project is paused. Open the Supabase dashboard and click Resume project.';
    if(e.code==='PGRST202' || /could not find the function/i.test(e.message)) return 'The database isn\'t set up yet: run sharing/supabase_setup.sql in the Supabase SQL Editor.';
    if(e.code==='SB403' || e.code==='42501' || /wrong edit key/i.test(e.message)) return 'This link belongs to another copy of the tournament. Stop sharing and create a new link.';
    if(e.code==='SB410') return 'This link expired: it wasn\'t updated for '+SHARE_KEEP_DAYS+' days, so it was removed. Create a new link to share again.';
    if(e.code==='SB413' || e.tooLarge) return 'This tournament is too big to share ('+(e.kb||'over 1024')+' KB, the limit is 1024 KB).';
    if(e.code==='SB429' && /new links/i.test(e.message)) return 'Too many new links from this network today. Try again tomorrow.';
    if(e.code==='SB429') return 'Updating too often. Trying again in a moment.';
    if(e.code==='SB507') return 'The sharing storage is full, so no new links can be made right now. Existing links keep working.';
    if(e.status===401 || e.status===403 || /api key/i.test(e.message)) return 'Supabase rejected the key. Paste the publishable (or anon) key from Project Settings → API Keys.';
    return e.message;
  }
};
/* Running as the web version inside Claude? (Its page may not contact other websites.) */
function inClaudeFrame(){
  if(window.__SB_NATIVE__ || Native.has('sbStore')) return false;
  try{ if(window.claude && typeof window.claude.use==='function') return true; }catch(e){}
  try{ if(/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/.test(location.hostname)) return true; }catch(e){}
  try{ return window.top!==window.self && /claude/.test(document.referrer||''); }catch(e){ return true; }
}
/* Accept what people paste: dashboard links, trailing /rest/v1, missing https. */
function normalizeSupabaseUrl(u){
  u = String(u||'').trim();
  const dash = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]{10,40})/i);
  if(dash) return 'https://'+dash[1].toLowerCase()+'.supabase.co';
  if(/^[a-z0-9]{15,40}$/i.test(u)) return 'https://'+u.toLowerCase()+'.supabase.co';     // just the project ref
  if(!/^https?:\/\//i.test(u) && u) u = 'https://'+u;
  return u.replace(/\/(rest|auth)\/v1.*$/i,'').replace(/\/+$/,'');
}

/* The read-only copy of one tournament that a link shows. */
const SHARE_PLAYER_FIELDS = ['id','name','gender','clubId','skillLevel','rankingPoints','nationality','createdAt'];
function buildShareSnapshot(tid){
  const t = state.tournaments.find(x=>x.id===tid); if(!t) return null;
  const {share, ...tournament} = t;
  const regs = state.registrations.filter(r=>r.tournamentId===tid || state.events.some(e=>e.id===r.eventId && e.tournamentId===tid))
    .map(r=>({id:r.id, tournamentId:r.tournamentId, eventId:r.eventId, playerId:r.playerId, partnerId:r.partnerId||null, status:r.status, createdAt:r.createdAt}));
  const events = state.events.filter(e=>e.tournamentId===tid);
  const eventIds = new Set(events.map(e=>e.id));
  const inT = x => x.tournamentId===tid || eventIds.has(x.eventId);   // entries and draws link by event
  const entries = state.entries.filter(inT);
  const playerIds = new Set();
  regs.forEach(r=>{ playerIds.add(r.playerId); if(r.partnerId) playerIds.add(r.partnerId); });
  entries.forEach(e=> entryPlayerIds(e).forEach(p=>playerIds.add(p)));
  const players = state.players.filter(p=>playerIds.has(p.id)).map(p=>{ const o={}; SHARE_PLAYER_FIELDS.forEach(k=>{ if(p[k]!==undefined) o[k]=p[k]; }); return o; });
  const clubIds = new Set(players.map(p=>p.clubId).filter(Boolean));
  return {
    v:1, tournament,
    events, entries, registrations: regs, players,
    clubs: state.clubs.filter(c=>clubIds.has(c.id)).map(c=>({id:c.id, name:c.name, createdAt:c.createdAt})),
    draws: state.draws.filter(inT),
    matches: state.matches.filter(inT),
    courts: state.courts.filter(c=>c.tournamentId===tid)
  };
}
function shareLinkFor(t){
  const cfg = shareConfig();
  if(!t || !t.share || !cfg.viewerUrl) return '';
  const m = cfg.url.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co$/i);
  const where = m ? 'p='+m[1].toLowerCase() : 'u='+encodeURIComponent(cfg.url);
  return cfg.viewerUrl.replace(/#.*$/,'') + '#s=' + t.share.id + '&' + where + '&k=' + encodeURIComponent(cfg.key);
}

/* Keeps every shared tournament's copy up to date. Data changes schedule a
   sync; unchanged tournaments are skipped; failures retry with backoff. */
const ShareSync = (function(){
  const lastSent = {};          // tid -> JSON last published successfully
  const status = {};            // tid -> {state:'syncing'|'ok'|'error', at, error}
  let timer=null, busy=false, again=false, retryMs=0;
  function schedule(delay){
    if(VIEWER) return;
    clearTimeout(timer);
    timer = setTimeout(run, delay==null ? 2000 : delay);
  }
  function setStatus(tid, s){ status[tid] = Object.assign({}, status[tid], s); ShareUI.refresh(tid); }
  async function publish(t, force){
    const snap = buildShareSnapshot(t.id); if(!snap) return;
    const json = JSON.stringify(snap);
    if(!force && lastSent[t.id]===json) return;
    const bytes = shareBytes(json);
    if(bytes > SHARE_MAX_BYTES){ const err=new Error('too large'); err.tooLarge=true; err.kb=Math.ceil(bytes/1024); throw err; }
    setStatus(t.id, {state:'syncing'});
    const at = await ShareAPI.rpc(shareConfig(), 'sb_publish', {p_id:t.share.id, p_key:t.share.key, p_data:snap});
    lastSent[t.id] = json;
    setStatus(t.id, {state:'ok', at: at || nowIso(), error:null});
  }
  async function run(force){
    if(busy){ again=true; return; }
    const cfg = shareConfig(); if(!cfg.ready) return;
    const shared = state.tournaments.filter(isShareLive);
    if(!shared.length) return;
    busy=true;
    let failed=false, soon=false;
    for(const t of shared){
      try{ await publish(t, force); }
      catch(e){
        console.error('share sync', e);
        if(e.code==='SB429' && !/new links/i.test(e.message)){ soon=true; continue; }   // updating too fast: just try again shortly
        if(e.code==='SB410'){   // expired on the server: stop syncing it and tell the organiser
          setStatus(t.id, {state:'error', error:ShareAPI.explain(e), expired:true});
          await Store.update('tournaments', t.id, {share: Object.assign({}, t.share, {expired:true, expiredAt: nowIso()})});
          continue;
        }
        // Permanent problems wait for the next change instead of retrying on a timer.
        const permanent = e.tooLarge || ['SB400','SB403','SB413','42501'].includes(e.code);
        if(!permanent) failed=true;
        setStatus(t.id, {state:'error', error:ShareAPI.explain(e), offline:!!e.offline});
      }
    }
    busy=false;
    if(failed){ retryMs = Math.min(retryMs ? retryMs*2 : 5000, 120000); schedule(retryMs); }
    else { retryMs = 0; if(soon) schedule(1500); }
    if(again){ again=false; schedule(500); }
  }
  window.addEventListener('online', ()=>schedule(500));
  return {schedule, run, publish, status:tid=>status[tid]||null, forget(tid){ delete lastSent[tid]; delete status[tid]; },
    markPublished(tid, at, json){ lastSent[tid]=json; status[tid]={state:'ok', at: at||nowIso(), error:null}; }};
})();

    if(s.state==='error') return `<span class="share-dot bad"></span> ${esc(s.error)} ${s.offline?'Retrying automatically.':''}`;
    return `<span class="share-dot ok"></span> Live &middot; up to date (${esc(fmtTime(s.at))})`;
  }
  function expiryLine(t){
    const s = ShareSync.status(t.id);
    const until = shareExpiryDate(s && s.state==='ok' ? s.at : null);
    return until
      ? `Stays active until <b>${esc(fmtDate(until.toISOString()))}</b>. Each change moves this date; links are removed ${SHARE_KEEP_DAYS} days after the last change.`

    }
    if(t.share && t.share.expired){
      return `<p class="helptext" style="margin-top:0"><b>This link has expired.</b> ${esc(t.name)} wasn't changed for ${SHARE_KEEP_DAYS} days, so its shared copy was removed and the old link no longer works.</p>
        <p class="helptext">Create a new link to share it again. Anyone following the old link will need the new one.</p>`;

      return `<p class="helptext" style="margin-top:0">Anyone with the link can follow <b>${esc(t.name)}</b> in a browser, with no app or sign-in: live matches, upcoming matches, results and current standings. It updates by itself a few seconds after each change you make.</p>
        <p class="helptext">Player emails, phone numbers, birth dates and photos are never shared. You can stop sharing at any time, and links are removed automatically ${SHARE_KEEP_DAYS} days after the tournament last changed.</p>`;
